      g.fillText(a.name, row.r.x + (kit ? 12 : 28), row.r.y + row.r.h / 2 - 1);
      g.font = '9px ui-monospace, monospace'; g.fillStyle = '#66748c';
      g.fillText(kit ? `+${Math.round(a.heal * 100)}% over ${a.secs}s` : `x${a.mult.toFixed(2)}`,
                 row.r.x + (kit ? 12 : 28), row.r.y + row.r.h / 2 + 10);
      g.textAlign = 'right';
      g.fillStyle = on ? '#7de08a' : '#8ea3bd'; g.font = '11px ui-monospace, monospace';
      g.fillText(String((kit ? myKits : myAmmo)[row.k] ?? 0), row.r.x + row.r.w - 10, row.r.y + row.r.h / 2 + 3);
      g.textAlign = 'left';
    }
    g.font = '12px ui-monospace, monospace';
  }
}

// --- render -------------------------------------------------------------------
let renderFailed = false;
requestAnimationFrame(function frame(now) {
  try { drawFrame(now); } catch (err) {
    if (!renderFailed) { renderFailed = true; console.error('render error (loop kept alive):', err); }
  }
  requestAnimationFrame(frame);
});

function drawFrame(now) {
  const map = MAPS[mapId], me = ships.get(myId);
  const st = resolve(myHull, myFit);          // your resolved stats, wanted by minimap and hud alike

  // Thruster tracks how fast you are actually going, measured off the smoothed
  // render position — the server never sends velocity and does not need to.
  const frameDt = Math.min(0.1, (now - lastFrameAt) / 1000) || 0.016;
  lastFrameAt = now;
  if (me) {
    if (prevSelf) {
      const v = Math.hypot(me.rx - prevSelf.x, me.ry - prevSelf.y) / frameDt;
      thrust += (Math.min(1, v / Math.max(1, st.speed)) - thrust) * 0.16;
    }
    prevSelf = { x: me.rx, y: me.ry };
  } else thrust *= 0.9;
  setThrust(thrust);

  for (const s of ships.values()) { s.rx += (s.x - s.rx) * 0.35; s.ry += (s.y - s.ry) * 0.35; }
  if (me) {
    cam.x = clamp(me.rx - WVW / 2, WORLD.x0, Math.max(WORLD.x0, WORLD.x1 - WVW));
    cam.y = clamp(me.ry - WVH / 2, WORLD.y0, Math.max(WORLD.y0, WORLD.y1 - WVH));
  }
  const depth = me ? driftDepth(me.x, me.y) : 0;
  if (marker && me && Math.hypot(marker.x - me.x, marker.y - me.y) < 12) marker = null;
  const atPortal = me ? nearPortal(map, { x: me.x, y: me.y, jumpCd: 0 }) : null;
  const charge = me?.charge ?? 0;

  g.fillStyle = '#05070b'; g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.globalAlpha = 0.055; g.fillStyle = map.tint; g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.globalAlpha = 1;
  drawStars();

  g.save();
  g.scale(zoom, zoom);
  g.translate(-cam.x, -cam.y);

  for (const [x, y, r, col] of map.neb) {
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, col); grad.addColorStop(1, 'transparent');
    g.globalAlpha = 0.30; g.fillStyle = grad; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  g.globalAlpha = 1;

  g.strokeStyle = 'rgba(120,160,220,0.05)'; g.lineWidth = 1; g.beginPath();
  for (let x = Math.floor(cam.x / 500) * 500; x < cam.x + WVW; x += 500) { g.moveTo(x, cam.y); g.lineTo(x, cam.y + WVH); }
  for (let y = Math.floor(cam.y / 500) * 500; y < cam.y + WVH; y += 500) { g.moveTo(cam.x, y); g.lineTo(cam.x + WVW, y); }
  g.stroke();

  // No boundary drawn in the world. Sliding off the minimap is the tell, and the
  // shear vignette takes over from there.

  // Workshop signage: a marked-out firing line and a label over each area, so the
  // room explains itself instead of needing a diagram beside it.
  if (map.dev) {
    g.save();
    g.strokeStyle = 'rgba(125,224,138,0.30)'; g.lineWidth = 2; g.setLineDash([14, 10]);
    g.strokeRect(PEN.x, PEN.y, PEN.w, PEN.h);
    g.setLineDash([]);
    g.strokeStyle = 'rgba(125,224,138,0.13)'; g.lineWidth = 1;
    for (const sl of PEN_SLOTS) {                                    // a mark under each post
      g.beginPath(); g.moveTo(PEN.x + 14, sl.y); g.lineTo(PEN.x + PEN.w - 14, sl.y); g.stroke();
    }
    g.textAlign = 'left';
    for (const L of DEV_LABELS) {
      g.fillStyle = 'rgba(125,224,138,0.85)'; g.font = 'bold 20px ui-monospace, monospace';
      g.fillText(L.text, L.x, L.y);
      g.fillStyle = 'rgba(125,224,138,0.42)'; g.font = '13px ui-monospace, monospace';
      g.fillText(L.sub, L.x, L.y + 18);
    }
    // and a nameplate under every mannequin, since that is the point of them
    g.textAlign = 'center'; g.font = '12px ui-monospace, monospace';
    for (const pr of PROPS) {
      g.fillStyle = 'rgba(207,228,255,0.55)';
      g.fillText(pr.label, pr.x, pr.y + 210);
    }
    g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
    g.restore();
  }

  if (map.base) {
    const b = map.base, col = COMPANIES[map.owner ?? myCo].color, mine = (map.owner ?? myCo) === myCo;
    const grd = g.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    grd.addColorStop(0, col + '2e'); grd.addColorStop(0.65, col + '12'); grd.addColorStop(1, 'transparent');
    g.fillStyle = grd; g.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);

    g.strokeStyle = col + (mine ? 'aa' : '55'); g.lineWidth = 2;
    g.setLineDash([26, 18]); g.lineDashOffset = -now / 60;          // slow drift
    g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.stroke();
    g.setLineDash([]); g.lineDashOffset = 0;
    g.strokeStyle = col + '44'; g.lineWidth = 1;
    g.beginPath(); g.arc(b.x, b.y, b.r * 0.62, 0, 7); g.stroke();

    for (let i = 0; i < 4; i++) {                                    // approach ticks
      const a = i * Math.PI / 2 + Math.PI / 4;
      g.beginPath();
      g.moveTo(b.x + Math.cos(a) * (b.r - 26), b.y + Math.sin(a) * (b.r - 26));
      g.lineTo(b.x + Math.cos(a) * (b.r + 26), b.y + Math.sin(a) * (b.r + 26));
      g.stroke();
    }

    g.save();                                                        // station
    g.translate(b.x, b.y); g.rotate(now / 9000);
    g.strokeStyle = col; g.lineWidth = 3; g.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3, px = Math.cos(a) * 62, py = Math.sin(a) * 62;
      i ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.closePath(); g.stroke();
    g.fillStyle = col + '55'; g.fill();
    g.fillStyle = col; g.fillRect(-13, -13, 26, 26);
    g.restore();

    g.fillStyle = col; g.textAlign = 'center'; g.font = '14px ui-monospace, monospace';
    g.fillText(map.dev ? 'WORKSHOP DOCK' : `${COMPANIES[map.owner ?? myCo].tag} BASE`, b.x, b.y - b.r - 18);
    g.font = '12px ui-monospace, monospace'; g.textAlign = 'left';
  }

  const idle = 0.6 + 0.4 * Math.sin(now / 420);
  for (const p of map.portals) {
    const tint = MAPS[p.to].tint;
    const spooling = charge > 0 && atPortal === p;
    let r = PORTAL_R;
    if (spooling) {
      const el = JUMP_TIME - charge, prog = el / JUMP_TIME;
      r = PORTAL_R * (1 + (0.16 + 0.34 * prog) * Math.sin(el * el * 1.6 * Math.PI * 2));  // winds up
    }
    g.globalAlpha = (spooling ? 0.34 : 0.20) * (spooling ? 1 : idle);
    g.fillStyle = tint; g.beginPath(); g.arc(p.x, p.y, r, 0, 7); g.fill();
    g.globalAlpha = 1; g.strokeStyle = tint; g.lineWidth = spooling ? 5 : 3;
    g.beginPath(); g.arc(p.x, p.y, r, 0, 7); g.stroke();
    if (spooling) {
      g.lineWidth = 3; g.strokeStyle = '#fff';
      g.beginPath(); g.arc(p.x, p.y, PORTAL_R * 1.45, -Math.PI / 2, -Math.PI / 2 + (1 - charge / JUMP_TIME) * Math.PI * 2);
      g.stroke();
    }
    g.fillStyle = tint; g.textAlign = 'center';
    g.fillText(MAPS[p.to].name.toUpperCase(), p.x, p.y - PORTAL_R * 1.45 - 14);
  }
  g.textAlign = 'left';

  if (marker) {
    g.strokeStyle = '#4a90d9'; g.lineWidth = 1.5; g.globalAlpha = 0.8;
    g.beginPath(); g.arc(marker.x, marker.y, 8, 0, 7); g.stroke();
    g.globalAlpha = 1;
  }

  for (const pod of pods) {
    const col = MATERIALS[pod.mat]?.colour ?? '#9aa3ad';
    const pu = 0.72 + 0.28 * Math.sin(now / 260 + pod.id);
    g.globalAlpha = 0.22 * pu; g.fillStyle = col;
    g.beginPath(); g.arc(pod.x, pod.y, 26, 0, 7); g.fill();
    g.globalAlpha = 1; g.fillStyle = col;
    g.save(); g.translate(pod.x, pod.y); g.rotate(now / 1400 + pod.id);
    g.beginPath(); g.moveTo(0, -9); g.lineTo(8, 0); g.lineTo(0, 9); g.lineTo(-8, 0);
    g.closePath(); g.fill();
    g.strokeStyle = '#05070b'; g.lineWidth = 1.5; g.stroke();
    g.restore();
    if (hover && podAt(toWorld(hover).x, toWorld(hover).y)?.id === pod.id) {
      const reachable = me && Math.hypot(pod.x - me.rx, pod.y - me.ry) <= SCOOP_R;
      g.strokeStyle = col; g.lineWidth = 1.4; g.setLineDash([3, 4]);
      g.beginPath(); g.arc(pod.x, pod.y, 21, 0, 7); g.stroke(); g.setLineDash([]);
      g.fillStyle = col; g.textAlign = 'center'; g.font = '10px ui-monospace, monospace';
      g.fillText(`${MATERIALS[pod.mat]?.name ?? pod.mat} — click to ${reachable ? 'haul in' : 'fly over and collect'}`,
                 pod.x, pod.y + 32);
      g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
    }
    {
      g.fillStyle = col; g.textAlign = 'center'; g.font = '10px ui-monospace, monospace';
      g.fillText((MATERIALS[pod.mat]?.sym ?? '?') + (pod.n > 1 ? ' ×' + pod.n : ''), pod.x, pod.y - 18);
      g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
    }
  }

  if (want && me) {                                // on the way to fetch something
    const pod = pods.find(p => p.id === want);
    if (pod) {
      const col = MATERIALS[pod.mat]?.colour ?? '#9aa3ad';
      g.strokeStyle = col; g.globalAlpha = 0.45; g.lineWidth = 1.5; g.setLineDash([9, 8]);
      g.beginPath(); g.moveTo(me.rx, me.ry); g.lineTo(pod.x, pod.y); g.stroke();
      g.setLineDash([]); g.globalAlpha = 1;
      g.strokeStyle = col; g.lineWidth = 1.6;
      g.beginPath(); g.arc(pod.x, pod.y, 24, 0, 7); g.stroke();
    }
  }

  if (scoop && me) {                               // tractor beam
    const pod = pods.find(p => p.id === scoop.id);
    if (pod) {
      const col = MATERIALS[pod.mat]?.colour ?? '#9aa3ad';
      const px = pod.x + (me.rx - pod.x) * scoop.p, py = pod.y + (me.ry - pod.y) * scoop.p;
      g.strokeStyle = col; g.globalAlpha = 0.35; g.lineWidth = 10;
      g.beginPath(); g.moveTo(me.rx, me.ry); g.lineTo(pod.x, pod.y); g.stroke();
      g.globalAlpha = 0.9; g.lineWidth = 2;
      g.beginPath(); g.moveTo(me.rx, me.ry); g.lineTo(pod.x, pod.y); g.stroke();
      g.fillStyle = col; g.globalAlpha = 1;       // the cargo itself, sliding in
      g.beginPath(); g.arc(px, py, 7 * (1 - scoop.p * 0.6), 0, 7); g.fill();
    }
  }

  for (const b of bolts) {                         // bolts first, so hulls sit on top
    const p1 = Math.min(1, b.p), p0 = Math.max(0, b.p - 0.22);
    const x0 = b.sx + (b.ax - b.sx) * p0, y0 = b.sy + (b.ay - b.sy) * p0;
    const x1 = b.sx + (b.ax - b.sx) * p1, y1 = b.sy + (b.ay - b.sy) * p1;
    const thick = boltWidth(b.w);                 // a better emitter throws a heavier bolt
    g.strokeStyle = b.foe ? '#ff7a5c' : '#8fe7ff';
    g.globalAlpha = 0.22; g.lineWidth = thick + 3.5;
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    g.globalAlpha = 1; g.lineWidth = thick;
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    if (thick > 3.2) {                            // heavy rounds run white hot down the middle
      g.strokeStyle = b.foe ? '#ffd6c8' : '#e8fbff'; g.lineWidth = thick * 0.34;
      g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    }
  }

  // Rockets. The server ticks at 30Hz and these move 520px/s, so they are flown
  // forward from the last snapshot rather than drawn where they were — otherwise
  // a rocket advances in visible 17px steps.
  if (rockets.length) {
    const ahead = Math.min(0.12, (now - snapAt) / 1000) * ROCKET_SPEED;
    for (const r of rockets) {
      const c = Math.cos(r.h), sn = Math.sin(r.h);
      const x = r.x + c * ahead, y = r.y + sn * ahead;
      const len = 7 + Math.min(6, Math.sqrt(Math.max(0, r.w)) * 0.35);
      g.save(); g.translate(x, y); g.rotate(r.h);
      // exhaust first, so the body sits on top of it
      const flame = 12 + Math.sin(now / 40 + x) * 4;
      const grd = g.createLinearGradient(-len, 0, -len - flame, 0);
      grd.addColorStop(0, r.foe ? 'rgba(255,170,120,0.85)' : 'rgba(150,225,255,0.85)');
      grd.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grd;
      g.beginPath();
      g.moveTo(-len, -2.2); g.lineTo(-len - flame, 0); g.lineTo(-len, 2.2);
      g.closePath(); g.fill();
      g.fillStyle = r.foe ? '#ff8a6b' : '#cfe9ff';
      g.beginPath();
      g.moveTo(len, 0); g.lineTo(-len * 0.5, -2.8); g.lineTo(-len, -1.6);
      g.lineTo(-len, 1.6); g.lineTo(-len * 0.5, 2.8);
      g.closePath(); g.fill();
      g.fillStyle = '#0a0f16'; g.fillRect(-len * 0.3, -1, len * 0.5, 2);
      g.restore();
    }
  }

  for (const [id, s] of ships) {
    const R = rOf(s), lost = s.vis === STALE, foe = s.co === 'x';
    const lvl = (s.plvl ?? 0) / 100, sys = s.psys ?? 0;
    g.save();
    g.translate(s.rx, s.ry); g.rotate(s.heading);
    g.globalAlpha = lost ? 0.35 : 1;               // last known track, no live sensor

    if (sys === 1 && lvl > 0.02) {                 // thrusters: a plume out the back
      const len = R * (1.6 + lvl * 5.5);
      const grd = g.createLinearGradient(-R, 0, -R - len, 0);
      grd.addColorStop(0, `rgba(255,255,255,${0.45 + lvl * 0.45})`);
      grd.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grd;
      g.beginPath();
      g.moveTo(-R, -R * 0.55); g.lineTo(-R - len, -R * 0.16 * (1 + lvl));
      g.lineTo(-R - len, R * 0.16 * (1 + lvl)); g.lineTo(-R, R * 0.55);
      g.closePath(); g.fill();
    }

    g.fillStyle = colOf(s);
    if (foe) {                                     // hostiles read as a different kind of thing
      g.beginPath();
      g.moveTo(R * 1.35, 0); g.lineTo(0, R); g.lineTo(-R * 0.8, 0); g.lineTo(0, -R);
      g.closePath(); g.fill();
      g.strokeStyle = '#1b0d28'; g.lineWidth = 1.5; g.stroke();
    } else {
      g.fillStyle = colOf(s);
      g.fillRect(-R, -R, R * 2, R * 2);
      if (id === myId) { g.strokeStyle = '#fff'; g.lineWidth = 2; g.strokeRect(-R, -R, R * 2, R * 2); }
      g.fillStyle = '#05070b'; g.fillRect(R - 6, -2, 6, 4);

      // Cannons go ON TOP of the hull and out past its nose, on the same
      // hardpoints the bolts actually leave from. Drawn under the body they were
      // almost entirely hidden — on a Hauler about three pixels showed.
      // Fixed. The cannons used to fatten with every emitter and just looked
      // blunt — how good your guns are shows in the bolt, not the barrel.
      const bore = Math.max(3, R * 0.26);
      for (const side of [-1, 1]) {
        const off = side * R * 0.95;
        g.fillStyle = '#0a0f16';                   // a dark seat, so it reads off the hull
        g.fillRect(-R * 0.25 - 1, off - bore / 2 - 1.4, R * 1.9 + 2, bore + 2.8);
        g.fillStyle = '#c2cede';
        g.fillRect(-R * 0.25, off - bore / 2, R * 1.9, bore);
        g.fillStyle = '#eef5ff';                   // muzzle
        g.fillRect(R * 1.25, off - bore / 2 - 0.6, R * 0.4, bore + 1.2);
        if (sys === 2 && lvl > 0.02) {             // weapons: the mounts crackle
          g.globalAlpha = (lost ? 0.35 : 1) * (0.4 + lvl * 0.6) *
                          (0.55 + 0.45 * Math.sin(now / 55 + (side > 0 ? 2 : 0)));
          g.fillStyle = SYS_COLOUR[1];
          g.fillRect(-R * 0.25, off - bore / 2 - lvl * 2, R * 1.9 + lvl * 7, bore + lvl * 4);
          g.globalAlpha = lost ? 0.35 : 1;
        }
      }
    }
    if (lost) { g.strokeStyle = '#e05a5a'; g.lineWidth = 1; g.setLineDash([3, 3]);
                g.strokeRect(-R - 4, -R - 4, R * 2 + 8, R * 2 + 8); g.setLineDash([]); }
    g.globalAlpha = 1;
    g.restore();

    if (sys === 3 && lvl > 0.02) {                 // shields: a bubble that thickens
      const rr = R * (2.2 + lvl * 0.8);
      g.globalAlpha = 0.06 + lvl * 0.16;
      g.fillStyle = SYS_COLOUR[2];
      g.beginPath(); g.arc(s.rx, s.ry, rr, 0, 7); g.fill();
      g.globalAlpha = 0.2 + lvl * 0.6; g.strokeStyle = SYS_COLOUR[2]; g.lineWidth = 1 + lvl * 2;
      g.beginPath(); g.arc(s.rx, s.ry, rr, 0, 7); g.stroke();
      g.globalAlpha = 1;
    }

    if (hover && s.co === 'x' && !lost && id === hostileAt(toWorld(hover).x, toWorld(hover).y) && id !== me?.tgt) {
      g.strokeStyle = 'rgba(255,140,120,0.55)'; g.lineWidth = 1.2; g.setLineDash([3, 4]);
      g.beginPath(); g.arc(s.rx, s.ry, R + 13, 0, 7); g.stroke(); g.setLineDash([]);
    }
    if (me && id === me.tgt) {                     // engagement reticle
      const rr = R + 9 + Math.sin(now / 200) * 2;
      g.strokeStyle = '#ff5c6b'; g.lineWidth = 1.6;
      for (let q = 0; q < 4; q++) {
        const a0 = q * Math.PI / 2 + Math.PI / 4;
        g.beginPath(); g.arc(s.rx, s.ry, rr, a0 - 0.42, a0 + 0.42); g.stroke();
      }
      const inRange = Math.hypot(s.rx - me.rx, s.ry - me.ry) <= st.weaponRange;
      g.fillStyle = inRange ? '#ff5c6b' : '#7a5a60';
      g.textAlign = 'center'; g.font = '11px ui-monospace, monospace';
      const running = s.hp <= 10;
      g.fillStyle = running ? '#ffc14d' : (inRange ? '#ff5c6b' : '#7a5a60');
      g.fillText(`${ALIENS[s.hull]?.name ?? '?'}  ${s.hp}%` +
                 (running ? '  FLEEING' : inRange ? '' : '  OUT OF RANGE'), s.rx, s.ry - rr - 8);
      g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
    }

    // A repair drone at work: one small machine going round and round the hull
    // with a torch on it. Drawn for anyone you can see, not just yourself.
    if ((s.fix ?? 0) > 0) {
      const a0 = now / 340, rr = R * 2.5;
      const px = s.rx + Math.cos(a0) * rr, py = s.ry + Math.sin(a0) * rr * 0.55;
      const grd = g.createRadialGradient(s.rx, s.ry, R * 0.4, s.rx, s.ry, R * 2.9);
      grd.addColorStop(0, 'rgba(125,224,138,0.16)');
      grd.addColorStop(1, 'rgba(125,224,138,0)');
      g.fillStyle = grd;
      g.beginPath(); g.arc(s.rx, s.ry, R * 2.9, 0, 7); g.fill();
      g.strokeStyle = 'rgba(125,224,138,0.30)'; g.lineWidth = 1;
      g.beginPath(); g.ellipse(s.rx, s.ry, rr, rr * 0.55, 0, 0, 7); g.stroke();
      g.strokeStyle = 'rgba(125,224,138,0.55)'; g.lineWidth = 1.4;   // the torch beam
      g.beginPath(); g.moveTo(px, py); g.lineTo(s.rx, s.ry); g.stroke();
      const spark = 0.55 + 0.45 * Math.sin(now / 46);
      g.fillStyle = `rgba(190,255,205,${spark.toFixed(2)})`;
      g.beginPath(); g.arc(s.rx, s.ry, 2.4 + spark * 1.6, 0, 7); g.fill();
      g.fillStyle = '#0a0f16'; g.fillRect(px - 5, py - 4, 10, 8);
      g.fillStyle = '#7de08a'; g.fillRect(px - 4, py - 3, 8, 6);
      g.fillStyle = '#0a0f16'; g.fillRect(px - 1.5, py - 1.5, 3, 3);
      if (id === myId) {                          // your own progress, in words
        g.textAlign = 'center'; g.font = '10px ui-monospace, monospace';
        g.fillStyle = 'rgba(125,224,138,0.85)';
        g.fillText(`REPAIRING ${s.fix}%`, s.rx, s.ry - R * 3.2);
        g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
      }
    }

    // Escort, in whatever formation it is flying. Armed drones are drawn with a
    // barrel, because they are genuinely where some of your bolts come from.
    const nD = s.drones ?? 0;
    if (nD) {
      const layout = formSlots(FORMATION_KEYS[s.form ?? 0] ?? 'line', nD);
      const c0 = Math.cos(s.heading), s0 = Math.sin(s.heading), dr = Math.max(5, R * 0.52);
      const mine2 = id === myId;
      const stuffed = mine2 && holdVol(hold) >= cargoCap;
      layout.forEach((pt, d) => {
        const dx = s.rx + (c0 * pt.fwd - s0 * pt.lat) * R;
        const dy = s.ry + (s0 * pt.fwd + c0 * pt.lat) * R;
        const armed = ((s.dmask ?? 0) >> d) & 1;
        // Only your own bays are on the wire by name, so only your own rigs get
        // drawn as rigs. Somebody else's escort is just an escort.
        const rig = mine2 && isCollector(myDrones[d]);
        g.save(); g.translate(dx, dy); g.rotate(s.heading);
        g.globalAlpha = lost ? 0.3 : 0.95;
        g.fillStyle = '#0a0f16'; g.fillRect(-dr - 1, -dr - 1, dr * 2 + 2, dr * 2 + 2);
        g.fillStyle = rig ? (stuffed ? '#8a7550' : '#c2a24f') : colOf(s);
        g.fillRect(-dr, -dr, dr * 2, dr * 2);
        if (armed) { g.fillStyle = '#c2cede'; g.fillRect(dr * 0.4, -1.3, dr * 1.5, 2.6); }
        if (rig) {                                 // an open cradle, facing out
          g.strokeStyle = stuffed ? '#6b5a3a' : '#ffd479'; g.lineWidth = 1.6;
          g.beginPath();
          g.moveTo(dr * 0.3, -dr * 1.15); g.lineTo(dr * 1.25, -dr * 0.75);
          g.moveTo(dr * 0.3, dr * 1.15);  g.lineTo(dr * 1.25, dr * 0.75);
          g.stroke();
        }
        g.fillStyle = '#0a0f16'; g.fillRect(-dr * 0.35, -dr * 0.35, dr * 0.7, dr * 0.7);
        g.globalAlpha = 1; g.restore();
        if (rig && stuffed) {                      // it has stopped, and says so
          g.textAlign = 'center'; g.font = '9px ui-monospace, monospace';
          g.fillStyle = 'rgba(6,10,16,0.85)'; g.fillRect(dx - 15, dy - dr - 15, 30, 12);
          g.fillStyle = '#e0a53f'; g.fillText('FULL', dx, dy - dr - 6);
          g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
        }
      });
    }

    if (lost) continue;                            // no vitals read on a fading track

    // PLACEHOLDER shield impact. Lit only while the shields are catching the hit;
    // once they're down the server stops sending it and bare hull takes the damage.
    const f = (s.flash ?? 0) / 100;
    if (f > 0) {
      const rr = R * (2.7 + (1 - f) * 0.9);        // the envelope stands well off the hull
      g.globalAlpha = f * 0.20; g.fillStyle = '#7fd4ff';
      g.beginPath(); g.arc(s.rx, s.ry, rr, 0, 7); g.fill();
      g.globalAlpha = Math.min(1, f * 1.1); g.strokeStyle = '#bfe9ff'; g.lineWidth = 1.5 + f * 2.5;
      g.beginPath(); g.arc(s.rx, s.ry, rr, 0, 7); g.stroke();
      g.globalAlpha = 1;
    }

    const bw = Math.max(30, R * 2.8);              // bars stay upright, never rotate
    g.fillStyle = 'rgba(4,7,12,0.75)';
    g.fillRect(s.rx - bw / 2, s.ry - R - 17, bw, 8);
    g.fillStyle = '#5fd0ff'; g.fillRect(s.rx - bw / 2 + 1, s.ry - R - 16, (bw - 2) * (s.sh ?? 0) / 100, 2.5);
    g.fillStyle = (s.hp ?? 100) > 33 ? '#7de08a' : '#e05a5a';
    g.fillRect(s.rx - bw / 2 + 1, s.ry - R - 12.5, (bw - 2) * (s.hp ?? 0) / 100, 2.5);
    if (s.lvl > 0) {                               // rank, so everyone can read it
      g.fillStyle = 'rgba(4,7,12,0.8)';
      g.fillRect(s.rx + bw / 2 + 3, s.ry - R - 18, 20, 11);
      g.fillStyle = '#cfe4ff'; g.font = 'bold 9px ui-monospace, monospace'; g.textAlign = 'center';
      g.fillText(String(s.lvl), s.rx + bw / 2 + 13, s.ry - R - 9.5);
      g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
    }
  }
  // Damage you deal is red and loud. Damage you take is amber — unless your own
  // shields caught it, in which case it is drawn in the same blue as your shield
  // bar and shield bubble, so "the shield held" reads the same way everywhere.
  for (const h of numbers) {
    const fade = h.p < 0.55 ? 1 : Math.max(0, (1 - h.p) / 0.45);
    const colour = h.mine ? (h.sh ? '#ff8fa0' : '#ff3b47')     // paler red = blunted by their shields
                          : (h.sh ? '#7fd4ff' : '#ffc14d');    // blue = yours held, amber = it got through
    g.globalAlpha = fade;
    g.font = (h.mine ? 'bold 17px' : '14px') + ' ui-monospace, SFMono-Regular, monospace';
    g.textAlign = 'center';
    const txt = (h.mine ? '' : '-') + h.n;
    g.lineWidth = 3.5; g.strokeStyle = 'rgba(4,7,12,0.9)';
    g.strokeText(txt, h.x, h.y - h.p * 36);
    g.fillStyle = colour;
    g.fillText(txt, h.x, h.y - h.p * 36);
    g.globalAlpha = 1; g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
  }

  for (const b of blasts) {                        // kill flash, over everything in world space
    const rr = b.r * (1.3 + b.p * 6.5);
    g.strokeStyle = b.foe ? '#ff9a6a' : '#9ad7ff';
    g.globalAlpha = (1 - b.p) * 0.85;
    g.lineWidth = 2 + (1 - b.p) * 6;
    g.beginPath(); g.arc(b.x, b.y, rr, 0, 7); g.stroke();
    g.globalAlpha = (1 - b.p) * (1 - b.p) * 0.55;
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(b.x, b.y, rr * 0.5, 0, 7); g.fill();
    g.globalAlpha = 1;
  }

  g.restore();

  // --- jump button (screen space) ---
  if (atPortal || charge > 0) {
    const p = atPortal ?? map.portals[0], tint = MAPS[p.to].tint, b = btn();
    const prog = charge > 0 ? 1 - charge / JUMP_TIME : 0;
    g.fillStyle = 'rgba(6,10,16,0.9)';
    g.beginPath(); g.roundRect(b.x, b.y, b.w, b.h, 6); g.fill();
    if (charge > 0) {
      g.save(); g.beginPath(); g.roundRect(b.x, b.y, b.w, b.h, 6); g.clip();
      g.globalAlpha = 0.35; g.fillStyle = tint; g.fillRect(b.x, b.y, b.w * prog, b.h);
      g.restore(); g.globalAlpha = 1;
    }
    g.strokeStyle = tint; g.lineWidth = 1.5;
    g.beginPath(); g.roundRect(b.x + .5, b.y + .5, b.w - 1, b.h - 1, 6); g.stroke();
    g.fillStyle = tint; g.textAlign = 'center'; g.font = '13px ui-monospace, monospace';
    g.fillText(charge > 0 ? `SPOOLING  ${charge.toFixed(1)}s  ·  CLICK TO ABORT`
                          : `JUMP  →  ${MAPS[p.to].name.toUpperCase()}`, b.x + b.w / 2, b.y + 29);
    g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
  }

  // --- minimap ---
  const sx = MM_W / MAP_W, sy = MM_H / MAP_H;
  g.fillStyle = 'rgba(6,10,16,0.86)'; g.fillRect(MM_X, MM_Y, MM_W, MM_H);
  g.strokeStyle = map.tint + '99'; g.lineWidth = 1; g.strokeRect(MM_X + .5, MM_Y + .5, MM_W - 1, MM_H - 1);
  if (map.base) {
    const b = map.base, col = COMPANIES[map.owner ?? myCo].color;
    g.strokeStyle = col + 'cc'; g.lineWidth = 1;
    g.beginPath(); g.arc(MM_X + b.x * sx, MM_Y + b.y * sy, b.r * sx, 0, 7); g.stroke();
    g.fillStyle = col; g.fillRect(MM_X + b.x * sx - 2, MM_Y + b.y * sy - 2, 4, 4);
  }
  for (const p of map.portals) {
    g.fillStyle = MAPS[p.to].tint;
    g.fillRect(MM_X + p.x * sx - 2.5, MM_Y + p.y * sy - 2.5, 5, 5);
  }
  if (marker && me) {                                 // course line, drawn under the dots
    const mx = MM_X + clamp(marker.x, 0, MAP_W) * sx, my = MM_Y + clamp(marker.y, 0, MAP_H) * sy;
    g.strokeStyle = 'rgba(74,144,217,0.75)'; g.lineWidth = 1; g.setLineDash([3, 3]);
    g.beginPath(); g.moveTo(MM_X + me.rx * sx, MM_Y + me.ry * sy); g.lineTo(mx, my); g.stroke();
    g.setLineDash([]);
    g.strokeStyle = '#4a90d9';
    g.beginPath(); g.arc(mx, my, 3.5, 0, 7); g.stroke();
    g.beginPath(); g.moveTo(mx - 6, my); g.lineTo(mx + 6, my);
    g.moveTo(mx, my - 6); g.lineTo(mx, my + 6); g.stroke();
  }
  g.save();                                        // nothing on the plot may spill past the frame
  g.beginPath(); g.rect(MM_X, MM_Y, MM_W, MM_H); g.clip();

  if (me) {                                        // the sweep itself, expanding out to radar range
    const cx = MM_X + clamp(me.rx, 0, MAP_W) * sx, cy = MM_Y + clamp(me.ry, 0, MAP_H) * sy;
    const reach = st.radar * sx;                 // the sweep itself, no ring left behind
    for (const off of [0, 0.5]) {
      const ph = ((now / 2400) + off) % 1;
      g.globalAlpha = (1 - ph) * (1 - ph) * 0.5;
      g.strokeStyle = '#7fd4ff'; g.lineWidth = 1.4;
      g.beginPath(); g.arc(cx, cy, ph * reach, 0, 7); g.stroke();
    }
    g.globalAlpha = 1;
  }

  for (const pod of pods) {
    g.fillStyle = MATERIALS[pod.mat]?.colour ?? '#9aa3ad';
    g.fillRect(MM_X + clamp(pod.x, 0, MAP_W) * sx - 1, MM_Y + clamp(pod.y, 0, MAP_H) * sy - 1, 2, 2);
  }
  for (const [id, s] of ships) {
    const off = driftDepth(s.x, s.y) > 0;          // clamp strays to the frame so they stay findable
    const mx = MM_X + clamp(s.rx, 0, MAP_W) * sx, my = MM_Y + clamp(s.ry, 0, MAP_H) * sy;
    if (s.co === 'x') {                            // hostiles: a pulsing diamond, never a ping ring
      const ph = ((now / 900) + id * 0.31) % 1;
      g.globalAlpha = s.vis === FRESH ? 0.5 + 0.5 * (1 - ph) : 0.35;
      g.fillStyle = ALIENS[s.hull]?.colour ?? '#b06adf';
      g.beginPath(); g.moveTo(mx, my - 3); g.lineTo(mx + 3, my); g.lineTo(mx, my + 3); g.lineTo(mx - 3, my);
      g.closePath(); g.fill();
      g.globalAlpha = 1;
      continue;
    }
    if (s.vis === ALLY) {
      g.fillStyle = off ? '#ff5c6b' : (COMPANIES[s.co]?.color ?? '#8899aa');
      const w = id === myId ? 5 : 3;
      g.fillRect(mx - w / 2, my - w / 2, w, w);
      continue;
    }
    const hot = s.vis === FRESH;
    if (hot) {                                     // contact ping, phase-offset per contact
      const ph = ((now / 1150) + id * 0.37) % 1;
      g.globalAlpha = (1 - ph) * 0.75;
      g.strokeStyle = '#ff5c6b'; g.lineWidth = 1;
      g.beginPath(); g.arc(mx, my, 2 + ph * 8, 0, 7); g.stroke();
      g.globalAlpha = 1;
    }
    g.globalAlpha = hot ? 1 : 0.4;
    g.fillStyle = '#ff5c6b'; g.fillRect(mx - 1.5, my - 1.5, 3, 3);
    g.globalAlpha = 1;
  }
  g.restore();
  // The viewport can hang off charted space now, so draw only the part of it that
  // the plot actually covers — clipped to the frame, half a pixel in for the stroke.
  const vx0 = Math.max(0, cam.x), vy0 = Math.max(0, cam.y);
  const vx1 = Math.min(MAP_W, cam.x + WVW), vy1 = Math.min(MAP_H, cam.y + WVH);
  if (vx1 > vx0 && vy1 > vy0) {
    const L = Math.max(MM_X + .5, MM_X + vx0 * sx), T = Math.max(MM_Y + .5, MM_Y + vy0 * sy);
    const R = Math.min(MM_X + MM_W - .5, MM_X + vx1 * sx), B = Math.min(MM_Y + MM_H - .5, MM_Y + vy1 * sy);
    if (R > L && B > T) { g.strokeStyle = '#ff3b47'; g.lineWidth = 1; g.strokeRect(L, T, R - L, B - T); }
  }

  // --- reactor, bottom left ---
  {
    const cx = 62, cy = VIEW_H - 74, R0 = 34;
    const cap = (power.cap ?? 0) / 100;
    const sysI = power.to ? SYSTEMS.indexOf(power.to) : -1;
    const lvl = power.to ? (power.lv?.[power.to] ?? 0) / 100 : 0;
    const col = sysI < 0 ? '#5b6b85' : SYS_COLOUR[sysI];

    g.fillStyle = 'rgba(4,7,12,0.72)';
    g.beginPath(); g.arc(cx, cy, R0 + 13, 0, 7); g.fill();

    g.strokeStyle = '#1d2634'; g.lineWidth = 6;    // capacitor ring
    g.beginPath(); g.arc(cx, cy, R0, 0, 7); g.stroke();
    g.strokeStyle = cap > 0.15 ? '#ffd479' : '#ff5c6b'; g.lineWidth = 6;
    g.beginPath(); g.arc(cx, cy, R0, -Math.PI / 2, -Math.PI / 2 + cap * Math.PI * 2); g.stroke();

    if (lvl > 0) {                                 // what is being fed, and how hard
      g.globalAlpha = 0.16 + lvl * 0.34; g.fillStyle = col;
      g.beginPath(); g.arc(cx, cy, (R0 - 7) * (0.35 + lvl * 0.65), 0, 7); g.fill();
      g.globalAlpha = 1;
      g.strokeStyle = col; g.lineWidth = 2.5;
      g.beginPath(); g.arc(cx, cy, R0 - 10, -Math.PI / 2, -Math.PI / 2 + lvl * Math.PI * 2); g.stroke();
    }

    g.textAlign = 'center';
    g.fillStyle = lvl > 0 ? col : '#5b6b85'; g.font = 'bold 14px ui-monospace, monospace';
    g.fillText(`+${Math.round(BOOST * lvl * 100)}%`, cx, cy + 2);
    g.fillStyle = '#66748c'; g.font = '9px ui-monospace, monospace';
    g.fillText(power.to ? power.to.toUpperCase() : 'REACTOR', cx, cy + 14);
    g.fillText(`${Math.round(cap * 100)}%`, cx, cy - 10);

    SYSTEMS.forEach((sys, i) => {                  // 1 2 3, arranged around the dial
      const a0 = -Math.PI / 2 + (i - 1) * 0.85;
      const px = cx + Math.cos(a0) * (R0 + 22), py = cy + Math.sin(a0) * (R0 + 22);
      const on = power.to === sys;
      g.fillStyle = on ? SYS_COLOUR[i] : '#3d4757';
      g.font = (on ? 'bold 12px' : '11px') + ' ui-monospace, monospace';
      g.fillText(String(i + 1), px, py + 4);
    });
    g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
  }

  // --- star system button ---
  const sb = sysBtn();
  g.fillStyle = 'rgba(6,10,16,0.86)'; g.beginPath(); g.roundRect(sb.x, sb.y, sb.w, sb.h, 5); g.fill();
  g.strokeStyle = '#3d5a7f'; g.lineWidth = 1;
  g.beginPath(); g.roundRect(sb.x + .5, sb.y + .5, sb.w - 1, sb.h - 1, 5); g.stroke();
  g.strokeStyle = '#8ab4e6'; g.beginPath();                       // little link glyph
  g.moveTo(sb.x + 12, sb.y + 15); g.lineTo(sb.x + 24, sb.y + 15);
  g.moveTo(sb.x + 24, sb.y + 10); g.lineTo(sb.x + 24, sb.y + 20); g.stroke();
  g.fillStyle = '#8ab4e6';
  for (const [dx, dy] of [[9, 15], [27, 10], [27, 20]]) { g.beginPath(); g.arc(sb.x + dx, sb.y + dy, 2.5, 0, 7); g.fill(); }
  g.fillStyle = '#8ab4e6'; g.fillText('STAR SYSTEM', sb.x + 38, sb.y + 19);

  // What is playing, beside the button. Right-aligned so it grows leftward and
  // never crowds anything, and dimmed while it is only the score — a lit tag is
  // the tell that the fight has taken over the deck.
  const tune = nowPlaying();
  if (tune) {
    const tense = musicMood() !== CALM ? musicMood().toUpperCase() : null;
    const fight = !!tense;
    g.font = '11px ui-monospace, monospace'; g.textAlign = 'right';
    const label = tune.length > 30 ? tune.slice(0, 29) + '\u2026' : tune;
    const tw = g.measureText(label).width + (fight ? 52 : 0);
    g.fillStyle = 'rgba(6,10,16,0.7)';
    g.beginPath(); g.roundRect(sb.x - 18 - tw, sb.y, tw + 14, sb.h, 5); g.fill();
    if (fight) {
      g.textAlign = 'left'; g.font = '9px ui-monospace, monospace';
      const hot = musicMood() === COMBAT;
      g.fillStyle = hot ? 'rgba(224,90,90,0.18)' : 'rgba(224,165,63,0.18)';
      g.fillRect(sb.x - 12 - tw, sb.y + 9, 44, 13);
      g.fillStyle = hot ? '#e05a5a' : '#e0a53f';
      g.fillText(tense, sb.x - 8 - tw, sb.y + 19);
      g.textAlign = 'right';
    }
    g.font = '11px ui-monospace, monospace';
    g.fillStyle = fight ? '#cfe4ff' : '#5b7290';
    g.fillText(label, sb.x - 12, sb.y + 19);
    g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
  }

  // --- hud ---
  g.fillStyle = map.tint; g.fillText(map.name, 16, 24);
  const terr = map.dev ? 'TESTING GROUND' : map.owner ? `${COMPANIES[map.owner].tag} TERRITORY` : 'CONTESTED';
  g.fillStyle = map.dev ? '#7de08a' : map.owner ? COMPANIES[map.owner].color : '#e05a5a';
  g.fillText(terr, 20 + g.measureText(map.name).width, 24);
  // The way out, on screen for as long as you are in here. It was said once in
  // chat, which fades after four seconds, so it may as well not have been said.
  if (map.dev) {
    g.fillStyle = 'rgba(125,224,138,0.55)';
    g.fillText('· /dev to leave', 26 + g.measureText(map.name).width + g.measureText(terr).width, 24);
  }
  g.fillStyle = '#5b6b85';
  g.fillText(`${myName || '…'} · ${COMPANIES[myCo].tag} · ${HULLS[myHull].name} ${HULLS[myHull].cls}` +
             `${myDrones.filter(Boolean).length ? ` +${myDrones.filter(Boolean).length} drones` : ''} · ` +
             `${status} · ${ships.size} in sector`, 16, 42);
  if (me) {
    const hp = Math.round(st.hull * (me.hp ?? 100) / 100);
    const sh = shieldNow, shMax = Math.max(1, shieldTop || st.shield);
    const boosted = shMax > st.shield * 1.001;
    const w = 190;
    g.fillStyle = 'rgba(4,7,12,0.7)'; g.fillRect(16, 52, w, 22);
    g.fillStyle = '#1d3b52'; g.fillRect(18, 54, w - 4, 8);
    g.fillStyle = boosted ? '#8fe7ff' : '#5fd0ff';   // brighter blue, never a different colour
    g.fillRect(18, 54, (w - 4) * sh / shMax, 8);
    if (boosted) {                                 // where the unboosted pool used to end
      const mark = 18 + (w - 4) * (st.shield / shMax);
      g.fillStyle = 'rgba(255,255,255,0.55)'; g.fillRect(mark, 52, 1, 12);
    }
    g.fillStyle = '#26402c'; g.fillRect(18, 64, w - 4, 8);
    g.fillStyle = hp > st.hull / 3 ? '#7de08a' : '#e05a5a';
    g.fillRect(18, 64, (w - 4) * hp / st.hull, 8);
    g.fillStyle = '#5b6b85';
    g.fillText(`SH ${sh}/${shMax | 0}${boosted ? ' ↑' : ''}   HU ${hp}/${st.hull | 0}` +
               (myFit.length ? `   fit ${myFit.length}/${st.slots}` : ''), 16 + w + 10, 68);
    let hostiles = 0, tracks = 0;
    for (const c of ships.values()) if (c.vis === FRESH) hostiles++; else if (c.vis === STALE) tracks++;
    if (docked()) {
      g.fillStyle = COMPANIES[myCo].color;
      g.fillText('◆ DOCKED — repairing', 16 + w + 10, 52);
    } else if (hostiles || tracks) {
      g.fillStyle = '#ff5c6b';
      g.fillText(`▲ ${hostiles} contact${hostiles === 1 ? '' : 's'}` + (tracks ? ` · ${tracks} fading` : ''), 16 + w + 10, 52);
    }
    const vol = holdVol(hold), gw = 190;
    g.fillStyle = 'rgba(4,7,12,0.7)'; g.fillRect(16, 92, gw, 14);
    g.fillStyle = '#1b222d'; g.fillRect(18, 94, gw - 4, 10);
    let gx = 18;                                   // one segment per material, in its own colour
    for (const [m, n] of Object.entries(hold)) {
      const w2 = (gw - 4) * (n * (MATERIALS[m]?.vol ?? 1)) / Math.max(1, cargoCap);
      g.fillStyle = MATERIALS[m]?.colour ?? '#9aa3ad';
      g.fillRect(gx, 94, w2, 10); gx += w2;
    }
    g.fillStyle = vol >= cargoCap ? '#ff5c6b' : '#5b6b85';
    g.fillText(`CARGO ${vol}/${cargoCap}` + (vol >= cargoCap ? '  HOLD FULL' : '') +
               (vol ? `  ${holdValue(hold)} cr` : ''), 16 + gw + 10, 103);
    g.fillStyle = '#ffd479';
    g.fillText(`${credits} ${CURRENCY.short}`, 16, 124);
    const rank = myRank ?? levelFor(myXp);
    g.fillStyle = '#cfe4ff';
    g.fillText(`LVL ${rank.level}`, 16 + 96, 124);
    const bx = 16 + 152, bw2 = 60;
    g.fillStyle = '#1b222d'; g.fillRect(bx, 117, bw2, 6);
    g.fillStyle = '#8ab4e6'; g.fillRect(bx, 117, bw2 * progress(myXp), 6);
    if (atDock && vol > 0) {
      g.fillStyle = COMPANIES[myCo].color;
      g.fillText('docked — press I to stow cargo', 16 + 96, 124);
    }
    g.fillStyle = depth > 0 ? '#ff5c6b' : '#5b6b85';
    g.fillText(depth > 0 ? `SHEAR ${driftDps(depth) | 0}/s` :
               `RDR ${st.radar | 0}   SIG ${Math.round(st.signature * 10) / 10}s   ` +
               `GUN ${st.damage | 0}×${Math.round(st.fireRate * 10) / 10}/s @${st.weaponRange | 0}`, 16 + w + 10, 84);
  }
  g.fillText('TAB engage · TAB TAB break off · click cargo to haul it in · ' +
             'I inventory · H hangar · M star system · Q E ammo · O sound', 16, VIEW_H - 16);

  if (depth > 0 && !sysOpen && !bayOpen) {
    const t = Math.min(1, depth / DRIFT_MARGIN);
    const vig = g.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.28,
                                       VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.78);
    vig.addColorStop(0, 'transparent');
    vig.addColorStop(1, `rgba(150,12,24,${0.20 + t * 0.5})`);
    g.fillStyle = vig; g.fillRect(0, 0, VIEW_W, VIEW_H);

    const pulse = 0.5 + 0.5 * Math.abs(Math.sin(now / (150 - t * 80)));
    g.textAlign = 'center'; g.globalAlpha = pulse;
    g.fillStyle = '#ff2f42'; g.font = 'bold 30px ui-monospace, SFMono-Regular, monospace';
    g.fillText('⚠  BEACON LATTICE LOST  ⚠', VIEW_W / 2, VIEW_H * 0.22);
    g.globalAlpha = 0.6 + pulse * 0.4;
    g.font = '15px ui-monospace, monospace'; g.fillStyle = '#ff8a95';
    g.fillText(`UNCOMPENSATED HULL SHEAR — ${driftDps(depth) | 0}/s`, VIEW_W / 2, VIEW_H * 0.22 + 28);
    g.font = '13px ui-monospace, monospace'; g.fillStyle = '#ffc4ca';
    g.fillText(`${depth | 0}m OUTSIDE CHARTED SPACE — COME ABOUT`, VIEW_W / 2, VIEW_H * 0.22 + 52);
    g.globalAlpha = 1; g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
  }

  if (notice) {
    const age = (now - notice.at) / 1000;
    if (age > 4.5) notice = null;
    else {
      g.globalAlpha = age < 0.25 ? age / 0.25 : Math.min(1, (4.5 - age) / 1.2);
      g.font = '15px ui-monospace, monospace'; g.textAlign = 'center';
      const w2 = g.measureText(notice.text).width + 40;
      g.fillStyle = 'rgba(6,10,16,0.88)'; g.fillRect(VIEW_W / 2 - w2 / 2, 22, w2, 38);
      g.strokeStyle = notice.colour; g.lineWidth = 1;
      g.strokeRect(VIEW_W / 2 - w2 / 2 + .5, 22.5, w2 - 1, 37);
      g.fillStyle = notice.colour; g.fillText(notice.text, VIEW_W / 2, 47);
      g.textAlign = 'left'; g.globalAlpha = 1; g.font = '12px ui-monospace, monospace';
    }
  }

  stirMusic(now);
  stepSignOut();
  if (!dead) drawToasts(now);
  if (!dead && !sysOpen && !setOpen) { drawBar(); drawSpacePrompt(); }   // under the panels, over the world
  if (leaving()) drawLeaving();
  if (setOpen) drawSettings();
  if (sysOpen) drawSystem(me);
  if (bayOpen) drawBay();
  if (invOpen) drawInventory();
  if (dead) drawWreck(now);
  if (chatOpen || chatLog.some(m => now - m.at < CHAT_LINGER)) drawChat(now);

  if (!signedOff && performance.now() - lastInput > IDLE_LIMIT) {
    signedOff = true;
    try { ws.close(4002, 'idle'); } catch {}
    status = 'signed out';
  }
  if (signedOff) drawSignedOff();
}

function drawChat(now) {
  const w = Math.min(620, VIEW_W - 80), x = (VIEW_W - w) / 2;
  // Open, it is a window onto the whole conversation. Closed, only the last few
  // lines linger, and only briefly — the history is there when you ask for it.
  const recent = chatOpen ? chatLog.slice(-8)
                          : chatLog.filter(m => now - m.at < CHAT_LINGER).slice(-4);
  if (!recent.length && !chatOpen) return;
  const lineH = 18, boxH = recent.length * lineH + (chatOpen ? 34 : 8);
  const y = VIEW_H * 0.42 - boxH / 2;
  const fadeOf = m => {
    if (chatOpen) return 1;
    const left = CHAT_LINGER - (now - m.at);
    return Math.max(0, Math.min(1, left / CHAT_FADE));
  };

  if (chatOpen) {
    g.fillStyle = 'rgba(6,10,16,0.9)'; g.fillRect(x, y, w, boxH);
    g.strokeStyle = '#2c3d55'; g.lineWidth = 1; g.strokeRect(x + .5, y + .5, w - 1, boxH - 1);
  }

  g.font = '12px ui-monospace, monospace'; g.textAlign = 'left';
  recent.forEach((m, i) => {
    const ty = y + 6 + i * lineH + 12;
    g.globalAlpha = fadeOf(m);
    if (!chatOpen) {                               // no panel when closed, so a shadow keeps it legible
      g.lineWidth = 3; g.strokeStyle = 'rgba(4,7,12,0.85)';
      g.strokeText((m.from ? m.from + '  ' : '') + m.text, x + 10, ty);
    }
    if (m.from) {
      g.fillStyle = COMPANIES[m.co]?.color ?? '#8ab4e6';
      g.fillText(m.from, x + 10, ty);
      g.fillStyle = '#cfe4ff';
      g.fillText(m.text, x + 12 + g.measureText(m.from).width + 6, ty);
    } else {
      g.fillStyle = '#8ab4e6';                     // the console answering you
      g.fillText(m.text, x + 10, ty);
    }
    g.globalAlpha = 1;
  });

  if (chatOpen) {
    const iy = y + boxH - 24;
    g.fillStyle = 'rgba(255,255,255,0.04)'; g.fillRect(x + 6, iy, w - 12, 20);
    g.fillStyle = amAdmin ? '#ffd479' : '#66748c';
    g.fillText(amAdmin ? '»' : '>', x + 12, iy + 14);
    g.fillStyle = '#fff';
    g.fillText(chatLine, x + 26, iy + 14);
    if ((now / 500 | 0) % 2) {
      g.fillStyle = '#7de08a';
      g.fillRect(x + 27 + g.measureText(chatLine).width, iy + 4, 7, 13);
    }
    g.fillStyle = '#3d4757'; g.textAlign = 'right';
    g.fillText(amAdmin ? '/help · admin' : '/help', x + w - 10, iy + 14);
    g.textAlign = 'left';
  }
  g.font = '12px ui-monospace, monospace';
}

function drawSignedOff() {
  g.fillStyle = 'rgba(3,5,9,0.93)'; g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.textAlign = 'center';
  g.fillStyle = '#8ab4e6'; g.font = '26px ui-monospace, SFMono-Regular, monospace';
  g.fillText('SIGNED OUT', VIEW_W / 2, VIEW_H * 0.45);
  g.fillStyle = '#66748c'; g.font = '13px ui-monospace, monospace';
  g.fillText(`${IDLE_LIMIT / 60000} minutes without input — your ship was docked and the sector released`,
             VIEW_W / 2, VIEW_H * 0.45 + 28);
  g.fillStyle = '#7de08a'; g.font = '14px ui-monospace, monospace';
  g.fillText('click anywhere to come back', VIEW_W / 2, VIEW_H * 0.45 + 60);
  g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
}

function drawWreck(now) {
  const age = (now - dead.at) / 1000;
  const fade = Math.min(1, age / 0.8);
  const grd = g.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.15,
                                     VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.85);
  grd.addColorStop(0, `rgba(40,4,8,${0.55 * fade})`);
  grd.addColorStop(1, `rgba(8,2,4,${0.94 * fade})`);
  g.fillStyle = grd; g.fillRect(0, 0, VIEW_W, VIEW_H);

  g.globalAlpha = fade; g.textAlign = 'center';
  g.fillStyle = '#ff3b47'; g.font = 'bold 34px ui-monospace, SFMono-Regular, monospace';
  g.fillText('SHIP DESTROYED', VIEW_W / 2, VIEW_H * 0.34);

  const lost = Object.entries(dead.lost);
  g.font = '13px ui-monospace, monospace';
  if (lost.length) {
    g.fillStyle = '#8d99ab';
    g.fillText('cargo lost with the hull — it is still out there', VIEW_W / 2, VIEW_H * 0.34 + 34);
    let lx = VIEW_W / 2 - lost.reduce((w2, [m, n]) =>
      w2 + g.measureText(`${MATERIALS[m]?.sym ?? m} ×${n}`).width + 26, 0) / 2;
    for (const [m, n] of lost) {
      const txt = `${MATERIALS[m]?.sym ?? m} ×${n}`;
      g.fillStyle = MATERIALS[m]?.colour ?? '#9aa3ad'; g.textAlign = 'left';
      g.fillText(txt, lx, VIEW_H * 0.34 + 58);
      lx += g.measureText(txt).width + 26;
    }
    g.textAlign = 'center';
  } else {
    g.fillStyle = '#66748c';
    g.fillText('an empty hold — nothing to lose', VIEW_W / 2, VIEW_H * 0.34 + 34);
  }
  g.fillStyle = '#ffd479'; g.font = '12px ui-monospace, monospace';
  g.fillText(`${credits} ${CURRENCY.short} intact — the company keeps your account, not your ship`,
             VIEW_W / 2, VIEW_H * 0.34 + 86);

  const b = respawnBtn();
  const pulse = 0.75 + 0.25 * Math.sin(now / 380);
  g.globalAlpha = fade * pulse;
  g.fillStyle = 'rgba(125,224,138,0.16)'; g.fillRect(b.x, b.y, b.w, b.h);
  g.strokeStyle = '#7de08a'; g.lineWidth = 1.6; g.strokeRect(b.x + .5, b.y + .5, b.w - 1, b.h - 1);
  g.fillStyle = '#7de08a'; g.font = '16px ui-monospace, monospace';
  g.fillText('RESPAWN', b.x + b.w / 2, b.y + 33);
  g.globalAlpha = fade;
  g.fillStyle = '#5b6b85'; g.font = '11px ui-monospace, monospace';
  g.fillText(`click, or press Enter — you rebuild at ${COMPANIES[myCo].tag}-1`, VIEW_W / 2, b.y + b.h + 22);
  g.globalAlpha = 1; g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
}
</script>
