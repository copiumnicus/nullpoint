      if (why) return say(why, '#e0a53f');
      return send({ t: 'scraphull', key: it.k });
    }
    if (it.kind === 'device') {
      const d = DEVICES[it.k];
      return credits >= d.price ? send({ t: 'buydevice', key: it.k })
        : say(`A ${d.name} costs ${fmtCredits(d.price)} ${CURRENCY.short}`, '#e0a53f');
    }
    const gated = whyNotSold(it.k, { docked: atRing && !inMyOutpost(), berth: !berthWhy() });
    if (gated) return say(`${EQUIPMENT[it.k].name} — ${gated}`, '#e0a53f');
    return credits >= EQUIPMENT[it.k].price ? send({ t: 'buy', item: it.k })
      : say(`A ${EQUIPMENT[it.k].name} costs ${fmtCredits(EQUIPMENT[it.k].price)} ${CURRENCY.short}`, '#e0a53f');
  }
}

const fmt = v => Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 10) / 10;

// The one number that tells you which of two items in your inventory you want,
// without opening a tooltip: what it is for, not everything it does.
const headline = k => {
  const e = EQUIPMENT[k];
  const pick = a => e.mods.find(([n]) => n === a);
  const m = pick(e.kind === 'rocket' ? 'rockets' : e.slot === 'weapon' ? 'damage'
              : e.slot === 'generator' ? 'shield' : null) ?? e.mods[0];
  if (!m) return '';
  const [attr, op, v] = m;
  return op === 'mul' ? `${ATTRS[attr].label} ${v > 0 ? '+' : ''}${Math.round(v * 100)}%`
       : attr === 'rockets' ? `${v} rocket${v === 1 ? '' : 's'}`
       : `${v > 0 ? '+' : ''}${fmt(v)} ${ATTRS[attr].label.toLowerCase()}`;
};

// A framed box of real numbers, placed beside the cursor and nudged back on
// screen at the edges. This is the only place the effect of a module is stated
// exactly — a blurb reads well and tells you nothing.
function drawTip(tip, at) {
  if (!tip) return;
  g.font = '11px ui-monospace, monospace';
  const lines = tip.lines.slice(0, 12);
  const cut = tip.lines.length - lines.length;
  const notes = tip.notes ?? [];
  const widest = Math.max(g.measureText(tip.title).width + 90,
                          g.measureText(tip.blurb ?? '').width,
                          g.measureText(tip.does ?? '').width,
                          ...notes.map(n => g.measureText(n).width),
                          ...lines.map(l => g.measureText(`${l.label}  ${l.from} → ${l.to}${l.unit}`).width + 54));
  const w = Math.min(340, Math.max(190, widest + 24));
  const h = 40 + (tip.blurb ? 15 : 0) + (tip.does ? 15 : 0) + lines.length * 15 + (cut ? 14 : 0)
          + (notes.length ? 6 + notes.length * 14 : 0);
  const x = Math.min(at.x + 18, VIEW_W - w - 8), y = Math.min(at.y + 14, VIEW_H - h - 8);

  g.fillStyle = 'rgba(6,10,16,0.97)'; g.fillRect(x, y, w, h);
  g.strokeStyle = '#3d5876'; g.lineWidth = 1; g.strokeRect(x + .5, y + .5, w - 1, h - 1);

  let ty = y + 19;
  g.textAlign = 'left'; g.fillStyle = '#cfe4ff'; g.font = '12px ui-monospace, monospace';
  g.fillText(tip.title, x + 10, ty);
  if (tip.price) { g.textAlign = 'right'; g.fillStyle = credits >= tip.price ? '#ffd479' : '#7a6a45';
                   g.fillText(`${fmtCredits(tip.price)} ${CURRENCY.short}`, x + w - 10, ty); g.textAlign = 'left'; }
  ty += 14;
  g.font = '10px ui-monospace, monospace'; g.fillStyle = '#66748c';
  g.fillText(tip.sub ?? '', x + 10, ty); ty += tip.blurb ? 15 : 6;
  if (tip.blurb) { g.fillStyle = '#8ea3bd'; g.fillText(tip.blurb, x + 10, ty); ty += 8; }
  // What it lets you do, in the colour the readouts use for a gain. It is above
  // the numbers on purpose: on the technology shelf the sentence is the thing
  // being sold and the percentages are what it cost.
  if (tip.does) { ty += 15; g.fillStyle = '#7de08a'; g.fillText(tip.does, x + 10, ty); }

  g.font = '11px ui-monospace, monospace';
  for (const l of lines) {
    ty += 15;
    g.fillStyle = '#7b8ba3'; g.fillText(l.label, x + 10, ty);
    g.textAlign = 'right';
    g.fillStyle = '#66748c'; g.fillText(String(l.from), x + w - 96, ty);
    g.fillStyle = '#3d4757'; g.fillText('→', x + w - 84, ty);
    g.fillStyle = l.good ? '#7de08a' : '#e07a7a';
    g.fillText(`${l.to}${l.unit}`, x + w - 44, ty);
    if (l.pct !== null) { g.font = '10px ui-monospace, monospace';
                          g.fillText(`${l.pct > 0 ? '+' : ''}${l.pct}%`, x + w - 10, ty);
                          g.font = '11px ui-monospace, monospace'; }
    g.textAlign = 'left';
  }
  if (cut) { ty += 14; g.fillStyle = '#4a5568'; g.font = '10px ui-monospace, monospace';
             g.fillText(`+${cut} more`, x + 10, ty); }
  // Every note on its own line. They used to be one string, which meant the one
  // that mattered most — where the thing is even sold — had to be left out.
  if (notes.length) {
    g.font = '10px ui-monospace, monospace'; ty += 4;
    for (const n of notes) { ty += 14; g.fillStyle = '#5b6b85'; g.fillText(n, x + 10, ty); }
  }
  g.font = '11px ui-monospace, monospace';
}

function drawBay() {
  const G = bayGeom(), P = G.panel;
  const stats = resolve(myHull, myFit, escortOf(myDrones, myRig), myForm), bare = resolve(myHull, emptyFit());
  const home = docked();
  const at = hover && hover.x > P.x && hover.x < P.x + P.w && hover.y > P.y && hover.y < P.y + P.h ? hover : null;
  const over = r => at && at.x > r.x && at.x < r.x + r.w && at.y > r.y && at.y < r.y + r.h;
  let tip = null;

  g.fillStyle = 'rgba(3,5,9,0.92)'; g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.fillStyle = 'rgba(8,12,19,0.98)'; g.fillRect(P.x, P.y, P.w, P.h);
  g.strokeStyle = '#2c3d55'; g.lineWidth = 1; g.strokeRect(P.x + .5, P.y + .5, P.w - 1, P.h - 1);

  g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
  for (const t of G.tabs) {
    const on = t.key === G.tab;
    g.fillStyle = on ? 'rgba(90,150,220,0.18)' : 'rgba(255,255,255,0.02)';
    g.fillRect(t.r.x, t.r.y, t.r.w, t.r.h);
    g.strokeStyle = on ? '#7fd4ff' : '#2c3d55'; g.lineWidth = on ? 1.6 : 1;
    g.strokeRect(t.r.x + .5, t.r.y + .5, t.r.w - 1, t.r.h - 1);
    g.fillStyle = on ? '#cfe4ff' : '#66748c'; g.textAlign = 'center';
    g.fillText(t.name, t.r.x + t.r.w / 2, t.r.y + t.r.h / 2 + 4);
  }
  g.textAlign = 'right'; g.font = '13px ui-monospace, monospace'; g.fillStyle = '#ffd479';
  g.fillText(`${fmtCredits(credits)} ${CURRENCY.short}`, P.x + P.w - 20, P.y + 32);
  g.textAlign = 'left'; g.font = '11px ui-monospace, monospace';
  g.fillStyle = home ? '#66748c' : '#e0a53f';
  g.fillText(home ? 'docked — every change takes effect at once'
           : MAPS[mapId].dev ? 'fly into the workshop ring to outfit'
                             : 'out here only ammunition sells — the rest wants a dock or a rented bay',
             P.x + 236, P.y + 32);

  // a live stat line, so the effect of a click is visible immediately
  let sx = P.x + 20;
  for (const k of ['hull', 'shield', 'damage', 'speed', 'capacitor']) {
    const d = stats[k] - bare[k];
    g.fillStyle = '#66748c'; g.fillText(ATTRS[k].label.toUpperCase(), sx, P.y + 62);
    g.fillStyle = '#cfe4ff'; g.font = '13px ui-monospace, monospace';
    g.fillText(String(Math.round(stats[k])), sx, P.y + 78);
    if (Math.abs(d) > 0.01) {
      g.fillStyle = (ATTRS[k].better === 'high') === (d > 0) ? '#7de08a' : '#e07a7a';
      g.font = '10px ui-monospace, monospace';
      g.fillText(`${d > 0 ? '+' : ''}${Math.round(d)}`, sx + 44, P.y + 78);
    }
    g.font = '11px ui-monospace, monospace';
    sx += G.colW * 0.62;
  }

  const pct = v => `${v > 0 ? '+' : ''}${Math.round(v * 100)}%`;
  const SHORT = { damage: 'dmg', hull: 'hull', shield: 'shld', speed: 'spd', accel: 'acc' };

  if (G.tab === 'hangar') {
    g.globalAlpha = home ? 1 : 0.45;               // look all you like; fitting needs the ring
    g.fillStyle = '#5b6b85';
    g.fillText('YOUR SHIPS', P.x + 20, G.top - 10);
    g.fillText(`RACKS  ${fitCount(myFit)}/${SLOTS.reduce((n, s2) => n + slotsOf(myHull)[s2], 0)}`,
               P.x + 30 + G.colW, G.top - 10);
    g.fillText('ESCORT', P.x + 40 + G.colW * 2, G.top - 10);

    for (const { k, r } of G.hulls) {
      const H = HULLS[k], on = k === myHull, sl = slotsOf(k);
      if (over(r) && !on) tip = tipFor('hull', k, shipCtx());
      g.fillStyle = on ? 'rgba(90,150,220,0.16)' : over(r) ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.03)';
      g.fillRect(r.x, r.y, r.w, r.h);
      g.strokeStyle = on ? '#7fd4ff' : '#2c3d55'; g.lineWidth = on ? 1.6 : 1;
      g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);
      g.fillStyle = COMPANIES[myCo].color;
      g.fillRect(r.x + 16 - H.r / 2, r.y + r.h / 2 - H.r / 2, H.r, H.r);
      g.fillStyle = on ? '#fff' : '#93a3b5'; g.font = '12px ui-monospace, monospace';
      g.fillText(H.name, r.x + 36, r.y + 20);
      g.fillStyle = '#66748c'; g.font = '10px ui-monospace, monospace';
      g.fillText(`${H.cls}   W${sl.weapon} G${sl.generator} T${sl.tech}   ${H.attrs.hull} hull  ` +
                 `${H.attrs.cargo} hold`, r.x + 36, r.y + 35);
      if (on) { g.fillStyle = '#7fd4ff'; g.textAlign = 'right';
                g.fillText('FLYING', r.x + r.w - 10, r.y + 20); g.textAlign = 'left'; }
      g.font = '11px ui-monospace, monospace';
    }

    for (const row of G.racks) {
      const r = row.r;
      if (row.header) {
        g.fillStyle = '#3d4757'; g.font = '10px ui-monospace, monospace';
        g.fillText(row.slot === 'drone' ? `DRONE BAYS  ${myDrones.length}/${MAX_DRONES}`
                 : row.slot === 'rig'   ? 'COLLECTOR RIG  (its own bay)'
                 : row.slot === 'form'  ? `FORMATION${myDrones.length ? '' : '  (needs drones)'}`
                                        : row.slot.toUpperCase(),
                   r.x + 2, r.y + r.h - 4);
        g.font = '11px ui-monospace, monospace';
        continue;
      }
      if (row.slot === 'form') {
        const F = FORMATIONS[row.key], flying = row.key === myForm;
        if (over(r)) tip = tipFor('form', row.key, shipCtx());
        g.fillStyle = flying ? 'rgba(125,224,138,0.12)' : over(r) ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.02)';
        g.fillRect(r.x, r.y, r.w, r.h);
        g.strokeStyle = flying ? '#7de08a' : '#2c3d55'; g.lineWidth = 1;
        g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);
        const mid = r.y + r.h / 2 + 4;
        g.fillStyle = flying ? '#cfe4ff' : '#8ea3bd';
        g.fillText(F.name, r.x + 10, mid);
        g.textAlign = 'right';
        g.fillStyle = flying ? '#7de08a' : '#66748c';
        g.fillText(flying ? 'FLYING' : 'fly it', r.x + r.w - 10, mid);
        g.textAlign = 'left';
        // What this escort would really deliver, not the brochure number.
        // escortScale, not bonusScale: the escort ramp is fittable now (cohesion and
        // escort are attributes), and bonusScale knows nothing about them — a ship
        // flying Wing Repeaters read "+4%" while actually flying +12%.
        const k = escortScale(myDrones.length, stats);
        const nameW = g.measureText(F.name).width;
        g.font = '10px ui-monospace, monospace';
        const mx = r.x + 20 + nameW, room = r.x + r.w - 60 - mx;
        const forms = F.mods.length
          ? [F.mods.map(([a, , v]) => `${SHORT[a] ?? a} ${pct(v * k)}`).join('  '),
             F.mods.map(([a, , v]) => `${SHORT[a] ?? a}${pct(v * k)}`).join(' '), '']
          : ['no effect', ''];
        g.fillStyle = '#66748c';
        g.fillText(forms.find(t => g.measureText(t).width <= room) ?? '', mx, mid);
        g.font = '11px ui-monospace, monospace';
        continue;
      }
      const held = row.slot === 'drone' ? myDrones[row.index]
                 : row.slot === 'rig'   ? myRig
                 : (myFit[row.slot] ?? [])[row.index];
      const item = EQUIPMENT[held];
      const stock = item ? [] : lockerFor(row.slot);
      if (over(r) && held) tip = tipFor('item', held, shipCtx());
      else if (over(r) && stock.length === 1) {
        tip = tipFor('item', stock[0], shipCtx());
        tip = tip && { ...tip, notes: ['The only thing you own that fits. Click to fit it.', ...tip.notes] };
      }
      g.fillStyle = item ? 'rgba(125,224,138,0.12)' : over(r) ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.02)';
      g.fillRect(r.x, r.y, r.w, r.h);
      g.strokeStyle = item ? '#7de08a' : '#2c3d55'; g.lineWidth = 1;
      if (!item) g.setLineDash([3, 3]);
      g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1); g.setLineDash([]);
      let tx = r.x + 10;
      if (row.slot === 'drone') { g.fillStyle = COMPANIES[myCo].color;
                                  g.fillRect(r.x + 8, r.y + r.h / 2 - 3, 6, 6); tx = r.x + 22; }
      g.fillStyle = item ? '#cfe4ff' : '#3d4757';
      g.fillText(item ? item.name : row.slot === 'drone' ? 'empty bay' : 'empty', tx, r.y + r.h / 2 + 4);
      if (!item && stock.length) { g.fillStyle = '#4d6a45'; g.textAlign = 'right';
                                   g.fillText(stock.length === 1 ? 'fit ' + EQUIPMENT[stock[0]].name
                                                                 : `choose  (${stock.length})`,
                                              r.x + r.w - 10, r.y + r.h / 2 + 4);
                                   g.textAlign = 'left'; }
      if (item) { g.fillStyle = '#66748c'; g.textAlign = 'right';
                  g.fillText('remove', r.x + r.w - 10, r.y + r.h / 2 + 4); g.textAlign = 'left'; }
    }

    g.globalAlpha = 1;
    g.fillStyle = '#5b6b85';
    g.fillText(home ? 'click an empty slot to choose what goes in it · a filled slot to strip it · H or Esc to close'
                    : 'looking only — fitting needs your base ring · ammunition is sold anywhere',
               P.x + 20, P.y + P.h - 18);
    g.font = '12px ui-monospace, monospace';

    const pick = pickGeom();
    if (pick) {
      const B = pick.box;
      g.fillStyle = 'rgba(4,7,12,0.97)'; g.fillRect(B.x, B.y, B.w, B.h);
      g.strokeStyle = '#5a86b8'; g.lineWidth = 1.4; g.strokeRect(B.x + .5, B.y + .5, B.w - 1, B.h - 1);
      for (const { k, r } of pick.rows) {
        const e = EQUIPMENT[k], hot = over(r);
        if (hot) tip = tipFor('item', k, shipCtx());
        g.fillStyle = hot ? 'rgba(122,180,240,0.16)' : 'rgba(255,255,255,0.03)';
        g.fillRect(r.x, r.y, r.w, r.h);
        g.fillStyle = hot ? '#eaf3ff' : '#cfe4ff'; g.font = '12px ui-monospace, monospace';
        g.fillText(e.name, r.x + 10, r.y + r.h / 2 + 4);
        g.textAlign = 'right';
        g.fillStyle = '#7de08a'; g.font = '11px ui-monospace, monospace';
        g.fillText(`x${myGear[k] ?? 0}`, r.x + r.w - 10, r.y + r.h / 2 + 4);
        g.fillStyle = '#66748c'; g.font = '10px ui-monospace, monospace';
        g.fillText(headline(k), r.x + r.w - 46, r.y + r.h / 2 + 4);
        g.textAlign = 'left'; g.font = '11px ui-monospace, monospace';
      }
    }
    drawTip(tip, at ?? { x: 0, y: 0 });
    return;
  }

  // --- store ---------------------------------------------------------------
  g.fillStyle = '#5b6b85';
  g.fillText('DEPARTMENT', P.x + 20, G.top - 10);
  // The inventory has no page list, so there is no page hint and nothing to
  // measure it against — G.pages[0] is undefined there, and reading .r off it
  // threw inside the render loop and took the whole panel with it.
  if (G.pages.length)
    g.fillText(STORE_PAGES.find(p => p.key === G.page)?.hint ?? '', P.x + 30 + G.pages[0].r.w, G.top - 10);
  else if (bayTab === 'inventory')
    g.fillText(`Everything you own and are not flying. Click to break it up for ${Math.round(SCRAP_RATE * 100)}%.`,
               P.x + 20, G.top - 10);

  for (const p of G.pages) {
    const on = p.key === G.page, r = p.r;
    // Dimmed means "not from here" — the page still opens, so you can price
    // things on the way home.
    g.globalAlpha = sellsAt(p.key, home) ? 1 : 0.4;
    g.fillStyle = on ? 'rgba(90,150,220,0.16)' : over(r) ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.02)';
    g.fillRect(r.x, r.y, r.w, r.h);
    g.strokeStyle = on ? '#7fd4ff' : '#2c3d55'; g.lineWidth = on ? 1.6 : 1;
    g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);
    g.fillStyle = on ? '#cfe4ff' : '#8ea3bd'; g.font = '12px ui-monospace, monospace';
    g.fillText(p.name, r.x + 12, r.y + r.h / 2 + 4);
    g.font = '11px ui-monospace, monospace'; g.globalAlpha = 1;
  }

  // STATS: where every number on the ship came from. The ship, then what you
  // bolted to it, then the technologies, then the research ladder — in the order
  // they are applied, because a technology multiplies what the equipment added and
  // showing them the other way round makes the technology look smaller than it is.
  if (bayTab === 'stats') {
    g.save();
    g.beginPath(); g.rect(G.body.x, G.body.y, G.body.w, G.body.h); g.clip();
    for (const row of G.stats ?? []) {
      const r = row.r;
      const val = v => row.pct ? `${(v * 100).toFixed(1)}%` : Math.round(v).toLocaleString('en-US');
      g.font = '12px ui-monospace, monospace';
      g.fillStyle = row.touched ? '#cfe4ff' : '#66748c';
      g.fillText(row.label, r.x + 4, r.y + 16);
      g.textAlign = 'right';
      // Where it started and where it ended, side by side, because a final number
      // on its own is exactly what this page exists to stop being the only thing.
      g.fillStyle = '#5b6b85'; g.font = '11px ui-monospace, monospace';
      g.fillText(val(row.base), r.x + r.w * 0.62, r.y + 16);
      g.fillStyle = row.touched ? '#7de08a' : '#66748c'; g.font = 'bold 12px ui-monospace, monospace';
      g.fillText(val(row.final) + (row.unit && !row.pct ? row.unit : ''), r.x + r.w - 8, r.y + 16);
      g.textAlign = 'left';
      g.strokeStyle = '#1d2b3d'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(r.x, r.y + 24.5); g.lineTo(r.x + r.w, r.y + 24.5); g.stroke();

      let ly = r.y + 24;
      for (const st of row.steps) {
        ly += STAT_STEP;
        const up = st.to > st.from;
        g.font = '10px ui-monospace, monospace'; g.fillStyle = '#7f8fa6';
        g.fillText('   ' + LAYER_NAME[st.layer], r.x + 4, ly);
        g.textAlign = 'right';
        g.fillStyle = up ? '#7de08a' : '#e0a53f';
        g.fillText(`${val(st.from)} \u2192 ${val(st.to)}`, r.x + r.w - 8, ly);
        // The multiple, which is the part you cannot do in your head.
        g.fillStyle = '#4a5568';
        g.fillText(st.from ? `x${(st.to / st.from).toFixed(2)}` : '', r.x + r.w * 0.62, ly);
        g.textAlign = 'left';
      }
    }
    g.restore();
    if (G.bar) {
      g.fillStyle = 'rgba(255,255,255,0.05)';
      g.fillRect(G.bar.track.x, G.bar.track.y, G.bar.track.w, G.bar.track.h);
      g.fillStyle = '#3d5876'; g.fillRect(G.bar.x, G.bar.y, G.bar.w, G.bar.h);
    }
    g.font = '11px ui-monospace, monospace';
  }

  if (bayTab === 'inventory' && !G.store.length) {
    g.textAlign = 'center'; g.font = '12px ui-monospace, monospace'; g.fillStyle = '#66748c';
    g.fillText('Nothing spare. Everything you own is bolted to the ship.',
               G.panel.x + G.panel.w / 2, G.panel.y + G.panel.h / 2);
    g.textAlign = 'left';
  }

  // A shelf longer than the panel says so, and says how much of it you are seeing.
  if (G.bar) {
    g.fillStyle = 'rgba(90,134,184,0.16)';
    g.fillRect(G.bar.track.x, G.bar.track.y, G.bar.track.w, G.bar.track.h);
    g.fillStyle = '#5a86b8';
    g.fillRect(G.bar.x, G.bar.y, G.bar.w, G.bar.h);
    g.textAlign = 'right'; g.font = '9px ui-monospace, monospace'; g.fillStyle = '#3d4757';
    // "3-9 of 14" is a ROW count and only the row-snapped tabs have one. The stats
    // page scrolls by pixels over rows of different heights, so it has no such
    // number and printed "1-NaN of undefined" until this asked.
    g.fillText(Number.isFinite(G.scroll?.total)
      ? `${G.scroll.at + 1}-${Math.min(G.scroll.total, G.scroll.at + G.scroll.per)} of ${G.scroll.total}  ·  scroll`
      : 'scroll',
               G.bar.track.x - 8, G.panel.y + G.panel.h - 16);
    g.textAlign = 'left'; g.font = '11px ui-monospace, monospace';
  }

  for (const it of G.store) {
    const r = it.r;
    const price = it.kind === 'own' ? scrapOfItem(it.k)
                : it.kind === 'ownhull' ? scrapOfHull(it.k)
                : it.kind === 'hull' ? HULLS[it.k].price
                : it.kind === 'form' ? FORMATIONS[it.k].price
                : it.kind === 'drone' ? dronePrice(myDrones.length)
                : it.kind === 'ammo' ? AMMO[it.k].price
                : it.kind === 'kit' ? KITS[it.k].price
                : it.kind === 'device' ? DEVICES[it.k].price
                                      : EQUIPMENT[it.k].price;
    const name = it.kind === 'own' ? `${EQUIPMENT[it.k].name}   x${it.n}`
               : it.kind === 'ownhull' ? `${HULLS[it.k].name}   (not flying)`
               : it.kind === 'hull' ? HULLS[it.k].name
               : it.kind === 'form' ? FORMATIONS[it.k].name
               : it.kind === 'drone' ? `Drone ${myDrones.length + 1}`
               : it.kind === 'ammo' ? `${AMMO[it.k].name}   crate of ${AMMO[it.k].pack}`
               : it.kind === 'kit' ? KITS[it.k].name
               : it.kind === 'device' ? DEVICES[it.k].name
                                     : EQUIPMENT[it.k].name;
    // Every row carries a sentence AND its numbers. The numbers are read off the
    // tables rather than written into the blurbs, so a rebalance cannot leave the
    // shelf advertising last week's figures — see modSummary.
    const blurb = it.kind === 'own' ? EQUIPMENT[it.k].blurb
                : it.kind === 'ownhull' ? `${HULLS[it.k].cls} — a hull you own and are not flying`
                : it.kind === 'hull' ? `${HULLS[it.k].cls}   W${slotsOf(it.k).weapon} G${slotsOf(it.k).generator} T${slotsOf(it.k).tech}   ${HULLS[it.k].blurb}`
                : it.kind === 'form' ? `${FORMATIONS[it.k].blurb}   ${modSummary(FORMATIONS[it.k].mods) || 'no bonus'}`
                : it.kind === 'drone' ? `An escort ship carrying one module of yours.   bay ${myDrones.length + 1} of ${MAX_DRONES}`
                : it.kind === 'ammo' ? `${AMMO[it.k].blurb}   x${AMMO[it.k].mult.toFixed(2)} damage`
                : it.kind === 'kit' ? `${KITS[it.k].blurb}   +${Math.round(KITS[it.k].heal * 100)}% hull over ${KITS[it.k].secs}s`
                : it.kind === 'device' ? `${DEVICES[it.k].blurb}   ${DEVICES[it.k].secs}s to fold`
                // A technology row leads with what it lets you DO and then what
                // that costs, because on this shelf the sentence IS the purchase
                // and the percentages are the receipt. Everything else keeps its
                // blurb — a generator really is its numbers.
                : EQUIPMENT[it.k].does
                  ? `${EQUIPMENT[it.k].does}   ${modSummary(EQUIPMENT[it.k].mods) || SPENDS[EQUIPMENT[it.k].spends] || ''}`
                  : EQUIPMENT[it.k].blurb;
    const afford = credits >= price;
    const sells = sellsAt(G.page, home);
    if (over(r)) tip = tipFor(it.kind, it.k, shipCtx());

    // Why you cannot buy this, if you cannot. It used to be written into the
    // blurb line, which reads exactly like a description — the row looked normal,
    // said something odd where its description should be, and refused the click.
    // A locked row now looks locked.
    const locked = it.kind === 'item' && frontierOnly(it.k) && berthWhy()
        ? 'Sold only at a pirate outpost, and only to pilots who rent a bay there'
      : it.kind === 'ammo'
        ? whyNotBuy(it.k, { fit: myFit, drones: escortOf(myDrones, myRig), EQUIPMENT })
      : null;

    g.globalAlpha = (it.owned || afford ? 1 : 0.5) * (sells ? 1 : 0.45) * (locked ? 0.55 : 1);
    g.fillStyle = it.owned ? 'rgba(125,224,138,0.10)' : over(r) ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.03)';
    g.fillRect(r.x, r.y, r.w, r.h);
    g.strokeStyle = it.owned ? '#2c3d55' : afford ? '#3d5876' : '#2c3d55'; g.lineWidth = 1;
    g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);
    g.fillStyle = locked ? '#8a93a3' : '#cfe4ff'; g.font = '12px ui-monospace, monospace';
    g.fillText(locked ? '\u{1F512} ' + name : name, r.x + 12, r.y + 20);
    // A locked row says the reason where its description would be, in the colour
    // the game uses for "no", not the colour it uses for prose.
    g.fillStyle = locked ? '#e0a53f' : '#66748c'; g.font = '10px ui-monospace, monospace';
    g.fillText(locked ?? blurb, r.x + 12, r.y + 35);
    g.textAlign = 'right';
    if (it.owned) { g.fillStyle = '#7de08a'; g.font = '11px ui-monospace, monospace';
                    g.fillText((it.kind === 'hull' ? it.k === myHull : it.k === myForm) ? 'FLYING' : 'owned — fly it',
                               r.x + r.w - 12, r.y + 20); }
    else if (it.kind === 'own' || it.kind === 'ownhull') {
      // In the inventory the number is what breaking it up PAYS, not what it cost.
      g.fillStyle = '#7de08a'; g.font = '11px ui-monospace, monospace';
      g.fillText(`+${fmtCredits(price)} ${CURRENCY.short}`, r.x + r.w - 12, r.y + 20);
      g.fillStyle = '#66748c'; g.font = '9px ui-monospace, monospace';
      g.fillText(`click to break up · ${Math.round(SCRAP_RATE * 100)}% of ${fmtCredits(
        it.kind === 'own' ? EQUIPMENT[it.k].price : HULLS[it.k].price)}`, r.x + r.w - 12, r.y + 35);
    }
    else { g.fillStyle = afford ? '#ffd479' : '#7a6a45'; g.font = '11px ui-monospace, monospace';
           g.fillText(`${fmtCredits(price)} ${CURRENCY.short}`, r.x + r.w - 12, r.y + 20); }
    const stock = it.kind === 'item' ? (myGear[it.k] ?? 0)
                : it.kind === 'ammo' ? (myAmmo[it.k] ?? 0)
                : it.kind === 'kit' ? (myKits[it.k] ?? 0)
                : it.kind === 'device' ? (myDevices[it.k] ?? 0) : 0;
    if (stock) { g.fillStyle = '#7de08a'; g.font = '10px ui-monospace, monospace';
                 g.fillText(it.kind === 'ammo' ? `${stock} rounds held`
                          : it.kind === 'kit' || it.kind === 'device' ? `${stock} aboard` : `${stock} in your inventory`,
                            r.x + r.w - 12, r.y + 35); }
    g.textAlign = 'left'; g.globalAlpha = 1; g.font = '11px ui-monospace, monospace';
  }

  g.fillStyle = '#5b6b85';
  g.fillText('hover for exact numbers · click to buy · fit it in the HANGAR tab · H or Esc to close',
             P.x + 20, P.y + P.h - 18);
  g.font = '12px ui-monospace, monospace';
  drawTip(tip, at ?? { x: 0, y: 0 });
}

// --- inventory / company hangar -----------------------------------------------
// Left is what the ship is carrying, right is what the company holds for you.
// Transfer only works at the dock, because the hangar is theirs, not yours.
function invGeom() {
  const w = Math.min(820, VIEW_W - 60), h = Math.min(440, VIEW_H - 60);
  const x = (VIEW_W - w) / 2, y = (VIEW_H - h) / 2;
  const colW = (w - 60) / 2, top = y + 92;
  const rows = (obj, cx) => Object.keys(obj).map((mat, i) =>
    ({ mat, r: { x: cx, y: top + i * 40, w: colW, h: 34 } }));
  return { panel: { x, y, w, h }, colW, top,
           ship: rows(hold, x + 20), bank: rows(vault, x + 40 + colW),
           all: { x: x + 20, y: y + h - 56, w: 190, h: 40 } };
}

function invClick(v) {
  const G = invGeom();
  const inside = r => v.x > r.x && v.x < r.x + r.w && v.y > r.y && v.y < r.y + r.h;
  if (!inside(G.panel)) { invOpen = false; return; }
  if (!atDock) return;                              // browsing is free, moving cargo is not
  for (const { mat, r } of G.ship) if (inside(r)) return send({ t: 'stash', mat });
  for (const { mat, r } of G.bank) if (inside(r)) {
    // right half of the row sells, left half loads it back onto the ship
    if (v.x > r.x + r.w * 0.62) return send({ t: 'sell', mat, n: vault[mat] });
    return send({ t: 'load', mat });
  }
  if (inside(G.all)) for (const mat of Object.keys(hold)) send({ t: 'stash', mat });
}

function stack(r, mat, n, live) {
  const M = MATERIALS[mat];
  g.fillStyle = live ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.02)';
  g.fillRect(r.x, r.y, r.w, r.h);
  g.strokeStyle = (M?.colour ?? '#9aa3ad') + (live ? 'aa' : '44'); g.lineWidth = 1;
  g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);
  g.fillStyle = M?.colour ?? '#9aa3ad';
  g.fillRect(r.x + 10, r.y + 6, 22, 22);
  g.fillStyle = '#0a0e14'; g.font = 'bold 12px ui-monospace, monospace'; g.textAlign = 'center';
  g.fillText(M?.sym ?? '?', r.x + 21, r.y + 21);
  g.textAlign = 'left';
  g.fillStyle = '#cfe4ff'; g.font = '12px ui-monospace, monospace';
  g.fillText(M?.name ?? mat, r.x + 42, r.y + 15);
  g.fillStyle = '#66748c'; g.font = '10px ui-monospace, monospace';
  g.fillText(`T${M?.tier ?? '?'} · ${M?.value ?? 0} ${CURRENCY.short} · ${M?.vol ?? 1} vol · ${M?.density ?? '?'} g/cm³`,
             r.x + 42, r.y + 27);
  g.fillStyle = '#fff'; g.font = '14px ui-monospace, monospace'; g.textAlign = 'right';
  g.fillText('×' + n, r.x + r.w - 12, r.y + 22);
  g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
}

function drawInventory() {
  const G = invGeom(), P = G.panel, vol = holdVol(hold);
  g.fillStyle = 'rgba(3,5,9,0.92)'; g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.fillStyle = 'rgba(8,12,19,0.98)'; g.fillRect(P.x, P.y, P.w, P.h);
  g.strokeStyle = '#2c3d55'; g.lineWidth = 1; g.strokeRect(P.x + .5, P.y + .5, P.w - 1, P.h - 1);

  g.font = '15px ui-monospace, monospace'; g.fillStyle = '#8ab4e6';
  g.fillText('CARGO', P.x + 20, P.y + 32);
  g.font = '13px ui-monospace, monospace'; g.fillStyle = '#ffd479'; g.textAlign = 'right';
  g.fillText(`${fmtCredits(credits)} ${CURRENCY.short}`, P.x + P.w - 20, P.y + 32);
  g.textAlign = 'left'; g.font = '11px ui-monospace, monospace';
  g.fillStyle = atDock ? '#66748c' : '#e0a53f';
  g.fillText(atDock ? 'docked — click a stack to move it the other way'
                    : 'looking only — ore moves and sells at your base ring', P.x + 20, P.y + 52);

  g.fillStyle = '#5b6b85'; g.font = '11px ui-monospace, monospace';
  g.fillText(`SHIP HOLD   ${vol}/${cargoCap}` + (vol ? `   ${fmtCredits(holdValue(hold))} ${CURRENCY.short}` : '') +
             (atDock ? '   → click to stow' : ''), P.x + 20, G.top - 12);
  g.fillText('COMPANY HANGAR   unlimited' + (atDock ? '   → left half loads, right half sells' : ''),
             P.x + 40 + G.colW, G.top - 12);

  if (!G.ship.length) { g.fillStyle = '#3d4757'; g.fillText('the hold is empty', P.x + 20, G.top + 18); }
  for (const { mat, r } of G.ship) stack(r, mat, hold[mat], atDock);
  if (!G.bank.length) { g.fillStyle = '#3d4757'; g.fillText('nothing stored yet', P.x + 40 + G.colW, G.top + 18); }
  for (const { mat, r } of G.bank) {
    stack(r, mat, vault[mat], atDock);
    if (!atDock) continue;
    const M = MATERIALS[mat];
    g.fillStyle = 'rgba(255,212,121,0.10)';
    g.fillRect(r.x + r.w * 0.62, r.y + 1, r.w * 0.38 - 1, r.h - 2);
    g.fillStyle = '#ffd479'; g.textAlign = 'center'; g.font = '10px ui-monospace, monospace';
    g.fillText(`SELL ${fmtCredits(vault[mat] * M.value)} ${CURRENCY.short}`, r.x + r.w * 0.81, r.y + r.h / 2 + 4);
    g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
  }

  if (G.ship.length) {
    const A = G.all;
    g.globalAlpha = atDock ? 1 : 0.35;
    g.fillStyle = 'rgba(125,224,138,0.14)'; g.fillRect(A.x, A.y, A.w, A.h);
    g.strokeStyle = '#7de08a'; g.lineWidth = 1.3; g.strokeRect(A.x + .5, A.y + .5, A.w - 1, A.h - 1);
    g.fillStyle = '#7de08a'; g.textAlign = 'center';
    g.fillText('STOW EVERYTHING', A.x + A.w / 2, A.y + 18);
    g.fillStyle = '#4d7a55'; g.font = '10px ui-monospace, monospace';
    g.fillText('or press SPACE', A.x + A.w / 2, A.y + 29);
    g.font = '12px ui-monospace, monospace';
    g.textAlign = 'left'; g.globalAlpha = 1;
  }
  g.fillStyle = '#5b6b85'; g.font = '11px ui-monospace, monospace';
  g.fillText('I or Esc to close', P.x + P.w - 130, P.y + P.h - 30);
  g.font = '12px ui-monospace, monospace';
}

// --- joining -----------------------------------------------------------------
// A first visit picks a callsign and a side, and nothing else exists until they
// do — no token, no row in the accounts file, no ship in anyone's sector. The
// name is what everyone else sees on your hull, so it is worth asking for.
let signup = null, joinName = '', joinCo = null, joinSaid = '';

function joinLayout() {
  const w = Math.min(560, VIEW_W - 40), h = 380;
  const x = Math.round((VIEW_W - w) / 2), y = Math.round((VIEW_H - h) / 2);
  const cards = (signup?.companies ?? []);
  const cw = (w - 40 - (cards.length - 1) * 12) / Math.max(1, cards.length);
  return {
    panel: { x, y, w, h },
    field: { x: x + 20, y: y + 74, w: w - 40, h: 42 },
    cards: cards.map((c, i) => ({ ...c, r: { x: x + 20 + i * (cw + 12), y: y + 168, w: cw, h: 104 } })),
    go: { x: x + 20, y: y + h - 66, w: w - 40, h: 44 },
  };
}

function joinClick(v) {
  const L = joinLayout();
  const inside = r => v.x > r.x && v.x < r.x + r.w && v.y > r.y && v.y < r.y + r.h;
  for (const c of L.cards) if (inside(c.r)) { joinCo = c.key; joinSaid = ''; return; }
  if (inside(L.go)) return tryJoin();
}

function tryJoin() {
  const why = nameProblem(joinName);
  if (why) { joinSaid = why; return; }
  if (!joinCo) { joinSaid = 'pick a side'; return; }
  send({ t: 'join', name: cleanName(joinName), co: joinCo });
}

// The name field takes keys directly — there is no DOM input on this canvas.
function joinKey(e) {
  if (e.key === 'Enter') { e.preventDefault(); return tryJoin(); }
  if (e.key === 'Backspace') { e.preventDefault(); joinName = joinName.slice(0, -1); joinSaid = ''; return; }
  if (e.key === 'Tab') {
    e.preventDefault();                            // Tab walks the companies
    const keys = (signup?.companies ?? []).map(c => c.key);
    joinCo = keys[(keys.indexOf(joinCo) + 1) % Math.max(1, keys.length)] ?? null;
    return;
  }
  if (e.key.length !== 1 || e.metaKey || e.ctrlKey) return;
  if (joinName.length >= NAME_MAX) return;
  joinName += e.key;
  joinSaid = '';
}

function drawJoin(now) {
  const L = joinLayout(), P = L.panel;
  const over = r => hover && hover.x > r.x && hover.x < r.x + r.w && hover.y > r.y && hover.y < r.y + r.h;
  g.fillStyle = '#03050a'; g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.fillStyle = 'rgba(8,12,19,0.98)'; g.fillRect(P.x, P.y, P.w, P.h);
  g.strokeStyle = '#2c3d55'; g.lineWidth = 1; g.strokeRect(P.x + .5, P.y + .5, P.w - 1, P.h - 1);

  g.textAlign = 'center';
  g.font = '20px ui-monospace, monospace'; g.fillStyle = '#8ab4e6';
  g.fillText(GAME.toUpperCase(), P.x + P.w / 2, P.y + 40);
  g.font = '11px ui-monospace, monospace'; g.fillStyle = '#5b6b85';
  g.fillText('pick a callsign and a side — both are yours for good', P.x + P.w / 2, P.y + 60);

  const f = L.field;                               // the name, typed straight in
  g.textAlign = 'left';
  g.fillStyle = 'rgba(255,255,255,0.03)'; g.fillRect(f.x, f.y, f.w, f.h);
  g.strokeStyle = joinSaid ? '#e05a5a' : '#3d5876'; g.lineWidth = 1.4;
  g.strokeRect(f.x + .5, f.y + .5, f.w - 1, f.h - 1);
  g.font = '18px ui-monospace, monospace';
  g.fillStyle = joinName ? '#cfe4ff' : '#3d4757';
  g.fillText(joinName || 'callsign', f.x + 14, f.y + 28);
  if (Math.floor(now / 500) % 2 === 0 && joinName.length < NAME_MAX) {
    const w2 = g.measureText(joinName).width;
    g.fillStyle = '#7fd4ff'; g.fillRect(f.x + 16 + w2, f.y + 12, 2, 20);
  }
  g.font = '10px ui-monospace, monospace'; g.textAlign = 'right';
  g.fillStyle = '#3d4757'; g.fillText(`${joinName.length}/${NAME_MAX}`, f.x + f.w - 12, f.y + 28);
  g.textAlign = 'left';

  g.font = '10px ui-monospace, monospace'; g.fillStyle = '#3d4757';
  g.fillText('SIDE', L.cards[0]?.r.x ?? P.x + 20, L.cards[0] ? L.cards[0].r.y - 10 : P.y + 150);

  for (const c of L.cards) {
    const on = joinCo === c.key, r = c.r;
    g.fillStyle = on ? c.color + '22' : over(r) ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.02)';
    g.fillRect(r.x, r.y, r.w, r.h);
    g.strokeStyle = on ? c.color : '#2c3d55'; g.lineWidth = on ? 2 : 1;
    g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);
    g.textAlign = 'center';
    g.fillStyle = c.color; g.font = '17px ui-monospace, monospace';
    g.fillText(c.tag, r.x + r.w / 2, r.y + 32);
    g.fillStyle = on ? '#cfe4ff' : '#66748c'; g.font = '9px ui-monospace, monospace';
    for (const [i, word] of c.name.split(' ').entries())
      g.fillText(word, r.x + r.w / 2, r.y + 50 + i * 11);
    g.fillStyle = '#4a5568'; g.font = '10px ui-monospace, monospace';
    g.fillText(`${c.pilots} pilot${c.pilots === 1 ? '' : 's'}`, r.x + r.w / 2, r.y + r.h - 10);
    g.textAlign = 'left';
  }

  const b = L.go, ready = !nameProblem(joinName) && joinCo;
  g.fillStyle = ready ? 'rgba(125,224,138,0.16)' : 'rgba(255,255,255,0.03)';
  g.fillRect(b.x, b.y, b.w, b.h);
  g.strokeStyle = ready ? '#7de08a' : '#2c3d55'; g.lineWidth = ready ? 1.8 : 1;
  g.strokeRect(b.x + .5, b.y + .5, b.w - 1, b.h - 1);
  g.textAlign = 'center'; g.font = '15px ui-monospace, monospace';
  g.fillStyle = ready ? '#7de08a' : '#3d4757';
  g.fillText('LAUNCH', b.x + b.w / 2, b.y + 28);
  if (joinSaid) {
    g.font = '11px ui-monospace, monospace'; g.fillStyle = '#e05a5a';
    g.fillText(joinSaid, P.x + P.w / 2, b.y - 12);
  }
  g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
}

// --- settings -----------------------------------------------------------------
// Sound and music on separate faders, because writing music for the game means
// wanting the game running and the game silent at the same time.
let setOpen = false, dragging = null;

// Two questions, not one. Are you shooting at something — and is something
// shooting at you? Both at once is a fight; only the second is a chase, which is
// what crossing a map with a drifter on your tail actually is. How long either
// verdict is held is moodFor's problem, in shared/music.js, with the tests on it.
let moodHeld = { mood: CALM, until: 0, calmAt: 0 };

function fightState() {
  const me = ships.get(myId);
  if (!me || dead) return {};
  let hunted = (me.flash ?? 0) > 0;             // something just landed on your shields
  if (!hunted) for (const s of ships.values())
    if (s.co === 'x' && s.tgt === myId) { hunted = true; break; }
  return { fighting: !!me.tgt, hunted };
}

// Every frame. Cheap, and setMood ignores anything that is not a change.
function stirMusic(now) {
  moodHeld = moodFor(fightState(), now, moodHeld);
  setMood(resolveMood(moodHeld.mood, hasMood));   // a mood with no folder borrows one
}

const busOn = key => key === 'master' ? audioOn() : key === 'sfx' ? sfxOnly() : musicOnly();
const busVol = key => key === 'sfx' ? sfxVolume() : musicVolume();
const setVol = (key, v) => key === 'sfx' ? setSfxVolume(v) : setMusicVolume(v);
const flipBus = key => key === 'master' ? toggleAudio() : key === 'sfx' ? toggleSfx() : toggleMusic();

function settingsClick(v) {
  const L = settingsLayout(VIEW_W, VIEW_H);
  const inside = r => v.x > r.x && v.x < r.x + r.w && v.y > r.y && v.y < r.y + r.h;
  if (!inside(L.panel)) { setOpen = false; return; }
  if (inside(L.skip)) return nextTrack();
  for (const row of L.rows) {
    if (inside(row.toggle)) {
      const now = flipBus(row.key);
      return say(`${row.label} ${now ? 'on' : 'muted'}`, now ? '#7de08a' : '#e0a53f');
    }
    if (row.hit && inside(row.hit)) {
      setVol(row.key, valueAt(row.track, v.x));
      dragging = row.key;                          // keep following the pointer
      return;
    }
  }
  for (const a of L.actions) if (inside(a.r)) {
    if (a.key === 'signout') { setOpen = false; askToSignOut(); }
    return;
  }
}

// Signing out is a ten second stand-down, not a switch. Something shooting at
// you cancels it, and so does changing your mind — otherwise a misclick puts
// your ship on the floor of a sector with a drifter on it.
const SIGNOUT_WAIT = 10_000;
let leavingAt = 0;

const leaving = () => leavingAt > 0;
const cancelLeaving = why => {
  if (!leaving()) return;
  leavingAt = 0;
  if (why) say(why, '#e0a53f');
};

function askToSignOut() {
  if (signedOff || leaving()) return;
  const st = fightState();
  if (st.fighting || st.hunted) return say('Not while something is shooting at you', '#e0a53f');
  leavingAt = performance.now() + SIGNOUT_WAIT;
}

// Releases the sector and the socket. The token stays in local storage, so this
// is putting the ship down rather than giving it away — a click brings you back
// to the same pilot, which is what the idle timeout already did quietly.
function signOut() {
  if (signedOff) return;
  signedOff = true;
  leavingAt = 0;
  stopMusic();                                  // silence, not a score over a dead screen
  try { ws.close(4002, 'signed out'); } catch {}
  status = 'signed out';
}

// Counts down, and gives up the moment a fight starts. Deliberately on
// performance.now rather than the frame timestamp: leavingAt is set from that
// clock, and the two are only the same clock by convention.
function stepSignOut() {
  if (!leaving()) return;
  const st = fightState();
  if (st.fighting || st.hunted) return cancelLeaving('Sign-out cancelled — you are under fire');
  if (performance.now() >= leavingAt) signOut();
}

function drawLeaving() {
  if (!leaving()) return;
  const now = performance.now();
  const left = Math.max(0, Math.ceil((leavingAt - now) / 1000));
  const w = 300, h = 96, x = (VIEW_W - w) / 2, y = VIEW_H / 2 - 140;
  g.fillStyle = 'rgba(6,10,16,0.94)'; g.fillRect(x, y, w, h);
  g.strokeStyle = '#e0a53f'; g.lineWidth = 1.4; g.strokeRect(x + .5, y + .5, w - 1, h - 1);
  g.textAlign = 'center';
  g.font = '12px ui-monospace, monospace'; g.fillStyle = '#8ea3bd';
  g.fillText('SIGNING OUT', x + w / 2, y + 26);
  g.font = '34px ui-monospace, monospace'; g.fillStyle = '#e0a53f';
  g.fillText(String(left), x + w / 2, y + 62);
  g.font = '11px ui-monospace, monospace'; g.fillStyle = '#5b6b85';
  g.fillText('Esc or click to stay', x + w / 2, y + 82);
  const p = 1 - Math.max(0, (leavingAt - now) / SIGNOUT_WAIT);
  g.fillStyle = 'rgba(224,165,63,0.5)'; g.fillRect(x, y + h - 3, w * p, 3);
  g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
}

// A fader you can only click once is a fader you fight. Held, it tracks.
function settingsDrag(v) {
  if (!dragging) return;
  const row = settingsLayout(VIEW_W, VIEW_H).rows.find(r => r.key === dragging);
  if (row?.track) setVol(dragging, valueAt(row.track, v.x));
}

function drawSettings() {
  const L = settingsLayout(VIEW_W, VIEW_H), P = L.panel;
  const over = r => hover && hover.x > r.x && hover.x < r.x + r.w && hover.y > r.y && hover.y < r.y + r.h;

  g.fillStyle = 'rgba(3,5,9,0.86)'; g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.fillStyle = 'rgba(8,12,19,0.98)'; g.fillRect(P.x, P.y, P.w, P.h);
  g.strokeStyle = '#2c3d55'; g.lineWidth = 1; g.strokeRect(P.x + .5, P.y + .5, P.w - 1, P.h - 1);

  g.textAlign = 'left'; g.font = '15px ui-monospace, monospace'; g.fillStyle = '#8ab4e6';
  g.fillText('MENU', P.x + 20, P.y + 32);
  g.font = '11px ui-monospace, monospace'; g.fillStyle = '#5b6b85';
  g.fillText('Esc or O to close', P.x + P.w - 132, P.y + 32);
  // Time flown, which is not time the tab was open: the half hour before an idle
  // sign-out is not in here, because nobody was flying for it.
  g.font = '10px ui-monospace, monospace'; g.fillStyle = '#3d4757';
  g.fillText(`${fmtPlayed(myPlayed)} flown`, P.x + 74, P.y + 32);
  for (const sec of L.sections) {
    g.font = '10px ui-monospace, monospace'; g.fillStyle = '#3d4757';
    g.fillText(sec.label, P.x + 20, sec.y);
    const tw = g.measureText(sec.label).width;
    g.strokeStyle = 'rgba(61,71,87,0.45)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(P.x + 28 + tw, sec.y - 4); g.lineTo(P.x + P.w - 20, sec.y - 4); g.stroke();
  }

  // Frame time and ping. Two lines because they are two questions: one is whether
  // this machine is keeping up, the other whether the distance is, and the fix for
  // one is not the fix for the other. Coloured against the server tick, so "good"
  // means good relative to the only clock the game actually runs on.
  for (const row of (L.perf ?? [])) {
    const line = row.key === 'frame' ? frameLine(frameSamples) : pingLine(pingSamples);
    g.font = '12px ui-monospace, monospace'; g.fillStyle = '#8ea3bd';
    g.fillText(row.label, row.r.x + 20, row.r.y + 21);
    g.textAlign = 'right';
    g.fillStyle = GRADE[line.grade] ?? '#66748c';
    g.fillText(line.text, row.r.x + row.r.w - 22, row.r.y + 21);
    g.textAlign = 'left';
  }

  for (const row of L.rows) {
    const live = busOn(row.key), master = audioOn();
    const dim = row.key !== 'master' && !master;
    g.globalAlpha = dim ? 0.4 : 1;
    g.font = '12px ui-monospace, monospace';
    g.fillStyle = live ? '#cfe4ff' : '#66748c';
    g.fillText(row.label, row.r.x + 20, row.r.y + 27);

    if (row.kind === 'slider') {
      const v = busVol(row.key), t = row.track;
      g.fillStyle = '#1d2b3d'; g.fillRect(t.x, t.y, t.w, t.h);
      g.fillStyle = live ? '#5fd0ff' : '#3a4a5e'; g.fillRect(t.x, t.y, t.w * v, t.h);
      const kx = t.x + t.w * v;
      g.fillStyle = live ? '#cfe4ff' : '#66748c';
      g.fillRect(kx - 3, t.y - 6, 6, t.h + 12);
      g.font = '10px ui-monospace, monospace'; g.fillStyle = '#66748c';
      g.textAlign = 'right';
      g.fillText(`${Math.round(v * 100)}%`, t.x + t.w + 18, row.r.y + 27);
      g.textAlign = 'left';
    }
    g.font = '9px ui-monospace, monospace'; g.fillStyle = '#3d4757';
    g.fillText(row.hint, row.r.x + 20, row.r.y + 39);

    const b = row.toggle;                          // the switch, same place every row
    g.fillStyle = live ? 'rgba(125,224,138,0.16)' : 'rgba(224,90,90,0.14)';
    g.fillRect(b.x, b.y, b.w, b.h);
    g.strokeStyle = live ? '#7de08a' : '#e05a5a'; g.lineWidth = over(b) ? 1.8 : 1;
    g.strokeRect(b.x + .5, b.y + .5, b.w - 1, b.h - 1);
    g.textAlign = 'center'; g.font = '10px ui-monospace, monospace';
    g.fillStyle = live ? '#7de08a' : '#e05a5a';
    g.fillText(live ? 'ON' : 'MUTED', b.x + b.w / 2, b.y + 15);
    g.textAlign = 'left'; g.globalAlpha = 1;
  }

  const track = musicTrack();
  g.font = '11px ui-monospace, monospace'; g.fillStyle = track ? '#8ea3bd' : '#3d4757';
  const title = track ? nowPlaying() : 'no tracks — drop files into public/music';
  g.fillText(title.length > 36 ? title.slice(0, 35) + '\u2026' : title, L.now.x, L.now.y + 16);
  if (track) {
    const b = L.skip;
    g.fillStyle = over(b) ? 'rgba(122,180,240,0.16)' : 'rgba(255,255,255,0.03)';
    g.fillRect(b.x, b.y, b.w, b.h);
    g.strokeStyle = '#3d5876'; g.lineWidth = 1; g.strokeRect(b.x + .5, b.y + .5, b.w - 1, b.h - 1);
    g.fillStyle = '#8ab4e6'; g.textAlign = 'center';
    g.fillText('SKIP  N', b.x + b.w / 2, b.y + 17);
    g.textAlign = 'left';
  }

  for (const a of L.actions) {
    const r = a.r, hot = over(r);
    g.fillStyle = hot ? 'rgba(224,90,90,0.16)' : 'rgba(255,255,255,0.03)';
    g.fillRect(r.x, r.y, r.w, r.h);
    g.strokeStyle = hot ? '#e05a5a' : '#3d4757'; g.lineWidth = 1;
    g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);
    g.font = '11px ui-monospace, monospace'; g.fillStyle = hot ? '#e0a53f' : '#8ea3bd';
    g.fillText(a.label, r.x + 12, r.y + r.h / 2 + 4);
    g.font = '9px ui-monospace, monospace'; g.fillStyle = '#4a5568';
    g.textAlign = 'right';
    g.fillText(a.hint, r.x + r.w - 12, r.y + r.h / 2 + 4);
    g.textAlign = 'left';
  }
  g.font = '12px ui-monospace, monospace';
}

// One phrasing of the current track, used by the menu and by the readout beside
// the star system button — the folder is dropped and so is the extension, so a
// filename reads as a title.
function nowPlaying() {
  const t = musicTrack();
  if (!t) return '';
  return '\u266a  ' + t.split('/').pop().replace(/\.[a-z0-9]+$/i, '');
}

// --- ammunition bar -----------------------------------------------------------
// Two boxes, bottom centre: what the guns are loaded with and what the racks
// are. Clicking one opens a short menu above it of the grades you actually hold;
// pick one and the menu goes away and the box changes. Six boxes said all of it
// at once and cost a strip of screen to do it.
//
// A weapon with nothing behind it does not fire, so the count is not decoration
// and the box says so before you find out the hard way.
// Where the hauling rig is right now, when one is out fetching. Set while the
// escort is drawn and read by the tractor beam a few lines later, so the beam
// leaves the drone that is actually doing the work rather than the hull.

const PICK_STRIP = 20;                          // the top of a box opens its rack
let feedOpen = null;                            // which box has its menu up
let lastBox = { feed: null, t: -Infinity };     // for spotting a double click on one

const heldGrades = feed => feed === 'repair'
  ? KIT_KEYS.filter(k => (myKits[k] ?? 0) > 0)
  : feed === 'device'
  ? DEVICE_KEYS.filter(k => (myDevices[k] ?? 0) > 0)
  : forWeapon(feed).filter(k => (myAmmo[k] ?? 0) > 0);

// WHAT THE ROWS OF A BOX'S MENU ACTUALLY ARE, asked once.
//
// Every other box picks between grades you hold; the beacon picks between hangars
// you own, because there is only one kind of beacon and choosing between one thing
// is not a choice. The draw was changed to list hangars and the CLICK was not, so
// the two built different menus out of the same box: the rows you saw were sectors
// and the row you clicked was the string 'recall', which the server correctly
// refused with "no hangar of yours there". A pilot with two hangars could not click
// the second one at all, because on the click side the menu only had one row.
//
// One function, both callers. This is rule one in its narrowest form — the same
// question answered in two places will answer it differently.
const menuRows = feed => feed === 'device' ? foldPorts().map(h => h.map) : heldGrades(feed);

// Same shape as repairBlocked: the button, its tooltip and the server all ask
// one function, so the box never offers what the server will refuse.
function recallBlocked() {
  const me = ships.get(myId);
  // Standing in the hangar it would take you to — the same question the server
  // asks, and not "am I at a dock". A pilot at their own ring could not fold to the
  // bay they rent because being at a ring was the refusal.
  const dest = foldDest();
  const atDest = !!me && mapId === dest.map
    && Math.hypot(me.x - dest.x, me.y - dest.y) < (dest.r ?? 0);
  return whyNotDevice({ devices: myDevices, using: myDevice,
                        atDest, busy: (me?.wrp ?? 0) > 0 });
}

// Why the repair button is not available, or null. The button, its tooltip and
// the server all ask the same function, so it never offers what it will refuse.
function repairBlocked() {
  const me = ships.get(myId);
  return whyNotRepair({
    kits: myKits, using: myKit, docked: atDock,
    sinceHit: sinceHitSecs(), hurt: !!me && (me.hp ?? 100) < 100, busy: !!me?.fix,
  });
}
// The wire carries a shield-impact flash, not a timestamp, so track the last
// frame we saw one and count from there.
let lastHitAt = -1e9, prevHp = null;
const sinceHitSecs = () => (performance.now() - lastHitAt) / 1000;

function barClick(v) {
  const L = barLayout(VIEW_W, VIEW_H);
  const inside = r => v.x > r.x && v.x < r.x + r.w && v.y > r.y && v.y < r.y + r.h;

  if (feedOpen) {                               // the menu covers the world, so it goes first
    const box = L.boxes.find(b => b.feed === feedOpen);
    const M = feedMenu(box, menuRows(feedOpen));
    for (const row of M.rows) if (inside(row.r)) {
      if (feedOpen === 'repair') { if (row.k !== myKit) send({ t: 'kit', key: row.k }); }
      else if (feedOpen === 'device') {
        // row.k is a sector, not a grade. There is one kind of beacon and the strip
        // above the box used to pick between them, which meant it never opened at
        // all; what a pilot actually needs to choose is where the thing puts them.
        if (row.k !== foldDest().map) send({ t: 'foldto', map: row.k });
      }
      else if (row.k !== myUsing[feedOpen]) {
        const why = whyNotLoad(row.k, feeding());
        if (why) { say(why[0].toUpperCase() + why.slice(1), '#e0a53f'); feedOpen = null; return true; }
        send({ t: 'ammo', key: row.k });
      }
      feedOpen = null;
      return true;
    }
    feedOpen = null;
    if (inside(M.box)) return true;
  }
  for (const b of L.boxes) {
    if (!inside(b.r)) continue;
    // Twice on the same box safes the weapon, or brings it back. Once opens the
    // menu — so the first click of a double opens it and the second puts it away
    // again on its way to the switch, which reads fine.
    const now4 = performance.now();
    const twice = lastBox.feed === b.feed && now4 - lastBox.t < DOUBLE_TAP;
    lastBox = { feed: b.feed, t: twice ? -Infinity : now4 };
    if (twice) {
      const on = !myArmed[b.feed];
      feedOpen = null;
      send({ t: 'arm', feed: b.feed, on });
      say(`${b.feed === 'laser' ? 'Guns' : 'Rockets'} ${on ? 'firing again' : 'holding fire'}`,
          on ? '#7de08a' : '#e0a53f');
      return true;
    }
    const held = heldGrades(b.feed);
    if (b.feed === 'device') {
      if (v.y < b.r.y + PICK_STRIP && menuRows('device').length > 1) {
        feedOpen = feedOpen === b.feed ? null : b.feed;
        return true;
      }
      if (!held.length) { say('No beacon aboard — buy one on the Beacons page at a dock', '#e0a53f'); return true; }
      const why = recallBlocked();
      if (why) { say(why[0].toUpperCase() + why.slice(1), '#e0a53f'); return true; }
      send({ t: 'recall' });
      say(`Folding to ${foldDest().name} — hold still`, '#8ab4e6');
      return true;
    }
    if (b.feed === 'repair') {
      // The strip along the top opens the rack; the rest of the box spends one.
      // Repairing is what you want most of the time so it keeps the big target,
      // but choosing which drone has to be reachable — it was not reachable at all.
      if (v.y < b.r.y + PICK_STRIP && held.length > 1) {
        feedOpen = feedOpen === b.feed ? null : b.feed;
        return true;
      }
      if (!held.length) { say('No repair drone aboard — buy one on the Repair page at a dock', '#e0a53f'); return true; }
      const why = repairBlocked();
      if (why) { say(why[0].toUpperCase() + why.slice(1), '#e0a53f'); return true; }
      send({ t: 'repair' });
      return true;
    }
    if (!held.length) { say(`Out of ${b.feed === 'laser' ? 'cells' : 'warheads'} — a crate is sold anywhere, docked or not`, '#e0a53f'); return true; }
    if (held.length === 1) {                    // nothing to choose between
      if (held[0] !== myUsing[b.feed]) send({ t: 'ammo', key: held[0] });
      return true;
    }
    feedOpen = feedOpen === b.feed ? null : b.feed;
    return true;
  }
  return false;
}

// Step to the next grade of one feed that you actually hold.
function cycleAmmo(feed) {
  const held = heldGrades(feed);
  if (held.length < 2) return say(`You hold only one grade of ${feed === 'laser' ? 'cells' : 'warheads'}`, '#66748c');
  const i = held.indexOf(myUsing[feed]);
  send({ t: 'ammo', key: held[(i + 1) % held.length] });
  feedOpen = null;
}

// A round drawn as what it is: a bolt for cells, a dart for warheads.
function roundIcon(feed, cx, cy, col, k = 1) {
  g.fillStyle = col;
  if (feed === 'laser') g.fillRect(cx - 2 * k, cy - 9 * k, 4 * k, 18 * k);
  else { g.beginPath(); g.moveTo(cx, cy - 10 * k); g.lineTo(cx + 5 * k, cy + 8 * k);
         g.lineTo(cx, cy + 4 * k); g.lineTo(cx - 5 * k, cy + 8 * k); g.closePath(); g.fill(); }
}

// The one thing SPACE would do, said plainly, right above the bar. It reads the
// same function the key does, so it can never offer something the key refuses.
function drawSpacePrompt() {
  // Not while a chooser is open. The ammunition grades, the repair rack and the
  // beacon's list of hangars all open upward out of their box and all of them cross
  // this strip — a four-hangar beacon menu is 128px tall and starts above it.
  //
  // Hidden rather than moved. Moving it above whatever is open means it jumps by a
  // different amount for every menu height, and a prompt that moves is harder to
  // read than one that is briefly absent. And the absence is honest: while a menu is
  // up, clicking a row is what you are doing, not pressing SPACE — the menu closes
  // on the next click either way and the prompt comes back where it always is.
  if (feedOpen) return;
  const act = spaceAction();
  if (act.kind === 'none') return;
  const L = barLayout(VIEW_W, VIEW_H);
  g.font = '12px ui-monospace, monospace';
  const w = 30 + g.measureText(act.label).width + 22;
  const { x, y, h } = promptRect(VIEW_W, VIEW_H, w);
  g.fillStyle = 'rgba(6,10,16,0.86)'; g.fillRect(x, y, w, h);
  g.strokeStyle = act.kind === 'stow' ? '#7de08a' : '#3d5876'; g.lineWidth = 1;
  g.strokeRect(x + .5, y + .5, w - 1, h - 1);
  g.fillStyle = act.kind === 'stow' ? 'rgba(125,224,138,0.16)' : 'rgba(122,180,240,0.12)';
  g.fillRect(x + 6, y + 5, 30, 14);
  g.textAlign = 'center'; g.font = '10px ui-monospace, monospace';
  g.fillStyle = act.kind === 'stow' ? '#7de08a' : '#8ab4e6';
  g.fillText('SPACE', x + 21, y + 15);
  g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
  g.fillStyle = '#cfe4ff';
  g.fillText(act.label, x + 44, y + 16);
}

// The repair rack. Amber when it will work, dim when it will not, and the reason
// is one hover away rather than something you learn by clicking.
// One hangar in the beacon's menu: where it is and what it is. A rented bay and a
// company dock are not the same offer — the bay does not repair you — so they do
// not read the same either.
function drawPortRow(row) {
  const h = foldPorts().find(p => p.map === row.k) ?? { name: row.k, kind: 'dock' };
  const on = foldDest().map === row.k;
  const hot = hover && hover.x > row.r.x && hover.x < row.r.x + row.r.w
                    && hover.y > row.r.y && hover.y < row.r.y + row.r.h;
  g.fillStyle = on ? 'rgba(125,224,138,0.14)' : hot ? 'rgba(122,180,240,0.16)' : 'rgba(255,255,255,0.02)';
  g.fillRect(row.r.x, row.r.y, row.r.w, row.r.h);
  g.textAlign = 'left';
  g.font = '11px ui-monospace, monospace'; g.fillStyle = on ? '#cfe4ff' : '#a8bcd4';
  g.fillText(h.name, row.r.x + 12, row.r.y + row.r.h / 2 - 1);
  g.font = '9px ui-monospace, monospace';
  g.fillStyle = h.kind === 'bay' ? '#e0a53f' : '#66748c';
  g.fillText(h.kind === 'bay' ? 'rented bay · no repairs' : 'company dock · repairs you',
             row.r.x + 12, row.r.y + row.r.h / 2 + 10);
  g.textAlign = 'right';
  if (on) { g.fillStyle = '#7de08a'; g.font = '11px ui-monospace, monospace';
            g.fillText('\u2713', row.r.x + row.r.w - 10, row.r.y + row.r.h / 2 + 3); }
  g.textAlign = 'left';
}

// The way home. Drawn as a ring closing rather than a bar, because what it is
// counting down is a window in which nothing may touch you.
function drawDeviceBox(b) {
  const r = b.r, d = DEVICES[myDevice], n = myDevices[myDevice] ?? 0;
  const me = ships.get(myId), folding = (me?.wrp ?? 0) > 0;
  const why = recallBlocked(), ready = !why;
  const over = hover && hover.x > r.x && hover.x < r.x + r.w && hover.y > r.y && hover.y < r.y + r.h;

  g.fillStyle = 'rgba(6,10,16,0.82)'; g.fillRect(r.x, r.y, r.w, r.h);
  g.strokeStyle = folding ? '#7fd4ff' : ready ? '#8ab4e6' : over ? '#4a6785' : '#243448';
  g.lineWidth = folding || ready ? 2 : 1;
  g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);

  const cx = r.x + r.w / 2, cy = r.y + 24;
  g.globalAlpha = n ? (ready || folding ? 1 : 0.4) : 0.25;
  g.strokeStyle = folding ? '#7fd4ff' : '#cfe9ff'; g.lineWidth = 2;
  g.beginPath(); g.arc(cx, cy, 8.5, 0, 7); g.stroke();       // a gate, opening
  g.beginPath(); g.arc(cx, cy, 4, 0, 7); g.stroke();
  g.globalAlpha = 1;
  if (folding) {                                  // the window you have to survive
    g.strokeStyle = '#7fd4ff'; g.lineWidth = 2.5;
    g.beginPath();
    g.arc(cx, cy, 13, -Math.PI / 2, -Math.PI / 2 + (me.wrp / 100) * Math.PI * 2);
    g.stroke();
  }
  g.textAlign = 'center'; g.font = '12px ui-monospace, monospace';
  g.fillStyle = folding ? '#7fd4ff' : n ? (ready ? '#cfe4ff' : '#e0a53f') : '#66748c';
  g.fillText(folding ? `${Math.max(0, Math.ceil(d.secs * (1 - me.wrp / 100)))}s` : String(n),
             cx, r.y + r.h - 10);
  // The arrow means there is somewhere else to go, so it appears when a pilot
  // rents a bay and not before. A pilot with one hangar has nothing to choose.
  const ports = foldPorts(), dest = foldDest();
  if (ports.length > 1) {
    g.fillStyle = over ? '#8ab4e6' : '#3d4757'; g.font = '9px ui-monospace, monospace';
    g.fillText('\u25b2', r.x + r.w - 9, r.y + 12);
    // And the destination is written on the box rather than hidden in the menu.
    // Spending 3400 to find out where you were pointed is the whole complaint.
    g.font = '8px ui-monospace, monospace'; g.fillStyle = folding ? '#7fd4ff' : '#7f8fa6';
    g.fillText(dest.name.split(' · ').pop().slice(0, 9), cx, r.y + 12);
  }
  if (over && !feedOpen) {
    const t = folding ? `folding to ${dest.name} — one hit ends it`
      : (why ?? `${d.name} · ${d.secs}s to ${dest.name}` +
                (ports.length > 1 ? ', and one hit ends it — click the top to change where' : ', and one hit ends it'));
    g.font = '11px ui-monospace, monospace';
    const w = g.measureText(t).width + 18;
    const x = Math.max(6, Math.min(VIEW_W - w - 6, cx - w / 2));
    g.fillStyle = 'rgba(6,10,16,0.95)'; g.fillRect(x, r.y - TIP_UP, w, TIP_H);
    g.strokeStyle = '#2c3d55'; g.lineWidth = 1; g.strokeRect(x + .5, r.y - TIP_UP + .5, w - 1, TIP_H - 1);
    g.fillStyle = '#cfe4ff'; g.fillText(t, x + w / 2, r.y - 10);
  }
  g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
}

function drawRepairBox(b) {
  const r = b.r, k = KITS[myKit], n = myKits[myKit] ?? 0;
  const me = ships.get(myId), busy = (me?.fix ?? 0) > 0;
  const why = repairBlocked(), ready = !why;
  const over = hover && hover.x > r.x && hover.x < r.x + r.w && hover.y > r.y && hover.y < r.y + r.h;

  g.fillStyle = 'rgba(6,10,16,0.82)'; g.fillRect(r.x, r.y, r.w, r.h);
  g.strokeStyle = busy ? '#7de08a' : ready ? '#e0a53f' : over ? '#4a6785' : '#243448';
  g.lineWidth = busy || ready ? 2 : 1;
  g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);

  g.save();                                      // a spanner, near enough
  g.translate(r.x + r.w / 2, r.y + 32);
  g.globalAlpha = n ? (ready || busy ? 1 : 0.4) : 0.25;
  g.strokeStyle = busy ? '#7de08a' : '#cfe9ff'; g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-5, 6); g.lineTo(4, -4); g.stroke();
  g.beginPath(); g.arc(6, -6, 4.4, 0.7, 5.4); g.stroke();
  g.lineCap = 'butt'; g.restore();

  if (k?.tier > 1) {
    g.fillStyle = n ? '#ffd479' : '#4a4230';
    for (let i = 0; i < k.tier - 1; i++) g.fillRect(r.x + 6 + i * 6, r.y + 6, 4, 4);
  }
  g.textAlign = 'center'; g.font = '12px ui-monospace, monospace';
  g.fillStyle = busy ? '#7de08a' : n ? (ready ? '#e0a53f' : '#5b6b85') : '#e05a5a';
  g.fillText(busy ? `${me.fix}%` : n ? String(n) : 'NONE', r.x + r.w / 2, r.y + r.h - 10);
  if (KIT_KEYS.filter(kk => myKits[kk] > 0).length > 1) {
    const hot = hover && hover.x > r.x && hover.x < r.x + r.w
             && hover.y > r.y && hover.y < r.y + PICK_STRIP;
    g.fillStyle = hot ? 'rgba(122,180,240,0.18)' : 'rgba(255,255,255,0.04)';
    g.fillRect(r.x + 1, r.y + 1, r.w - 2, PICK_STRIP - 1);
    g.fillStyle = hot ? '#8ab4e6' : '#4a5568'; g.font = '9px ui-monospace, monospace';
    g.textAlign = 'center';
    g.fillText('\u25b2 PICK', r.x + r.w / 2, r.y + 14);
    g.textAlign = 'left';
  }
  if (over && !feedOpen) {
    const t = busy ? 'repairing…' : why ? why : `${k.name} — +${Math.round(k.heal * 100)}% hull`;
    g.font = '11px ui-monospace, monospace';
    const w = g.measureText(t).width + 18;
    const x = Math.max(6, Math.min(VIEW_W - w - 6, r.x + r.w / 2 - w / 2));
    g.fillStyle = 'rgba(6,10,16,0.95)'; g.fillRect(x, r.y - TIP_UP, w, TIP_H);
    g.strokeStyle = '#2c3d55'; g.lineWidth = 1; g.strokeRect(x + .5, r.y - TIP_UP + .5, w - 1, TIP_H - 1);
    g.fillStyle = why && !busy ? '#e0a53f' : '#cfe4ff'; g.fillText(t, x + w / 2, r.y - 10);
  }
  g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
}

function drawBar() {
  const L = barLayout(VIEW_W, VIEW_H);
  const over = r => hover && hover.x > r.x && hover.x < r.x + r.w && hover.y > r.y && hover.y < r.y + r.h;

  for (const b of L.boxes) {
    if (b.feed === 'repair') { drawRepairBox(b); continue; }
    if (b.feed === 'device') { drawDeviceBox(b); continue; }
    const key = myUsing[b.feed], a = AMMO[key], n = myAmmo[key] ?? 0;
    const r = b.r, safed = !myArmed[b.feed], dry = !safed && n === 0;
    const low = !dry && !safed && n < (b.feed === 'rocket' ? 60 : 300);
    g.fillStyle = 'rgba(6,10,16,0.82)'; g.fillRect(r.x, r.y, r.w, r.h);
    g.strokeStyle = safed ? '#6a5340' : dry ? '#ff5c6b' : feedOpen === b.feed ? '#7fd4ff'
                  : over(r) ? '#4a6785' : '#243448';
    g.lineWidth = dry || feedOpen === b.feed ? 2 : 1;
    g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);

    g.globalAlpha = safed ? 0.35 : 1;
    // The grade has its own colour, and the round itself wears it. Pips alone
    // meant the only way to tell what was loaded was to count them.
    const grade = a.colour ?? '#c2a24f';
    roundIcon(b.feed, r.x + r.w / 2, r.y + 24, dry ? '#5a2733' : grade);
    if (a.tier > 1) {                            // pips for the grade, top-left
      g.fillStyle = dry ? '#4a4230' : grade;
      for (let i = 0; i < a.tier - 1; i++) g.fillRect(r.x + 6 + i * 6, r.y + 6, 4, 4);
    }
    g.textAlign = 'center'; g.font = '12px ui-monospace, monospace';
    g.fillStyle = safed ? '#e0a53f' : dry ? '#ff5c6b' : low ? '#e0a53f' : '#cfe4ff';
    g.fillText(safed ? 'HELD' : dry ? 'DRY' : n > 9999 ? `${Math.round(n / 1000)}k` : String(n),
               r.x + r.w / 2, r.y + r.h - 10);
    g.globalAlpha = 1;
    if (safed) {                                 // struck through: this one is holding fire
      g.fillStyle = 'rgba(224,165,63,0.10)'; g.fillRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);
      g.strokeStyle = '#e0a53f'; g.lineWidth = 3; g.lineCap = 'round';
      g.beginPath();
      g.moveTo(r.x + 13, r.y + 11); g.lineTo(r.x + r.w - 13, r.y + r.h - 21);
      g.moveTo(r.x + r.w - 13, r.y + 11); g.lineTo(r.x + 13, r.y + r.h - 21);
      g.stroke();
      g.lineCap = 'butt';
    }
    if (heldGrades(b.feed).length > 1) {         // a hint that there is a choice here
      g.fillStyle = '#3d4757'; g.font = '9px ui-monospace, monospace';
      g.fillText('▲', r.x + r.w - 9, r.y + 12);
    }
    if (over(r) && !feedOpen) {                  // name of what is loaded
      // If something better is in the hold and cannot go in the guns, the box says
      // so here rather than making a pilot open the menu to find out.
      const stuck = forWeapon(b.feed).filter(k => (myAmmo[k] ?? 0) > 0 && whyNotLoad(k, feeding()));
      const t = `${a.name}  x${a.mult.toFixed(2)}`
        + (stuck.length ? `   ·   ${AMMO[stuck.at(-1)].name} held: ${whyNotLoad(stuck.at(-1), feeding())}` : '');
      g.fillStyle = grade;
      g.font = '11px ui-monospace, monospace';
      const w = g.measureText(t).width + 18;
      const x = Math.max(6, Math.min(VIEW_W - w - 6, r.x + r.w / 2 - w / 2));
      g.fillStyle = 'rgba(6,10,16,0.95)'; g.fillRect(x, r.y - TIP_UP, w, TIP_H);
      g.strokeStyle = '#2c3d55'; g.lineWidth = 1; g.strokeRect(x + .5, r.y - TIP_UP + .5, w - 1, TIP_H - 1);
      g.fillStyle = grade; g.fillText(t, x + w / 2, r.y - 10);
    }
    g.textAlign = 'left';
  }
  g.font = '10px ui-monospace, monospace'; g.textAlign = 'center'; g.fillStyle = '#2f3f55';
  g.fillText('Q', L.boxes[0].r.x - 9, L.r.y + L.r.h - 10);
  g.fillText('E', L.boxes[1].r.x - 9, L.r.y + L.r.h - 10);
  g.textAlign = 'left';

  if (feedOpen) {
    const box = L.boxes.find(b => b.feed === feedOpen);
    const held = menuRows(feedOpen);
    const M = feedMenu(box, held);
    g.fillStyle = 'rgba(4,7,12,0.97)'; g.fillRect(M.box.x, M.box.y, M.box.w, M.box.h);
    g.strokeStyle = '#5a86b8'; g.lineWidth = 1.4;
    g.strokeRect(M.box.x + .5, M.box.y + .5, M.box.w - 1, M.box.h - 1);
    for (const row of M.rows) {
      if (feedOpen === 'device') { drawPortRow(row); continue; }
      const kit = feedOpen === 'repair';
      const a = kit ? KITS[row.k] : AMMO[row.k];
      const on = kit ? myKit === row.k : myUsing[feedOpen] === row.k;
      const hot = over(row.r);
      g.fillStyle = on ? 'rgba(125,224,138,0.14)' : hot ? 'rgba(122,180,240,0.16)' : 'rgba(255,255,255,0.02)';
      g.fillRect(row.r.x, row.r.y, row.r.w, row.r.h);
      // A grade you own but may not load is drawn, not hidden. Hiding it means a
      // pilot who bought Fusion Cells sees them vanish from the menu and concludes
      // the purchase was lost; the point of the row is to say what is missing.
      const lock = kit ? null : whyNotLoad(row.k, feeding());
      g.globalAlpha = lock ? 0.55 : 1;
      if (!kit) roundIcon(feedOpen, row.r.x + 14, row.r.y + row.r.h / 2, a.colour ?? '#8fa8c4', 0.6);
      g.font = '11px ui-monospace, monospace';
      g.fillStyle = lock ? '#7f8fa6' : on ? '#cfe4ff' : '#a8bcd4';
      g.fillText(a.name, row.r.x + (kit ? 12 : 28), row.r.y + row.r.h / 2 - 1);
      g.font = '9px ui-monospace, monospace'; g.fillStyle = '#66748c';
      g.fillStyle = lock ? '#e0a53f' : kit ? '#66748c' : (a.colour ?? '#66748c');
      g.fillText(lock ? lock.split(' — ')[0]
                      : kit ? `+${Math.round(a.heal * 100)}% over ${a.secs}s` : `x${a.mult.toFixed(2)}`,
                 row.r.x + (kit ? 12 : 28), row.r.y + row.r.h / 2 + 10);
      g.globalAlpha = 1;
      g.textAlign = 'right';
      g.fillStyle = on ? '#7de08a' : '#8ea3bd'; g.font = '11px ui-monospace, monospace';
      g.fillText(String((kit ? myKits : myAmmo)[row.k] ?? 0), row.r.x + row.r.w - 10, row.r.y + row.r.h / 2 + 3);
      g.textAlign = 'left';
    }
    g.font = '12px ui-monospace, monospace';
  }
}

// --- render -------------------------------------------------------------------
let renderFailed = false;
// How long a frame took, and how long the server takes to answer. Sampled always
// rather than only while the menu is open: a readout that starts measuring when
// you look at it can only ever show you the frames you spent opening a menu.
const frameSamples = sampler(), pingSamples = sampler();
let lastPingAt = 0;
const PING_EVERY = 1000;                            // once a second is plenty for a median

requestAnimationFrame(function frame(now) {
  if (now - lastPingAt > PING_EVERY) { lastPingAt = now; send({ t: 'ping', at: now }); }
  try { drawFrame(now); } catch (err) {
    if (!renderFailed) { renderFailed = true; console.error('render error (loop kept alive):', err); }
  }
  requestAnimationFrame(frame);
});

function drawFrame(now) {
  const map = MAPS[mapId], me = ships.get(myId);
  const st = resolve(myHull, myFit);          // your resolved stats, wanted by minimap and hud alike

  // Thruster tracks how fast you are actually going, measured off the smoothed
  // render position — the server never sends velocity and does not need to.
  // Sampled here, off the delta the renderer already computes — timing the frame
  // in two places is two answers waiting to disagree.
  if (lastFrameAt) pushSample(frameSamples, now - lastFrameAt);
  const frameDt = Math.min(0.1, (now - lastFrameAt) / 1000) || 0.016;
  lastFrameAt = now;
  if (me) {
    if (prevSelf) {
      const v = Math.hypot(me.rx - prevSelf.x, me.ry - prevSelf.y) / frameDt;
      thrust += (Math.min(1, v / Math.max(1, st.speed)) - thrust) * 0.16;
    }
    prevSelf = { x: me.rx, y: me.ry };
  } else thrust *= 0.9;
  setThrust(thrust);

  for (const s of ships.values()) { s.rx += (s.x - s.rx) * 0.35; s.ry += (s.y - s.ry) * 0.35; }
  if (me) {
    cam.x = clamp(me.rx - WVW / 2, WORLD.x0, Math.max(WORLD.x0, WORLD.x1 - WVW));
    cam.y = clamp(me.ry - WVH / 2, WORLD.y0, Math.max(WORLD.y0, WORLD.y1 - WVH));
  }
  const depth = me ? driftDepth(me.x, me.y) : 0;
  if (marker && me && Math.hypot(marker.x - me.x, marker.y - me.y) < 12) marker = null;
  const atPortal = me ? nearPortal(map, { x: me.x, y: me.y, jumpCd: 0 }) : null;
  const charge = me?.charge ?? 0;

  g.fillStyle = '#05070b'; g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.globalAlpha = 0.055; g.fillStyle = map.tint; g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.globalAlpha = 1;
  drawStars();

  g.save();
  g.scale(zoom, zoom);
  g.translate(-cam.x, -cam.y);

  for (const [x, y, r, col] of map.neb) {
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, col); grad.addColorStop(1, 'transparent');
    g.globalAlpha = 0.30; g.fillStyle = grad; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  g.globalAlpha = 1;

  g.strokeStyle = 'rgba(120,160,220,0.05)'; g.lineWidth = 1; g.beginPath();
  for (let x = Math.floor(cam.x / 500) * 500; x < cam.x + WVW; x += 500) { g.moveTo(x, cam.y); g.lineTo(x, cam.y + WVH); }
  for (let y = Math.floor(cam.y / 500) * 500; y < cam.y + WVH; y += 500) { g.moveTo(cam.x, y); g.lineTo(cam.x + WVW, y); }
  g.stroke();

  // No boundary drawn in the world. Sliding off the minimap is the tell, and the
  // shear vignette takes over from there.

  // Workshop signage: a marked-out firing line and a label over each area, so the
  // room explains itself instead of needing a diagram beside it.
  if (map.dev) {
    g.save();
    g.strokeStyle = 'rgba(125,224,138,0.30)'; g.lineWidth = 2; g.setLineDash([14, 10]);
    g.strokeRect(PEN.x, PEN.y, PEN.w, PEN.h);
    g.setLineDash([]);
    g.strokeStyle = 'rgba(125,224,138,0.13)'; g.lineWidth = 1;
    for (const sl of PEN_SLOTS) {                                    // a mark under each post
      g.beginPath(); g.moveTo(PEN.x + 14, sl.y); g.lineTo(PEN.x + PEN.w - 14, sl.y); g.stroke();
    }
    g.textAlign = 'left';
    for (const L of DEV_LABELS) {
      g.fillStyle = 'rgba(125,224,138,0.85)'; g.font = 'bold 20px ui-monospace, monospace';
      g.fillText(L.text, L.x, L.y);
      g.fillStyle = 'rgba(125,224,138,0.42)'; g.font = '13px ui-monospace, monospace';
      g.fillText(L.sub, L.x, L.y + 18);
    }
    // and a nameplate under every mannequin, since that is the point of them
    g.textAlign = 'center'; g.font = '12px ui-monospace, monospace';
    for (const pr of PROPS) {
      g.fillStyle = 'rgba(207,228,255,0.55)';
      g.fillText(pr.label, pr.x, pr.y + 210);
    }
    g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
    g.restore();
  }

  if (map.outpost) {
    // Not a base and drawn so it cannot be mistaken for one: no company colour, no
    // approach ticks, a broken ring instead of a sweep. It buys ore. That is all
    // it does, and nothing about it should promise otherwise.
    const o = map.outpost, near = me && Math.hypot(o.x - me.rx, o.y - me.ry) < o.r;
    g.strokeStyle = near ? '#e0a53f' : '#8a6a3a'; g.lineWidth = 1.5;
    g.setLineDash([8, 14]); g.lineDashOffset = now / 220;
    g.beginPath(); g.arc(o.x, o.y, o.r, 0, 7); g.stroke();
    g.setLineDash([]); g.lineDashOffset = 0;
    g.save(); g.translate(o.x, o.y); g.rotate(-now / 14000);
    g.strokeStyle = near ? '#ffd479' : '#8a6a3a'; g.lineWidth = 2.5;
    g.beginPath();                                    // a lopsided hulk, not a station
    for (let i = 0; i < 5; i++) {
      const a2 = (i / 5) * Math.PI * 2, rr = 46 + (i % 2 ? 16 : 0);
      i ? g.lineTo(Math.cos(a2) * rr, Math.sin(a2) * rr) : g.moveTo(Math.cos(a2) * rr, Math.sin(a2) * rr);
    }
    g.closePath(); g.stroke();
    g.fillStyle = '#0a0f16'; g.fill(); g.stroke();
    g.restore();
    // A berth you rent is drawn on the hulk itself: lit bays and an open gantry,
    // so an outpost you can work at reads differently from one you can only sell to
    // from across the sector.
    const mine = myBerths.includes(mapId);
    if (mine) {
      g.save(); g.translate(o.x, o.y); g.rotate(now / 14000);
      g.strokeStyle = near ? '#7de08a' : '#3f6a4a'; g.lineWidth = 2;
      for (let i = 0; i < 5; i++) {                 // a gantry off each face
        const a2 = (i / 5) * Math.PI * 2 + 0.6;
        g.beginPath();
        g.moveTo(Math.cos(a2) * 52, Math.sin(a2) * 52);
        g.lineTo(Math.cos(a2) * 84, Math.sin(a2) * 84);
        g.stroke();
      }
      const lit = 0.5 + 0.5 * Math.sin(now / 700);
      g.globalAlpha = 0.35 + 0.4 * lit; g.fillStyle = '#7de08a';
      for (let i = 0; i < 5; i++) {
        const a2 = (i / 5) * Math.PI * 2 + 0.6;
        g.beginPath(); g.arc(Math.cos(a2) * 84, Math.sin(a2) * 84, 3.2, 0, 7); g.fill();
      }
      g.globalAlpha = 1; g.restore();
    }
    g.textAlign = 'center'; g.font = '11px ui-monospace, monospace';
    g.fillStyle = mine ? (near ? '#7de08a' : '#3f6a4a') : (near ? '#ffd479' : '#6a5a3a');
    g.fillText(mine ? 'PIRATE OUTPOST · YOUR BERTH' : 'PIRATE OUTPOST', o.x, o.y - 76);
    g.font = '9px ui-monospace, monospace'; g.fillStyle = '#6a5a3a';
    g.fillText(mine ? 'press H to refit and buy · no repairs and no shelter here'
                    : `buys ore at ${Math.round(PIRATE_RATE * 100)}% of its value`,
               o.x, o.y + 84);
    // A sign you have to already know about is not a sign. Anyone who comes inside
    // is told what the place sells and which key opens it.
    if (near && !mine) {
      const t = 'PRESS  H  TO RENT A BAY HERE';
      g.font = 'bold 12px ui-monospace, monospace';
      const w = g.measureText(t).width + 26;
      const bx = o.x - w / 2, by = o.y - 132;
      const puls = 0.6 + 0.4 * Math.sin(now / 420);
      g.globalAlpha = 0.9;
      g.fillStyle = 'rgba(6,10,16,0.92)'; g.fillRect(bx, by, w, 26);
      g.strokeStyle = `rgba(255,212,121,${puls.toFixed(2)})`; g.lineWidth = 1.4;
      g.strokeRect(bx + .5, by + .5, w - 1, 25);
      g.fillStyle = '#ffd479';
      g.fillText(t, o.x, by + 18);
      g.globalAlpha = 1;
      g.font = '9px ui-monospace, monospace'; g.fillStyle = '#8a6a3a';
      g.fillText('refit here, and buy the gear your company will not sell', o.x, by + 40);
    }
    g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
  }

  if (map.base) {
    const b = map.base, col = COMPANIES[map.owner ?? myCo].color, mine = (map.owner ?? myCo) === myCo;
    const grd = g.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    grd.addColorStop(0, col + '2e'); grd.addColorStop(0.65, col + '12'); grd.addColorStop(1, 'transparent');
    g.fillStyle = grd; g.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);

    g.strokeStyle = col + (mine ? 'aa' : '55'); g.lineWidth = 2;
    g.setLineDash([26, 18]); g.lineDashOffset = -now / 60;          // slow drift
    g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.stroke();
    g.setLineDash([]); g.lineDashOffset = 0;
    g.strokeStyle = col + '44'; g.lineWidth = 1;
    g.beginPath(); g.arc(b.x, b.y, b.r * 0.62, 0, 7); g.stroke();

    for (let i = 0; i < 4; i++) {                                    // approach ticks
      const a = i * Math.PI / 2 + Math.PI / 4;
      g.beginPath();
      g.moveTo(b.x + Math.cos(a) * (b.r - 26), b.y + Math.sin(a) * (b.r - 26));
      g.lineTo(b.x + Math.cos(a) * (b.r + 26), b.y + Math.sin(a) * (b.r + 26));
      g.stroke();
    }

    g.save();                                                        // station
    g.translate(b.x, b.y); g.rotate(now / 9000);
    g.strokeStyle = col; g.lineWidth = 3; g.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3, px = Math.cos(a) * 62, py = Math.sin(a) * 62;
      i ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.closePath(); g.stroke();
    g.fillStyle = col + '55'; g.fill();
    g.fillStyle = col; g.fillRect(-13, -13, 26, 26);
    g.restore();

    drawLabs();                                                      // the yard

    g.fillStyle = col; g.textAlign = 'center'; g.font = '14px ui-monospace, monospace';
    g.fillText(map.dev ? 'WORKSHOP DOCK' : `${COMPANIES[map.owner ?? myCo].tag} BASE`, b.x, b.y - b.r - 18);
    g.font = '12px ui-monospace, monospace'; g.textAlign = 'left';
  }

  const idle = 0.6 + 0.4 * Math.sin(now / 420);
  for (const p of map.portals) {
    const tint = MAPS[p.to].tint;
    const spooling = charge > 0 && atPortal === p;
    let r = PORTAL_R;
    if (spooling) {
