<!doctype html>
<meta charset="utf-8">
<title>Aphelion</title>
<style>
  html,body{margin:0;height:100%;background:#05070b;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair;touch-action:none}
</style>
<canvas id="c"></canvas>
<script type="module">
import { MAP_W, MAP_H, PORTAL_R, MAPS, COMPANIES } from '/shared/maps.js';
import { SLOW_RADIUS, JUMP_TIME, nearPortal, inBase, driftDepth, driftDps,
         DRIFT_MARGIN, WORLD } from '/shared/sim.js';
import { ATTRS, HULLS, MODULES, resolve, radiusOf, slotsOf } from '/shared/ships.js';
import { chartLayout } from '/shared/chart.js';
import { ALLY, FRESH, STALE } from '/shared/radar.js';

const c = document.getElementById('c'), g = c.getContext('2d');
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;

// --- viewport: fills the window, DPR-correct --------------------------------
let VIEW_W = 0, VIEW_H = 0, MM_W = 0, MM_H = 0, MM_X = 0, MM_Y = 0;
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  VIEW_W = innerWidth; VIEW_H = innerHeight;
  c.width = Math.round(VIEW_W * dpr); c.height = Math.round(VIEW_H * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);              // also resets font — re-set it
  g.font = '12px ui-monospace, SFMono-Regular, monospace';
  MM_W = Math.min(260, VIEW_W * 0.22); MM_H = MM_W * (MAP_H / MAP_W);
  MM_X = VIEW_W - MM_W - 16; MM_Y = VIEW_H - MM_H - 16;
}
addEventListener('resize', resize); resize();
const btn    = () => ({ x: VIEW_W / 2 - 115, y: VIEW_H - 104, w: 230, h: 48 });
const sysBtn = () => ({ x: MM_X - 146, y: MM_Y + MM_H - 30, w: 136, h: 30 });
let sysOpen = false;

let myId = null, myCo = 'm', mapId = 'm1', status = 'connecting…';
let myHull = 'vanguard', myFit = [];
let bayOpen = false, draftHull = 'vanguard', draftFit = [];
const ships = new Map();          // id -> { x,y,heading,charge, rx,ry }
const cam = { x: 0, y: 0 };

// --- net ---------------------------------------------------------------------
const ws = new WebSocket(`ws://${location.host}`);
const send = o => { if (ws.readyState === 1) ws.send(JSON.stringify(o)); };
ws.onopen  = () => status = 'online';
ws.onclose = () => status = 'disconnected';
ws.onmessage = e => {
  const m = JSON.parse(e.data);
  if (m.t === 'welcome') { myId = m.id; myCo = m.co; mapId = m.map; myHull = m.hull; myFit = m.fit; return; }
  if (m.t === 'fit')     { myHull = m.hull; myFit = m.fit; draftHull = m.hull; draftFit = [...m.fit]; return; }
  if (m.t === 'map')     { mapId = m.map; ships.clear(); marker = null; return; }
  if (m.t !== 's') return;
  const seen = new Set();
  for (const [id, x, y, h, ch, co, hull, hp, sh, vis] of m.ships) {
    seen.add(id);
    const s = ships.get(id) ?? { rx: x, ry: y };
    s.x = x; s.y = y; s.heading = h; s.charge = ch; s.co = co;
    s.hull = hull; s.hp = hp; s.sh = sh; s.vis = vis;
    ships.set(id, s);
  }
  for (const id of ships.keys()) if (!seen.has(id)) ships.delete(id);
};

// --- input -------------------------------------------------------------------
// A tap is a destination. A hold is a throttle+heading, resent every tick because
// the ship (and the camera under the cursor) keeps moving while you hold still.
const HOLD_MS = 150, DRAG_PX = 10;
let held = false, steering = false, downAt = 0, cur = { x: 0, y: 0 }, down = { x: 0, y: 0 };
let marker = null;                                    // your last move order, for display

const toView = e => {
  const r = c.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (VIEW_W / r.width),
           y: (e.clientY - r.top)  * (VIEW_H / r.height) };
};

const docked = () => {
  const me = ships.get(myId), map = MAPS[mapId];
  return !!me && map.owner === myCo && inBase(map, { x: me.x, y: me.y });
};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'm') { sysOpen = !sysOpen; bayOpen = false; }
  if (k === 'h') { bayOpen = !bayOpen; sysOpen = false; draftHull = myHull; draftFit = [...myFit]; }
  if (k === 'k') send({ t: 'dev-damage' });        // temporary, until weapons exist
  if (e.key === 'Escape') { sysOpen = false; bayOpen = false; }
});

c.addEventListener('pointerdown', e => {
  const v = toView(e);
  if (sysOpen) { sysOpen = false; return; }
  if (bayOpen) { bayClick(v); return; }           // click anywhere dismisses the chart
  const sb = sysBtn();
  if (v.x > sb.x && v.x < sb.x + sb.w && v.y > sb.y && v.y < sb.y + sb.h) { sysOpen = true; return; }
  const b = btn();
  if (v.x > b.x && v.x < b.x + b.w && v.y > b.y && v.y < b.y + b.h) return send({ t: 'jump' });
  if (v.x > MM_X && v.y > MM_Y) {                     // minimap click = destination order
    marker = { x: clamp((v.x - MM_X) / MM_W * MAP_W, 0, MAP_W),
               y: clamp((v.y - MM_Y) / MM_H * MAP_H, 0, MAP_H) };   // the minimap IS charted space
    return send({ t: 'intent', mode: 'pt', x: marker.x, y: marker.y });
  }
  held = true; steering = false; downAt = performance.now(); cur = down = v;
  c.setPointerCapture(e.pointerId);
  marker = { x: v.x + cam.x, y: v.y + cam.y };
  send({ t: 'intent', mode: 'pt', x: marker.x, y: marker.y });   // instant response on tap
});
c.addEventListener('pointermove', e => {
  if (!held) return;
  cur = toView(e);
  if (Math.hypot(cur.x - down.x, cur.y - down.y) > DRAG_PX) steering = true;
});
addEventListener('pointerup', () => {
  if (held && steering) { send({ t: 'intent', mode: 'stop' }); marker = null; }
  held = false; steering = false;
});

setInterval(() => {                                   // flush at the server tick rate
  if (!held) return;
  if (!steering && performance.now() - downAt > HOLD_MS) steering = true;
  if (!steering) return;
  const me = ships.get(myId);
  if (!me) return;
  const dx = cur.x - (me.rx - cam.x), dy = cur.y - (me.ry - cam.y);
  const d = Math.hypot(dx, dy);
  const throttle = Math.min(1, d / SLOW_RADIUS);      // point near yourself = crawl
  marker = null;
  send(d < 1 ? { t: 'intent', mode: 'stop' }
             : { t: 'intent', mode: 'dir', dx: (dx / d) * throttle, dy: (dy / d) * throttle });
}, 1000 / 30);

// --- starfield: hashed grid, infinite, zero storage ---------------------------
const hash = (x, y, s) => {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(s, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};
const LAYERS = [
  { p: 0.30, cell:  70, size: 1.0, a: 0.45 },
  { p: 0.60, cell: 110, size: 1.7, a: 0.60 },
  { p: 1.00, cell: 190, size: 2.5, a: 0.85 },
];
function drawStars() {
  g.fillStyle = '#cfe4ff';
  LAYERS.forEach((L, li) => {
    const ox = cam.x * L.p, oy = cam.y * L.p;
    const cx0 = Math.floor(ox / L.cell), cx1 = Math.floor((ox + VIEW_W) / L.cell);
    const cy0 = Math.floor(oy / L.cell), cy1 = Math.floor((oy + VIEW_H) / L.cell);
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
      const b = hash(cx, cy, li * 97 + 3);
      if (b < 0.35) continue;
      g.globalAlpha = L.a * (0.35 + b * 0.65);
      g.fillRect(cx * L.cell + hash(cx, cy, li * 97 + 1) * L.cell - ox,
                 cy * L.cell + hash(cx, cy, li * 97 + 2) * L.cell - oy, L.size, L.size);
    }
  });
  g.globalAlpha = 1;
}

// --- star system chart -------------------------------------------------------
// All geometry lives in shared/chart.js so the tests verify the same router that
// draws here. This function is purely paint.
function drawSystem(me) {
  const { rects, links, stubs, NW, NH } = chartLayout(VIEW_W, VIEW_H);
  const small = NW < 104;

  g.fillStyle = 'rgba(3,5,9,0.92)'; g.fillRect(0, 0, VIEW_W, VIEW_H);

  for (const L of links) {                                  // long routing, under the nodes
    g.strokeStyle = L.own ? COMPANIES[L.own].color + '66' : 'rgba(224,90,90,0.50)';
    g.lineWidth = L.own ? 1.8 : 2.4;
    g.lineJoin = 'round';
    g.beginPath(); g.moveTo(L.pts[0][0], L.pts[0][1]);
    for (const [x, y] of L.pts.slice(1)) g.lineTo(x, y);
    g.stroke();
  }

  for (const [id, r] of rects) {
    const m = MAPS[id], here = id === mapId;
    const kx = r.w / MAP_W, ky = r.h / MAP_H;

    g.save();
    g.beginPath(); g.rect(r.x, r.y, r.w, r.h); g.clip();
    g.fillStyle = '#070b11'; g.fillRect(r.x, r.y, r.w, r.h);
    g.globalAlpha = 0.17; g.fillStyle = m.tint; g.fillRect(r.x, r.y, r.w, r.h);
    for (const [x, y, rad, col] of m.neb) {
      const cx = r.x + x * kx, cy = r.y + y * ky, rr = rad * kx;
      const grd = g.createRadialGradient(cx, cy, 0, cx, cy, rr);
      grd.addColorStop(0, col); grd.addColorStop(1, 'transparent');
      g.globalAlpha = 0.8; g.fillStyle = grd; g.fillRect(cx - rr, cy - rr, rr * 2, rr * 2);
    }
    g.globalAlpha = 0.45; g.fillStyle = '#cfe4ff';
    const sd = id.charCodeAt(0) * 31 + id.charCodeAt(1);
    for (let i = 0; i < 22; i++) g.fillRect(r.x + hash(i, 7, sd) * r.w, r.y + hash(i, 11, sd) * r.h, 1, 1);
    g.globalAlpha = 1;
    g.restore();

    for (const st of stubs) {                               // last stretch, over its own preview
      if (st.map !== id) continue;
      g.globalAlpha = 0.6; g.lineWidth = 1.2;
      g.strokeStyle = st.own ? COMPANIES[st.own].color : '#e08a8a';
      g.beginPath(); g.moveTo(st.from.x, st.from.y); g.lineTo(st.to_.x, st.to_.y); g.stroke();
      g.globalAlpha = 1;
      g.fillStyle = MAPS[st.to].tint;
      g.fillRect(st.from.x - 2.5, st.from.y - 2.5, 5, 5);
    }

    if (m.home) {
      g.fillStyle = COMPANIES[m.owner].color;
      const cx = r.x + m.base.x * kx, cy = r.y + m.base.y * ky;
      g.strokeStyle = COMPANIES[m.owner].color + '99'; g.lineWidth = 1;
      g.beginPath(); g.arc(cx, cy, m.base.r * kx, 0, 7); g.stroke();
      g.beginPath();
      g.moveTo(cx, cy - 7); g.lineTo(cx + 7, cy); g.lineTo(cx, cy + 7); g.lineTo(cx - 7, cy);
      g.closePath(); g.fill();
      g.strokeStyle = '#05070b'; g.lineWidth = 1; g.stroke();
    }
    if (here && me) {
      g.fillStyle = '#fff';
      g.beginPath(); g.arc(r.x + me.rx * kx, r.y + me.ry * ky, 3, 0, 7); g.fill();
    }

    // fill is the region's own theme; the OUTLINE is who holds it
    if (m.owner) { g.strokeStyle = COMPANIES[m.owner].color; g.lineWidth = 2; }
    else         { g.strokeStyle = '#8a94a8'; g.lineWidth = 1.4; g.setLineDash([4, 3]); }
    g.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);
    g.setLineDash([]);
    if (here) { g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.strokeRect(r.x - 3.5, r.y - 3.5, r.w + 7, r.h + 7); }

    g.textAlign = 'center';
    g.font = (small ? '10px' : '11px') + ' ui-monospace, monospace';
    g.fillStyle = here ? '#fff' : m.tint;
    g.fillText(m.name.split(' · ')[0] + (here ? '  ◂ you' : ''), r.x + r.w / 2, r.y + r.h + 14);
    g.fillStyle = '#66748c'; g.font = (small ? '9px' : '10px') + ' ui-monospace, monospace';
    g.fillText(m.theme.toUpperCase(), r.x + r.w / 2, r.y + r.h + 26);
  }

  g.textAlign = 'center'; g.fillStyle = '#8ab4e6'; g.font = '15px ui-monospace, monospace';
  g.fillText('KNOWN SPACE · STAR SYSTEM', VIEW_W / 2, 30);
  let lx = VIEW_W / 2 - 306;
  g.font = '11px ui-monospace, monospace'; g.textAlign = 'left';
  for (const [co, f] of Object.entries(COMPANIES)) {
    g.strokeStyle = f.color; g.lineWidth = 2; g.strokeRect(lx + .5, 43.5, 11, 11);
    g.fillStyle = co === myCo ? '#fff' : '#7f8ea8';
    g.fillText(`${f.tag} — ${f.name}${co === myCo ? '  ◂ you' : ''}`, lx + 18, 53);
    lx += 208;
  }
  g.strokeStyle = '#8a94a8'; g.lineWidth = 1.4; g.setLineDash([4, 3]);
  g.strokeRect(VIEW_W / 2 - 306.5, 62.5, 11, 11); g.setLineDash([]);
  g.fillStyle = '#7f8ea8';
  g.fillText('CONTESTED — no holder.   Fill colour is the region itself; the outline is who holds it.',
             VIEW_W / 2 - 288, 72);
  g.textAlign = 'center'; g.fillStyle = '#5b6b85'; g.font = '12px ui-monospace, monospace';
  g.fillText('click anywhere or press M to close', VIEW_W / 2, VIEW_H - 18);
  g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
}

// --- hangar -------------------------------------------------------------------
// Geometry lives in one place so drawing and hit-testing can never disagree
// about where a row is.
function bayGeom() {
  const w = Math.min(900, VIEW_W - 60), h = Math.min(470, VIEW_H - 60);
  const x = (VIEW_W - w) / 2, y = (VIEW_H - h) / 2;
  const colW = (w - 60) / 3, top = y + 74;
  const hulls = Object.keys(HULLS).map((k, i) => ({ k, r: { x: x + 20, y: top + i * 58, w: colW, h: 50 } }));
  const mods  = Object.keys(MODULES).map((k, i) => ({ k, r: { x: x + 30 + colW, y: top + i * 44, w: colW, h: 38 } }));
  return { panel: { x, y, w, h }, colW, top, hulls, mods,
           apply: { x: x + w - 190, y: y + h - 54, w: 170, h: 34 } };
}

function bayClick(v) {
  const G = bayGeom();
  const inside = (r) => v.x > r.x && v.x < r.x + r.w && v.y > r.y && v.y < r.y + r.h;
  if (!inside(G.panel)) { bayOpen = false; return; }
  for (const { k, r } of G.hulls) if (inside(r)) {
    draftHull = k;
    draftFit = draftFit.slice(0, slotsOf(k));         // a smaller hull can drop modules
    return;
  }
  for (const { k, r } of G.mods) if (inside(r)) {
    const i = draftFit.indexOf(k);
    if (i >= 0) draftFit.splice(i, 1);
    else if (draftFit.length < slotsOf(draftHull)) draftFit.push(k);
    return;
  }
  if (inside(G.apply) && docked()) send({ t: 'refit', hull: draftHull, fit: draftFit });
}

const fmt = v => Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 10) / 10;

function drawBay() {
  const G = bayGeom(), P = G.panel;
  const base = resolve(draftHull, []), fitted = resolve(draftHull, draftFit);
  const home = docked();

  g.fillStyle = 'rgba(3,5,9,0.92)'; g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.fillStyle = 'rgba(8,12,19,0.98)'; g.fillRect(P.x, P.y, P.w, P.h);
  g.strokeStyle = '#2c3d55'; g.lineWidth = 1; g.strokeRect(P.x + .5, P.y + .5, P.w - 1, P.h - 1);

  g.textAlign = 'left'; g.font = '15px ui-monospace, monospace'; g.fillStyle = '#8ab4e6';
  g.fillText('HANGAR', P.x + 20, P.y + 32);
  g.font = '11px ui-monospace, monospace';
  g.fillStyle = home ? '#66748c' : '#e0a53f';
  g.fillText(home ? 'DOCKED — refit at will'
                  : `fly into the ${COMPANIES[myCo].tag}-1 base ring to refit`, P.x + 100, P.y + 32);

  g.font = '11px ui-monospace, monospace';
  g.fillStyle = '#5b6b85'; g.fillText('HULL', P.x + 20, G.top - 12);
  g.fillText(`MODULES  ${draftFit.length}/${slotsOf(draftHull)}`, P.x + 30 + G.colW, G.top - 12);
  g.fillText('RESOLVED', P.x + 40 + G.colW * 2, G.top - 12);

  for (const { k, r } of G.hulls) {
    const H = HULLS[k], on = k === draftHull;
    g.fillStyle = on ? 'rgba(90,150,220,0.16)' : 'rgba(255,255,255,0.03)';
    g.fillRect(r.x, r.y, r.w, r.h);
    g.strokeStyle = on ? '#7fd4ff' : '#2c3d55'; g.lineWidth = on ? 1.6 : 1;
    g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);
    g.fillStyle = COMPANIES[myCo].color;
    g.fillRect(r.x + 14 - H.r / 2, r.y + r.h / 2 - H.r / 2, H.r, H.r);
    g.fillStyle = on ? '#fff' : '#93a3b5'; g.font = '12px ui-monospace, monospace';
    g.fillText(H.name, r.x + 34, r.y + 21);
    g.fillStyle = '#66748c'; g.font = '10px ui-monospace, monospace';
    const a = H.attrs;
    g.fillText(`${H.cls}   ${a.hull} hull  ${a.shield} sh  ${a.speed} spd`, r.x + 34, r.y + 36);
  }

  for (const { k, r } of G.mods) {
    const M = MODULES[k], on = draftFit.includes(k);
    const full = !on && draftFit.length >= slotsOf(draftHull);
    g.globalAlpha = full ? 0.4 : 1;
    g.fillStyle = on ? 'rgba(125,224,138,0.14)' : 'rgba(255,255,255,0.03)';
    g.fillRect(r.x, r.y, r.w, r.h);
    g.strokeStyle = on ? '#7de08a' : '#2c3d55'; g.lineWidth = on ? 1.6 : 1;
    g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);
    g.fillStyle = on ? '#fff' : '#93a3b5'; g.font = '11px ui-monospace, monospace';
    g.fillText(M.name, r.x + 10, r.y + 16);
    g.font = '10px ui-monospace, monospace';
    let tx = r.x + 10;
    for (const [attr, op, v] of M.mods) {
      const good = (ATTRS[attr].better === 'high') === (v > 0);
      g.fillStyle = good ? '#7de08a' : '#e07a7a';
      const txt = `${v > 0 ? '+' : ''}${op === 'mul' ? Math.round(v * 100) + '%' : fmt(v)} ${attr}`;
      g.fillText(txt, tx, r.y + 30);
      tx += g.measureText(txt).width + 12;
    }
    g.globalAlpha = 1;
  }

  const sx = P.x + 40 + G.colW * 2;
  let sy = G.top + 6;
  g.font = '11px ui-monospace, monospace';
  for (const [k, A] of Object.entries(ATTRS)) {
    const b = base[k], f = fitted[k], d = f - b;
    g.fillStyle = '#66748c'; g.fillText(A.label, sx, sy);
    g.fillStyle = '#cfe4ff'; g.textAlign = 'right';
    g.fillText(`${fmt(f)}${A.unit}`, sx + 150, sy);
    if (Math.abs(d) > 0.01) {
      g.fillStyle = (A.better === 'high') === (d > 0) ? '#7de08a' : '#e07a7a';
      g.fillText(`${d > 0 ? '+' : ''}${fmt(d)}`, sx + 214, sy);
    }
    g.textAlign = 'left';
    sy += 22;
  }

  const A = G.apply;
  g.globalAlpha = home ? 1 : 0.4;
  g.fillStyle = 'rgba(125,224,138,0.16)'; g.fillRect(A.x, A.y, A.w, A.h);
  g.strokeStyle = '#7de08a'; g.lineWidth = 1.4; g.strokeRect(A.x + .5, A.y + .5, A.w - 1, A.h - 1);
  g.fillStyle = '#7de08a'; g.textAlign = 'center'; g.font = '12px ui-monospace, monospace';
  g.fillText('APPLY REFIT', A.x + A.w / 2, A.y + 22);
  g.globalAlpha = 1;
  g.textAlign = 'left'; g.fillStyle = '#5b6b85'; g.font = '11px ui-monospace, monospace';
  g.fillText('click a hull or module to change the draft · H or Esc to close', P.x + 20, P.y + P.h - 30);
  g.font = '12px ui-monospace, monospace';
}

// --- render -------------------------------------------------------------------
let renderFailed = false;
requestAnimationFrame(function frame(now) {
  try { drawFrame(now); } catch (err) {
    if (!renderFailed) { renderFailed = true; console.error('render error (loop kept alive):', err); }
  }
  requestAnimationFrame(frame);
});

function drawFrame(now) {
  const map = MAPS[mapId], me = ships.get(myId);
  const st = resolve(myHull, myFit);          // your resolved stats, wanted by minimap and hud alike

  for (const s of ships.values()) { s.rx += (s.x - s.rx) * 0.35; s.ry += (s.y - s.ry) * 0.35; }
  if (me) {
    cam.x = clamp(me.rx - VIEW_W / 2, WORLD.x0, Math.max(WORLD.x0, WORLD.x1 - VIEW_W));
    cam.y = clamp(me.ry - VIEW_H / 2, WORLD.y0, Math.max(WORLD.y0, WORLD.y1 - VIEW_H));
  }
  const depth = me ? driftDepth(me.x, me.y) : 0;
  if (marker && me && Math.hypot(marker.x - me.x, marker.y - me.y) < 12) marker = null;
  const atPortal = me ? nearPortal(map, { x: me.x, y: me.y, jumpCd: 0 }) : null;
  const charge = me?.charge ?? 0;

  g.fillStyle = '#05070b'; g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.globalAlpha = 0.055; g.fillStyle = map.tint; g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.globalAlpha = 1;
  drawStars();

  g.save();
  g.translate(-cam.x, -cam.y);

  for (const [x, y, r, col] of map.neb) {
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, col); grad.addColorStop(1, 'transparent');
    g.globalAlpha = 0.30; g.fillStyle = grad; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  g.globalAlpha = 1;

  g.strokeStyle = 'rgba(120,160,220,0.05)'; g.lineWidth = 1; g.beginPath();
  for (let x = Math.floor(cam.x / 500) * 500; x < cam.x + VIEW_W; x += 500) { g.moveTo(x, cam.y); g.lineTo(x, cam.y + VIEW_H); }
  for (let y = Math.floor(cam.y / 500) * 500; y < cam.y + VIEW_H; y += 500) { g.moveTo(cam.x, y); g.lineTo(cam.x + VIEW_W, y); }
  g.stroke();

  // No boundary drawn in the world. Sliding off the minimap is the tell, and the
  // shear vignette takes over from there.

  if (map.base) {
    const b = map.base, col = COMPANIES[map.owner].color, mine = map.owner === myCo;
    const grd = g.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    grd.addColorStop(0, col + '2e'); grd.addColorStop(0.65, col + '12'); grd.addColorStop(1, 'transparent');
    g.fillStyle = grd; g.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);

    g.strokeStyle = col + (mine ? 'aa' : '55'); g.lineWidth = 2;
    g.setLineDash([26, 18]); g.lineDashOffset = -now / 60;          // slow drift
    g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.stroke();
    g.setLineDash([]); g.lineDashOffset = 0;
    g.strokeStyle = col + '44'; g.lineWidth = 1;
    g.beginPath(); g.arc(b.x, b.y, b.r * 0.62, 0, 7); g.stroke();

    for (let i = 0; i < 4; i++) {                                    // approach ticks
      const a = i * Math.PI / 2 + Math.PI / 4;
      g.beginPath();
      g.moveTo(b.x + Math.cos(a) * (b.r - 26), b.y + Math.sin(a) * (b.r - 26));
      g.lineTo(b.x + Math.cos(a) * (b.r + 26), b.y + Math.sin(a) * (b.r + 26));
      g.stroke();
    }

    g.save();                                                        // station
    g.translate(b.x, b.y); g.rotate(now / 9000);
    g.strokeStyle = col; g.lineWidth = 3; g.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3, px = Math.cos(a) * 62, py = Math.sin(a) * 62;
      i ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.closePath(); g.stroke();
    g.fillStyle = col + '55'; g.fill();
    g.fillStyle = col; g.fillRect(-13, -13, 26, 26);
    g.restore();

    g.fillStyle = col; g.textAlign = 'center'; g.font = '14px ui-monospace, monospace';
    g.fillText(`${COMPANIES[map.owner].tag} BASE`, b.x, b.y - b.r - 18);
    g.font = '12px ui-monospace, monospace'; g.textAlign = 'left';
  }

  const idle = 0.6 + 0.4 * Math.sin(now / 420);
  for (const p of map.portals) {
    const tint = MAPS[p.to].tint;
    const spooling = charge > 0 && atPortal === p;
    let r = PORTAL_R;
    if (spooling) {
      const el = JUMP_TIME - charge, prog = el / JUMP_TIME;
      r = PORTAL_R * (1 + (0.16 + 0.34 * prog) * Math.sin(el * el * 1.6 * Math.PI * 2));  // winds up
    }
    g.globalAlpha = (spooling ? 0.34 : 0.20) * (spooling ? 1 : idle);
    g.fillStyle = tint; g.beginPath(); g.arc(p.x, p.y, r, 0, 7); g.fill();
    g.globalAlpha = 1; g.strokeStyle = tint; g.lineWidth = spooling ? 5 : 3;
    g.beginPath(); g.arc(p.x, p.y, r, 0, 7); g.stroke();
    if (spooling) {
      g.lineWidth = 3; g.strokeStyle = '#fff';
      g.beginPath(); g.arc(p.x, p.y, PORTAL_R * 1.45, -Math.PI / 2, -Math.PI / 2 + (1 - charge / JUMP_TIME) * Math.PI * 2);
      g.stroke();
    }
    g.fillStyle = tint; g.textAlign = 'center';
    g.fillText(MAPS[p.to].name.toUpperCase(), p.x, p.y - PORTAL_R * 1.45 - 14);
  }
  g.textAlign = 'left';

  if (marker) {
    g.strokeStyle = '#4a90d9'; g.lineWidth = 1.5; g.globalAlpha = 0.8;
    g.beginPath(); g.arc(marker.x, marker.y, 8, 0, 7); g.stroke();
    g.globalAlpha = 1;
  }

  for (const [id, s] of ships) {
    const R = radiusOf(s.hull), lost = s.vis === STALE;
    g.save();
    g.translate(s.rx, s.ry); g.rotate(s.heading);
    g.globalAlpha = lost ? 0.35 : 1;               // last known track, no live sensor
    g.fillStyle = COMPANIES[s.co]?.color ?? '#8899aa';
    g.fillRect(-R, -R, R * 2, R * 2);
    if (id === myId) { g.strokeStyle = '#fff'; g.lineWidth = 2; g.strokeRect(-R, -R, R * 2, R * 2); }
    if (lost) { g.strokeStyle = '#e05a5a'; g.lineWidth = 1; g.setLineDash([3, 3]);
                g.strokeRect(-R - 4, -R - 4, R * 2 + 8, R * 2 + 8); g.setLineDash([]); }
    g.fillStyle = '#05070b'; g.fillRect(R - 6, -2, 6, 4);
    g.globalAlpha = 1;
    g.restore();

    if (lost) continue;                            // no vitals read on a fading track
    const bw = Math.max(30, R * 2.8);              // bars stay upright, never rotate
    g.fillStyle = 'rgba(4,7,12,0.75)';
    g.fillRect(s.rx - bw / 2, s.ry - R - 17, bw, 8);
    g.fillStyle = '#5fd0ff'; g.fillRect(s.rx - bw / 2 + 1, s.ry - R - 16, (bw - 2) * (s.sh ?? 0) / 100, 2.5);
    g.fillStyle = (s.hp ?? 100) > 33 ? '#7de08a' : '#e05a5a';
    g.fillRect(s.rx - bw / 2 + 1, s.ry - R - 12.5, (bw - 2) * (s.hp ?? 0) / 100, 2.5);
  }
  g.restore();

  // --- jump button (screen space) ---
  if (atPortal || charge > 0) {
    const p = atPortal ?? map.portals[0], tint = MAPS[p.to].tint, b = btn();
    const prog = charge > 0 ? 1 - charge / JUMP_TIME : 0;
    g.fillStyle = 'rgba(6,10,16,0.9)';
    g.beginPath(); g.roundRect(b.x, b.y, b.w, b.h, 6); g.fill();
    if (charge > 0) {
      g.save(); g.beginPath(); g.roundRect(b.x, b.y, b.w, b.h, 6); g.clip();
      g.globalAlpha = 0.35; g.fillStyle = tint; g.fillRect(b.x, b.y, b.w * prog, b.h);
      g.restore(); g.globalAlpha = 1;
    }
    g.strokeStyle = tint; g.lineWidth = 1.5;
    g.beginPath(); g.roundRect(b.x + .5, b.y + .5, b.w - 1, b.h - 1, 6); g.stroke();
    g.fillStyle = tint; g.textAlign = 'center'; g.font = '13px ui-monospace, monospace';
    g.fillText(charge > 0 ? `SPOOLING  ${charge.toFixed(1)}s  ·  CLICK TO ABORT`
                          : `JUMP  →  ${MAPS[p.to].name.toUpperCase()}`, b.x + b.w / 2, b.y + 29);
    g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
  }

  // --- minimap ---
  const sx = MM_W / MAP_W, sy = MM_H / MAP_H;
  g.fillStyle = 'rgba(6,10,16,0.86)'; g.fillRect(MM_X, MM_Y, MM_W, MM_H);
  g.strokeStyle = map.tint + '99'; g.lineWidth = 1; g.strokeRect(MM_X + .5, MM_Y + .5, MM_W - 1, MM_H - 1);
  if (map.base) {
    const b = map.base, col = COMPANIES[map.owner].color;
    g.strokeStyle = col + 'cc'; g.lineWidth = 1;
    g.beginPath(); g.arc(MM_X + b.x * sx, MM_Y + b.y * sy, b.r * sx, 0, 7); g.stroke();
    g.fillStyle = col; g.fillRect(MM_X + b.x * sx - 2, MM_Y + b.y * sy - 2, 4, 4);
  }
  for (const p of map.portals) {
    g.fillStyle = MAPS[p.to].tint;
    g.fillRect(MM_X + p.x * sx - 2.5, MM_Y + p.y * sy - 2.5, 5, 5);
  }
  if (marker && me) {                                 // course line, drawn under the dots
    const mx = MM_X + clamp(marker.x, 0, MAP_W) * sx, my = MM_Y + clamp(marker.y, 0, MAP_H) * sy;
    g.strokeStyle = 'rgba(74,144,217,0.75)'; g.lineWidth = 1; g.setLineDash([3, 3]);
    g.beginPath(); g.moveTo(MM_X + me.rx * sx, MM_Y + me.ry * sy); g.lineTo(mx, my); g.stroke();
    g.setLineDash([]);
    g.strokeStyle = '#4a90d9';
    g.beginPath(); g.arc(mx, my, 3.5, 0, 7); g.stroke();
    g.beginPath(); g.moveTo(mx - 6, my); g.lineTo(mx + 6, my);
    g.moveTo(mx, my - 6); g.lineTo(mx, my + 6); g.stroke();
  }
  g.save();                                        // nothing on the plot may spill past the frame
  g.beginPath(); g.rect(MM_X, MM_Y, MM_W, MM_H); g.clip();

  if (me) {                                        // the sweep itself, expanding out to radar range
    const cx = MM_X + clamp(me.rx, 0, MAP_W) * sx, cy = MM_Y + clamp(me.ry, 0, MAP_H) * sy;
    const reach = st.radar * sx;                 // the sweep itself, no ring left behind
    for (const off of [0, 0.5]) {
      const ph = ((now / 2400) + off) % 1;
      g.globalAlpha = (1 - ph) * (1 - ph) * 0.5;
      g.strokeStyle = '#7fd4ff'; g.lineWidth = 1.4;
      g.beginPath(); g.arc(cx, cy, ph * reach, 0, 7); g.stroke();
    }
    g.globalAlpha = 1;
  }

  for (const [id, s] of ships) {
    const off = driftDepth(s.x, s.y) > 0;          // clamp strays to the frame so they stay findable
    const mx = MM_X + clamp(s.rx, 0, MAP_W) * sx, my = MM_Y + clamp(s.ry, 0, MAP_H) * sy;
    if (s.vis === ALLY) {
      g.fillStyle = off ? '#ff5c6b' : (COMPANIES[s.co]?.color ?? '#8899aa');
      const w = id === myId ? 5 : 3;
      g.fillRect(mx - w / 2, my - w / 2, w, w);
      continue;
    }
    const hot = s.vis === FRESH;
    if (hot) {                                     // contact ping, phase-offset per contact
      const ph = ((now / 1150) + id * 0.37) % 1;
      g.globalAlpha = (1 - ph) * 0.75;
      g.strokeStyle = '#ff5c6b'; g.lineWidth = 1;
      g.beginPath(); g.arc(mx, my, 2 + ph * 8, 0, 7); g.stroke();
      g.globalAlpha = 1;
    }
    g.globalAlpha = hot ? 1 : 0.4;
    g.fillStyle = '#ff5c6b'; g.fillRect(mx - 1.5, my - 1.5, 3, 3);
    g.globalAlpha = 1;
  }
  g.restore();
  g.strokeStyle = '#ff3b47'; g.lineWidth = 1;
  g.strokeRect(MM_X + cam.x * sx, MM_Y + cam.y * sy, VIEW_W * sx, VIEW_H * sy);

  // --- star system button ---
  const sb = sysBtn();
  g.fillStyle = 'rgba(6,10,16,0.86)'; g.beginPath(); g.roundRect(sb.x, sb.y, sb.w, sb.h, 5); g.fill();
  g.strokeStyle = '#3d5a7f'; g.lineWidth = 1;
  g.beginPath(); g.roundRect(sb.x + .5, sb.y + .5, sb.w - 1, sb.h - 1, 5); g.stroke();
  g.strokeStyle = '#8ab4e6'; g.beginPath();                       // little link glyph
  g.moveTo(sb.x + 12, sb.y + 15); g.lineTo(sb.x + 24, sb.y + 15);
  g.moveTo(sb.x + 24, sb.y + 10); g.lineTo(sb.x + 24, sb.y + 20); g.stroke();
  g.fillStyle = '#8ab4e6';
  for (const [dx, dy] of [[9, 15], [27, 10], [27, 20]]) { g.beginPath(); g.arc(sb.x + dx, sb.y + dy, 2.5, 0, 7); g.fill(); }
  g.fillStyle = '#8ab4e6'; g.fillText('STAR SYSTEM', sb.x + 38, sb.y + 19);

  // --- hud ---
  g.fillStyle = map.tint; g.fillText(map.name, 16, 24);
  const terr = map.owner ? `${COMPANIES[map.owner].tag} TERRITORY` : 'CONTESTED';
  g.fillStyle = map.owner ? COMPANIES[map.owner].color : '#e05a5a';
  g.fillText(terr, 20 + g.measureText(map.name).width, 24);
  g.fillStyle = '#5b6b85';
  g.fillText(`${COMPANIES[myCo].tag} · ${HULLS[myHull].name} ${HULLS[myHull].cls} · ${status} · ` +
             `${ships.size} in sector · #${myId ?? '?'}`, 16, 42);
  if (me) {
    const hp = Math.round(st.hull * (me.hp ?? 100) / 100), sh = Math.round(st.shield * (me.sh ?? 100) / 100);
    const w = 190;
    g.fillStyle = 'rgba(4,7,12,0.7)'; g.fillRect(16, 52, w, 22);
    g.fillStyle = '#1d3b52'; g.fillRect(18, 54, w - 4, 8);
    g.fillStyle = '#5fd0ff'; g.fillRect(18, 54, (w - 4) * sh / Math.max(1, st.shield), 8);
    g.fillStyle = '#26402c'; g.fillRect(18, 64, w - 4, 8);
    g.fillStyle = hp > st.hull / 3 ? '#7de08a' : '#e05a5a';
    g.fillRect(18, 64, (w - 4) * hp / st.hull, 8);
    g.fillStyle = '#5b6b85';
    g.fillText(`SH ${sh}/${st.shield | 0}   HU ${hp}/${st.hull | 0}` +
               (myFit.length ? `   fit ${myFit.length}/${st.slots}` : ''), 16 + w + 10, 68);
    let hostiles = 0, tracks = 0;
    for (const c of ships.values()) if (c.vis === FRESH) hostiles++; else if (c.vis === STALE) tracks++;
    if (docked()) {
      g.fillStyle = COMPANIES[myCo].color;
      g.fillText('◆ DOCKED — repairing', 16 + w + 10, 52);
    } else if (hostiles || tracks) {
      g.fillStyle = '#ff5c6b';
      g.fillText(`▲ ${hostiles} contact${hostiles === 1 ? '' : 's'}` + (tracks ? ` · ${tracks} fading` : ''), 16 + w + 10, 52);
    }
    g.fillStyle = depth > 0 ? '#ff5c6b' : '#5b6b85';
    g.fillText(depth > 0 ? `SHEAR ${driftDps(depth) | 0}/s` :
               `RDR ${st.radar | 0}   SIG ${Math.round(st.signature * 10) / 10}s`, 16 + w + 10, 84);
  }
  g.fillText('click / hold to fly · JUMP at a portal · M star system · H hangar' +
             (docked() ? '' : ' (dock first)') + ' · K take test damage', 16, VIEW_H - 16);

  if (depth > 0 && !sysOpen && !bayOpen) {
    const t = Math.min(1, depth / DRIFT_MARGIN);
    const vig = g.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.28,
                                       VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.78);
    vig.addColorStop(0, 'transparent');
    vig.addColorStop(1, `rgba(150,12,24,${0.20 + t * 0.5})`);
    g.fillStyle = vig; g.fillRect(0, 0, VIEW_W, VIEW_H);

    const pulse = 0.5 + 0.5 * Math.abs(Math.sin(now / (150 - t * 80)));
    g.textAlign = 'center'; g.globalAlpha = pulse;
    g.fillStyle = '#ff2f42'; g.font = 'bold 30px ui-monospace, SFMono-Regular, monospace';
    g.fillText('⚠  BEACON LATTICE LOST  ⚠', VIEW_W / 2, VIEW_H * 0.22);
    g.globalAlpha = 0.6 + pulse * 0.4;
    g.font = '15px ui-monospace, monospace'; g.fillStyle = '#ff8a95';
    g.fillText(`UNCOMPENSATED HULL SHEAR — ${driftDps(depth) | 0}/s`, VIEW_W / 2, VIEW_H * 0.22 + 28);
    g.font = '13px ui-monospace, monospace'; g.fillStyle = '#ffc4ca';
    g.fillText(`${depth | 0}m OUTSIDE CHARTED SPACE — COME ABOUT`, VIEW_W / 2, VIEW_H * 0.22 + 52);
    g.globalAlpha = 1; g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
  }

  if (sysOpen) drawSystem(me);
  if (bayOpen) drawBay();
}
</script>
