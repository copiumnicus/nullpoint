<!doctype html>
<meta charset="utf-8">
<title>Nullpoint</title>
<style>
  html,body{margin:0;height:100%;background:#05070b;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair;touch-action:none}
</style>
<canvas id="c"></canvas>
<script type="module">
import { MAP_W, MAP_H, PORTAL_R, MAPS, COMPANIES } from '/shared/maps.js';
import { SLOW_RADIUS, JUMP_TIME, nearPortal, inBase, canDock, driftDepth, driftDps,
         DRIFT_MARGIN, WORLD, SIGHT_R } from '/shared/sim.js';
import { ATTRS, HULLS, resolve, slotsOf } from '/shared/ships.js';
import { EQUIPMENT, SLOTS, emptyFit, fitCount, MAX_DRONES, dronePrice,
         isCollector, collectorReach } from '/shared/gear.js';
import { levelFor, progress } from '/shared/level.js';
import { MAX_LEN, LOG_KEEP } from '/shared/chat.js';
import { FORMATIONS, FORMATION_KEYS, slots as formSlots, bonusScale } from '/shared/formation.js';
import { SYSTEMS, BOOST } from '/shared/power.js';
import { chartLayout } from '/shared/chart.js';
import { bayLayout, STORE_PAGES, fitsIn, pickerLayout, sellsAt } from '/shared/hangar.js';
import { tipFor } from '/shared/tooltip.js';
import { GAME, TOKEN_KEY, OLD_TOKEN_KEYS } from '/shared/brand.js';
import { audioReady, setThrust, laser, rocket, explosion,
         toggleAudio, toggleSfx, toggleMusic, audioOn, sfxOnly, musicOnly,
         setSfxVolume, sfxVolume, setMusicVolume, musicVolume,
         startMusic, nextTrack, musicTrack, onMusicChange, MUSIC_VOL_STEP,
         setMood, musicMood, hasMood, setPicker, setLeveller, stopMusic } from '/audio.js';
import { ALLY, FRESH, STALE } from '/shared/radar.js';
import { unpackShip, unpackBolt, unpackRocket, unpackBlast, unpackPod, unpackHit } from '/shared/net.js';
import { MATERIALS, holdVol, holdValue, SCOOP_R, CURRENCY } from '/shared/cargo.js';
import { ALIENS } from '/shared/aliens.js';
import { boltWidth } from '/shared/combat.js';
import { poolOf, moodFor, drawNext, resolveMood, levelStep,
         CALM, CHASE, COMBAT } from '/shared/music.js';
import { settingsLayout, valueAt } from '/shared/settings.js';
import { KITS, KIT_KEYS, DEFAULT_KIT, whyNotRepair, KIT_QUIET } from '/shared/repair.js';
import { AMMO, AMMO_KEYS, FEEDS, DEFAULT_AMMO, ARMED_ALL, magazine, forWeapon,
         barLayout, feedMenu } from '/shared/ammo.js';
import { PEN, PEN_SLOTS, PROPS, LABELS as DEV_LABELS } from '/shared/devmap.js';
import { ROCKET_SPEED, MAX_LAUNCHERS, isLauncher, launcherRoom } from '/shared/rockets.js';

const c = document.getElementById('c'), g = c.getContext('2d');
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;

// --- viewport: fills the window, DPR-correct --------------------------------
let VIEW_W = 0, VIEW_H = 0, MM_W = 0, MM_H = 0, MM_X = 0, MM_Y = 0;
let zoom = 1, WVW = 0, WVH = 0;   // zoom, and the world extent it makes visible
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  VIEW_W = innerWidth; VIEW_H = innerHeight;
  c.width = Math.round(VIEW_W * dpr); c.height = Math.round(VIEW_H * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);              // also resets font — re-set it
  g.font = '12px ui-monospace, SFMono-Regular, monospace';
  // never zoom IN past 1:1, but zoom out as far as a short window needs so that
  // SIGHT_R is always visible in every direction
  zoom = Math.min(1, Math.min(VIEW_W, VIEW_H) / (2 * SIGHT_R));
  WVW = VIEW_W / zoom; WVH = VIEW_H / zoom;
  MM_W = Math.min(260, VIEW_W * 0.22); MM_H = MM_W * (MAP_H / MAP_W);
  MM_X = VIEW_W - MM_W - 16; MM_Y = VIEW_H - MM_H - 16;
}
addEventListener('resize', resize); resize();
const btn    = () => ({ x: VIEW_W / 2 - 115, y: VIEW_H - 104, w: 230, h: 48 });
const sysBtn = () => ({ x: MM_X - 146, y: MM_Y + MM_H - 30, w: 136, h: 30 });
let sysOpen = false;

let myId = null, myCo = 'm', myName = '', mapId = 'm1', status = 'connecting…';
document.title = GAME;
// Carry a pilot across a rename rather than orphaning them under the old key.
const readToken = () => {
  try {
    const cur = localStorage.getItem(TOKEN_KEY);
    if (cur) return cur;
    for (const k of OLD_TOKEN_KEYS) {
      const old = localStorage.getItem(k);
      if (old) { localStorage.setItem(TOKEN_KEY, old); localStorage.removeItem(k); return old; }
    }
  } catch {}
  return '';
};
let myHull = 'hauler', myFit = emptyFit(), myGear = {}, myHulls = ['hauler'];
let power = { to: null, cap: 100, lv: { thrusters: 0, weapons: 0, shields: 0 } };
let shieldNow = 0, shieldTop = 0, myDrones = [], myXp = 0, myRank = { level: 1, into: 0, need: 1 };
let myForm = 'line', myForms = ['line'];
let myAmmo = {}, myUsing = { ...DEFAULT_AMMO }, myArmed = { ...ARMED_ALL };
let myKits = {}, myKit = DEFAULT_KIT;
let bayOpen = false;
// Blue is shields wherever it appears — the bar, the impact bubble, damage the
// shields caught, and the reactor feeding them. Thrusters take engine amber
// rather than a second blue.
const SYS_COLOUR = ['#ffffff', '#ff5c6b', '#5fd0ff'];   // thrusters, weapons, shields

const defOf = s => s.co === 'x' ? ALIENS[s.hull] : HULLS[s.hull];
const rOf   = s => defOf(s)?.r ?? 12;
const colOf = s => s.co === 'x' ? (ALIENS[s.hull]?.colour ?? '#b06adf')
                                : (COMPANIES[s.co]?.color ?? '#8899aa');
const ships = new Map();          // id -> { x,y,heading,charge, rx,ry }
let bolts = [], rockets = [], blasts = [], pods = [], numbers = [];   // rebuilt every snapshot
let snapAt = 0;                                 // when the last snapshot landed, for dead reckoning
let hold = {}, vault = {}, cargoCap = 60, credits = 0, atDock = false, scoop = null, want = null;
let invOpen = false, notice = null;
const prevShot = new Map();       // for spotting the frame a gun goes off
const prevRocket = new Map();     // and the frame a rack empties
let thrust = 0, lastFrameAt = 0, prevSelf = null;
let dead = null;                  // { lost, at } while you are a wreck
// Chat, with a console inside it. While it is open every keystroke belongs to the
// line being typed — otherwise 'h' would open the hangar mid-sentence.
let chatOpen = false, chatLine = '', amAdmin = false;
const CHAT_LINGER = 4000, CHAT_FADE = 1200;   // gone shortly after you stop typing
const chatLog = [];
// Sitting idle keeps a socket, a ship and a ticking world alive for nobody. Sign
// yourself out and the server can stop simulating entirely.
const IDLE_LIMIT = 30 * 60 * 1000;
let lastInput = performance.now(), signedOff = false;
const stir = () => { lastInput = performance.now(); };
const heardBooms = new Set();
const respawnBtn = () => ({ x: VIEW_W / 2 - 130, y: VIEW_H * 0.6, w: 260, h: 52 });
const say = (text, colour) => notice = { text, colour, at: performance.now() };

// Receipts, stacked down the right edge. A number ticking down in the corner of
// a panel is not a receipt — a refused click and a successful one looked
// identical from the outside, which is how buying outside the ring felt broken
// even when it was working.
const TOAST_LIFE = 4200, TOAST_FADE = 700, TOAST_H = 46, TOAST_W = 260, TOAST_KEEP = 5;
let toasts = [];
const toast = (what, cost, note) => {
  toasts.unshift({ what, cost, note, at: performance.now() });
  toasts = toasts.slice(0, TOAST_KEEP);
};

function drawToasts(now) {
  toasts = toasts.filter(t => now - t.at < TOAST_LIFE);
  toasts.forEach((t, i) => {
    const age = now - t.at;
    const fade = Math.min(1, age / 140) * Math.min(1, (TOAST_LIFE - age) / TOAST_FADE);
    const slide = (1 - Math.min(1, age / 180)) * 26;          // arrives from off the edge
    const x = VIEW_W - TOAST_W - 16 + slide, y = 92 + i * (TOAST_H + 8);
    const earned = t.cost < 0, sum = Math.abs(t.cost);
    g.globalAlpha = fade;
    g.fillStyle = 'rgba(6,10,16,0.93)'; g.fillRect(x, y, TOAST_W, TOAST_H);
    g.strokeStyle = earned ? '#7de08a' : '#ffd479'; g.lineWidth = 1;
    g.strokeRect(x + .5, y + .5, TOAST_W - 1, TOAST_H - 1);
    g.fillStyle = earned ? '#7de08a' : '#ffd479'; g.fillRect(x, y, 3, TOAST_H);
    g.textAlign = 'left'; g.font = '12px ui-monospace, monospace'; g.fillStyle = '#cfe4ff';
    g.fillText(t.what.length > 24 ? t.what.slice(0, 23) + '\u2026' : t.what, x + 14, y + 20);
    g.font = '10px ui-monospace, monospace'; g.fillStyle = '#66748c';
    g.fillText(t.note ?? '', x + 14, y + 35);
    g.textAlign = 'right'; g.font = '13px ui-monospace, monospace';
    g.fillStyle = earned ? '#7de08a' : '#ffd479';
    g.fillText(`${earned ? '+' : '\u2212'}${sum} ${CURRENCY.short}`, x + TOAST_W - 12, y + 22);
    g.font = '9px ui-monospace, monospace'; g.fillStyle = '#4a5568';
    g.fillText(`${credits} held`, x + TOAST_W - 12, y + 35);
    g.textAlign = 'left'; g.globalAlpha = 1;
  });
  g.font = '12px ui-monospace, monospace';
}

// What SPACE would do right now. The prompt at the bottom of the screen and the
// key itself both read this, so the screen can never offer something the key
// will not do — and stowing no longer needs the hold open to reach it.
function spaceAction() {
  const me2 = ships.get(myId);
  if (!me2 || dead) return { kind: 'none' };
  const pod = pods.filter(pd => Math.hypot(pd.x - me2.rx, pd.y - me2.ry) <= SCOOP_R)
                  .sort((a, b) => Math.hypot(a.x - me2.rx, a.y - me2.ry)
                                - Math.hypot(b.x - me2.rx, b.y - me2.ry))[0];
  if (pod) return { kind: 'scoop', pod, label: `haul in ${MATERIALS[pod.mat]?.name ?? 'cargo'}` };
  const mats = Object.keys(hold).filter(mt => (hold[mt] ?? 0) > 0);
  if (atDock && mats.length) {
    const n = mats.reduce((t, mt) => t + hold[mt], 0);
    return { kind: 'stow', mats, label: `stow ${n} of ore into the company hangar` };
  }
  if (nearPortal(MAPS[mapId], { x: me2.x, y: me2.y, jumpCd: 0 })) return { kind: 'jump', label: 'jump' };
  return { kind: 'none' };
}

// Name a track as it starts, then get out of the way — the folder it came from
// is dropped, and so is the extension, so a filename reads as a title.
onMusicChange(name => say('\u266a  ' + name.split('/').pop().replace(/\.[a-z0-9]+$/i, ''), '#8ab4e6'));
const cam = { x: 0, y: 0 };

// --- net ---------------------------------------------------------------------
// The token is the whole identity. It rides in the connect URL so the server can
// resolve the account before the first frame, with no handshake round trip.
// wss when the page came over https, or the browser refuses it as mixed content.
const WS_PROTO = location.protocol === 'https:' ? 'wss:' : 'ws:';
const ws = new WebSocket(`${WS_PROTO}//${location.host}/?t=${encodeURIComponent(readToken())}`);
const send = o => { if (ws.readyState === 1) ws.send(JSON.stringify(o)); };
ws.onopen  = () => status = 'online';
ws.onclose = () => status = 'disconnected';
ws.onmessage = e => {
  const m = JSON.parse(e.data);
  if (m.t === 'welcome') {
    myId = m.id; myCo = m.co; mapId = m.map; myHull = m.hull; myFit = m.fit;
    myGear = m.gear ?? {}; myHulls = m.hulls ?? [myHull]; credits = m.credits ?? 0;
    myDrones = m.drones ?? []; myXp = m.xp ?? 0; amAdmin = !!m.admin;
    myForm = m.formation ?? 'line'; myForms = m.formations ?? ['line'];
    myAmmo = m.ammo ?? {}; myUsing = { ...DEFAULT_AMMO, ...(m.using ?? {}) };
    myArmed = { ...ARMED_ALL, ...(m.armed ?? {}) };
    myKits = m.kits ?? {}; myKit = m.kit ?? DEFAULT_KIT;
    myName = m.name ?? '';
    if (m.token) { try { localStorage.setItem(TOKEN_KEY, m.token); } catch {} }
    return;
  }
  if (m.t === 'bumped') { status = 'signed in from another tab'; return; }
  if (m.t === 'chat') {
    chatLog.push({ from: m.from ?? '', co: m.co, text: String(m.text ?? '').slice(0, MAX_LEN), at: performance.now() });
    while (chatLog.length > LOG_KEEP) chatLog.shift();
    return;
  }
  if (m.t === 'fit') {                            // the station confirming a change
    myHull = m.hull; myFit = m.fit;
    myGear = m.gear ?? myGear;
    myHulls = m.hulls ?? myHulls;
    myDrones = m.drones ?? myDrones;
    myForm = m.formation ?? myForm; myForms = m.formations ?? myForms;
    myAmmo = m.ammo ?? myAmmo; myUsing = m.using ? { ...DEFAULT_AMMO, ...m.using } : myUsing;
    if (m.armed) myArmed = { ...ARMED_ALL, ...m.armed };
    myKits = m.kits ?? myKits; myKit = m.kit ?? myKit;
    if (typeof m.credits === 'number') credits = m.credits;
    return;
  }
  if (m.t === 'bought') {
    if (typeof m.credits === 'number') credits = m.credits;
    toast(m.what, m.cost, m.note);
    return;
  }
  if (m.t === 'award') {
    credits = m.total;
    say(m.promoted
        ? `${COMPANIES[myCo].tag} awards you ${m.amount} ${CURRENCY.short} — and promotes you to level ${m.level}`
        : `${COMPANIES[myCo].tag} awards you ${m.amount} ${CURRENCY.short}` +
          (m.xp ? ` and ${m.xp} XP` : '') + ` for a ${m.what}`,
        m.promoted ? '#7de08a' : '#ffd479');
    return;
  }
  if (m.t === 'dead')    { dead = { lost: m.lost ?? {}, at: performance.now() }; return; }
  if (m.t === 'map') {
    mapId = m.map; ships.clear(); prevShot.clear(); marker = null; prevSelf = null;
    if (m.respawned) dead = null;
    return;
  }
  if (m.t !== 's') return;
  bolts = (m.bolts ?? []).map(unpackBolt);
  rockets = (m.rockets ?? []).map(unpackRocket);
  snapAt = performance.now();
  blasts = (m.blasts ?? []).map(unpackBlast);
  {                                               // a blast is new the first time we see it low
    const self0 = ships.get(myId);
    for (const b of blasts) {
      const key = `${b.x},${b.y},${b.r}`;
      if (b.p > 0.4 || heardBooms.has(key)) continue;
      heardBooms.add(key);
      explosion(self0 ? Math.hypot(b.x - self0.x, b.y - self0.y) : 0, !!b.foe);
    }
    if (heardBooms.size > 80) heardBooms.clear();
  }
  pods = (m.pods ?? []).map(unpackPod);
  numbers = (m.hits ?? []).map(unpackHit);
  hold = m.hold ?? {}; cargoCap = m.cap ?? cargoCap;
  vault = m.vault ?? vault; credits = m.credits ?? credits;
  atDock = !!m.docked; scoop = m.scoop ?? null; want = m.want ?? null;
  myGear = m.gear ?? myGear;
  if (m.ammo) myAmmo = m.ammo;
  if (m.using) myUsing = { ...DEFAULT_AMMO, ...m.using };
  if (m.armed) myArmed = { ...ARMED_ALL, ...m.armed };
  if (m.power) power = m.power;
  if (typeof m.shieldNow === 'number') { shieldNow = m.shieldNow; shieldTop = m.shieldMax; }
  if (m.drones) myDrones = m.drones;
  if (m.rank) { myRank = m.rank; myXp = m.xp ?? myXp; }
  const seen = new Set();
  for (const raw of m.ships) {
    const n = unpackShip(raw);
    seen.add(n.id);
    const s = ships.get(n.id) ?? { rx: n.x, ry: n.y };
    Object.assign(s, n);
    ships.set(n.id, s);
  }
  const self = ships.get(myId);
  if (self) {                                    // the wire carries a flash, not a timestamp
    const wasHp = prevHp;
    if ((self.flash ?? 0) > 0 || (wasHp !== null && self.hp < wasHp)) lastHitAt = performance.now();
    prevHp = self.hp;
  }
  for (const [id, sh] of ships) {
    const was = prevShot.get(id) ?? 0;
    const d = self ? Math.hypot(sh.x - self.x, sh.y - self.y) : 1e9;
    if (sh.shot > 60 && was <= 60 && sh.vis !== STALE) laser(id === myId, d);
    const wasRk = prevRocket.get(id) ?? 0;
    if ((sh.rk ?? 0) > 60 && wasRk <= 60 && sh.vis !== STALE) rocket(id === myId, d);
    prevShot.set(id, sh.shot);
    prevRocket.set(id, sh.rk ?? 0);
  }
  for (const id of ships.keys()) if (!seen.has(id)) { ships.delete(id); prevShot.delete(id); prevRocket.delete(id); }
};

// --- input -------------------------------------------------------------------
// A tap is a destination. A hold is a throttle+heading, resent every tick because
// the ship (and the camera under the cursor) keeps moving while you hold still.
const HOLD_MS = 150, DRAG_PX = 10;
let held = false, steering = false, downAt = 0, cur = { x: 0, y: 0 }, down = { x: 0, y: 0 };
let hover = null, lastClick = { t: -1e9, x: 0, y: 0 };
let lastTab = -Infinity;          // never a double tap on the first press after load
const DOUBLE_TAP = 320;           // ms — the same window a double click uses
const PICK_SLACK = 30, DOUBLE_MS = 320, DOUBLE_PX = 26;
let marker = null;                                    // your last move order, for display

const toView = e => {
  const r = c.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (VIEW_W / r.width),
           y: (e.clientY - r.top)  * (VIEW_H / r.height) };
};
const toWorld = v => ({ x: v.x / zoom + cam.x, y: v.y / zoom + cam.y });

const docked = () => {
  const me = ships.get(myId);
  return !!me && canDock(MAPS[mapId], myCo, { x: me.x, y: me.y });
};

// Nearest hostile to a world point, within a forgiving radius. Demanding a direct
// hit on a 15px hull that is also moving made engaging anything a chore.
function hostileAt(wx, wy) {
  let best = null, bestD = Infinity;
  for (const [id, sh] of ships) {
    if (sh.co !== 'x' || sh.vis === STALE) continue;
    const d = Math.hypot(sh.rx - wx, sh.ry - wy);
    if (d < rOf(sh) + PICK_SLACK && d < bestD) { bestD = d; best = id; }
  }
  return best;
}

// Cargo is hauled in on purpose: you click it, and the tractor takes a moment.
function podAt(wx, wy) {
  let best = null, bestD = Infinity;
  for (const p of pods) {
    const d = Math.hypot(p.x - wx, p.y - wy);
    if (d < 34 && d < bestD) { bestD = d; best = p; }
  }
  return best;
}

function nearestHostile() {
  const me = ships.get(myId);
  if (!me) return null;
  let best = null, bestD = Infinity;
  for (const [id, sh] of ships) {
    if (sh.co !== 'x' || sh.vis === STALE) continue;
    const d = Math.hypot(sh.rx - me.rx, sh.ry - me.ry);
    if (d < bestD) { bestD = d; best = id; }
  }
  return best;
}
addEventListener('keydown', e => {
  audioReady();                                   // browsers want a gesture first
  setPicker(drawNext);
  setLeveller(levelStep);
  startMusic(poolOf);
  stir();

  if (chatOpen) {                                 // the line owns the keyboard
    if (e.key === 'Enter') {
      e.preventDefault();
      if (chatLine.trim()) send({ t: 'chat', text: chatLine });
      chatLine = ''; chatOpen = false;
      return;
    }
    if (e.key === 'Escape')    { e.preventDefault(); chatLine = ''; chatOpen = false; return; }
    if (e.key === 'Backspace') { e.preventDefault(); chatLine = chatLine.slice(0, -1); return; }
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      if (chatLine.length < MAX_LEN) chatLine += e.key;
    }
    return;
  }
  if (e.key === 'Enter' && !dead) { e.preventDefault(); chatOpen = true; chatLine = ''; return; }

  const k = e.key.toLowerCase();
  if (k === 'v') say(toggleAudio() ? 'Sound on' : 'Sound off', '#8ab4e6');
  if (k === 'm') { sysOpen = !sysOpen; bayOpen = false; }
  if (k === 'h') { if (picking) { picking = null; return; }        // back out of the chooser first
                   bayOpen = !bayOpen; sysOpen = false; invOpen = false; }
  if (k === '1' || k === '2' || k === '3') send({ t: 'power', sys: SYSTEMS[+k - 1] });
  if (k === 'i') { invOpen = !invOpen; sysOpen = false; bayOpen = false; }
  if (k === 'o') { setOpen = !setOpen; sysOpen = bayOpen = invOpen = false; }
  if (k === 'n') { nextTrack(); }
  if (e.key === '[' || e.key === ']') {
    const v = setMusicVolume(musicVolume() + (e.key === ']' ? MUSIC_VOL_STEP : -MUSIC_VOL_STEP));
    say(`Music ${Math.round(v * 100)}%`, '#8ab4e6');
  }
  if (k === 'q') cycleAmmo('laser');
  if (k === 'e') cycleAmmo('rocket');
  if (k === 'x') send({ t: 'target', id: 0 });     // break off
  if (e.key === 'Tab') {                          // engage the closest thing on the plot
    e.preventDefault();
    // Twice quickly is the opposite order. Engaging and breaking off are the
    // same thought, so they should be the same key rather than TAB and then X.
    const now3 = performance.now();
    if (now3 - lastTab < DOUBLE_TAP) { lastTab = 0; return send({ t: 'target', id: 0 }); }
    lastTab = now3;
    const n = nearestHostile();
    if (n !== null) send({ t: 'target', id: n });
  }
  if (k === 'k') send({ t: 'dev-damage' });        // self-damage, for watching the shield timer
  if (dead && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); send({ t: 'respawn' }); return; }
  if (e.key === ' ') {                            // one action key
    e.preventDefault();
    const act = spaceAction();
    if (act.kind === 'scoop') return send({ t: 'scoop', id: act.pod.id });
    if (act.kind === 'stow') {
      for (const mt of act.mats) send({ t: 'stash', mat: mt });
      return say(`Stowed ${act.mats.length} stack${act.mats.length === 1 ? '' : 's'}`, '#7de08a');
    }
    if (act.kind === 'jump') return send({ t: 'jump' });
    return say(atDock ? 'Hold is empty' : 'Nothing in reach', '#66748c');
  }
  if (e.key === 'Escape') {
    // Escape closes whatever is on top, and once there is nothing left to close
    // it opens the menu — which is where anything that is not flying the ship
    // ends up living.
    if (leaving()) { cancelLeaving('Staying'); return; }
    if (setOpen) { setOpen = false; return; }
    if (feedOpen) { feedOpen = null; return; }
    if (picking) { picking = null; return; }
    if (sysOpen || bayOpen || invOpen) { sysOpen = bayOpen = invOpen = false; return; }
    setOpen = true;
    return;
  }
});

c.addEventListener('pointerdown', e => {
  audioReady();
  setPicker(drawNext);
  setLeveller(levelStep);
  startMusic(poolOf);
  stir();
  if (signedOff) { location.reload(); return; }
  const v = toView(e);
  if (dead) {                                     // a wreck has exactly one control
    const b = respawnBtn();
    if (v.x > b.x && v.x < b.x + b.w && v.y > b.y && v.y < b.y + b.h) send({ t: 'respawn' });
    return;
  }
  if (leaving()) { cancelLeaving('Staying'); return; }
  if (setOpen) { settingsClick(v); return; }
  if (sysOpen) { sysOpen = false; return; }
  if (bayOpen) { bayClick(v); return; }           // click anywhere dismisses the chart
  if (invOpen) { invClick(v); return; }
  if (barClick(v)) return;                        // the ammunition bar sits over the world
  const sb = sysBtn();
  if (v.x > sb.x && v.x < sb.x + sb.w && v.y > sb.y && v.y < sb.y + sb.h) { sysOpen = true; return; }
  const b = btn();
  if (v.x > b.x && v.x < b.x + b.w && v.y > b.y && v.y < b.y + b.h) return send({ t: 'jump' });
  const w = toWorld(v);
  const pick = hostileAt(w.x, w.y);
  if (pick !== null) { lastClick = { t: performance.now(), x: v.x, y: v.y }; return send({ t: 'target', id: pick }); }
  const can = podAt(w.x, w.y);
  if (can) { lastClick = { t: performance.now(), x: v.x, y: v.y };
             marker = { x: can.x, y: can.y };        // show the course you just ordered
             return send({ t: 'scoop', id: can.id }); }

  // Double-click on empty space breaks off. Single click still just sets a course,
  // and the second click repeats that harmlessly.
  const now2 = performance.now();
  if (now2 - lastClick.t < DOUBLE_MS && Math.hypot(v.x - lastClick.x, v.y - lastClick.y) < DOUBLE_PX) {
    send({ t: 'target', id: 0 });
    lastClick.t = -1e9;
  } else lastClick = { t: now2, x: v.x, y: v.y };

  if (v.x > MM_X && v.y > MM_Y) {                     // minimap click = destination order
    marker = { x: clamp((v.x - MM_X) / MM_W * MAP_W, 0, MAP_W),
               y: clamp((v.y - MM_Y) / MM_H * MAP_H, 0, MAP_H) };   // the minimap IS charted space
    return send({ t: 'intent', mode: 'pt', x: marker.x, y: marker.y });
  }
  held = true; steering = false; downAt = performance.now(); cur = down = v;
  c.setPointerCapture(e.pointerId);
  marker = { x: v.x + cam.x, y: v.y + cam.y };
  send({ t: 'intent', mode: 'pt', x: marker.x, y: marker.y });   // instant response on tap
});
c.addEventListener('pointermove', e => {
  const v = toView(e);
  hover = v;
  if (dragging) return settingsDrag(v);                      // a fader follows the pointer
  if (held) stir();                                          // tracked always, so we can preview the pick
  if (!held) return;
  cur = v;
  if (Math.hypot(cur.x - down.x, cur.y - down.y) > DRAG_PX) steering = true;
});
c.addEventListener('pointerleave', () => hover = null);
addEventListener('pointerup', () => {
  if (held && steering) { send({ t: 'intent', mode: 'stop' }); marker = null; }
  held = false; steering = false; dragging = null;
});

setInterval(() => {                                   // flush at the server tick rate
  if (!held) return;
  if (!steering && performance.now() - downAt > HOLD_MS) steering = true;
  if (!steering) return;
  const me = ships.get(myId);
  if (!me) return;
  const dx = cur.x - (me.rx - cam.x), dy = cur.y - (me.ry - cam.y);
  const d = Math.hypot(dx, dy);
  const throttle = Math.min(1, d / SLOW_RADIUS);      // point near yourself = crawl
  marker = null;
  send(d < 1 ? { t: 'intent', mode: 'stop' }
             : { t: 'intent', mode: 'dir', dx: (dx / d) * throttle, dy: (dy / d) * throttle });
}, 1000 / 30);

// --- starfield: hashed grid, infinite, zero storage ---------------------------
const hash = (x, y, s) => {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(s, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};
const LAYERS = [
  { p: 0.30, cell:  70, size: 1.0, a: 0.45 },
  { p: 0.60, cell: 110, size: 1.7, a: 0.60 },
  { p: 1.00, cell: 190, size: 2.5, a: 0.85 },
];
function drawStars() {
  g.fillStyle = '#cfe4ff';
  LAYERS.forEach((L, li) => {
    const ox = cam.x * L.p * zoom, oy = cam.y * L.p * zoom;   // stars keep their screen size
    const cx0 = Math.floor(ox / L.cell), cx1 = Math.floor((ox + VIEW_W) / L.cell);
    const cy0 = Math.floor(oy / L.cell), cy1 = Math.floor((oy + VIEW_H) / L.cell);
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
      const b = hash(cx, cy, li * 97 + 3);
      if (b < 0.35) continue;
      g.globalAlpha = L.a * (0.35 + b * 0.65);
      g.fillRect(cx * L.cell + hash(cx, cy, li * 97 + 1) * L.cell - ox,
                 cy * L.cell + hash(cx, cy, li * 97 + 2) * L.cell - oy, L.size, L.size);
    }
  });
  g.globalAlpha = 1;
}

// --- star system chart -------------------------------------------------------
// All geometry lives in shared/chart.js so the tests verify the same router that
// draws here. This function is purely paint.
function drawSystem(me) {
  const { rects, links, stubs, NW, NH } = chartLayout(VIEW_W, VIEW_H);
  const small = NW < 104;

  g.fillStyle = 'rgba(3,5,9,0.92)'; g.fillRect(0, 0, VIEW_W, VIEW_H);

  for (const L of links) {                                  // long routing, under the nodes
    g.strokeStyle = L.own ? COMPANIES[L.own].color + '66' : 'rgba(224,90,90,0.50)';
    g.lineWidth = L.own ? 1.8 : 2.4;
    g.lineJoin = 'round';
    g.beginPath(); g.moveTo(L.pts[0][0], L.pts[0][1]);
    for (const [x, y] of L.pts.slice(1)) g.lineTo(x, y);
    g.stroke();
  }

  for (const [id, r] of rects) {
    const m = MAPS[id], here = id === mapId;
    const kx = r.w / MAP_W, ky = r.h / MAP_H;

    g.save();
    g.beginPath(); g.rect(r.x, r.y, r.w, r.h); g.clip();
    g.fillStyle = '#070b11'; g.fillRect(r.x, r.y, r.w, r.h);
    g.globalAlpha = 0.17; g.fillStyle = m.tint; g.fillRect(r.x, r.y, r.w, r.h);
    for (const [x, y, rad, col] of m.neb) {
      const cx = r.x + x * kx, cy = r.y + y * ky, rr = rad * kx;
      const grd = g.createRadialGradient(cx, cy, 0, cx, cy, rr);
      grd.addColorStop(0, col); grd.addColorStop(1, 'transparent');
      g.globalAlpha = 0.8; g.fillStyle = grd; g.fillRect(cx - rr, cy - rr, rr * 2, rr * 2);
    }
    g.globalAlpha = 0.45; g.fillStyle = '#cfe4ff';
    const sd = id.charCodeAt(0) * 31 + id.charCodeAt(1);
    for (let i = 0; i < 22; i++) g.fillRect(r.x + hash(i, 7, sd) * r.w, r.y + hash(i, 11, sd) * r.h, 1, 1);
    g.globalAlpha = 1;
    g.restore();

    for (const st of stubs) {                               // last stretch, over its own preview
      if (st.map !== id) continue;
      g.globalAlpha = 0.6; g.lineWidth = 1.2;
      g.strokeStyle = st.own ? COMPANIES[st.own].color : '#e08a8a';
      g.beginPath(); g.moveTo(st.from.x, st.from.y); g.lineTo(st.to_.x, st.to_.y); g.stroke();
      g.globalAlpha = 1;
      g.fillStyle = MAPS[st.to].tint;
      g.fillRect(st.from.x - 2.5, st.from.y - 2.5, 5, 5);
    }

    if (m.home) {
      g.fillStyle = COMPANIES[m.owner].color;
      const cx = r.x + m.base.x * kx, cy = r.y + m.base.y * ky;
      g.strokeStyle = COMPANIES[m.owner].color + '99'; g.lineWidth = 1;
      g.beginPath(); g.arc(cx, cy, m.base.r * kx, 0, 7); g.stroke();
      g.beginPath();
      g.moveTo(cx, cy - 7); g.lineTo(cx + 7, cy); g.lineTo(cx, cy + 7); g.lineTo(cx - 7, cy);
      g.closePath(); g.fill();
      g.strokeStyle = '#05070b'; g.lineWidth = 1; g.stroke();
    }
    if (here && me) {
      g.fillStyle = '#fff';
      g.beginPath(); g.arc(r.x + me.rx * kx, r.y + me.ry * ky, 3, 0, 7); g.fill();
    }

    // fill is the region's own theme; the OUTLINE is who holds it
    if (m.owner) { g.strokeStyle = COMPANIES[m.owner].color; g.lineWidth = 2; }
    else         { g.strokeStyle = '#8a94a8'; g.lineWidth = 1.4; g.setLineDash([4, 3]); }
    g.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);
    g.setLineDash([]);
    if (here) { g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.strokeRect(r.x - 3.5, r.y - 3.5, r.w + 7, r.h + 7); }

    g.textAlign = 'center';
    g.font = (small ? '10px' : '11px') + ' ui-monospace, monospace';
    g.fillStyle = here ? '#fff' : m.tint;
    g.fillText(m.name.split(' · ')[0] + (here ? '  ◂ you' : ''), r.x + r.w / 2, r.y + r.h + 14);
    g.fillStyle = '#66748c'; g.font = (small ? '9px' : '10px') + ' ui-monospace, monospace';
    g.fillText(m.theme.toUpperCase(), r.x + r.w / 2, r.y + r.h + 26);
  }

  g.textAlign = 'center'; g.fillStyle = '#8ab4e6'; g.font = '15px ui-monospace, monospace';
  g.fillText('KNOWN SPACE · STAR SYSTEM', VIEW_W / 2, 30);
  let lx = VIEW_W / 2 - 306;
  g.font = '11px ui-monospace, monospace'; g.textAlign = 'left';
  for (const [co, f] of Object.entries(COMPANIES)) {
    g.strokeStyle = f.color; g.lineWidth = 2; g.strokeRect(lx + .5, 43.5, 11, 11);
    g.fillStyle = co === myCo ? '#fff' : '#7f8ea8';
    g.fillText(`${f.tag} — ${f.name}${co === myCo ? '  ◂ you' : ''}`, lx + 18, 53);
    lx += 208;
  }
  g.strokeStyle = '#8a94a8'; g.lineWidth = 1.4; g.setLineDash([4, 3]);
  g.strokeRect(VIEW_W / 2 - 306.5, 62.5, 11, 11); g.setLineDash([]);
  g.fillStyle = '#7f8ea8';
  g.fillText('CONTESTED — no holder.   Fill colour is the region itself; the outline is who holds it.',
             VIEW_W / 2 - 288, 72);
  g.textAlign = 'center'; g.fillStyle = '#5b6b85'; g.font = '12px ui-monospace, monospace';
  g.fillText('click anywhere or press M to close', VIEW_W / 2, VIEW_H - 18);
  g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
}

// --- station: hangar and store ------------------------------------------------
// Geometry lives in one place so drawing and hit-testing can never disagree
// about where a row is. Two tabs: HANGAR arranges what you own, STORE spends
// money, paged by category so one column never holds everything at once.
let bayTab = 'hangar', bayPage = 'ships';
// Which empty slot is asking to be filled. Null unless a chooser is open.
let picking = null;

const lockerFor = slot => fitsIn(slot, { gear: myGear, fit: myFit, drones: myDrones });
const pickGeom = () => {
  if (!picking) return null;
  const G = bayGeom();
  const row = G.racks.find(r => !r.header && r.slot === picking.slot && r.index === picking.index);
  const items = lockerFor(picking.slot);
  return row && items.length ? { G, row, ...pickerLayout(G, row, items) } : null;
};

const bayGeom = () => bayLayout(VIEW_W, VIEW_H, {
  tab: bayTab, page: bayPage, hull: myHull, drones: myDrones.length,
  hulls: myHulls, formations: myForms, gear: myGear });

const shipCtx = () => ({ hull: myHull, fit: myFit, drones: myDrones, formation: myForm,
                         gear: myGear, hulls: myHulls, formations: myForms, credits });

function bayClick(v) {
  const G = bayGeom();
  const inside = r => v.x > r.x && v.x < r.x + r.w && v.y > r.y && v.y < r.y + r.h;

  // The chooser is drawn over the rows, so it must be hit-tested before them.
  // Anything outside it simply puts it away.
  const P0 = pickGeom();
  if (P0) {
    for (const { k, r } of P0.rows) if (inside(r)) {
      const to = picking;
      picking = null;
      return to.slot === 'drone' ? send({ t: 'dronefit', index: to.index, item: k })
                                 : send({ t: 'install', item: k });
    }
    picking = null;
    if (inside(P0.box)) return;
  }

  if (!inside(G.panel)) { bayOpen = false; return; }

  // Looking is free. Tabs and pages work anywhere, so you can price a rack on
  // the way home and know what to fly back for — it was refusing every click
  // when you were not docked, which also meant the panel stuck on whichever tab
  // you happened to be on when you left the ring.
  for (const t of G.tabs) if (inside(t.r)) { bayTab = t.key; picking = null; return; }
  for (const p of G.pages) if (inside(p.r)) { bayPage = p.key; return; }

  // Spending and fitting are not free.
  const atRing = docked();
  const needDock = () => (say('Fly into your base ring — only ammunition is sold out here', '#e0a53f'), true);

  if (bayTab === 'hangar') {
    for (const { k, r } of G.hulls) if (inside(r)) {
      if (k === myHull) return;
      if (!atRing) return needDock();
      return send({ t: 'hull', key: k });               // owned only in here; buying is the store's job
    }
    for (const row of G.racks) {
      if (row.header || !inside(row.r)) continue;
      if (!atRing) return needDock();
      if (row.slot === 'form') {
        if (row.key === myForm) return;
        return send({ t: 'formation', key: row.key });
      }
      if (row.slot === 'drone' && myDrones[row.index]) return send({ t: 'dronestrip', index: row.index });
      if (row.slot !== 'drone' && (myFit[row.slot] ?? [])[row.index])
        return send({ t: 'uninstall', slot: row.slot, index: row.index });
      // Empty: ask, do not guess. Guessing meant a pilot holding MK-Vs got MK-Is.
      const stock = lockerFor(row.slot);
      if (!stock.length) return say(row.slot === 'drone' ? 'Nothing in the locker to mount — buy one in the store'
                                                        : `Nothing in the locker for a ${row.slot} slot — buy one in the store`,
                                    '#8ab4e6');
      if (stock.length === 1) return row.slot === 'drone' ? send({ t: 'dronefit', index: row.index, item: stock[0] })
                                                          : send({ t: 'install', item: stock[0] });
      picking = { slot: row.slot, index: row.index };
      return;
    }
    return;
  }

  for (const it of G.store) {
    if (!inside(it.r)) continue;
    if (!sellsAt(bayPage, atRing)) return needDock();
    if (it.kind === 'hull') {
      if (it.owned) return it.k === myHull ? undefined : send({ t: 'hull', key: it.k });
      return credits >= HULLS[it.k].price ? send({ t: 'buyhull', key: it.k })
        : say(`A ${HULLS[it.k].name} costs ${HULLS[it.k].price} ${CURRENCY.short}`, '#e0a53f');
    }
    if (it.kind === 'form') {
      if (it.owned) return it.k === myForm ? undefined : send({ t: 'formation', key: it.k });
      return credits >= FORMATIONS[it.k].price ? send({ t: 'buyformation', key: it.k })
        : say(`${FORMATIONS[it.k].name} costs ${FORMATIONS[it.k].price} ${CURRENCY.short}`, '#e0a53f');
    }
    if (it.kind === 'drone') {
      const cost = dronePrice(myDrones.length);
      return credits >= cost ? send({ t: 'buydrone' })
        : say(`A drone costs ${cost} ${CURRENCY.short}`, '#e0a53f');
    }
    if (it.kind === 'ammo') {
      const a = AMMO[it.k];
      return credits >= a.price ? send({ t: 'buyammo', key: it.k, n: 1 })
        : say(`A crate of ${a.name} costs ${a.price} ${CURRENCY.short}`, '#e0a53f');
    }
    if (it.kind === 'kit') {
      const k = KITS[it.k];
      return credits >= k.price ? send({ t: 'buykit', key: it.k })
        : say(`A ${k.name} costs ${k.price} ${CURRENCY.short}`, '#e0a53f');
    }
    return credits >= EQUIPMENT[it.k].price ? send({ t: 'buy', item: it.k })
      : say(`Not enough credits for a ${EQUIPMENT[it.k].name}`, '#e0a53f');
  }
}

const fmt = v => Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 10) / 10;

// The one number that tells you which of two lockers items you want, without
// opening a tooltip: what it is for, not everything it does.
const headline = k => {
  const e = EQUIPMENT[k];
  const pick = a => e.mods.find(([n]) => n === a);
  const m = pick(e.kind === 'rocket' ? 'rockets' : e.slot === 'weapon' ? 'damage'
              : e.slot === 'generator' ? 'shield' : null) ?? e.mods[0];
  if (!m) return '';
  const [attr, op, v] = m;
  return op === 'mul' ? `${ATTRS[attr].label} ${v > 0 ? '+' : ''}${Math.round(v * 100)}%`
       : attr === 'rockets' ? `${v} rocket${v === 1 ? '' : 's'}`
       : `${v > 0 ? '+' : ''}${fmt(v)} ${ATTRS[attr].label.toLowerCase()}`;
};

// A framed box of real numbers, placed beside the cursor and nudged back on
// screen at the edges. This is the only place the effect of a module is stated
// exactly — a blurb reads well and tells you nothing.
function drawTip(tip, at) {
  if (!tip) return;
  g.font = '11px ui-monospace, monospace';
  const lines = tip.lines.slice(0, 12);
  const cut = tip.lines.length - lines.length;
  const widest = Math.max(g.measureText(tip.title).width + 90,
                          g.measureText(tip.blurb ?? '').width,
                          g.measureText(tip.note ?? '').width,
                          ...lines.map(l => g.measureText(`${l.label}  ${l.from} → ${l.to}${l.unit}`).width + 54));
  const w = Math.min(340, Math.max(190, widest + 24));
  const h = 40 + (tip.blurb ? 15 : 0) + lines.length * 15 + (cut ? 14 : 0) + (tip.note ? 20 : 0);
  const x = Math.min(at.x + 18, VIEW_W - w - 8), y = Math.min(at.y + 14, VIEW_H - h - 8);

  g.fillStyle = 'rgba(6,10,16,0.97)'; g.fillRect(x, y, w, h);
  g.strokeStyle = '#3d5876'; g.lineWidth = 1; g.strokeRect(x + .5, y + .5, w - 1, h - 1);

  let ty = y + 19;
  g.textAlign = 'left'; g.fillStyle = '#cfe4ff'; g.font = '12px ui-monospace, monospace';
  g.fillText(tip.title, x + 10, ty);
  if (tip.price) { g.textAlign = 'right'; g.fillStyle = credits >= tip.price ? '#ffd479' : '#7a6a45';
                   g.fillText(`${tip.price} ${CURRENCY.short}`, x + w - 10, ty); g.textAlign = 'left'; }
  ty += 14;
  g.font = '10px ui-monospace, monospace'; g.fillStyle = '#66748c';
  g.fillText(tip.sub ?? '', x + 10, ty); ty += tip.blurb ? 15 : 6;
  if (tip.blurb) { g.fillStyle = '#8ea3bd'; g.fillText(tip.blurb, x + 10, ty); ty += 8; }

  g.font = '11px ui-monospace, monospace';
  for (const l of lines) {
    ty += 15;
    g.fillStyle = '#7b8ba3'; g.fillText(l.label, x + 10, ty);
    g.textAlign = 'right';
    g.fillStyle = '#66748c'; g.fillText(String(l.from), x + w - 96, ty);
    g.fillStyle = '#3d4757'; g.fillText('→', x + w - 84, ty);
    g.fillStyle = l.good ? '#7de08a' : '#e07a7a';
    g.fillText(`${l.to}${l.unit}`, x + w - 44, ty);
    if (l.pct !== null) { g.font = '10px ui-monospace, monospace';
                          g.fillText(`${l.pct > 0 ? '+' : ''}${l.pct}%`, x + w - 10, ty);
                          g.font = '11px ui-monospace, monospace'; }
    g.textAlign = 'left';
  }
  if (cut) { ty += 14; g.fillStyle = '#4a5568'; g.font = '10px ui-monospace, monospace';
             g.fillText(`+${cut} more`, x + 10, ty); }
  if (tip.note) { ty += 18; g.fillStyle = '#5b6b85'; g.font = '10px ui-monospace, monospace';
                  g.fillText(tip.note, x + 10, ty); }
  g.font = '11px ui-monospace, monospace';
}

function drawBay() {
  const G = bayGeom(), P = G.panel;
  const stats = resolve(myHull, myFit, myDrones, myForm), bare = resolve(myHull, emptyFit());
  const home = docked();
  const at = hover && hover.x > P.x && hover.x < P.x + P.w && hover.y > P.y && hover.y < P.y + P.h ? hover : null;
  const over = r => at && at.x > r.x && at.x < r.x + r.w && at.y > r.y && at.y < r.y + r.h;
  let tip = null;

  g.fillStyle = 'rgba(3,5,9,0.92)'; g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.fillStyle = 'rgba(8,12,19,0.98)'; g.fillRect(P.x, P.y, P.w, P.h);
  g.strokeStyle = '#2c3d55'; g.lineWidth = 1; g.strokeRect(P.x + .5, P.y + .5, P.w - 1, P.h - 1);

  g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
  for (const t of G.tabs) {
    const on = t.key === G.tab;
    g.fillStyle = on ? 'rgba(90,150,220,0.18)' : 'rgba(255,255,255,0.02)';
    g.fillRect(t.r.x, t.r.y, t.r.w, t.r.h);
    g.strokeStyle = on ? '#7fd4ff' : '#2c3d55'; g.lineWidth = on ? 1.6 : 1;
    g.strokeRect(t.r.x + .5, t.r.y + .5, t.r.w - 1, t.r.h - 1);
    g.fillStyle = on ? '#cfe4ff' : '#66748c'; g.textAlign = 'center';
    g.fillText(t.name, t.r.x + t.r.w / 2, t.r.y + t.r.h / 2 + 4);
  }
  g.textAlign = 'right'; g.font = '13px ui-monospace, monospace'; g.fillStyle = '#ffd479';
  g.fillText(`${credits} ${CURRENCY.short}`, P.x + P.w - 20, P.y + 32);
  g.textAlign = 'left'; g.font = '11px ui-monospace, monospace';
  g.fillStyle = home ? '#66748c' : '#e0a53f';
  g.fillText(home ? 'docked — every change takes effect at once'
           : MAPS[mapId].dev ? 'fly into the workshop ring to outfit'
                             : 'out here you can buy ammunition — the rest needs a dock',
             P.x + 236, P.y + 32);

  // a live stat line, so the effect of a click is visible immediately
  let sx = P.x + 20;
  for (const k of ['hull', 'shield', 'damage', 'speed', 'capacitor']) {
    const d = stats[k] - bare[k];
    g.fillStyle = '#66748c'; g.fillText(ATTRS[k].label.toUpperCase(), sx, P.y + 62);
    g.fillStyle = '#cfe4ff'; g.font = '13px ui-monospace, monospace';
    g.fillText(String(Math.round(stats[k])), sx, P.y + 78);
    if (Math.abs(d) > 0.01) {
      g.fillStyle = (ATTRS[k].better === 'high') === (d > 0) ? '#7de08a' : '#e07a7a';
      g.font = '10px ui-monospace, monospace';
      g.fillText(`${d > 0 ? '+' : ''}${Math.round(d)}`, sx + 44, P.y + 78);
    }
    g.font = '11px ui-monospace, monospace';
    sx += G.colW * 0.62;
  }

  const pct = v => `${v > 0 ? '+' : ''}${Math.round(v * 100)}%`;
  const SHORT = { damage: 'dmg', hull: 'hull', shield: 'shld', speed: 'spd', accel: 'acc' };

  if (G.tab === 'hangar') {
    g.globalAlpha = home ? 1 : 0.45;               // look all you like; fitting needs the ring
    g.fillStyle = '#5b6b85';
    g.fillText('YOUR SHIPS', P.x + 20, G.top - 10);
    g.fillText(`RACKS  ${fitCount(myFit)}/${SLOTS.reduce((n, s2) => n + slotsOf(myHull)[s2], 0)}`,
               P.x + 30 + G.colW, G.top - 10);
    g.fillText('ESCORT', P.x + 40 + G.colW * 2, G.top - 10);

    for (const { k, r } of G.hulls) {
      const H = HULLS[k], on = k === myHull, sl = slotsOf(k);
      if (over(r) && !on) tip = tipFor('hull', k, shipCtx());
      g.fillStyle = on ? 'rgba(90,150,220,0.16)' : over(r) ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.03)';
      g.fillRect(r.x, r.y, r.w, r.h);
      g.strokeStyle = on ? '#7fd4ff' : '#2c3d55'; g.lineWidth = on ? 1.6 : 1;
      g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);
      g.fillStyle = COMPANIES[myCo].color;
      g.fillRect(r.x + 16 - H.r / 2, r.y + r.h / 2 - H.r / 2, H.r, H.r);
      g.fillStyle = on ? '#fff' : '#93a3b5'; g.font = '12px ui-monospace, monospace';
      g.fillText(H.name, r.x + 36, r.y + 20);
      g.fillStyle = '#66748c'; g.font = '10px ui-monospace, monospace';
      g.fillText(`${H.cls}   W${sl.weapon} G${sl.generator} T${sl.tech}   ${H.attrs.hull} hull  ` +
                 `${H.attrs.cargo} hold`, r.x + 36, r.y + 35);
      if (on) { g.fillStyle = '#7fd4ff'; g.textAlign = 'right';
                g.fillText('FLYING', r.x + r.w - 10, r.y + 20); g.textAlign = 'left'; }
      g.font = '11px ui-monospace, monospace';
    }

    for (const row of G.racks) {
      const r = row.r;
      if (row.header) {
        g.fillStyle = '#3d4757'; g.font = '10px ui-monospace, monospace';
        g.fillText(row.slot === 'drone' ? `DRONE BAYS  ${myDrones.length}/${MAX_DRONES}`
                 : row.slot === 'form'  ? `FORMATION${myDrones.length ? '' : '  (needs drones)'}`
                                        : row.slot.toUpperCase(),
                   r.x + 2, r.y + r.h - 4);
        g.font = '11px ui-monospace, monospace';
        continue;
      }
      if (row.slot === 'form') {
        const F = FORMATIONS[row.key], flying = row.key === myForm;
        if (over(r)) tip = tipFor('form', row.key, shipCtx());
        g.fillStyle = flying ? 'rgba(125,224,138,0.12)' : over(r) ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.02)';
        g.fillRect(r.x, r.y, r.w, r.h);
        g.strokeStyle = flying ? '#7de08a' : '#2c3d55'; g.lineWidth = 1;
        g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);
        const mid = r.y + r.h / 2 + 4;
        g.fillStyle = flying ? '#cfe4ff' : '#8ea3bd';
        g.fillText(F.name, r.x + 10, mid);
        g.textAlign = 'right';
        g.fillStyle = flying ? '#7de08a' : '#66748c';
        g.fillText(flying ? 'FLYING' : 'fly it', r.x + r.w - 10, mid);
        g.textAlign = 'left';
        // What this escort would really deliver, not the brochure number.
        const k = bonusScale(myDrones.length);
        const nameW = g.measureText(F.name).width;
        g.font = '10px ui-monospace, monospace';
        const mx = r.x + 20 + nameW, room = r.x + r.w - 60 - mx;
        const forms = F.mods.length
          ? [F.mods.map(([a, , v]) => `${SHORT[a] ?? a} ${pct(v * k)}`).join('  '),
             F.mods.map(([a, , v]) => `${SHORT[a] ?? a}${pct(v * k)}`).join(' '), '']
          : ['no effect', ''];
        g.fillStyle = '#66748c';
        g.fillText(forms.find(t => g.measureText(t).width <= room) ?? '', mx, mid);
        g.font = '11px ui-monospace, monospace';
        continue;
      }
      const held = row.slot === 'drone' ? myDrones[row.index] : (myFit[row.slot] ?? [])[row.index];
      const item = EQUIPMENT[held];
      const stock = item ? [] : lockerFor(row.slot);
      if (over(r) && held) tip = tipFor('item', held, shipCtx());
      else if (over(r) && stock.length === 1) {
        tip = tipFor('item', stock[0], shipCtx());
        tip = tip && { ...tip, note: 'the only thing in your locker that fits — click to bolt it on' };
      }
      g.fillStyle = item ? 'rgba(125,224,138,0.12)' : over(r) ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.02)';
      g.fillRect(r.x, r.y, r.w, r.h);
      g.strokeStyle = item ? '#7de08a' : '#2c3d55'; g.lineWidth = 1;
      if (!item) g.setLineDash([3, 3]);
      g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1); g.setLineDash([]);
      let tx = r.x + 10;
      if (row.slot === 'drone') { g.fillStyle = COMPANIES[myCo].color;
                                  g.fillRect(r.x + 8, r.y + r.h / 2 - 3, 6, 6); tx = r.x + 22; }
      g.fillStyle = item ? '#cfe4ff' : '#3d4757';
      g.fillText(item ? item.name : row.slot === 'drone' ? 'empty bay' : 'empty', tx, r.y + r.h / 2 + 4);
      if (!item && stock.length) { g.fillStyle = '#4d6a45'; g.textAlign = 'right';
                                   g.fillText(stock.length === 1 ? 'fit ' + EQUIPMENT[stock[0]].name
                                                                 : `choose  (${stock.length})`,
                                              r.x + r.w - 10, r.y + r.h / 2 + 4);
                                   g.textAlign = 'left'; }
      if (item) { g.fillStyle = '#66748c'; g.textAlign = 'right';
                  g.fillText('remove', r.x + r.w - 10, r.y + r.h / 2 + 4); g.textAlign = 'left'; }
    }

    g.globalAlpha = 1;
    g.fillStyle = '#5b6b85';
    g.fillText(home ? 'click an empty slot to choose what goes in it · a filled slot to strip it · H or Esc to close'
                    : 'looking only — fitting needs your base ring · ammunition is sold anywhere',
               P.x + 20, P.y + P.h - 18);
    g.font = '12px ui-monospace, monospace';

    const pick = pickGeom();
    if (pick) {
      const B = pick.box;
      g.fillStyle = 'rgba(4,7,12,0.97)'; g.fillRect(B.x, B.y, B.w, B.h);
      g.strokeStyle = '#5a86b8'; g.lineWidth = 1.4; g.strokeRect(B.x + .5, B.y + .5, B.w - 1, B.h - 1);
      for (const { k, r } of pick.rows) {
        const e = EQUIPMENT[k], hot = over(r);
        if (hot) tip = tipFor('item', k, shipCtx());
        g.fillStyle = hot ? 'rgba(122,180,240,0.16)' : 'rgba(255,255,255,0.03)';
        g.fillRect(r.x, r.y, r.w, r.h);
        g.fillStyle = hot ? '#eaf3ff' : '#cfe4ff'; g.font = '12px ui-monospace, monospace';
        g.fillText(e.name, r.x + 10, r.y + r.h / 2 + 4);
        g.textAlign = 'right';
        g.fillStyle = '#7de08a'; g.font = '11px ui-monospace, monospace';
        g.fillText(`x${myGear[k] ?? 0}`, r.x + r.w - 10, r.y + r.h / 2 + 4);
        g.fillStyle = '#66748c'; g.font = '10px ui-monospace, monospace';
        g.fillText(headline(k), r.x + r.w - 46, r.y + r.h / 2 + 4);
        g.textAlign = 'left'; g.font = '11px ui-monospace, monospace';
      }
    }
    drawTip(tip, at ?? { x: 0, y: 0 });
    return;
  }

  // --- store ---------------------------------------------------------------
  g.fillStyle = '#5b6b85';
  g.fillText('DEPARTMENT', P.x + 20, G.top - 10);
  g.fillText(STORE_PAGES.find(p => p.key === G.page)?.hint ?? '', P.x + 30 + G.pages[0].r.w, G.top - 10);

  for (const p of G.pages) {
    const on = p.key === G.page, r = p.r;
    // Dimmed means "not from here" — the page still opens, so you can price
    // things on the way home.
    g.globalAlpha = sellsAt(p.key, home) ? 1 : 0.4;
    g.fillStyle = on ? 'rgba(90,150,220,0.16)' : over(r) ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.02)';
    g.fillRect(r.x, r.y, r.w, r.h);
    g.strokeStyle = on ? '#7fd4ff' : '#2c3d55'; g.lineWidth = on ? 1.6 : 1;
    g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);
    g.fillStyle = on ? '#cfe4ff' : '#8ea3bd'; g.font = '12px ui-monospace, monospace';
    g.fillText(p.name, r.x + 12, r.y + r.h / 2 + 4);
    g.font = '11px ui-monospace, monospace'; g.globalAlpha = 1;
  }

  for (const it of G.store) {
    const r = it.r;
    const price = it.kind === 'hull' ? HULLS[it.k].price
                : it.kind === 'form' ? FORMATIONS[it.k].price
                : it.kind === 'drone' ? dronePrice(myDrones.length)
                : it.kind === 'ammo' ? AMMO[it.k].price
                : it.kind === 'kit' ? KITS[it.k].price
                                      : EQUIPMENT[it.k].price;
    const name = it.kind === 'hull' ? HULLS[it.k].name
               : it.kind === 'form' ? FORMATIONS[it.k].name
               : it.kind === 'drone' ? `Drone ${myDrones.length + 1}`
               : it.kind === 'ammo' ? `${AMMO[it.k].name}   crate of ${AMMO[it.k].pack}`
               : it.kind === 'kit' ? KITS[it.k].name
                                     : EQUIPMENT[it.k].name;
    const blurb = it.kind === 'hull' ? `${HULLS[it.k].cls}   W${slotsOf(it.k).weapon} G${slotsOf(it.k).generator} T${slotsOf(it.k).tech}`
                : it.kind === 'form' ? FORMATIONS[it.k].blurb
                : it.kind === 'drone' ? 'Flies escort. One slot, anything you like in it.'
                : it.kind === 'ammo' ? `${AMMO[it.k].blurb}   x${AMMO[it.k].mult.toFixed(2)} damage`
                : it.kind === 'kit' ? `${KITS[it.k].blurb}   +${Math.round(KITS[it.k].heal * 100)}% hull over ${KITS[it.k].secs}s`
                                      : EQUIPMENT[it.k].blurb;
    const afford = credits >= price;
    const sells = sellsAt(G.page, home);
    if (over(r)) tip = tipFor(it.kind, it.k, shipCtx());

    g.globalAlpha = (it.owned || afford ? 1 : 0.5) * (sells ? 1 : 0.45);
    g.fillStyle = it.owned ? 'rgba(125,224,138,0.10)' : over(r) ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.03)';
    g.fillRect(r.x, r.y, r.w, r.h);
    g.strokeStyle = it.owned ? '#2c3d55' : afford ? '#3d5876' : '#2c3d55'; g.lineWidth = 1;
    g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);
    g.fillStyle = '#cfe4ff'; g.font = '12px ui-monospace, monospace';
    g.fillText(name, r.x + 12, r.y + 20);
    g.fillStyle = '#66748c'; g.font = '10px ui-monospace, monospace';
    g.fillText(blurb, r.x + 12, r.y + 35);
    g.textAlign = 'right';
    if (it.owned) { g.fillStyle = '#7de08a'; g.font = '11px ui-monospace, monospace';
                    g.fillText((it.kind === 'hull' ? it.k === myHull : it.k === myForm) ? 'FLYING' : 'owned — fly it',
                               r.x + r.w - 12, r.y + 20); }
    else { g.fillStyle = afford ? '#ffd479' : '#7a6a45'; g.font = '11px ui-monospace, monospace';
           g.fillText(`${price} ${CURRENCY.short}`, r.x + r.w - 12, r.y + 20); }
    const stock = it.kind === 'item' ? (myGear[it.k] ?? 0)
                : it.kind === 'ammo' ? (myAmmo[it.k] ?? 0)
                : it.kind === 'kit' ? (myKits[it.k] ?? 0) : 0;
    if (stock) { g.fillStyle = '#7de08a'; g.font = '10px ui-monospace, monospace';
                 g.fillText(it.kind === 'ammo' ? `${stock} rounds held`
                          : it.kind === 'kit' ? `${stock} aboard` : `${stock} in locker`,
                            r.x + r.w - 12, r.y + 35); }
    g.textAlign = 'left'; g.globalAlpha = 1; g.font = '11px ui-monospace, monospace';
  }

  g.fillStyle = '#5b6b85';
  g.fillText('hover for exact numbers · click to buy · fit it in the HANGAR tab · H or Esc to close',
             P.x + 20, P.y + P.h - 18);
  g.font = '12px ui-monospace, monospace';
  drawTip(tip, at ?? { x: 0, y: 0 });
}

// --- inventory / company hangar -----------------------------------------------
// Left is what the ship is carrying, right is what the company holds for you.
// Transfer only works at the dock, because the hangar is theirs, not yours.
function invGeom() {
  const w = Math.min(820, VIEW_W - 60), h = Math.min(440, VIEW_H - 60);
  const x = (VIEW_W - w) / 2, y = (VIEW_H - h) / 2;
  const colW = (w - 60) / 2, top = y + 92;
  const rows = (obj, cx) => Object.keys(obj).map((mat, i) =>
    ({ mat, r: { x: cx, y: top + i * 40, w: colW, h: 34 } }));
  return { panel: { x, y, w, h }, colW, top,
           ship: rows(hold, x + 20), bank: rows(vault, x + 40 + colW),
           all: { x: x + 20, y: y + h - 56, w: 190, h: 40 } };
}

function invClick(v) {
  const G = invGeom();
  const inside = r => v.x > r.x && v.x < r.x + r.w && v.y > r.y && v.y < r.y + r.h;
  if (!inside(G.panel)) { invOpen = false; return; }
  if (!atDock) return;                              // browsing is free, moving cargo is not
  for (const { mat, r } of G.ship) if (inside(r)) return send({ t: 'stash', mat });
  for (const { mat, r } of G.bank) if (inside(r)) {
    // right half of the row sells, left half loads it back onto the ship
    if (v.x > r.x + r.w * 0.62) return send({ t: 'sell', mat, n: vault[mat] });
    return send({ t: 'load', mat });
  }
  if (inside(G.all)) for (const mat of Object.keys(hold)) send({ t: 'stash', mat });
}

function stack(r, mat, n, live) {
  const M = MATERIALS[mat];
  g.fillStyle = live ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.02)';
  g.fillRect(r.x, r.y, r.w, r.h);
  g.strokeStyle = (M?.colour ?? '#9aa3ad') + (live ? 'aa' : '44'); g.lineWidth = 1;
  g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);
  g.fillStyle = M?.colour ?? '#9aa3ad';
  g.fillRect(r.x + 10, r.y + 6, 22, 22);
  g.fillStyle = '#0a0e14'; g.font = 'bold 12px ui-monospace, monospace'; g.textAlign = 'center';
  g.fillText(M?.sym ?? '?', r.x + 21, r.y + 21);
  g.textAlign = 'left';
  g.fillStyle = '#cfe4ff'; g.font = '12px ui-monospace, monospace';
  g.fillText(M?.name ?? mat, r.x + 42, r.y + 15);
  g.fillStyle = '#66748c'; g.font = '10px ui-monospace, monospace';
  g.fillText(`T${M?.tier ?? '?'} · ${M?.value ?? 0} ${CURRENCY.short} · ${M?.vol ?? 1} vol · ${M?.density ?? '?'} g/cm³`,
             r.x + 42, r.y + 27);
  g.fillStyle = '#fff'; g.font = '14px ui-monospace, monospace'; g.textAlign = 'right';
  g.fillText('×' + n, r.x + r.w - 12, r.y + 22);
  g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
}

function drawInventory() {
  const G = invGeom(), P = G.panel, vol = holdVol(hold);
  g.fillStyle = 'rgba(3,5,9,0.92)'; g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.fillStyle = 'rgba(8,12,19,0.98)'; g.fillRect(P.x, P.y, P.w, P.h);
  g.strokeStyle = '#2c3d55'; g.lineWidth = 1; g.strokeRect(P.x + .5, P.y + .5, P.w - 1, P.h - 1);

  g.font = '15px ui-monospace, monospace'; g.fillStyle = '#8ab4e6';
  g.fillText('INVENTORY', P.x + 20, P.y + 32);
  g.font = '13px ui-monospace, monospace'; g.fillStyle = '#ffd479'; g.textAlign = 'right';
  g.fillText(`${credits} ${CURRENCY.short}`, P.x + P.w - 20, P.y + 32);
  g.textAlign = 'left'; g.font = '11px ui-monospace, monospace';
  g.fillStyle = atDock ? '#66748c' : '#e0a53f';
  g.fillText(atDock ? 'docked — click a stack to move it the other way'
                    : 'you can look, but transfers happen at your home base', P.x + 20, P.y + 52);

  g.fillStyle = '#5b6b85'; g.font = '11px ui-monospace, monospace';
  g.fillText(`SHIP HOLD   ${vol}/${cargoCap}` + (vol ? `   ${holdValue(hold)} ${CURRENCY.short}` : '') +
             (atDock ? '   → click to stow' : ''), P.x + 20, G.top - 12);
  g.fillText('COMPANY HANGAR   unlimited' + (atDock ? '   → left half loads, right half sells' : ''),
             P.x + 40 + G.colW, G.top - 12);

  if (!G.ship.length) { g.fillStyle = '#3d4757'; g.fillText('empty', P.x + 20, G.top + 18); }
  for (const { mat, r } of G.ship) stack(r, mat, hold[mat], atDock);
  if (!G.bank.length) { g.fillStyle = '#3d4757'; g.fillText('nothing stored yet', P.x + 40 + G.colW, G.top + 18); }
  for (const { mat, r } of G.bank) {
    stack(r, mat, vault[mat], atDock);
    if (!atDock) continue;
    const M = MATERIALS[mat];
    g.fillStyle = 'rgba(255,212,121,0.10)';
    g.fillRect(r.x + r.w * 0.62, r.y + 1, r.w * 0.38 - 1, r.h - 2);
    g.fillStyle = '#ffd479'; g.textAlign = 'center'; g.font = '10px ui-monospace, monospace';
    g.fillText(`SELL ${vault[mat] * M.value} ${CURRENCY.short}`, r.x + r.w * 0.81, r.y + r.h / 2 + 4);
    g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
  }

  if (G.ship.length) {
    const A = G.all;
    g.globalAlpha = atDock ? 1 : 0.35;
    g.fillStyle = 'rgba(125,224,138,0.14)'; g.fillRect(A.x, A.y, A.w, A.h);
    g.strokeStyle = '#7de08a'; g.lineWidth = 1.3; g.strokeRect(A.x + .5, A.y + .5, A.w - 1, A.h - 1);
    g.fillStyle = '#7de08a'; g.textAlign = 'center';
    g.fillText('STOW EVERYTHING', A.x + A.w / 2, A.y + 18);
    g.fillStyle = '#4d7a55'; g.font = '10px ui-monospace, monospace';
    g.fillText('or press SPACE', A.x + A.w / 2, A.y + 29);
    g.font = '12px ui-monospace, monospace';
    g.textAlign = 'left'; g.globalAlpha = 1;
  }
  g.fillStyle = '#5b6b85'; g.font = '11px ui-monospace, monospace';
  g.fillText('I or Esc to close', P.x + P.w - 130, P.y + P.h - 30);
  g.font = '12px ui-monospace, monospace';
}

// --- settings -----------------------------------------------------------------
// Sound and music on separate faders, because writing music for the game means
// wanting the game running and the game silent at the same time.
let setOpen = false, dragging = null;

// Two questions, not one. Are you shooting at something — and is something
// shooting at you? Both at once is a fight; only the second is a chase, which is
// what crossing a map with a drifter on your tail actually is. How long either
// verdict is held is moodFor's problem, in shared/music.js, with the tests on it.
let moodHeld = { mood: CALM, until: 0 };

function fightState() {
  const me = ships.get(myId);
  if (!me || dead) return {};
  let hunted = (me.flash ?? 0) > 0;             // something just landed on your shields
  if (!hunted) for (const s of ships.values())
    if (s.co === 'x' && s.tgt === myId) { hunted = true; break; }
  return { fighting: !!me.tgt, hunted };
}

// Every frame. Cheap, and setMood ignores anything that is not a change.
function stirMusic(now) {
  moodHeld = moodFor(fightState(), now, moodHeld);
  setMood(resolveMood(moodHeld.mood, hasMood));   // a mood with no folder borrows one
}

const busOn = key => key === 'master' ? audioOn() : key === 'sfx' ? sfxOnly() : musicOnly();
const busVol = key => key === 'sfx' ? sfxVolume() : musicVolume();
const setVol = (key, v) => key === 'sfx' ? setSfxVolume(v) : setMusicVolume(v);
const flipBus = key => key === 'master' ? toggleAudio() : key === 'sfx' ? toggleSfx() : toggleMusic();

function settingsClick(v) {
  const L = settingsLayout(VIEW_W, VIEW_H);
  const inside = r => v.x > r.x && v.x < r.x + r.w && v.y > r.y && v.y < r.y + r.h;
  if (!inside(L.panel)) { setOpen = false; return; }
  if (inside(L.skip)) return nextTrack();
  for (const row of L.rows) {
    if (inside(row.toggle)) {
      const now = flipBus(row.key);
      return say(`${row.label} ${now ? 'on' : 'muted'}`, now ? '#7de08a' : '#e0a53f');
    }
    if (row.hit && inside(row.hit)) {
      setVol(row.key, valueAt(row.track, v.x));
      dragging = row.key;                          // keep following the pointer
      return;
    }
  }
  for (const a of L.actions) if (inside(a.r)) {
    if (a.key === 'signout') { setOpen = false; askToSignOut(); }
    return;
  }
}

// Signing out is a ten second stand-down, not a switch. Something shooting at
// you cancels it, and so does changing your mind — otherwise a misclick puts
// your ship on the floor of a sector with a drifter on it.
const SIGNOUT_WAIT = 10_000;
let leavingAt = 0;

const leaving = () => leavingAt > 0;
const cancelLeaving = why => {
  if (!leaving()) return;
  leavingAt = 0;
  if (why) say(why, '#e0a53f');
};

function askToSignOut() {
  if (signedOff || leaving()) return;
  const st = fightState();
  if (st.fighting || st.hunted) return say('Not while something is shooting at you', '#e0a53f');
  leavingAt = performance.now() + SIGNOUT_WAIT;
}

// Releases the sector and the socket. The token stays in local storage, so this
// is putting the ship down rather than giving it away — a click brings you back
// to the same pilot, which is what the idle timeout already did quietly.
function signOut() {
  if (signedOff) return;
  signedOff = true;
  leavingAt = 0;
  stopMusic();                                  // silence, not a score over a dead screen
  try { ws.close(4002, 'signed out'); } catch {}
  status = 'signed out';
}

// Counts down, and gives up the moment a fight starts. Deliberately on
// performance.now rather than the frame timestamp: leavingAt is set from that
// clock, and the two are only the same clock by convention.
function stepSignOut() {
  if (!leaving()) return;
  const st = fightState();
  if (st.fighting || st.hunted) return cancelLeaving('Sign-out cancelled — you are under fire');
  if (performance.now() >= leavingAt) signOut();
}

function drawLeaving() {
  if (!leaving()) return;
  const now = performance.now();
  const left = Math.max(0, Math.ceil((leavingAt - now) / 1000));
  const w = 300, h = 96, x = (VIEW_W - w) / 2, y = VIEW_H / 2 - 140;
  g.fillStyle = 'rgba(6,10,16,0.94)'; g.fillRect(x, y, w, h);
  g.strokeStyle = '#e0a53f'; g.lineWidth = 1.4; g.strokeRect(x + .5, y + .5, w - 1, h - 1);
  g.textAlign = 'center';
  g.font = '12px ui-monospace, monospace'; g.fillStyle = '#8ea3bd';
  g.fillText('SIGNING OUT', x + w / 2, y + 26);
  g.font = '34px ui-monospace, monospace'; g.fillStyle = '#e0a53f';
  g.fillText(String(left), x + w / 2, y + 62);
  g.font = '11px ui-monospace, monospace'; g.fillStyle = '#5b6b85';
  g.fillText('Esc or click to stay', x + w / 2, y + 82);
  const p = 1 - Math.max(0, (leavingAt - now) / SIGNOUT_WAIT);
  g.fillStyle = 'rgba(224,165,63,0.5)'; g.fillRect(x, y + h - 3, w * p, 3);
  g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
}

// A fader you can only click once is a fader you fight. Held, it tracks.
function settingsDrag(v) {
  if (!dragging) return;
  const row = settingsLayout(VIEW_W, VIEW_H).rows.find(r => r.key === dragging);
  if (row?.track) setVol(dragging, valueAt(row.track, v.x));
}

function drawSettings() {
  const L = settingsLayout(VIEW_W, VIEW_H), P = L.panel;
  const over = r => hover && hover.x > r.x && hover.x < r.x + r.w && hover.y > r.y && hover.y < r.y + r.h;

  g.fillStyle = 'rgba(3,5,9,0.86)'; g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.fillStyle = 'rgba(8,12,19,0.98)'; g.fillRect(P.x, P.y, P.w, P.h);
  g.strokeStyle = '#2c3d55'; g.lineWidth = 1; g.strokeRect(P.x + .5, P.y + .5, P.w - 1, P.h - 1);

  g.textAlign = 'left'; g.font = '15px ui-monospace, monospace'; g.fillStyle = '#8ab4e6';
  g.fillText('MENU', P.x + 20, P.y + 32);
  g.font = '11px ui-monospace, monospace'; g.fillStyle = '#5b6b85';
  g.fillText('Esc or O to close', P.x + P.w - 132, P.y + 32);
  for (const sec of L.sections) {
    g.font = '10px ui-monospace, monospace'; g.fillStyle = '#3d4757';
    g.fillText(sec.label, P.x + 20, sec.y);
    const tw = g.measureText(sec.label).width;
    g.strokeStyle = 'rgba(61,71,87,0.45)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(P.x + 28 + tw, sec.y - 4); g.lineTo(P.x + P.w - 20, sec.y - 4); g.stroke();
  }

  for (const row of L.rows) {
    const live = busOn(row.key), master = audioOn();
    const dim = row.key !== 'master' && !master;
    g.globalAlpha = dim ? 0.4 : 1;
    g.font = '12px ui-monospace, monospace';
    g.fillStyle = live ? '#cfe4ff' : '#66748c';
    g.fillText(row.label, row.r.x + 20, row.r.y + 27);

    if (row.kind === 'slider') {
      const v = busVol(row.key), t = row.track;
      g.fillStyle = '#1d2b3d'; g.fillRect(t.x, t.y, t.w, t.h);
      g.fillStyle = live ? '#5fd0ff' : '#3a4a5e'; g.fillRect(t.x, t.y, t.w * v, t.h);
      const kx = t.x + t.w * v;
      g.fillStyle = live ? '#cfe4ff' : '#66748c';
      g.fillRect(kx - 3, t.y - 6, 6, t.h + 12);
      g.font = '10px ui-monospace, monospace'; g.fillStyle = '#66748c';
      g.textAlign = 'right';
      g.fillText(`${Math.round(v * 100)}%`, t.x + t.w + 18, row.r.y + 27);
      g.textAlign = 'left';
    }
    g.font = '9px ui-monospace, monospace'; g.fillStyle = '#3d4757';
    g.fillText(row.hint, row.r.x + 20, row.r.y + 39);

    const b = row.toggle;                          // the switch, same place every row
    g.fillStyle = live ? 'rgba(125,224,138,0.16)' : 'rgba(224,90,90,0.14)';
    g.fillRect(b.x, b.y, b.w, b.h);
    g.strokeStyle = live ? '#7de08a' : '#e05a5a'; g.lineWidth = over(b) ? 1.8 : 1;
    g.strokeRect(b.x + .5, b.y + .5, b.w - 1, b.h - 1);
    g.textAlign = 'center'; g.font = '10px ui-monospace, monospace';
    g.fillStyle = live ? '#7de08a' : '#e05a5a';
    g.fillText(live ? 'ON' : 'MUTED', b.x + b.w / 2, b.y + 15);
    g.textAlign = 'left'; g.globalAlpha = 1;
  }

  const track = musicTrack();
  g.font = '11px ui-monospace, monospace'; g.fillStyle = track ? '#8ea3bd' : '#3d4757';
  const title = track ? nowPlaying() : 'no tracks — drop files into public/music';
  g.fillText(title.length > 36 ? title.slice(0, 35) + '\u2026' : title, L.now.x, L.now.y + 16);
  if (track) {
    const b = L.skip;
    g.fillStyle = over(b) ? 'rgba(122,180,240,0.16)' : 'rgba(255,255,255,0.03)';
    g.fillRect(b.x, b.y, b.w, b.h);
    g.strokeStyle = '#3d5876'; g.lineWidth = 1; g.strokeRect(b.x + .5, b.y + .5, b.w - 1, b.h - 1);
    g.fillStyle = '#8ab4e6'; g.textAlign = 'center';
    g.fillText('SKIP  N', b.x + b.w / 2, b.y + 17);
    g.textAlign = 'left';
  }

  for (const a of L.actions) {
    const r = a.r, hot = over(r);
    g.fillStyle = hot ? 'rgba(224,90,90,0.16)' : 'rgba(255,255,255,0.03)';
    g.fillRect(r.x, r.y, r.w, r.h);
    g.strokeStyle = hot ? '#e05a5a' : '#3d4757'; g.lineWidth = 1;
    g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);
    g.font = '11px ui-monospace, monospace'; g.fillStyle = hot ? '#e0a53f' : '#8ea3bd';
    g.fillText(a.label, r.x + 12, r.y + r.h / 2 + 4);
    g.font = '9px ui-monospace, monospace'; g.fillStyle = '#4a5568';
    g.textAlign = 'right';
    g.fillText(a.hint, r.x + r.w - 12, r.y + r.h / 2 + 4);
    g.textAlign = 'left';
  }
  g.font = '12px ui-monospace, monospace';
}

// One phrasing of the current track, used by the menu and by the readout beside
// the star system button — the folder is dropped and so is the extension, so a
// filename reads as a title.
function nowPlaying() {
  const t = musicTrack();
  if (!t) return '';
  return '\u266a  ' + t.split('/').pop().replace(/\.[a-z0-9]+$/i, '');
}

// --- ammunition bar -----------------------------------------------------------
// Two boxes, bottom centre: what the guns are loaded with and what the racks
// are. Clicking one opens a short menu above it of the grades you actually hold;
// pick one and the menu goes away and the box changes. Six boxes said all of it
// at once and cost a strip of screen to do it.
//
// A weapon with nothing behind it does not fire, so the count is not decoration
// and the box says so before you find out the hard way.
let feedOpen = null;                            // which box has its menu up
let lastBox = { feed: null, t: -Infinity };     // for spotting a double click on one

const heldGrades = feed => feed === 'repair'
  ? KIT_KEYS.filter(k => (myKits[k] ?? 0) > 0)
  : forWeapon(feed).filter(k => (myAmmo[k] ?? 0) > 0);

// Why the repair button is not available, or null. The button, its tooltip and
// the server all ask the same function, so it never offers what it will refuse.
function repairBlocked() {
  const me = ships.get(myId);
  return whyNotRepair({
    kits: myKits, using: myKit, docked: docked(),
    sinceHit: sinceHitSecs(), hurt: !!me && (me.hp ?? 100) < 100, busy: !!me?.fix,
  });
}
// The wire carries a shield-impact flash, not a timestamp, so track the last
// frame we saw one and count from there.
let lastHitAt = -1e9, prevHp = null;
const sinceHitSecs = () => (performance.now() - lastHitAt) / 1000;

function barClick(v) {
  const L = barLayout(VIEW_W, VIEW_H);
  const inside = r => v.x > r.x && v.x < r.x + r.w && v.y > r.y && v.y < r.y + r.h;

  if (feedOpen) {                               // the menu covers the world, so it goes first
    const box = L.boxes.find(b => b.feed === feedOpen);
    const M = feedMenu(box, heldGrades(feedOpen));
    for (const row of M.rows) if (inside(row.r)) {
      if (feedOpen === 'repair') { if (row.k !== myKit) send({ t: 'kit', key: row.k }); }
      else if (row.k !== myUsing[feedOpen]) send({ t: 'ammo', key: row.k });
      feedOpen = null;
      return true;
    }
    feedOpen = null;
    if (inside(M.box)) return true;
  }
  for (const b of L.boxes) {
    if (!inside(b.r)) continue;
    // Twice on the same box safes the weapon, or brings it back. Once opens the
    // menu — so the first click of a double opens it and the second puts it away
    // again on its way to the switch, which reads fine.
    const now4 = performance.now();
    const twice = lastBox.feed === b.feed && now4 - lastBox.t < DOUBLE_TAP;
    lastBox = { feed: b.feed, t: twice ? -Infinity : now4 };
    if (twice) {
      const on = !myArmed[b.feed];
      feedOpen = null;
      send({ t: 'arm', feed: b.feed, on });
      say(`${b.feed === 'laser' ? 'Guns' : 'Rockets'} ${on ? 'firing again' : 'holding fire'}`,
          on ? '#7de08a' : '#e0a53f');
      return true;
    }
    const held = heldGrades(b.feed);
    if (b.feed === 'repair') {                  // a click spends one, if it may
      if (!held.length) { say('No repair drones aboard — they are sold at a dock', '#e0a53f'); return true; }
      const why = repairBlocked();
      if (why) { say(why[0].toUpperCase() + why.slice(1), '#e0a53f'); return true; }
      send({ t: 'repair' });
      return true;
    }
    if (!held.length) { say(`No ${b.feed === 'laser' ? 'cells' : 'warheads'} — buy a crate at the dock`, '#e0a53f'); return true; }
    if (held.length === 1) {                    // nothing to choose between
      if (held[0] !== myUsing[b.feed]) send({ t: 'ammo', key: held[0] });
      return true;
    }
    feedOpen = feedOpen === b.feed ? null : b.feed;
    return true;
  }
  return false;
}

// Step to the next grade of one feed that you actually hold.
function cycleAmmo(feed) {
  const held = heldGrades(feed);
  if (held.length < 2) return say(`Nothing else to feed the ${feed}s`, '#66748c');
  const i = held.indexOf(myUsing[feed]);
  send({ t: 'ammo', key: held[(i + 1) % held.length] });
  feedOpen = null;
}

// A round drawn as what it is: a bolt for cells, a dart for warheads.
function roundIcon(feed, cx, cy, col, k = 1) {
  g.fillStyle = col;
  if (feed === 'laser') g.fillRect(cx - 2 * k, cy - 9 * k, 4 * k, 18 * k);
  else { g.beginPath(); g.moveTo(cx, cy - 10 * k); g.lineTo(cx + 5 * k, cy + 8 * k);
         g.lineTo(cx, cy + 4 * k); g.lineTo(cx - 5 * k, cy + 8 * k); g.closePath(); g.fill(); }
}

// The one thing SPACE would do, said plainly, right above the bar. It reads the
// same function the key does, so it can never offer something the key refuses.
function drawSpacePrompt() {
  const act = spaceAction();
  if (act.kind === 'none') return;
  const L = barLayout(VIEW_W, VIEW_H);
  g.font = '12px ui-monospace, monospace';
  const w = 30 + g.measureText(act.label).width + 22;
  const x = Math.round((VIEW_W - w) / 2), y = L.r.y - 34;
  g.fillStyle = 'rgba(6,10,16,0.86)'; g.fillRect(x, y, w, 24);
  g.strokeStyle = act.kind === 'stow' ? '#7de08a' : '#3d5876'; g.lineWidth = 1;
  g.strokeRect(x + .5, y + .5, w - 1, 23);
  g.fillStyle = act.kind === 'stow' ? 'rgba(125,224,138,0.16)' : 'rgba(122,180,240,0.12)';
  g.fillRect(x + 6, y + 5, 30, 14);
  g.textAlign = 'center'; g.font = '10px ui-monospace, monospace';
  g.fillStyle = act.kind === 'stow' ? '#7de08a' : '#8ab4e6';
  g.fillText('SPACE', x + 21, y + 15);
  g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
  g.fillStyle = '#cfe4ff';
  g.fillText(act.label, x + 44, y + 16);
}

// The repair rack. Amber when it will work, dim when it will not, and the reason
// is one hover away rather than something you learn by clicking.
function drawRepairBox(b) {
  const r = b.r, k = KITS[myKit], n = myKits[myKit] ?? 0;
  const me = ships.get(myId), busy = (me?.fix ?? 0) > 0;
  const why = repairBlocked(), ready = !why;
  const over = hover && hover.x > r.x && hover.x < r.x + r.w && hover.y > r.y && hover.y < r.y + r.h;

  g.fillStyle = 'rgba(6,10,16,0.82)'; g.fillRect(r.x, r.y, r.w, r.h);
  g.strokeStyle = busy ? '#7de08a' : ready ? '#e0a53f' : over ? '#4a6785' : '#243448';
  g.lineWidth = busy || ready ? 2 : 1;
  g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);

  g.save();                                      // a spanner, near enough
  g.translate(r.x + r.w / 2, r.y + 24);
  g.globalAlpha = n ? (ready || busy ? 1 : 0.4) : 0.25;
  g.strokeStyle = busy ? '#7de08a' : '#cfe9ff'; g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-5, 6); g.lineTo(4, -4); g.stroke();
  g.beginPath(); g.arc(6, -6, 4.4, 0.7, 5.4); g.stroke();
  g.lineCap = 'butt'; g.restore();

  if (k?.tier > 1) {
    g.fillStyle = n ? '#ffd479' : '#4a4230';
    for (let i = 0; i < k.tier - 1; i++) g.fillRect(r.x + 6 + i * 6, r.y + 6, 4, 4);
  }
  g.textAlign = 'center'; g.font = '12px ui-monospace, monospace';
  g.fillStyle = busy ? '#7de08a' : n ? (ready ? '#e0a53f' : '#5b6b85') : '#3d4757';
  g.fillText(busy ? `${me.fix}%` : String(n), r.x + r.w / 2, r.y + r.h - 10);
  if (KIT_KEYS.filter(kk => myKits[kk] > 0).length > 1) {
    g.fillStyle = '#3d4757'; g.font = '9px ui-monospace, monospace';
    g.fillText('\u25b2', r.x + r.w - 9, r.y + 12);
  }
  if (over && !feedOpen) {
    const t = busy ? 'repairing…' : why ? why : `${k.name} — +${Math.round(k.heal * 100)}% hull`;
    g.font = '11px ui-monospace, monospace';
    const w = g.measureText(t).width + 18;
    const x = Math.max(6, Math.min(VIEW_W - w - 6, r.x + r.w / 2 - w / 2));
    g.fillStyle = 'rgba(6,10,16,0.95)'; g.fillRect(x, r.y - 24, w, 20);
    g.strokeStyle = '#2c3d55'; g.lineWidth = 1; g.strokeRect(x + .5, r.y - 23.5, w - 1, 19);
    g.fillStyle = why && !busy ? '#e0a53f' : '#cfe4ff'; g.fillText(t, x + w / 2, r.y - 10);
  }
  g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
}

function drawBar() {
  const L = barLayout(VIEW_W, VIEW_H);
  const over = r => hover && hover.x > r.x && hover.x < r.x + r.w && hover.y > r.y && hover.y < r.y + r.h;

  for (const b of L.boxes) {
    if (b.feed === 'repair') { drawRepairBox(b); continue; }
    const key = myUsing[b.feed], a = AMMO[key], n = myAmmo[key] ?? 0;
    const r = b.r, safed = !myArmed[b.feed], dry = !safed && n === 0;
    const low = !dry && !safed && n < (b.feed === 'rocket' ? 60 : 300);
    g.fillStyle = 'rgba(6,10,16,0.82)'; g.fillRect(r.x, r.y, r.w, r.h);
    g.strokeStyle = safed ? '#6a5340' : dry ? '#ff5c6b' : feedOpen === b.feed ? '#7fd4ff'
                  : over(r) ? '#4a6785' : '#243448';
    g.lineWidth = dry || feedOpen === b.feed ? 2 : 1;
    g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);

    g.globalAlpha = safed ? 0.35 : 1;
    roundIcon(b.feed, r.x + r.w / 2, r.y + 24, dry ? '#5a2733' : b.feed === 'laser' ? '#8fe7ff' : '#cfe9ff');
    if (a.tier > 1) {                            // pips for the grade, top-left
      g.fillStyle = dry ? '#4a4230' : '#ffd479';
      for (let i = 0; i < a.tier - 1; i++) g.fillRect(r.x + 6 + i * 6, r.y + 6, 4, 4);
    }
    g.textAlign = 'center'; g.font = '12px ui-monospace, monospace';
    g.fillStyle = safed ? '#e0a53f' : dry ? '#ff5c6b' : low ? '#e0a53f' : '#cfe4ff';
    g.fillText(safed ? 'HELD' : dry ? 'DRY' : n > 9999 ? `${Math.round(n / 1000)}k` : String(n),
               r.x + r.w / 2, r.y + r.h - 10);
    g.globalAlpha = 1;
    if (safed) {                                 // struck through: this one is holding fire
      g.fillStyle = 'rgba(224,165,63,0.10)'; g.fillRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);
      g.strokeStyle = '#e0a53f'; g.lineWidth = 3; g.lineCap = 'round';
      g.beginPath();
      g.moveTo(r.x + 13, r.y + 11); g.lineTo(r.x + r.w - 13, r.y + r.h - 21);
      g.moveTo(r.x + r.w - 13, r.y + 11); g.lineTo(r.x + 13, r.y + r.h - 21);
      g.stroke();
      g.lineCap = 'butt';
    }
    if (heldGrades(b.feed).length > 1) {         // a hint that there is a choice here
      g.fillStyle = '#3d4757'; g.font = '9px ui-monospace, monospace';
      g.fillText('▲', r.x + r.w - 9, r.y + 12);
    }
    if (over(r) && !feedOpen) {                  // name of what is loaded
      const t = `${a.name}  x${a.mult.toFixed(2)}`;
      g.font = '11px ui-monospace, monospace';
      const w = g.measureText(t).width + 18;
      const x = Math.max(6, Math.min(VIEW_W - w - 6, r.x + r.w / 2 - w / 2));
      g.fillStyle = 'rgba(6,10,16,0.95)'; g.fillRect(x, r.y - 24, w, 20);
      g.strokeStyle = '#2c3d55'; g.lineWidth = 1; g.strokeRect(x + .5, r.y - 23.5, w - 1, 19);
      g.fillStyle = '#cfe4ff'; g.fillText(t, x + w / 2, r.y - 10);
    }
    g.textAlign = 'left';
  }
  g.font = '10px ui-monospace, monospace'; g.textAlign = 'center'; g.fillStyle = '#2f3f55';
  g.fillText('Q', L.boxes[0].r.x - 9, L.r.y + L.r.h - 10);
  g.fillText('E', L.boxes[1].r.x - 9, L.r.y + L.r.h - 10);
  g.textAlign = 'left';

  if (feedOpen) {
    const box = L.boxes.find(b => b.feed === feedOpen);
    const held = heldGrades(feedOpen);
    const M = feedMenu(box, held);
    g.fillStyle = 'rgba(4,7,12,0.97)'; g.fillRect(M.box.x, M.box.y, M.box.w, M.box.h);
    g.strokeStyle = '#5a86b8'; g.lineWidth = 1.4;
    g.strokeRect(M.box.x + .5, M.box.y + .5, M.box.w - 1, M.box.h - 1);
    for (const row of M.rows) {
      const kit = feedOpen === 'repair';
      const a = kit ? KITS[row.k] : AMMO[row.k];
      const on = kit ? myKit === row.k : myUsing[feedOpen] === row.k;
      const hot = over(row.r);
      g.fillStyle = on ? 'rgba(125,224,138,0.14)' : hot ? 'rgba(122,180,240,0.16)' : 'rgba(255,255,255,0.02)';
      g.fillRect(row.r.x, row.r.y, row.r.w, row.r.h);
      if (!kit) roundIcon(feedOpen, row.r.x + 14, row.r.y + row.r.h / 2, on ? '#7de08a' : '#8fa8c4', 0.6);
      g.font = '11px ui-monospace, monospace';
      g.fillStyle = on ? '#cfe4ff' : '#a8bcd4';
