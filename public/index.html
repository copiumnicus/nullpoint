const c = document.getElementById('c'), g = c.getContext('2d');
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;

// --- viewport: fills the window, DPR-correct --------------------------------
let VIEW_W = 0, VIEW_H = 0, MM_W = 0, MM_H = 0, MM_X = 0, MM_Y = 0;
let zoom = 1, WVW = 0, WVH = 0;   // zoom, and the world extent it makes visible
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  VIEW_W = innerWidth; VIEW_H = innerHeight;
  c.width = Math.round(VIEW_W * dpr); c.height = Math.round(VIEW_H * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);              // also resets font — re-set it
  g.font = '12px ui-monospace, SFMono-Regular, monospace';
  // never zoom IN past 1:1, but zoom out as far as a short window needs so that
  // SIGHT_R is always visible in every direction
  zoom = Math.min(1, Math.min(VIEW_W, VIEW_H) / (2 * SIGHT_R));
  WVW = VIEW_W / zoom; WVH = VIEW_H / zoom;
  MM_W = Math.min(260, VIEW_W * 0.22); MM_H = MM_W * (MAP_H / MAP_W);
  MM_X = VIEW_W - MM_W - 16; MM_Y = VIEW_H - MM_H - 16;
}
addEventListener('resize', resize); resize();
const btn    = () => ({ x: VIEW_W / 2 - 115, y: VIEW_H - 104, w: 230, h: 48 });
const sysBtn = () => ({ x: MM_X - 146, y: MM_Y + MM_H - 30, w: 136, h: 30 });
let sysOpen = false;
let patchOpen = false, patchScroll = 0;   // the changelog, top right
let berthOpen = false;                    // the pirates' offer of a bay

let myId = null, myCo = 'm', myName = '', mapId = 'm1', status = 'connecting…';
document.title = GAME;
// Carry a pilot across a rename rather than orphaning them under the old key.
const readToken = () => {
  try {
    const cur = localStorage.getItem(TOKEN_KEY);
    if (cur) return cur;
    for (const k of OLD_TOKEN_KEYS) {
      const old = localStorage.getItem(k);
      if (old) { localStorage.setItem(TOKEN_KEY, old); localStorage.removeItem(k); return old; }
    }
  } catch {}
  return '';
};
let myHull = 'hauler', myFit = emptyFit(), myGear = {}, myHulls = ['hauler'];
let power = { to: null, cap: 100, lv: { thrusters: 0, weapons: 0, shields: 0 } };
let shieldNow = 0, shieldTop = 0, myDrones = [], myXp = 0, myRank = { level: 1, into: 0, need: 1 };
// What the ship you are flying can DO, as opposed to what its numbers are. Kept
// beside the fit rather than recomputed per frame, and refreshed by exactly the
// two messages that can change a fit — see refreshTech below.
let myTech = new Set(), myPlate = true;
let myRig = null;                 // the collector, which is not one of the bays
let myPlayed = 0;                 // seconds flown, idle time already taken off
let myOnline = 1;                 // pilots in the world, including you
let myForm = 'line', myForms = ['line'];
let myAmmo = {}, myUsing = { ...DEFAULT_AMMO }, myArmed = { ...ARMED_ALL };
let myKits = {}, myKit = DEFAULT_KIT;
let myDevices = {}, myDevice = DEFAULT_DEVICE;
let myBerths = [];                // outposts you rent a bay at
let myFoldTo = null;              // and which hangar a beacon takes you to
let labs = new Map();             // every research station in this sector
let myLab = null;                 // { mods, income } if you have one
let labOpen = false;              // the research panel
// Staking is permanent and costs 500,000, and a pilot doing it for the first time
// has no idea the plot is for good. One click was the whole transaction, which is
// the wrong shape for the most expensive irreversible thing in the game.
let labConfirm = false;
// The threat file: what you have killed, and how many. A hostile is in it the
// first time you kill one and not before — the game's five odd mechanics were
// never written down anywhere a player could read them, and this is where they
// are, paid for one kill at a time.
let myKills = {}, fileOpen = false;
// Two positions, and the difference between them is why it feels like anything.
// `fileWant` is where the wheel has asked to be; `fileAt` is where the list is
// actually drawn, easing toward it. A wheel tick used to move a whole 96px entry
// in one frame, which is not scrolling, it is two different lists shown in
// succession.
let fileWant = 0, fileAt = 0, fileTick = 0;
// The balance the server last told us, and when. The counter runs UP from that
// at the rate the server also told us — it never invents money, it only shows
// the money that is already accruing between one bank and the next. Server truth
// always wins: a fresh `credits` resets both.
let creditsAt = 0, creditsSeen = 0;
// Every hangar this pilot could fold to, and the one they have chosen. Both from
// shared/berth.js, because the server decides the same question with the same two
// functions — a menu offering a bay the server would refuse is the bug this shape
// exists to prevent.
// The ship as the ammunition rules see it. Same object the server builds, so the
// menu can never offer a grade the server would refuse to load.
const feeding = () => ({ fit: myFit, drones: escortOf(myDrones, myRig), EQUIPMENT });
const foldPorts = () => homePorts({ co: myCo, berths: myBerths }, MAPS);
const foldDest  = () => foldTo({ co: myCo, berths: myBerths }, MAPS, myFoldTo);
let bayOpen = false;
// Blue is shields wherever it appears — the bar, the impact bubble, damage the
// shields caught, and the reactor feeding them. Thrusters take engine amber
// rather than a second blue.
const SYS_COLOUR = ['#ffffff', '#ff5c6b', '#5fd0ff', '#c78fff'];   // thrusters, weapons, shields, ability
// The fourth is whatever this hull's ability is, so it is named and coloured by
// the hull rather than by the slot — routing to 'special' means nothing to read.
const abilityHere = () => ABILITIES[HULLS[myHull]?.ability] ?? null;
const sysColour = i => (i === 3 ? (abilityHere()?.colour ?? SYS_COLOUR[3]) : SYS_COLOUR[i]);
const sysName = i => (i === 3 ? (abilityHere()?.name ?? 'NONE').toUpperCase() : SYSTEMS[i].toUpperCase());

const defOf = s => s.co === 'x' ? ALIENS[s.hull] : HULLS[s.hull];
const rOf   = s => defOf(s)?.r ?? 12;
const colOf = s => s.co === 'x' ? (ALIENS[s.hull]?.colour ?? '#b06adf')
                                : (COMPANIES[s.co]?.color ?? '#8899aa');
const ships = new Map();          // id -> { x,y,heading,charge, rx,ry }
let bolts = [], rockets = [], blasts = [], pyres = [], pods = [], numbers = [];   // rebuilt every snapshot
let snapAt = 0;                                 // when the last snapshot landed, for dead reckoning
let hold = {}, vault = {}, cargoCap = 60, credits = 0, atDock = false, scoop = null, want = null;
let invOpen = false, notice = null;
const prevShot = new Map();       // for spotting the frame a gun goes off
const prevRocket = new Map();     // and the frame a rack empties
let thrust = 0, lastFrameAt = 0, prevSelf = null;
let dead = null;                  // { lost, at } while you are a wreck
// Chat, with a console inside it. While it is open every keystroke belongs to the
// line being typed — otherwise 'h' would open the hangar mid-sentence.
let chatOpen = false, chatLine = '', amAdmin = false;
const CHAT_LINGER = 4000, CHAT_FADE = 1200;   // gone shortly after you stop typing
const chatLog = [];
// Sitting idle keeps a socket, a ship and a ticking world alive for nobody. Sign
// yourself out and the server can stop simulating entirely.
const IDLE_LIMIT = 30 * 60 * 1000;
let lastInput = performance.now(), signedOff = false;
const stir = () => { lastInput = performance.now(); };
const heardBooms = new Set();
const respawnBtn = () => ({ x: VIEW_W / 2 - 130, y: VIEW_H * 0.6, w: 260, h: 52 });
const say = (text, colour) => notice = { text, colour, at: performance.now() };

// Receipts, stacked down the right edge. A number ticking down in the corner of
// a panel is not a receipt — a refused click and a successful one looked
// identical from the outside, which is how buying outside the ring felt broken
// even when it was working.
const TOAST_LIFE = 4200, TOAST_FADE = 700, TOAST_H = 46, TOAST_W = 260, TOAST_KEEP = 5;
let toasts = [];
const toast = (what, cost, note) => {
  toasts.unshift({ what, cost, note, at: performance.now() });
  toasts = toasts.slice(0, TOAST_KEEP);
};

// The changelog. A version number is a small promise that the thing is being
// worked on, and it costs one icon to keep.
// The threat file. Everything you have killed, weakest first, with its outline, its
// numbers and one line on what it actually does.
//
// Absent rather than greyed out: a hostile you have not killed is not in here at
// all. The header says how many of nine you have, so the file admits it is
// incomplete without telling you what is missing — a list of locked entries would
// be the manual this exists instead of.
function drawFile(now) {
  const filed = filedIn(myKills);
  // Ease toward where the wheel asked to be, off the timestamp the FRAME was handed
  // rather than off performance.now(). Two clocks matter here and CLAUDE.md says so:
  // the render harness drives frames inside a few milliseconds of wall clock, so an
  // easing measured against the real clock never advances and the panel looks
  // frozen to the only thing that could have tested it.
  //
  // Frame-rate independent: the same fraction of the remaining distance per second
  // however fast the client runs, so it settles in about a fifth of a second at
  // 30fps and at 144.
  const dtS = Math.min(0.05, Math.max(0, (now - fileTick) / 1000)) || 0.016;
  fileTick = now;
  const ease = 1 - Math.pow(0.0001, dtS);
  fileAt += (fileWant - fileAt) * ease;
  if (Math.abs(fileWant - fileAt) < 0.5) fileAt = fileWant;
  const L = filePanel(VIEW_W, VIEW_H, fileAt, filed.length);
  const P = L.panel;
  g.fillStyle = 'rgba(4,7,12,0.94)'; g.fillRect(P.x, P.y, P.w, P.h);
  g.strokeStyle = '#5a86b8'; g.lineWidth = 1.4;
  g.strokeRect(P.x + .5, P.y + .5, P.w - 1, P.h - 1);

  const prog = fileProgress(myKills);
  g.font = '15px ui-monospace, monospace'; g.textAlign = 'left'; g.fillStyle = '#cfe4ff';
  g.fillText('THREAT FILE', P.x + FILE_PAD, P.y + 30);
  g.font = '11px ui-monospace, monospace'; g.fillStyle = '#7f8fa6';
  g.fillText(`${prog.known} of ${prog.all} recorded · ${totalKills(myKills).toLocaleString('en-US')} confirmed kills`,
             P.x + FILE_PAD, P.y + 50);
  g.textAlign = 'right'; g.fillStyle = '#66748c'; g.font = '12px ui-monospace, monospace';
  g.fillText('\u00d7', L.close.x + L.close.w, L.close.y + 15);
  g.textAlign = 'left';

  if (!filed.length) {
    g.font = '12px ui-monospace, monospace'; g.fillStyle = '#66748c';
    g.fillText('Nothing recorded yet. Kill something and it goes in here.',
               P.x + FILE_PAD, P.y + FILE_HEAD + 30);
    g.font = '12px ui-monospace, monospace';
    return;
  }

  // Clipped to the window the rows move behind, so a row leaving the top is CUT
  // rather than drawn over the header — which is the other half of not looking
  // like a jump.
  g.save();
  g.beginPath(); g.rect(L.body.x, L.body.y, L.body.w, L.body.h); g.clip();
  for (const row of L.rows) {
    const d = dossierOf(filed[row.i], myKills);
    if (!d) continue;
    const hot = hover && hover.x > row.r.x && hover.x < row.r.x + row.r.w
                      && hover.y > row.r.y && hover.y < row.r.y + row.r.h;
    g.fillStyle = hot ? 'rgba(122,180,240,0.10)' : 'rgba(255,255,255,0.02)';
    g.fillRect(row.r.x, row.r.y, row.r.w, row.r.h);
    g.strokeStyle = '#243448'; g.lineWidth = 1;
    g.strokeRect(row.r.x + .5, row.r.y + .5, row.r.w - 1, row.r.h - 1);

    // Its own outline, at its own scale, in its own colour — the same points the
    // world draws it with, so the file and the sky cannot show different ships.
    g.save();
    g.translate(row.r.x + 40, row.r.y + row.r.h / 2);
    g.strokeStyle = d.colour; g.lineWidth = 1.6;
    g.beginPath();
    outlineOf(d.kind, 20).forEach(([px, py], i) => i ? g.lineTo(px, py) : g.moveTo(px, py));
    g.closePath(); g.stroke();
    g.fillStyle = d.colour + '22'; g.fill();
    g.restore();

    const tx = row.r.x + 78;
    g.font = '13px ui-monospace, monospace'; g.fillStyle = '#cfe4ff';
    g.fillText(d.name, tx, row.r.y + 20);
    g.font = '10px ui-monospace, monospace'; g.fillStyle = d.colour;
    g.fillText(d.cls.toUpperCase(), tx + g.measureText(d.name).width * 1.05 + 14, row.r.y + 20);

    g.font = '10px ui-monospace, monospace'; g.fillStyle = '#7f8fa6';
    g.fillText(`hull ${d.hull.toLocaleString('en-US')}   shield ${d.shield.toLocaleString('en-US')}   ` +
               `speed ${d.speed}   ` +
               (d.armed ? `${d.dps} dps at ${d.reach}` : 'no gun'),
               tx, row.r.y + 38);

    g.fillStyle = '#8ea3bd';
    const words = d.tell.split(' ');
    let line = '', at = row.r.y + 56;
    const wide = row.r.w - (tx - row.r.x) - 96;
    for (const wd of words) {
      const t2 = line ? line + ' ' + wd : wd;
      if (g.measureText(t2).width > wide && line) { g.fillText(line, tx, at); line = wd; at += 12; }
      else line = t2;
    }
    if (line) g.fillText(line, tx, at);

    g.textAlign = 'right';
    g.font = 'bold 15px ui-monospace, monospace'; g.fillStyle = '#7de08a';
    g.fillText(String(d.killed), row.r.x + row.r.w - 14, row.r.y + 24);
    g.font = '9px ui-monospace, monospace'; g.fillStyle = '#4a5568';
    g.fillText('killed', row.r.x + row.r.w - 14, row.r.y + 36);
    g.fillStyle = '#ffd479'; g.font = '10px ui-monospace, monospace';
    g.fillText(`${fmtCredits(d.bounty)} ${CURRENCY.short}`, row.r.x + row.r.w - 14, row.r.y + 56);
    g.textAlign = 'left';
  }
  g.restore();

  if (L.maxScroll > 0) {
    // A real bar, because "1-7 of 9" cannot tell you how far a smooth scroll is
    // through the list and a thumb can.
    const tr = { x: P.x + P.w - 7, y: L.body.y, w: 3, h: L.body.h };
    g.fillStyle = 'rgba(255,255,255,0.05)'; g.fillRect(tr.x, tr.y, tr.w, tr.h);
    const frac = L.body.h / (filed.length * FILE_ROW);
    const th = Math.max(24, tr.h * frac);
    const ty = tr.y + (tr.h - th) * (L.at / L.maxScroll);
    g.fillStyle = '#3d5876'; g.fillRect(tr.x, ty, tr.w, th);
  }
  if (L.maxScroll > 0) {
    g.font = '9px ui-monospace, monospace'; g.fillStyle = '#3d4757'; g.textAlign = 'center';
    g.fillText(`${L.at + 1}-${Math.min(filed.length, L.at + L.fit)} of ${filed.length} · wheel to scroll`,
               P.x + P.w / 2, P.y + P.h - 6);
    g.textAlign = 'left';
  }
  g.font = '12px ui-monospace, monospace';
}

function fileClick(v) {
  const filed = filedIn(myKills);
  const L = filePanel(VIEW_W, VIEW_H, fileScroll, filed.length);
  const inside = r => v.x > r.x && v.x < r.x + r.w && v.y > r.y && v.y < r.y + r.h;
  if (inside(L.close) || !inside(L.panel)) { fileOpen = false; return true; }
  return true;                                     // a reference document: reading, not clicking
}

// The research panel: three ladders, one rung at a time.
//
// Not the station panel's machinery — that is shelves you browse, this is a ladder
// you climb, and forcing one into the other would mean a page of one-item shelves.
// Geometry comes from shared/research.js so the row you can see is the row you can
// click, which is a bug this codebase has shipped twice.
function drawLab() {
  const L = labPanel(VIEW_W, VIEW_H), P = L.panel;
  const mask = myLab?.mods ?? 0, near = atMyLab();
  g.fillStyle = 'rgba(4,7,12,0.94)'; g.fillRect(P.x, P.y, P.w, P.h);
  g.strokeStyle = '#7de08a'; g.lineWidth = 1.4;
  g.strokeRect(P.x + .5, P.y + .5, P.w - 1, P.h - 1);

  g.font = '15px ui-monospace, monospace'; g.textAlign = 'left'; g.fillStyle = '#cfe4ff';
  g.fillText('RESEARCH STATION', P.x + LAB_PAD, P.y + 30);
  g.font = '11px ui-monospace, monospace'; g.fillStyle = '#7f8fa6';
  g.fillText(`${myName} · ${fmtCredits(credits)} ${CURRENCY.short} held`, P.x + LAB_PAD, P.y + 50);
  const inc = incomeOf(mask);
  g.fillStyle = inc ? '#7de08a' : '#4a5568';
  g.fillText(inc ? `earning ${inc} ${CURRENCY.short}/s — ${(inc * 86400).toLocaleString('en-US')} a day, flying or not`
                 : 'nothing built yet', P.x + LAB_PAD, P.y + 68);
  g.textAlign = 'right'; g.fillStyle = '#66748c'; g.font = '12px ui-monospace, monospace';
  g.fillText('\u00d7', L.close.x + L.close.w, L.close.y + 15);
  g.textAlign = 'left';

  // No station yet: the panel is the one place that sells you one, so a pilot who
  // presses R with nothing built finds the thing to buy rather than an empty box.
  if (!myLab) {
    const why = whyNotStake({ credits, docked: atDock, has: false });
    const row = L.rows[0], hot = hover && hover.x > row.r.x && hover.x < row.r.x + row.r.w
                                       && hover.y > row.r.y && hover.y < row.r.y + row.r.h;
    g.fillStyle = why ? 'rgba(255,255,255,0.02)' : hot ? 'rgba(125,224,138,0.16)' : 'rgba(255,255,255,0.03)';
    g.fillRect(row.r.x, row.r.y, row.r.w, row.r.h);
    g.strokeStyle = why ? '#243448' : '#4a6785'; g.lineWidth = 1;
    g.strokeRect(row.r.x + .5, row.r.y + .5, row.r.w - 1, row.r.h - 1);
    g.font = '12px ui-monospace, monospace';
    g.fillStyle = why ? '#66748c' : labConfirm ? '#ffd479' : '#cfe4ff';
    g.fillText(labConfirm && !why ? 'Place it here? This is permanent'
                                  : 'Stake a plot in the yard', row.r.x + 12, row.r.y + 22);
    g.font = '10px ui-monospace, monospace';
    g.fillStyle = labConfirm && !why ? '#ffd479' : '#7f8fa6';
    // Two lines on the confirm, because a pilot doing this the first time knows
    // none of it: what the thing is FOR, and that the spot cannot be moved.
    if (why) {
      g.fillText(why, row.r.x + 12, row.r.y + 42);
    } else if (labConfirm) {
      g.fillText('Where you research everything past the shops — hull, shields, mining.',
                 row.r.x + 12, row.r.y + 40);
      g.fillText('The spot is permanent, so pick somewhere safe and easy to get back to.',
                 row.r.x + 12, row.r.y + 52);
    } else {
      g.fillText('Researches what the shops cannot sell — and pays you while you are away.',
                 row.r.x + 12, row.r.y + 40);
      g.fillText('Placed in your company ring, with your name on it, for good.',
                 row.r.x + 12, row.r.y + 52);
    }
    g.textAlign = 'right'; g.font = '12px ui-monospace, monospace';
    g.fillStyle = why ? '#66748c' : '#ffd479';
    g.fillText(`${fmtCredits(LAB_PRICE)} ${CURRENCY.short}`, row.r.x + row.r.w - 12, row.r.y + 26);
    g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
    return;
  }
  for (const row of L.rows) {
    const st = rowState(mask, row.line, credits);
    const why = st.next ? whyNotBuild(st.next, { credits, mask, near }) : null;
    const hot = hover && hover.x > row.r.x && hover.x < row.r.x + row.r.w
                      && hover.y > row.r.y && hover.y < row.r.y + row.r.h;
    g.fillStyle = st.done ? 'rgba(125,224,138,0.10)'
                : !why ? (hot ? 'rgba(125,224,138,0.16)' : 'rgba(255,255,255,0.03)')
                : 'rgba(255,255,255,0.02)';
    g.fillRect(row.r.x, row.r.y, row.r.w, row.r.h);
    g.strokeStyle = st.done ? '#3d5876' : why ? '#243448' : '#4a6785'; g.lineWidth = 1;
    g.strokeRect(row.r.x + .5, row.r.y + .5, row.r.w - 1, row.r.h - 1);

    // Pips: how far up this ladder you are, at a glance.
    for (let i = 0; i < st.max; i++) {
      g.fillStyle = i < st.tier ? '#7de08a' : '#243448';
      g.fillRect(row.r.x + 12 + i * 9, row.r.y + 12, 6, 6);
    }
    g.font = '12px ui-monospace, monospace'; g.fillStyle = '#cfe4ff';
    g.fillText(`${st.name}  ${st.tier}/${st.max}`, row.r.x + 12 + st.max * 9 + 10, row.r.y + 18);
    g.font = '11px ui-monospace, monospace';
    if (st.done) {
      g.fillStyle = '#7de08a';
      g.fillText(`${st.built} — the top of this ladder`, row.r.x + 12, row.r.y + 40);
    } else {
      g.fillStyle = why ? '#66748c' : '#cfe4ff';
      g.fillText(st.nextName, row.r.x + 12, row.r.y + 40);
      // What it does to the ship you are actually flying, in the numbers on your own
      // bar. "Twice the hull" is a fact about the module; "1,100 -> 2,200" is a fact
      // about you, and it is the one that decides whether a million credits is worth
      // it. A pilot cannot tell whether "stronger" means one percent or one hundred.
      const gain = rungGain(mask, row.line, myStats());
      g.font = '10px ui-monospace, monospace';
      if (why) {
        g.fillStyle = '#7f8fa6';
        g.fillText(why, row.r.x + 12, row.r.y + 54);
      } else if (gain) {
        g.fillStyle = '#7de08a';
        g.fillText(gain.label, row.r.x + 12, row.r.y + 54);
        g.fillStyle = '#66748c';
        const w = g.measureText(gain.label).width;
        g.font = '9px ui-monospace, monospace';
        g.fillText(gain.sub, row.r.x + 12 + w + 12, row.r.y + 54);
      } else {
        g.fillStyle = '#7f8fa6';
        g.fillText(st.does, row.r.x + 12, row.r.y + 54);
      }
      g.font = '10px ui-monospace, monospace';
      g.textAlign = 'right';
      g.font = '12px ui-monospace, monospace';
      g.fillStyle = why ? '#66748c' : '#ffd479';
      g.fillText(`${fmtCredits(st.price)} ${CURRENCY.short}`, row.r.x + row.r.w - 12, row.r.y + 40);
      g.textAlign = 'left';
    }
  }
  g.font = '12px ui-monospace, monospace';
}

function labClick(v) {
  const L = labPanel(VIEW_W, VIEW_H);
  const inside = r => v.x > r.x && v.x < r.x + r.w && v.y > r.y && v.y < r.y + r.h;
  if (inside(L.close) || !inside(L.panel)) { labOpen = false; labConfirm = false; return true; }
  const mask = myLab?.mods ?? 0, near = atMyLab();
  if (!myLab) {
    // Anywhere but the row takes the offer back off the table, so a stray click
    // cannot be the second half of a confirmation the pilot has forgotten about.
    if (!inside(L.rows[0].r)) { labConfirm = false; return true; }
    const why = whyNotStake({ credits, docked: atDock, has: false });
    if (why) { labConfirm = false; say(why[0].toUpperCase() + why.slice(1), '#e0a53f'); return true; }
    if (!labConfirm) {
      labConfirm = true;
      say('Permanent — your station keeps this spot for good. Click again to place it', '#ffd479');
      return true;
    }
    labConfirm = false;
    send({ t: 'stake' });
    return true;
  }
  for (const row of L.rows) {
    if (!inside(row.r)) continue;
    const st = rowState(mask, row.line, credits);
    if (!st.next) { say('That ladder is finished', '#7de08a'); return true; }
    const why = whyNotBuild(st.next, { credits, mask, near });
    if (why) { say(why[0].toUpperCase() + why.slice(1), '#e0a53f'); return true; }
    send({ t: 'build', key: st.next });
    return true;
  }
  return true;
}

// Research stations, standing in the company ring.
//
// Small — 26px against a Bulwark's 34 — because a lot of them share a yard and a
// ring full of enormous private monuments is not somewhere anyone wants to dock.
// Every pilot sees every station; only yours lights up, and every one carries its
// owner's name, because the whole first 500,000 buys you a thing other people can
// see is yours.
//
// The picture is derived from the module mask alone, so a station that has been
// built on looks built on, to everyone, with nothing extra on the wire.
function drawLabs() {
  const me = ships.get(myId);
  for (const l of labs.values()) {
    const p = { x: l.x, y: l.y };                  // world space, like the ring it stands in
    const R = LAB_R, col = l.own ? '#7de08a' : '#4a6785';
    const parts = partsOf(l.mods);

    // Rings first, under the core: shield work reads as something around it.
    for (const part of parts.filter(q => q.part === 'ring')) {
      g.strokeStyle = col; g.globalAlpha = 0.30 + part.at * 0.35; g.lineWidth = 1;
      g.beginPath(); g.arc(p.x, p.y, R * (1.25 + part.at * 0.5), 0, 7); g.stroke();
    }
    g.globalAlpha = 1;
    // Booms: mining gear, sticking out where you can count it.
    for (const part of parts.filter(q => q.part === 'boom')) {
      const a = part.at * Math.PI * 2;
      g.strokeStyle = col; g.lineWidth = 2;
      g.beginPath();
      g.moveTo(p.x + Math.cos(a) * R * 0.8, p.y + Math.sin(a) * R * 0.8);
      g.lineTo(p.x + Math.cos(a) * R * 2.1, p.y + Math.sin(a) * R * 2.1);
      g.stroke();
    }
    // The core, a hexagon, plus a plate per hull tier thickening its edge.
    const plates = parts.filter(q => q.part === 'plate').length;
    g.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + Math.PI / 6;
      const px = p.x + Math.cos(a) * R, py = p.y + Math.sin(a) * R;
      i ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.closePath();
    g.fillStyle = l.own ? 'rgba(125,224,138,0.14)' : 'rgba(74,103,133,0.12)';
    g.fill();
    g.strokeStyle = col; g.lineWidth = 1 + plates * 0.6; g.stroke();

    // Standing at your own station, the game says what to press. R is not on any
    // other prompt and nothing else in the world mentions it, so a pilot who has
    // bought one and flown to it would otherwise be looking at a hexagon.
    if (l.own && me && nearLab(l, { x: me.rx ?? me.x, y: me.ry ?? me.y })) {
      const lab = 'PRESS R';
      g.font = 'bold 10px ui-monospace, monospace'; g.textAlign = 'center';
      const w = g.measureText(lab).width + 16;
      g.fillStyle = 'rgba(6,10,16,0.9)';
      g.fillRect(p.x - w / 2, p.y + R + 6, w, 16);
      g.strokeStyle = '#7de08a'; g.lineWidth = 1;
      g.strokeRect(p.x - w / 2 + .5, p.y + R + 6.5, w - 1, 15);
      g.fillStyle = '#7de08a';
      g.fillText(lab, p.x, p.y + R + 18);
      g.font = '9px ui-monospace, monospace'; g.fillStyle = '#7f8fa6';
      g.fillText('research', p.x, p.y + R + 32);
      g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
    }
    if (l.name) {
      g.font = 'bold 9px ui-monospace, monospace'; g.textAlign = 'center';
      g.lineWidth = 3; g.strokeStyle = 'rgba(4,7,12,0.9)';
      g.strokeText(l.name, p.x, p.y - R - 8);
      g.fillStyle = col; g.fillText(l.name, p.x, p.y - R - 8);
      g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
    }
  }
}

// You are safe, and this is the first time the game has ever said so.
//
// Two of the three sanctuaries a player learns by accident — stand in your own
// ring long enough and you notice nothing shoots you. The portal mouth they never
// learn: nothing draws that 288px circle anywhere, so the thing you should run for
// when something faster than you finds you is invisible.
//
// It draws nothing at all outside a haven. A badge that is always on the screen is
// furniture, and furniture is not read.
function drawHaven() {
  const me = ships.get(myId);
  if (!me || dead || signup) return;
  const map = MAPS[mapId];
  const line = havenLine(havenKind(map, me), {
    mine: canDock(map, myCo, me),                // your ring mends you; nowhere else does
    hunted: fightState().hunted,                 // peace stops one STARTING, not one already on you
  });
  if (!line) return;

  const b = havenBadge(VIEW_W), col = TONE[line.tone] ?? TONE.calm;
  g.fillStyle = 'rgba(6,10,16,0.93)'; g.fillRect(b.x, b.y, b.w, b.h);
  g.strokeStyle = col; g.lineWidth = 1;
  g.strokeRect(b.x + .5, b.y + .5, b.w - 1, b.h - 1);
  g.fillStyle = col; g.fillRect(b.x, b.y, 3, b.h);   // the same spine the receipts wear
  g.font = '11px ui-monospace, monospace'; g.textAlign = 'center';
  g.fillStyle = col;
  g.fillText(`${line.tone === 'warn' ? '\u25b2' : '\u25c6'}  ${line.text}`, b.x + b.w / 2, b.y + 17);
  g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
}

function drawPatch() {
  const b = patchIcon(VIEW_W);
  const hot = hover && hover.x > b.x && hover.x < b.x + b.w && hover.y > b.y && hover.y < b.y + b.h;
  g.fillStyle = patchOpen ? 'rgba(122,180,240,0.18)' : hot ? 'rgba(255,255,255,0.08)' : 'rgba(6,10,16,0.72)';
  g.fillRect(b.x, b.y, b.w, b.h);
  g.strokeStyle = patchOpen || hot ? '#5a86b8' : '#243448'; g.lineWidth = 1;
  g.strokeRect(b.x + .5, b.y + .5, b.w - 1, b.h - 1);
  g.strokeStyle = patchOpen || hot ? '#cfe4ff' : '#5b6b85'; g.lineWidth = 1.4;
  for (let i = 0; i < 3; i++) {                     // three lines: a note, not a menu
    const ly = b.y + 9 + i * 4.5;
    g.beginPath(); g.moveTo(b.x + 7, ly); g.lineTo(b.x + b.w - 7 - (i === 2 ? 5 : 0), ly); g.stroke();
  }
  g.textAlign = 'right'; g.font = '9px ui-monospace, monospace';
  g.fillStyle = hot || patchOpen ? '#8ea3bd' : '#3d4757';
  const vtag = `v${VERSION}`;
  g.fillText(vtag, b.x - 6, b.y + 17);
  // Who else is out there, beside the version. Alone reads grey; anybody else at
  // all reads green, because "is anyone playing this" is the actual question.
  const crowd = `${myOnline} online`;
  g.fillStyle = myOnline > 1 ? '#7de08a' : '#3d4757';
  g.fillText(crowd, b.x - 14 - g.measureText(vtag).width, b.y + 17);
  g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
  if (!patchOpen) return;

  const L = patchPanel(VIEW_W, VIEW_H, patchScroll);
  patchScroll = L.at;                               // clamped by the layout, not here
  const P = L.panel;
  g.fillStyle = 'rgba(4,7,12,0.97)'; g.fillRect(P.x, P.y, P.w, P.h);
  g.strokeStyle = '#2c3d55'; g.lineWidth = 1; g.strokeRect(P.x + .5, P.y + .5, P.w - 1, P.h - 1);
  g.font = '11px ui-monospace, monospace'; g.fillStyle = '#8ab4e6';
  g.fillText('WHAT CHANGED', P.x + PATCH_PAD, P.y + 20);
  g.textAlign = 'right'; g.fillStyle = '#3d4757'; g.font = '9px ui-monospace, monospace';
  g.fillText(L.maxScroll ? 'scroll to read · click away to close' : 'click away to close',
             P.x + P.w - 12, P.y + 20);
  g.textAlign = 'left';

  for (const ln of L.lines) {
    if (ln.kind === 'gap') continue;
    if (ln.kind === 'ver') {
      g.font = '11px ui-monospace, monospace'; g.fillStyle = '#ffd479';
      const tag = ln.v === 'earlier' ? 'earlier' : `v${ln.v}`;
      g.fillText(tag, ln.x, ln.y);
      const tw = g.measureText(tag).width;
      g.strokeStyle = 'rgba(61,71,87,0.4)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(ln.x + tw + 8, ln.y - 4); g.lineTo(P.x + P.w - PATCH_PAD - 6, ln.y - 4); g.stroke();
    } else {
      // Whole lines. The layout wrapped them to fit, so nothing here has to cut
      // anything off — reading half a sentence was the complaint.
      g.font = '10px ui-monospace, monospace'; g.fillStyle = '#8ea3bd';
      g.fillText(ln.text, ln.x, ln.y);
    }
  }
  if (L.bar) {
    g.fillStyle = 'rgba(90,134,184,0.18)';
    g.fillRect(L.bar.x, P.y + PATCH_HEAD, L.bar.w, P.h - PATCH_HEAD - 10);
    g.fillStyle = '#5a86b8';
    g.fillRect(L.bar.x, L.bar.y, L.bar.w, L.bar.h);
  }
  g.font = '12px ui-monospace, monospace';
}

// What the pirates will rent you, and what they will not. Deliberately blunt about
// the second part: the whole risk of the thing is a pilot assuming a bay is cover.
function drawBerth() {
  const L = berthPanel(VIEW_W, VIEW_H), P = L.panel;

                     && hover.y > L.buy.y && hover.y < L.buy.y + L.buy.h;

  g.fillStyle = 'rgba(3,5,9,0.86)'; g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.fillStyle = 'rgba(8,12,19,0.98)'; g.fillRect(P.x, P.y, P.w, P.h);
  g.strokeStyle = '#8a6a3a'; g.lineWidth = 1; g.strokeRect(P.x + .5, P.y + .5, P.w - 1, P.h - 1);

  g.textAlign = 'left'; g.font = '14px ui-monospace, monospace'; g.fillStyle = '#ffd479';
  g.fillText('A BERTH HERE', P.x + 20, P.y + 32);
  // Four lines and no more: the panel is 380px wide, so a sentence past about
  // fifty-six characters runs out of the frame. The second line is the one that
  // matters and used to be missing entirely — a bay is not a convenience, it is
  // the only shelf that stocks the top half of every ladder.
  g.font = '10px ui-monospace, monospace'; g.fillStyle = '#8ea3bd';
  g.fillText('Rent a bay: refit and buy here, without flying home.', P.x + 20, P.y + 56);
  g.fillText('The only shelf that sells the top of every ladder.', P.x + 20, P.y + 74);
  g.fillStyle = '#66748c';
  g.fillText('No repairs, no shelter, and shut while you are shot at.', P.x + 20, P.y + 92);
  g.fillText(`Rank ${BERTH_RANK} and up: they rent to pilots they know of.`, P.x + 20, P.y + 110);

  g.font = '12px ui-monospace, monospace'; g.textAlign = 'right';
  g.fillStyle = credits >= berthPrice() ? '#ffd479' : '#e05a5a';
  g.fillText(`${fmtCredits(berthPrice())} ${CURRENCY.short}`, P.x + P.w - 20, P.y + 32);
  g.textAlign = 'left';

  g.fillStyle = why ? 'rgba(255,255,255,0.03)' : over ? 'rgba(125,224,138,0.20)' : 'rgba(125,224,138,0.12)';
  g.fillRect(L.buy.x, L.buy.y, L.buy.w, L.buy.h);
  g.strokeStyle = why ? '#3d4757' : '#7de08a'; g.lineWidth = 1.4;
  g.strokeRect(L.buy.x + .5, L.buy.y + .5, L.buy.w - 1, L.buy.h - 1);
  g.textAlign = 'center'; g.font = '12px ui-monospace, monospace';
  g.fillStyle = why ? '#66748c' : '#7de08a';
  g.fillText(why ? why.toUpperCase() : 'RENT THE BAY', L.buy.x + L.buy.w / 2, L.buy.y + 23);
  g.textAlign = 'left';
}

function drawToasts(now) {
  toasts = toasts.filter(t => now - t.at < TOAST_LIFE);
  toasts.forEach((t, i) => {
    const age = now - t.at;
    const fade = Math.min(1, age / 140) * Math.min(1, (TOAST_LIFE - age) / TOAST_FADE);
    const slide = (1 - Math.min(1, age / 180)) * 26;          // arrives from off the edge
    const x = VIEW_W - TOAST_W - 16 + slide, y = 92 + i * (TOAST_H + 8);
    const earned = t.cost < 0, sum = Math.abs(t.cost);
    g.globalAlpha = fade;
    g.fillStyle = 'rgba(6,10,16,0.93)'; g.fillRect(x, y, TOAST_W, TOAST_H);
    g.strokeStyle = earned ? '#7de08a' : '#ffd479'; g.lineWidth = 1;
    g.strokeRect(x + .5, y + .5, TOAST_W - 1, TOAST_H - 1);
    g.fillStyle = earned ? '#7de08a' : '#ffd479'; g.fillRect(x, y, 3, TOAST_H);
    g.textAlign = 'left'; g.font = '12px ui-monospace, monospace'; g.fillStyle = '#cfe4ff';
    g.fillText(t.what.length > 24 ? t.what.slice(0, 23) + '\u2026' : t.what, x + 14, y + 20);
    g.font = '10px ui-monospace, monospace'; g.fillStyle = '#66748c';
    g.fillText(t.note ?? '', x + 14, y + 35);
    g.textAlign = 'right'; g.font = '13px ui-monospace, monospace';
    g.fillStyle = earned ? '#7de08a' : '#ffd479';
    g.fillText(`${earned ? '+' : '\u2212'}${fmtCredits(sum)} ${CURRENCY.short}`, x + TOAST_W - 12, y + 22);
    g.font = '9px ui-monospace, monospace'; g.fillStyle = '#4a5568';
    g.fillText(`${fmtCredits(credits)} held`, x + TOAST_W - 12, y + 35);
    g.textAlign = 'left'; g.globalAlpha = 1;
  });
  g.font = '12px ui-monospace, monospace';
}

// What SPACE would do right now. The prompt at the bottom of the screen and the
// key itself both read this, so the screen can never offer something the key
// will not do — and stowing no longer needs the hold open to reach it.
// What the balance is right now, as opposed to the last time the server said so.
//
// A mine pays out once a second, and a counter that jumps by twelve once a second
// reads as broken rather than as income. So the client runs FORWARD from the last
// number it was given, at the rate it was also given — it is not inventing money,
// it is drawing money that has already accrued and has not been banked yet.
//
// Server truth always wins: any change to `credits` resets the anchor, so the two
// cannot drift. And it never runs more than a second and a bit ahead, because that
// is how often the bank happens.
// Your own station, if it is in the sector you are looking at. `own` is filled in
// per viewer by the server, so this never has to match names.
const myLabHere = () => [...labs.values()].find(l => l.own) ?? null;

// Standing AT it, which is a different question from owning one in this sector —
// they were the same expression for a few minutes and the panel would happily
// have sold a 16,000,000 credit module from the far side of the map.
function atMyLab() {
  const me2 = ships.get(myId), mine = myLabHere();
  return !!me2 && !!mine && nearLab(mine, { x: me2.x, y: me2.y });
}

function liveCredits() {
  const rate = myLab?.income ?? 0;
  if (!rate) return credits;
  const ahead = Math.min(2, (performance.now() - creditsAt) / 1000);
  return credits + Math.floor(rate * Math.max(0, ahead));
}

function spaceAction() {
  const me2 = ships.get(myId);
  if (!me2 || dead) return { kind: 'none' };
  // The gate outranks everything. Sitting in a portal mouth with ore under you,
  // the thing you came to the gate to do is leave — and hauling a pod first, then
  // pressing again, was a fight with the key rather than with anything in space.
  if (nearPortal(MAPS[mapId], { x: me2.x, y: me2.y, jumpCd: 0 })) return { kind: 'jump', label: 'jump through the gate' };
  // Somewhere you flew TO outranks whatever happens to be lying beside it. This is
  // the same rule the gate needed: standing in a place you came to use, the thing
  // you came to do is the thing the key should do. Hauling first meant a full hold
  // beside a wreck field could not sell to the outpost it was parked in — which is
  // exactly the situation you go to an outpost to get out of.
  const mats = Object.keys(hold).filter(mt => (hold[mt] ?? 0) > 0);
  if (mats.length && inOutpost(MAPS[mapId], { x: me2.x, y: me2.y })) {
    const n = mats.reduce((t, mt) => t + hold[mt], 0);
    return { kind: 'fence', label: `sell ${n} of ore to the outpost for ${fmtCredits(pirateValue(hold))} ${CURRENCY.short}` };
  }
  if (atDock && mats.length) {
    const n = mats.reduce((t, mt) => t + hold[mt], 0);
    return { kind: 'stow', mats, label: `stow ${n} of ore into the company hangar` };
  }

  const pod = pods.filter(pd => Math.hypot(pd.x - me2.rx, pd.y - me2.ry) <= SCOOP_R)
                  .sort((a, b) => Math.hypot(a.x - me2.rx, a.y - me2.ry)
                                - Math.hypot(b.x - me2.rx, b.y - me2.ry))[0];
  if (pod) return { kind: 'scoop', pod, label: `haul in ${MATERIALS[pod.mat]?.name ?? 'cargo'}` };
  return { kind: 'none' };
}

// Name a track as it starts, then get out of the way — the folder it came from
// is dropped, and so is the extension, so a filename reads as a title.
onMusicChange(name => say('\u266a  ' + name.split('/').pop().replace(/\.[a-z0-9]+$/i, ''), '#8ab4e6'));
const cam = { x: 0, y: 0 };

// --- net ---------------------------------------------------------------------
// The token is the whole identity. It rides in the connect URL so the server can
// resolve the account before the first frame, with no handshake round trip.
// wss when the page came over https, or the browser refuses it as mixed content.
const WS_PROTO = location.protocol === 'https:' ? 'wss:' : 'ws:';
const ws = new WebSocket(`${WS_PROTO}//${location.host}/?t=${encodeURIComponent(readToken())}`);
const send = o => { if (ws.readyState === 1) ws.send(JSON.stringify(o)); };
ws.onopen  = () => status = 'online';
ws.onclose = () => status = 'disconnected';
// What the server last told us, so a delta has something to be relative to.
// Everything below this line still reads a whole snapshot: a delta is turned
// back into one before it reaches any of it, so there is exactly one snapshot
// reader and a delta cannot drift from a keyframe by growing a second.
const wire = newBase();
ws.onmessage = e => {
  let m = JSON.parse(e.data);
  if (m.t === 'd') {
    // A delta with no baseline is unusable. Ask for a keyframe and drop it —
    // over TCP this only happens on a reconnect that lands mid-tick, but a
    // client quietly applying updates to nothing is a black screen.
    if (!wire.ready) { send({ t: 'need' }); return; }
    m = decodeDelta(wire, m);
  } else if (m.t === 's') absorbFull(wire, m);
  if (m.t === 'welcome') {
    myId = m.id; myCo = m.co; mapId = m.map; myHull = m.hull; myFit = m.fit;
    myGear = m.gear ?? {}; myHulls = m.hulls ?? [myHull]; credits = m.credits ?? 0;
    myDrones = m.drones ?? []; myRig = m.rig ?? null; myXp = m.xp ?? 0; amAdmin = !!m.admin;
    myPlayed = m.played ?? 0;
    myForm = m.formation ?? 'line'; myForms = m.formations ?? ['line'];
    myAmmo = m.ammo ?? {}; myUsing = { ...DEFAULT_AMMO, ...(m.using ?? {}) };
    myArmed = { ...ARMED_ALL, ...(m.armed ?? {}) };
    myKits = m.kits ?? {}; myKit = m.kit ?? DEFAULT_KIT;
    myDevices = m.devices ?? {}; myDevice = m.device ?? DEFAULT_DEVICE;
    myBerths = m.berths ?? []; myFoldTo = m.foldTo ?? null;
    refreshTech();
    myName = m.name ?? '';
    signup = null; joinSaid = '';                 // whoever you are, you are in now
    // Written and then read back. A storage write that silently fails loses the
    // pilot on the next reload, and the only moment we can tell is this one.
    if (m.token) {
      let kept = null;
      try { localStorage.setItem(TOKEN_KEY, m.token); kept = localStorage.getItem(TOKEN_KEY); } catch {}
      if (kept !== m.token)
        say('This browser will not remember you — private window, or storage is blocked', '#e0a53f');
    }
    return;
  }
  if (m.t === 'bumped') { status = 'signed in from another tab'; return; }
  if (m.t === 'chat') {
    chatLog.push({ from: m.from ?? '', co: m.co, text: String(m.text ?? '').slice(0, MAX_LEN), at: performance.now() });
    while (chatLog.length > LOG_KEEP) chatLog.shift();
    return;
  }
  if (m.t === 'fit') {                            // the station confirming a change
    myHull = m.hull; myFit = m.fit;
    myGear = m.gear ?? myGear;
    myHulls = m.hulls ?? myHulls;
    myDrones = m.drones ?? myDrones; myRig = 'rig' in m ? m.rig : myRig;
    myForm = m.formation ?? myForm; myForms = m.formations ?? myForms;
    myAmmo = m.ammo ?? myAmmo; myUsing = m.using ? { ...DEFAULT_AMMO, ...m.using } : myUsing;
    if (m.armed) myArmed = { ...ARMED_ALL, ...m.armed };
    myKits = m.kits ?? myKits; myKit = m.kit ?? myKit;
    myDevices = m.devices ?? myDevices; myDevice = m.device ?? myDevice;
    myBerths = m.berths ?? myBerths; if ('foldTo' in m) myFoldTo = m.foldTo;
    if (typeof m.credits === 'number') credits = m.credits;
    refreshTech();
    return;
  }
  if (m.t === 'reset') {                          // the account is gone; become a stranger
    try { localStorage.removeItem(TOKEN_KEY); } catch {}
    location.reload();
    return;
  }
  if (m.t === 'signup') {
    signup = { companies: m.companies ?? [] };
    if (m.problem) joinSaid = m.problem;
    status = 'choose a callsign';
    return;
  }
  if (m.t === 'bought') {
    if (typeof m.credits === 'number') credits = m.credits;
    toast(m.what, m.cost, m.note);
    return;
  }
  if (m.t === 'award') {
    credits = m.total;
    // A shared bounty that reads exactly like a solo one teaches nobody the system
    // is there, and the first thing you want to know when a stranger joins your
    // fight is whether their help cost you or paid you.
    const split = m.with ? ` — shared ${m.with + 1} ways on ${Math.round(m.share * 100)}% of the damage` : '';
    say(m.promoted
        ? `${COMPANIES[myCo].tag} awards you ${fmtCredits(m.amount)} ${CURRENCY.short} — and promotes you to level ${m.level}${split}`
        : `${COMPANIES[myCo].tag} awards you ${fmtCredits(m.amount)} ${CURRENCY.short}` +
          (m.xp ? ` and ${m.xp} XP` : '') + ` for a ${m.what}${split}`,
        m.promoted ? '#7de08a' : '#ffd479');
    return;
  }
  // The server echoes whatever we stamped, so the round trip is measured on one
  // clock and the two machines never have to agree what time it is.
  if (m.t === 'pong') { pushSample(pingSamples, performance.now() - (m.at ?? 0)); return; }
  if (m.t === 'dead')    { dead = { lost: m.lost ?? {}, toll: m.toll ?? 0, at: performance.now() };
                           if (m.toll) credits = Math.max(0, credits - m.toll);
                           return; }
  if (m.t === 'map') {
    mapId = m.map; ships.clear(); prevShot.clear(); marker = null; prevSelf = null;
    // The sector changed, so everything the baseline holds is about somewhere
    // else. The server sends a keyframe on the first tick after a jump for the
    // same reason; this is the client refusing to apply anything until it lands.
    wire.ready = false;
    if (m.respawned) dead = null;
    return;
  }
  if (m.t !== 's') return;
  bolts = (m.bolts ?? []).map(unpackBolt);
  rockets = (m.rockets ?? []).map(unpackRocket);
  snapAt = performance.now();
  blasts = (m.blasts ?? []).map(unpackBlast);
  pyres  = (m.pyres ?? []).map(unpackPyre);
  {                                               // a blast is new the first time we see it low
    const self0 = ships.get(myId);
    for (const b of blasts) {
      const key = `${b.x},${b.y},${b.r}`;
      if (b.p > 0.4 || heardBooms.has(key)) continue;
      heardBooms.add(key);
      explosion(self0 ? Math.hypot(b.x - self0.x, b.y - self0.y) : 0, !!b.foe);
    }
    if (heardBooms.size > 80) heardBooms.clear();
  }
  pods = (m.pods ?? []).map(unpackPod);
  numbers = (m.hits ?? []).map(unpackHit);
  // Research stations in this sector. Nothing on one ever moves, so the delta
  // never mentions them again after the keyframe — but the decoder hands back a
  // whole snapshot either way, so this is just a read.
  labs = new Map((m.labs ?? []).map(unpackLab).map(l => [l.id, l]));
  if ('lab' in m) myLab = m.lab;
  hold = m.hold ?? {}; cargoCap = m.cap ?? cargoCap;
  vault = m.vault ?? vault;
  // The balance, and the moment it was true. Everything between banks is drawn by
  // running forward from here at the rate the server stated — see liveCredits.
  if (typeof m.credits === 'number' && m.credits !== creditsSeen) {
    creditsSeen = m.credits; creditsAt = performance.now();
  }
  credits = m.credits ?? credits;
  atDock = !!m.docked; scoop = m.scoop ?? null; want = m.want ?? null;
  myGear = m.gear ?? myGear;
  if (m.ammo) myAmmo = m.ammo;
  if (m.using) myUsing = { ...DEFAULT_AMMO, ...m.using };
  if (m.armed) myArmed = { ...ARMED_ALL, ...m.armed };
  if (m.kits) myKits = m.kits;
  if (m.kit) myKit = m.kit;
  if (m.devices) myDevices = m.devices;
  if (m.device) myDevice = m.device;
  if (m.berths) myBerths = m.berths;
  if (m.kills) myKills = m.kills;
  if ('foldTo' in m) myFoldTo = m.foldTo;
  if (m.power) power = m.power;
  if (typeof m.shieldNow === 'number') { shieldNow = m.shieldNow; shieldTop = m.shieldMax; }
  if (m.drones) { myDrones = m.drones; refreshTech(); }
  if ('rig' in m) myRig = m.rig;
  // Whether the plating is still there to take a hit for you. It rides in the
  // viewer's own bag rather than on the ship row because nobody else can see it.
  if (typeof m.plate === 'number') myPlate = !!m.plate;
  if (typeof m.played === 'number') myPlayed = m.played;
  if (typeof m.online === 'number') myOnline = m.online;
  if (m.rank) { myRank = m.rank; myXp = m.xp ?? myXp; }
  const seen = new Set();
  for (const raw of m.ships) {
    const n = unpackShip(raw);
    seen.add(n.id);
    const s = ships.get(n.id) ?? { rx: n.x, ry: n.y };
    Object.assign(s, n);
    ships.set(n.id, s);
  }
  const self = ships.get(myId);
  if (self) {                                    // the wire carries a flash, not a timestamp
    const wasHp = prevHp;
    if ((self.flash ?? 0) > 0 || (wasHp !== null && self.hp < wasHp)) lastHitAt = performance.now();
    prevHp = self.hp;
  }
  for (const [id, sh] of ships) {
    const was = prevShot.get(id) ?? 0;
    const d = self ? Math.hypot(sh.x - self.x, sh.y - self.y) : 1e9;
    if (sh.shot > 60 && was <= 60 && sh.vis !== STALE) laser(id === myId, d);
    const wasRk = prevRocket.get(id) ?? 0;
    if ((sh.rk ?? 0) > 60 && wasRk <= 60 && sh.vis !== STALE) rocket(id === myId, d);
    prevShot.set(id, sh.shot);
    prevRocket.set(id, sh.rk ?? 0);
  }
  for (const id of ships.keys()) if (!seen.has(id)) { ships.delete(id); prevShot.delete(id); prevRocket.delete(id); }
};

// --- input -------------------------------------------------------------------
// A tap is a destination. A hold is a throttle+heading, resent every tick because
// the ship (and the camera under the cursor) keeps moving while you hold still.
const HOLD_MS = 150, DRAG_PX = 10;
let held = false, steering = false, downAt = 0, cur = { x: 0, y: 0 }, down = { x: 0, y: 0 };
const steerDown = new Set();      // WASD currently held
let keySteer = false;             // ...and whether they were steering last flush
let hover = null, lastClick = { t: -1e9, x: 0, y: 0 };
let lastTab = -Infinity;          // never a double tap on the first press after load
const DOUBLE_TAP = 320;           // ms — the same window a double click uses
const PICK_SLACK = 30, DOUBLE_MS = 320, DOUBLE_PX = 26;
let marker = null;                                    // your last move order, for display

const toView = e => {
  const r = c.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (VIEW_W / r.width),
           y: (e.clientY - r.top)  * (VIEW_H / r.height) };
};
// Screen and world, and these two must stay each other's inverse — the draw path
// is `g.scale(zoom, zoom); g.translate(-cam.x, -cam.y)`, so screen = (world - cam) * zoom.
// Every conversion goes through one of these. Doing it by hand is what broke
// course plotting: the move order read `v.x + cam.x`, which equals toWorld only
// while zoom is 1, and zoom drops below 1 on any window shorter than 2 * SIGHT_R
// (1120px) — most of them. Courses landed short by a factor of zoom, measured
// from the top-left of the view, so the further from that corner you clicked the
// further the ship stopped from your cursor. Steering had the same confusion
// pointing the other way, which skewed both its heading and its throttle.
const toWorld  = v => ({ x: v.x / zoom + cam.x, y: v.y / zoom + cam.y });
const toScreen = p => ({ x: (p.x - cam.x) * zoom, y: (p.y - cam.y) * zoom });

// A berth you rent is the same counter as your own dock for everything the panel
// does — and it shuts the instant something hits you, which your own ring does not.
const inMyOutpost = () => {
  const me = ships.get(myId);
  return !!me && inOutpost(MAPS[mapId], { x: me.x, y: me.y });
};
const berthWhy = () => whyNotBerth({
  owned: myBerths.includes(mapId), inside: inMyOutpost(), sinceHit: sinceHitSecs(),
});
const docked = () => {
  const me = ships.get(myId);
  return (!!me && canDock(MAPS[mapId], myCo, { x: me.x, y: me.y })) || !berthWhy();
};

// Nearest hostile to a world point, within a forgiving radius. Demanding a direct
// hit on a 15px hull that is also moving made engaging anything a chore.
function hostileAt(wx, wy) {
  let best = null, bestD = Infinity;
  for (const [id, sh] of ships) {
    if (sh.co !== 'x' || sh.vis === STALE) continue;
    const d = Math.hypot(sh.rx - wx, sh.ry - wy);
    if (d < rOf(sh) + PICK_SLACK && d < bestD) { bestD = d; best = id; }
  }
  return best;
}

// Cargo is hauled in on purpose: you click it, and the tractor takes a moment.
function podAt(wx, wy) {
  let best = null, bestD = Infinity;
  for (const p of pods) {
    // Somebody else's share of a shared kill is not yours to click. Offering it
    // and then having the server refuse would be the worse half of both.
    if (!mayScoop(p, myId)) continue;
    const d = Math.hypot(p.x - wx, p.y - wy);
    if (d < 34 && d < bestD) { bestD = d; best = p; }
  }
  return best;
}

function nearestHostile() {
  const me = ships.get(myId);
  if (!me) return null;
  let best = null, bestD = Infinity;
  for (const [id, sh] of ships) {
    if (sh.co !== 'x' || sh.vis === STALE) continue;
    const d = Math.hypot(sh.rx - me.rx, sh.ry - me.ry);
    if (d < bestD) { bestD = d; best = id; }
  }
  return best;
}
addEventListener('keydown', e => {
  audioReady();                                   // browsers want a gesture first
  setPicker(drawNext);
  setLeveller(levelStep);
  startMusic(poolOf);
  stir();

  if (chatOpen) {                                 // the line owns the keyboard
    if (e.key === 'Enter') {
      e.preventDefault();
      if (chatLine.trim()) send({ t: 'chat', text: chatLine });
      chatLine = ''; chatOpen = false;
      return;
    }
    if (e.key === 'Escape')    { e.preventDefault(); chatLine = ''; chatOpen = false; return; }
    if (e.key === 'Backspace') { e.preventDefault(); chatLine = chatLine.slice(0, -1); return; }
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      if (chatLine.length < MAX_LEN) chatLine += e.key;
    }
    return;
  }
  if (signup) return joinKey(e);                 // the form owns the keyboard
  if (e.key === 'Enter' && !dead) { e.preventDefault(); chatOpen = true; chatLine = ''; steerDown.clear(); return; }

  const k = e.key.toLowerCase();
  // preventDefault or the arrows scroll the page out from under the canvas.
  if (!dead && STEER_KEYS[k]) { steerDown.add(k); e.preventDefault(); }
  if (k === 'v') say(toggleAudio() ? 'Sound on' : 'Sound off', '#8ab4e6');
  if (k === 'm') { sysOpen = !sysOpen; bayOpen = false; }
  if (k === 'h') { if (picking) { picking = null; return; }        // back out of the chooser first
                   // At an outpost you have no bay at, the station key offers you
                   // one rather than doing nothing — a dead key reads as a bug.
                   if (!bayOpen && inMyOutpost() && !myBerths.includes(mapId)) {
                     berthOpen = !berthOpen; sysOpen = invOpen = false; return;
                   }
                   berthOpen = false;
                   bayOpen = !bayOpen; sysOpen = false; invOpen = false; }
  // 4 is the hull's own system. The Hauler has none, so the key says so rather
  // than silently doing nothing — a dead key reads as a bug.
  if (k === '1' || k === '2' || k === '3') send({ t: 'power', sys: SYSTEMS[+k - 1] });
  if (k === '4') {
    const ab = ABILITIES[HULLS[myHull]?.ability];
    if (ab) send({ t: 'power', sys: SPECIAL });
    else say('A Hauler has no system of its own — route to 1, 2 or 3', '#66748c');
  }
  if (k === 'i') { invOpen = !invOpen; sysOpen = false; bayOpen = false; }
  // R for research. Its own key rather than a SPACE action, because SPACE is
  // whatever you are standing on and this is a place you go to on purpose.
  if (k === 'r') { labOpen = !labOpen; labConfirm = false; sysOpen = false; bayOpen = false; invOpen = false; }
  // L for the logbook. Readable anywhere, because it is a reference document and
  // the moment you want it is the moment something unfamiliar is shooting at you.
  if (k === 'l') { fileOpen = !fileOpen; fileWant = fileAt = 0; sysOpen = false; bayOpen = false; invOpen = false; labOpen = false; }
  if (k === 'o') { setOpen = !setOpen; sysOpen = bayOpen = invOpen = false; }
  if (k === 'n') { nextTrack(); }
  if (e.key === '[' || e.key === ']') {
    const v = setMusicVolume(musicVolume() + (e.key === ']' ? MUSIC_VOL_STEP : -MUSIC_VOL_STEP));
    say(`Music ${Math.round(v * 100)}%`, '#8ab4e6');
  }
  if (k === 'q') cycleAmmo('laser');
  if (k === 'e') cycleAmmo('rocket');
  if (k === 'x') send({ t: 'target', id: 0 });     // break off
  if (e.key === 'Tab') {                          // engage the closest thing on the plot
    e.preventDefault();
    // Twice quickly is the opposite order. Engaging and breaking off are the
    // same thought, so they should be the same key rather than TAB and then X.
    const now3 = performance.now();
    if (now3 - lastTab < DOUBLE_TAP) { lastTab = 0; return send({ t: 'target', id: 0 }); }
    lastTab = now3;
    const n = nearestHostile();
    if (n !== null) send({ t: 'target', id: n });
  }
  if (k === 'k') send({ t: 'dev-damage' });        // self-damage, for watching the shield timer
  if (dead && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); send({ t: 'respawn' }); return; }
  if (e.key === ' ') {                            // one action key
    e.preventDefault();
    const act = spaceAction();
    if (act.kind === 'scoop') {
      if (holdFullFor(hold, act.pod.mat, cargoCap))
        return say(`Hold is full — no room for ${MATERIALS[act.pod.mat]?.name ?? 'that'}`, '#e0a53f');
      return send({ t: 'scoop', id: act.pod.id });
    }
    if (act.kind === 'stow') {
      for (const mt of act.mats) send({ t: 'stash', mat: mt });
      return say(`Stowed ${act.mats.length} stack${act.mats.length === 1 ? '' : 's'}`, '#7de08a');
    }
    if (act.kind === 'jump') return send({ t: 'jump' });
    if (act.kind === 'fence') return send({ t: 'fence' });
    return say(atDock ? 'Nothing in the hold to stow' : 'Nothing in reach to haul in', '#66748c');
  }
  if (e.key === 'Escape') {
    // Escape closes whatever is on top, and once there is nothing left to close
    // it opens the menu — which is where anything that is not flying the ship
    // ends up living.
    if (patchOpen) { patchOpen = false; return; }
    if (berthOpen) { berthOpen = false; return; }
    if (leaving()) { cancelLeaving('Staying'); return; }
    if (setOpen) { setOpen = false; return; }
    if (feedOpen) { feedOpen = null; return; }
    if (picking) { picking = null; return; }
    if (sysOpen || bayOpen || invOpen || labOpen || fileOpen) { sysOpen = bayOpen = invOpen = labOpen = fileOpen = false; return; }
    setOpen = true;
    return;
  }
});

c.addEventListener('pointerdown', e => {
  audioReady();
  setPicker(drawNext);
  setLeveller(levelStep);
  startMusic(poolOf);
  stir();
  if (signedOff) { location.reload(); return; }
  const v = toView(e);
  if (dead) {                                     // a wreck has exactly one control
    const b = respawnBtn();
    if (v.x > b.x && v.x < b.x + b.w && v.y > b.y && v.y < b.y + b.h) send({ t: 'respawn' });
    return;
  }
  if (signup) { joinClick(v); return; }
  // The changelog is hit-tested before anything else, because it is drawn over
  // everything else. Anywhere off it closes it, so it never needs its own button.
  {
    const pb = patchIcon(VIEW_W);
    if (v.x > pb.x && v.x < pb.x + pb.w && v.y > pb.y && v.y < pb.y + pb.h) {
      patchOpen = !patchOpen; patchScroll = 0; return;
    }
    if (patchOpen) {
      // A click inside is somebody reading it, not somebody dismissing it.
      const pp = patchPanel(VIEW_W, VIEW_H, patchScroll).panel;
      if (!(v.x > pp.x && v.x < pp.x + pp.w && v.y > pp.y && v.y < pp.y + pp.h)) patchOpen = false;
      return;
    }
  }
  if (leaving()) { cancelLeaving('Staying'); return; }
  if (berthOpen) {
    const L = berthPanel(VIEW_W, VIEW_H);
    if (v.x > L.buy.x && v.x < L.buy.x + L.buy.w && v.y > L.buy.y && v.y < L.buy.y + L.buy.h) {
      const why = whyNotBuyBerth({ xp: myXp, credits, owned: myBerths.includes(mapId), inside: inMyOutpost() });
      if (why) return say(why, '#e0a53f');
      send({ t: 'buyberth' });
      berthOpen = false;
      return;
    }
    berthOpen = false;                             // anywhere else puts the offer away
    return;
  }
  if (setOpen) { settingsClick(v); return; }
  if (sysOpen) { sysOpen = false; return; }
  if (bayOpen) { bayClick(v); return; }           // click anywhere dismisses the chart
  if (fileOpen) { fileClick(v); return; }
  if (labOpen) { labClick(v); return; }
  if (invOpen) { invClick(v); return; }
  if (barClick(v)) return;                        // the ammunition bar sits over the world
  const sb = sysBtn();
  if (v.x > sb.x && v.x < sb.x + sb.w && v.y > sb.y && v.y < sb.y + sb.h) { sysOpen = true; return; }
  const b = btn();
  if (v.x > b.x && v.x < b.x + b.w && v.y > b.y && v.y < b.y + b.h) return send({ t: 'jump' });
  const w = toWorld(v);
  const pick = hostileAt(w.x, w.y);
  if (pick !== null) { lastClick = { t: performance.now(), x: v.x, y: v.y }; return send({ t: 'target', id: pick }); }
  const can = podAt(w.x, w.y);
  if (can) { lastClick = { t: performance.now(), x: v.x, y: v.y };
             marker = { x: can.x, y: can.y };        // show the course you just ordered
             {
               if (holdFullFor(hold, can.mat, cargoCap))
                 return say(`Hold is full — no room for ${MATERIALS[can.mat]?.name ?? 'that'}`, '#e0a53f');
               return send({ t: 'scoop', id: can.id });
             } }

  // Double-click on empty space breaks off. Single click still just sets a course,
  // and the second click repeats that harmlessly.
  const now2 = performance.now();
  if (now2 - lastClick.t < DOUBLE_MS && Math.hypot(v.x - lastClick.x, v.y - lastClick.y) < DOUBLE_PX) {
    send({ t: 'target', id: 0 });
    lastClick.t = -1e9;
  } else lastClick = { t: now2, x: v.x, y: v.y };

  if (v.x > MM_X && v.y > MM_Y) {                     // minimap click = destination order
    marker = { x: clamp((v.x - MM_X) / MM_W * MAP_W, 0, MAP_W),
               y: clamp((v.y - MM_Y) / MM_H * MAP_H, 0, MAP_H) };   // the minimap IS charted space
    return send({ t: 'intent', mode: 'pt', x: marker.x, y: marker.y });
  }
  held = true; steering = false; downAt = performance.now(); cur = down = v;
  c.setPointerCapture(e.pointerId);
  marker = toWorld(v);
  send({ t: 'intent', mode: 'pt', x: marker.x, y: marker.y });   // instant response on tap
});
c.addEventListener('pointermove', e => {
  const v = toView(e);
  hover = v;
  if (dragging) return settingsDrag(v);                      // a fader follows the pointer
  if (held) stir();                                          // tracked always, so we can preview the pick
  if (!held) return;
  cur = v;
  if (Math.hypot(cur.x - down.x, cur.y - down.y) > DRAG_PX) steering = true;
});
// Releasing is never conditional. keyup is deliberately outside every mode check
// the keydown handler makes, because a key pressed while flying and released
// after opening the chat would otherwise stay down forever — and so would every
// key held at the moment the window lost focus, which is what alt-tabbing mid-burn
// does. A ship that flies off on its own with nothing touching the keyboard is
// the single worst bug this input can have.
// The changelog is the only thing in the game long enough to need scrolling, so
// the wheel is claimed only while it is open and left alone otherwise.
addEventListener('wheel', e => {
  // Two things scroll, and the changelog is drawn over everything, so it wins.
  if (patchOpen) {
    e.preventDefault?.();
    patchScroll = Math.max(0, patchScroll + (e.deltaY > 0 ? 3 : -3));
    return;
  }
  if (fileOpen) {
    e.preventDefault?.();
    // Clamped at BOTH ends. Unbounded above, scrolling past the last entry kept
    // counting, so coming back up did nothing until every phantom step had been
    // undone — which reads exactly like a panel that does not scroll at all.
    // In pixels, and clamped at BOTH ends. Unbounded above, scrolling past the
    // last entry kept counting, so coming back did nothing until every phantom
    // step had been undone — which reads exactly like a panel that does not scroll.
    const max = filePanel(VIEW_W, VIEW_H, 0, filedIn(myKills).length).maxScroll;
    const step = Math.max(40, Math.min(140, Math.abs(e.deltaY) || 60));
    fileWant = Math.max(0, Math.min(max, fileWant + Math.sign(e.deltaY) * step));
    return;
  }
  if (bayOpen && (bayTab === 'store' || bayTab === 'inventory' || bayTab === 'stats')) {
    e.preventDefault?.();
    bayScroll = Math.max(0, bayScroll + (e.deltaY > 0 ? 2 : -2));
  }
}, { passive: false });
addEventListener('keyup', e => steerDown.delete(e.key.toLowerCase()));
addEventListener('blur', () => steerDown.clear());
c.addEventListener('pointerleave', () => hover = null);
addEventListener('pointerup', () => {
  if (held && steering) { send({ t: 'intent', mode: 'stop' }); marker = null; }
  held = false; steering = false; dragging = null;
});

setInterval(() => {                                   // flush at the server tick rate
  // The keyboard outranks the mouse so you can take the ship off a plotted course
  // by just reaching for WASD, without having to click something first.
  const key = steerVector(steerDown);
  if (key) {
    marker = null; keySteer = true;
    return send({ t: 'intent', mode: 'dir', dx: key.dx, dy: key.dy });
  }
  if (keySteer) {                                     // the last key came up
    keySteer = false;
    if (!held) return send({ t: 'intent', mode: 'stop' });
  }
  if (!held) return;
  if (!steering && performance.now() - downAt > HOLD_MS) steering = true;
  if (!steering) return;
  const me = ships.get(myId);
  if (!me) return;
  const at = toScreen({ x: me.rx, y: me.ry });         // where the hull actually is on screen
  const dx = cur.x - at.x, dy = cur.y - at.y;
  const d = Math.hypot(dx, dy);
  const throttle = Math.min(1, d / SLOW_RADIUS);      // point near yourself = crawl
  marker = null;
  send(d < 1 ? { t: 'intent', mode: 'stop' }
             : { t: 'intent', mode: 'dir', dx: (dx / d) * throttle, dy: (dy / d) * throttle });
}, 1000 / 30);

// --- starfield: hashed grid, infinite, zero storage ---------------------------
const hash = (x, y, s) => {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(s, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};
const LAYERS = [
  { p: 0.30, cell:  70, size: 1.0, a: 0.45 },
  { p: 0.60, cell: 110, size: 1.7, a: 0.60 },
  { p: 1.00, cell: 190, size: 2.5, a: 0.85 },
];
function drawStars() {
  g.fillStyle = '#cfe4ff';
  LAYERS.forEach((L, li) => {
    const ox = cam.x * L.p * zoom, oy = cam.y * L.p * zoom;   // stars keep their screen size
    const cx0 = Math.floor(ox / L.cell), cx1 = Math.floor((ox + VIEW_W) / L.cell);
    const cy0 = Math.floor(oy / L.cell), cy1 = Math.floor((oy + VIEW_H) / L.cell);
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
      const b = hash(cx, cy, li * 97 + 3);
      if (b < 0.35) continue;
      g.globalAlpha = L.a * (0.35 + b * 0.65);
      g.fillRect(cx * L.cell + hash(cx, cy, li * 97 + 1) * L.cell - ox,
                 cy * L.cell + hash(cx, cy, li * 97 + 2) * L.cell - oy, L.size, L.size);
    }
  });
  g.globalAlpha = 1;
}

// --- star system chart -------------------------------------------------------
// All geometry lives in shared/chart.js so the tests verify the same router that
// draws here. This function is purely paint.
function drawSystem(me) {
  const { rects, links, stubs, NW, NH } = chartLayout(VIEW_W, VIEW_H);
  const small = NW < 104;

  g.fillStyle = 'rgba(3,5,9,0.92)'; g.fillRect(0, 0, VIEW_W, VIEW_H);

  for (const L of links) {                                  // long routing, under the nodes
    g.strokeStyle = L.own ? COMPANIES[L.own].color + '66' : 'rgba(224,90,90,0.50)';
    g.lineWidth = L.own ? 1.8 : 2.4;
    g.lineJoin = 'round';
    g.beginPath(); g.moveTo(L.pts[0][0], L.pts[0][1]);
    for (const [x, y] of L.pts.slice(1)) g.lineTo(x, y);
    g.stroke();
  }

  for (const [id, r] of rects) {
    const m = MAPS[id], here = id === mapId;
    const kx = r.w / MAP_W, ky = r.h / MAP_H;

    g.save();
    g.beginPath(); g.rect(r.x, r.y, r.w, r.h); g.clip();
    g.fillStyle = '#070b11'; g.fillRect(r.x, r.y, r.w, r.h);
    g.globalAlpha = 0.17; g.fillStyle = m.tint; g.fillRect(r.x, r.y, r.w, r.h);
    for (const [x, y, rad, col] of m.neb) {
      const cx = r.x + x * kx, cy = r.y + y * ky, rr = rad * kx;
      const grd = g.createRadialGradient(cx, cy, 0, cx, cy, rr);
      grd.addColorStop(0, col); grd.addColorStop(1, 'transparent');
      g.globalAlpha = 0.8; g.fillStyle = grd; g.fillRect(cx - rr, cy - rr, rr * 2, rr * 2);
    }
    g.globalAlpha = 0.45; g.fillStyle = '#cfe4ff';
    const sd = id.charCodeAt(0) * 31 + id.charCodeAt(1);
    for (let i = 0; i < 22; i++) g.fillRect(r.x + hash(i, 7, sd) * r.w, r.y + hash(i, 11, sd) * r.h, 1, 1);
    g.globalAlpha = 1;
    g.restore();

    for (const st of stubs) {                               // last stretch, over its own preview
      if (st.map !== id) continue;
      g.globalAlpha = 0.6; g.lineWidth = 1.2;
      g.strokeStyle = st.own ? COMPANIES[st.own].color : '#e08a8a';
      g.beginPath(); g.moveTo(st.from.x, st.from.y); g.lineTo(st.to_.x, st.to_.y); g.stroke();
      g.globalAlpha = 1;
      g.fillStyle = MAPS[st.to].tint;
      g.fillRect(st.from.x - 2.5, st.from.y - 2.5, 5, 5);
    }

    // Anywhere you can trade is worth finding from the chart. The outpost was on
    // the sector plot only, which is no help at all when the question is which
    // sector to fly to.
    if (m.outpost) {
      const ox = r.x + m.outpost.x * kx, oy = r.y + m.outpost.y * ky;
      g.strokeStyle = '#e0a53f'; g.lineWidth = 1;
      g.setLineDash([2, 2]);
      g.beginPath(); g.arc(ox, oy, Math.max(3, m.outpost.r * kx), 0, 7); g.stroke();
      g.setLineDash([]);
      g.fillStyle = '#e0a53f';                       // a lopsided mark, like the hulk itself
      g.beginPath();
      for (let i = 0; i < 5; i++) {
        const a2 = (i / 5) * Math.PI * 2 - Math.PI / 2, rr = i % 2 ? 3 : 5.5;
        i ? g.lineTo(ox + Math.cos(a2) * rr, oy + Math.sin(a2) * rr)
          : g.moveTo(ox + Math.cos(a2) * rr, oy + Math.sin(a2) * rr);
      }
      g.closePath(); g.fill();
      g.strokeStyle = '#05070b'; g.lineWidth = 1; g.stroke();
    }

    if (m.home) {
      g.fillStyle = COMPANIES[m.owner].color;
      const cx = r.x + m.base.x * kx, cy = r.y + m.base.y * ky;
      g.strokeStyle = COMPANIES[m.owner].color + '99'; g.lineWidth = 1;
      g.beginPath(); g.arc(cx, cy, m.base.r * kx, 0, 7); g.stroke();
      g.beginPath();
      g.moveTo(cx, cy - 7); g.lineTo(cx + 7, cy); g.lineTo(cx, cy + 7); g.lineTo(cx - 7, cy);
      g.closePath(); g.fill();
      g.strokeStyle = '#05070b'; g.lineWidth = 1; g.stroke();
    }
    if (here && me) {
      g.fillStyle = '#fff';
      g.beginPath(); g.arc(r.x + me.rx * kx, r.y + me.ry * ky, 3, 0, 7); g.fill();
    }

    // fill is the region's own theme; the OUTLINE is who holds it
    if (m.owner) { g.strokeStyle = COMPANIES[m.owner].color; g.lineWidth = 2; }
    else         { g.strokeStyle = '#8a94a8'; g.lineWidth = 1.4; g.setLineDash([4, 3]); }
    g.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);
    g.setLineDash([]);
    if (here) { g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.strokeRect(r.x - 3.5, r.y - 3.5, r.w + 7, r.h + 7); }

    g.textAlign = 'center';
    g.font = (small ? '10px' : '11px') + ' ui-monospace, monospace';
    g.fillStyle = here ? '#fff' : m.tint;
    g.fillText(m.name.split(' · ')[0] + (here ? '  ◂ you' : ''), r.x + r.w / 2, r.y + r.h + 14);
    g.fillStyle = '#66748c'; g.font = (small ? '9px' : '10px') + ' ui-monospace, monospace';
    g.fillText(m.theme.toUpperCase(), r.x + r.w / 2, r.y + r.h + 26);
  }

  g.textAlign = 'center'; g.fillStyle = '#8ab4e6'; g.font = '15px ui-monospace, monospace';
  g.fillText('KNOWN SPACE · STAR SYSTEM', VIEW_W / 2, 30);
  let lx = VIEW_W / 2 - 306;
  g.font = '11px ui-monospace, monospace'; g.textAlign = 'left';
  for (const [co, f] of Object.entries(COMPANIES)) {
    g.strokeStyle = f.color; g.lineWidth = 2; g.strokeRect(lx + .5, 43.5, 11, 11);
    g.fillStyle = co === myCo ? '#fff' : '#7f8ea8';
    g.fillText(`${f.tag} — ${f.name}${co === myCo ? '  ◂ you' : ''}`, lx + 18, 53);
    lx += 208;
  }
  g.strokeStyle = '#8a94a8'; g.lineWidth = 1.4; g.setLineDash([4, 3]);
  g.strokeRect(VIEW_W / 2 - 306.5, 62.5, 11, 11); g.setLineDash([]);
  g.fillStyle = '#7f8ea8';
  g.fillText('CONTESTED — nobody holds it.   The fill is the region; the outline is its owner.',
             VIEW_W / 2 - 288, 72);
  g.textAlign = 'center'; g.fillStyle = '#5b6b85'; g.font = '12px ui-monospace, monospace';
  g.fillText('click anywhere or press M to close', VIEW_W / 2, VIEW_H - 18);
  g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
}

// --- station: hangar and store ------------------------------------------------
// Geometry lives in one place so drawing and hit-testing can never disagree
// about where a row is. Two tabs: HANGAR arranges what you own, STORE spends
// money, paged by category so one column never holds everything at once.
let bayTab = 'hangar', bayPage = 'ships';
// Which empty slot is asking to be filled. Null unless a chooser is open.
let picking = null;

const lockerFor = slot => fitsIn(slot, { gear: myGear, fit: myFit, drones: myDrones });
const pickGeom = () => {
  if (!picking) return null;
  const G = bayGeom();
  const row = G.racks.find(r => !r.header && r.slot === picking.slot && r.index === picking.index);
  const items = lockerFor(picking.slot);
  return row && items.length ? { G, row, ...pickerLayout(G, row, items) } : null;
};

let bayScroll = 0;                        // how far down the current shelf we are
const bayGeom = () => bayLayout(VIEW_W, VIEW_H, {
  tab: bayTab, page: bayPage, hull: myHull, drones: myDrones.length,
  hulls: myHulls, formations: myForms, gear: myGear, scroll: bayScroll,
  // The STATS tab reads the whole ship, because it shows how the ship was arrived
  // at. Same fit the game resolves, so the breakdown cannot disagree with the bars.
  fit: myFit, escort: myDrones, rig: myRig, formation: myForm, mask: myLab?.mods ?? 0 });

// The ship as the rules see it. The reactor ceiling lives in here now, so the
// readout has to ask the ship rather than a constant.
// One place the fitted technologies are resolved, called by the two messages that
// can change a fit. Recomputing it per frame would be a fresh Set sixty times a
// second for something that changes when you press a button in the station.
function refreshTech() { myTech = techSet(myFit, myDrones); }
// How much of the drift margin the compensator is currently nulling, in px. The
// server has the ship and calls shearGrace; here the capacitor arrives as a
// percentage in the power payload, which is the same fraction shearGrace scales
// SHEAR_GRACE by — one constant, two ways in, and no second opinion about where
// the wall is.
const shearHeld = () => (hasTech(myTech, 'compensator') ? SHEAR_GRACE * (power.cap ?? 0) / 100 : 0);
// The ship the SERVER is simulating, which is not what resolve() alone returns.
//
// resolve() answers what the shops sold you; newShip and refit both wrap it in
// applyResearch, so a pilot with one shield tier is flying 7,400 while this said
// 3,700. Everything downstream inherited the error — the readout under-reported the
// ship, and the research panel quoted "your shield 3,700 -> 7,400" for a rung that
// actually takes 7,400 to 14,800, which is the whole reason a pilot reads that line.
//
// Two copies of "what is this ship", and they disagreed the moment research existed.
const myStats = () =>
  applyResearch(resolve(myHull, myFit, escortOf(myDrones, myRig), myForm), myLab?.mods ?? 0);
const shipCtx = () => ({ hull: myHull, fit: myFit, drones: escortOf(myDrones, myRig), formation: myForm,
                         gear: myGear, hulls: myHulls, formations: myForms, credits,
                         ammo: myAmmo, kits: myKits, devices: myDevices });

function bayClick(v) {
  const G = bayGeom();
  const inside = r => v.x > r.x && v.x < r.x + r.w && v.y > r.y && v.y < r.y + r.h;

  // The chooser is drawn over the rows, so it must be hit-tested before them.
  // Anything outside it simply puts it away.
  const P0 = pickGeom();
  if (P0) {
    for (const { k, r } of P0.rows) if (inside(r)) {
      const to = picking;
      picking = null;
      return to.slot === 'drone' ? send({ t: 'dronefit', index: to.index, item: k })
           : to.slot === 'rig'     ? send({ t: 'rigfit', item: k })
                                   : send({ t: 'install', item: k });
    }
    picking = null;
    if (inside(P0.box)) return;
  }

  if (!inside(G.panel)) { bayOpen = false; return; }

  // Looking is free. Tabs and pages work anywhere, so you can price a rack on
  // the way home and know what to fly back for — it was refusing every click
  // when you were not docked, which also meant the panel stuck on whichever tab
  // you happened to be on when you left the ring.
  for (const t of G.tabs) if (inside(t.r)) { bayTab = t.key; bayScroll = 0; picking = null; return; }
  for (const p of G.pages) if (inside(p.r)) { bayPage = p.key; bayScroll = 0; return; }

  // Spending and fitting are not free.
  const atRing = docked();
  const needDock = () => (say('Fly into your base ring — only ammunition is sold out here', '#e0a53f'), true);

  if (bayTab === 'hangar') {
    for (const { k, r } of G.hulls) if (inside(r)) {
      if (k === myHull) return;
      if (!atRing) return needDock();
      return send({ t: 'hull', key: k });               // owned only in here; buying is the store's job
    }
    for (const row of G.racks) {
      if (row.header || !inside(row.r)) continue;
      if (!atRing) return needDock();
      if (row.slot === 'form') {
        if (row.key === myForm) return;
        return send({ t: 'formation', key: row.key });
      }
      if (row.slot === 'drone' && myDrones[row.index]) return send({ t: 'dronestrip', index: row.index });
      if (row.slot === 'rig') {
        if (myRig) return send({ t: 'rigstrip' });
        const rigs = lockerFor('rig');
        if (!rigs.length) return say('No collector rig yet — buy one on the Drones page', '#8ab4e6');
        if (rigs.length === 1) return send({ t: 'rigfit', item: rigs[0] });
        picking = { slot: 'rig', index: 0 };
        return;
      }
      if (row.slot !== 'drone' && (myFit[row.slot] ?? [])[row.index])
        return send({ t: 'uninstall', slot: row.slot, index: row.index });
      // Empty: ask, do not guess. Guessing meant a pilot holding MK-Vs got MK-Is.
      const stock = lockerFor(row.slot);
      if (!stock.length) return say(row.slot === 'drone' ? 'Nothing spare to mount — buy a module in the STORE tab'
                                                        : `Nothing spare fits a ${row.slot} slot — buy one in the STORE tab`,
                                    '#8ab4e6');
      if (stock.length === 1) return row.slot === 'drone' ? send({ t: 'dronefit', index: row.index, item: stock[0] })
                                                          : send({ t: 'install', item: stock[0] });
      picking = { slot: row.slot, index: row.index };
      return;
    }
    return;
  }

  for (const it of G.store) {
    if (!inside(it.r)) continue;
    // The inventory is not a shop page, so the shop's where-can-I-buy-this rule
    // does not apply to it — bayPage is whatever shelf you last looked at, and
    // letting that decide whether you may break up a spare emitter was an accident
    // waiting to be a bug. Breaking up has its own rule, and it is asked below.
    if (it.kind !== 'own' && it.kind !== 'ownhull' && !sellsAt(bayPage, atRing)) return needDock();
    if (it.kind === 'hull') {
      if (it.owned) return it.k === myHull ? undefined : send({ t: 'hull', key: it.k });
      return credits >= HULLS[it.k].price ? send({ t: 'buyhull', key: it.k })
        : say(`A ${HULLS[it.k].name} costs ${fmtCredits(HULLS[it.k].price)} ${CURRENCY.short}`, '#e0a53f');
    }
    if (it.kind === 'form') {
      if (it.owned) return it.k === myForm ? undefined : send({ t: 'formation', key: it.k });
      return credits >= FORMATIONS[it.k].price ? send({ t: 'buyformation', key: it.k })
        : say(`${FORMATIONS[it.k].name} costs ${fmtCredits(FORMATIONS[it.k].price)} ${CURRENCY.short}`, '#e0a53f');
    }
    if (it.kind === 'drone') {
      const cost = dronePrice(myDrones.length);
      return credits >= cost ? send({ t: 'buydrone' })
        : say(`A drone costs ${fmtCredits(cost)} ${CURRENCY.short}`, '#e0a53f');
    }
    if (it.kind === 'ammo') {
      const a = AMMO[it.k];
      const locked = whyNotBuy(it.k, { fit: myFit, drones: escortOf(myDrones, myRig), EQUIPMENT });
      if (locked) return say(`${a.name} ${locked}`, '#e0a53f');
      return credits >= a.price ? send({ t: 'buyammo', key: it.k, n: 1 })
        : say(`A crate of ${a.name} costs ${fmtCredits(a.price)} ${CURRENCY.short}`, '#e0a53f');
    }
    if (it.kind === 'kit') {
      const k = KITS[it.k];
      return credits >= k.price ? send({ t: 'buykit', key: it.k })
        : say(`A ${k.name} costs ${fmtCredits(k.price)} ${CURRENCY.short}`, '#e0a53f');
    }
    if (it.kind === 'own') {
      const why = whyNotScrap(it.k, { held: myGear[it.k] ?? 0, where: atRing ? 'dock' : null });
      if (why) return say(why, '#e0a53f');
      return send({ t: 'scrap', item: it.k });
    }
    if (it.kind === 'ownhull') {
      const why = whyNotScrapHull(it.k, { owned: myHulls, flying: myHull, where: atRing ? 'dock' : null });
