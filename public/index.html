<!doctype html>
<meta charset="utf-8">
<title>Nullpoint</title>
<style>
  html,body{margin:0;height:100%;background:#05070b;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair;touch-action:none}
</style>
<canvas id="c"></canvas>
<script type="module">
import { MAP_W, MAP_H, PORTAL_R, MAPS, COMPANIES } from '/shared/maps.js';
import { SLOW_RADIUS, JUMP_TIME, nearPortal, inBase, driftDepth, driftDps,
         DRIFT_MARGIN, WORLD, SIGHT_R } from '/shared/sim.js';
import { ATTRS, HULLS, resolve, slotsOf } from '/shared/ships.js';
import { EQUIPMENT, SLOTS, emptyFit, fitCount, MAX_DRONES, dronePrice } from '/shared/gear.js';
import { levelFor, progress } from '/shared/level.js';
import { MAX_LEN, LOG_KEEP } from '/shared/chat.js';
import { FORMATIONS, FORMATION_KEYS, slots as formSlots, bonusScale } from '/shared/formation.js';
import { SYSTEMS, BOOST } from '/shared/power.js';
import { chartLayout } from '/shared/chart.js';
import { bayLayout, STORE_PAGES } from '/shared/hangar.js';
import { tipFor } from '/shared/tooltip.js';
import { GAME, TOKEN_KEY, OLD_TOKEN_KEYS } from '/shared/brand.js';
import { audioReady, setThrust, laser, explosion, toggleAudio, audioOn } from '/audio.js';
import { ALLY, FRESH, STALE } from '/shared/radar.js';
import { unpackShip, unpackBolt, unpackBlast, unpackPod, unpackHit } from '/shared/net.js';
import { MATERIALS, holdVol, holdValue, SCOOP_R, CURRENCY } from '/shared/cargo.js';
import { ALIENS } from '/shared/aliens.js';
import { boltWidth } from '/shared/combat.js';

const c = document.getElementById('c'), g = c.getContext('2d');
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;

// --- viewport: fills the window, DPR-correct --------------------------------
let VIEW_W = 0, VIEW_H = 0, MM_W = 0, MM_H = 0, MM_X = 0, MM_Y = 0;
let zoom = 1, WVW = 0, WVH = 0;   // zoom, and the world extent it makes visible
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  VIEW_W = innerWidth; VIEW_H = innerHeight;
  c.width = Math.round(VIEW_W * dpr); c.height = Math.round(VIEW_H * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);              // also resets font — re-set it
  g.font = '12px ui-monospace, SFMono-Regular, monospace';
  // never zoom IN past 1:1, but zoom out as far as a short window needs so that
  // SIGHT_R is always visible in every direction
  zoom = Math.min(1, Math.min(VIEW_W, VIEW_H) / (2 * SIGHT_R));
  WVW = VIEW_W / zoom; WVH = VIEW_H / zoom;
  MM_W = Math.min(260, VIEW_W * 0.22); MM_H = MM_W * (MAP_H / MAP_W);
  MM_X = VIEW_W - MM_W - 16; MM_Y = VIEW_H - MM_H - 16;
}
addEventListener('resize', resize); resize();
const btn    = () => ({ x: VIEW_W / 2 - 115, y: VIEW_H - 104, w: 230, h: 48 });
const sysBtn = () => ({ x: MM_X - 146, y: MM_Y + MM_H - 30, w: 136, h: 30 });
let sysOpen = false;

let myId = null, myCo = 'm', myName = '', mapId = 'm1', status = 'connecting…';
document.title = GAME;
// Carry a pilot across a rename rather than orphaning them under the old key.
const readToken = () => {
  try {
    const cur = localStorage.getItem(TOKEN_KEY);
    if (cur) return cur;
    for (const k of OLD_TOKEN_KEYS) {
      const old = localStorage.getItem(k);
      if (old) { localStorage.setItem(TOKEN_KEY, old); localStorage.removeItem(k); return old; }
    }
  } catch {}
  return '';
};
let myHull = 'hauler', myFit = emptyFit(), myGear = {}, myHulls = ['hauler'];
let power = { to: null, cap: 100, lv: { thrusters: 0, weapons: 0, shields: 0 } };
let shieldNow = 0, shieldTop = 0, myDrones = [], myXp = 0, myRank = { level: 1, into: 0, need: 1 };
let myForm = 'line', myForms = ['line'];
let bayOpen = false;
// Blue is shields wherever it appears — the bar, the impact bubble, damage the
// shields caught, and the reactor feeding them. Thrusters take engine amber
// rather than a second blue.
const SYS_COLOUR = ['#ffffff', '#ff5c6b', '#5fd0ff'];   // thrusters, weapons, shields

const defOf = s => s.co === 'x' ? ALIENS[s.hull] : HULLS[s.hull];
const rOf   = s => defOf(s)?.r ?? 12;
const colOf = s => s.co === 'x' ? (ALIENS[s.hull]?.colour ?? '#b06adf')
                                : (COMPANIES[s.co]?.color ?? '#8899aa');
const ships = new Map();          // id -> { x,y,heading,charge, rx,ry }
let bolts = [], blasts = [], pods = [], numbers = [];   // rebuilt every snapshot
let hold = {}, vault = {}, cargoCap = 60, credits = 0, atDock = false, scoop = null, want = null;
let invOpen = false, notice = null;
const prevShot = new Map();       // for spotting the frame a gun goes off
let thrust = 0, lastFrameAt = 0, prevSelf = null;
let dead = null;                  // { lost, at } while you are a wreck
// Chat, with a console inside it. While it is open every keystroke belongs to the
// line being typed — otherwise 'h' would open the hangar mid-sentence.
let chatOpen = false, chatLine = '', amAdmin = false;
const CHAT_LINGER = 4000, CHAT_FADE = 1200;   // gone shortly after you stop typing
const chatLog = [];
// Sitting idle keeps a socket, a ship and a ticking world alive for nobody. Sign
// yourself out and the server can stop simulating entirely.
const IDLE_LIMIT = 30 * 60 * 1000;
let lastInput = performance.now(), signedOff = false;
const stir = () => { lastInput = performance.now(); };
const heardBooms = new Set();
const respawnBtn = () => ({ x: VIEW_W / 2 - 130, y: VIEW_H * 0.6, w: 260, h: 52 });
const say = (text, colour) => notice = { text, colour, at: performance.now() };
const cam = { x: 0, y: 0 };

// --- net ---------------------------------------------------------------------
// The token is the whole identity. It rides in the connect URL so the server can
// resolve the account before the first frame, with no handshake round trip.
// wss when the page came over https, or the browser refuses it as mixed content.
const WS_PROTO = location.protocol === 'https:' ? 'wss:' : 'ws:';
const ws = new WebSocket(`${WS_PROTO}//${location.host}/?t=${encodeURIComponent(readToken())}`);
const send = o => { if (ws.readyState === 1) ws.send(JSON.stringify(o)); };
ws.onopen  = () => status = 'online';
ws.onclose = () => status = 'disconnected';
ws.onmessage = e => {
  const m = JSON.parse(e.data);
  if (m.t === 'welcome') {
    myId = m.id; myCo = m.co; mapId = m.map; myHull = m.hull; myFit = m.fit;
    myGear = m.gear ?? {}; myHulls = m.hulls ?? [myHull]; credits = m.credits ?? 0;
    myDrones = m.drones ?? []; myXp = m.xp ?? 0; amAdmin = !!m.admin;
    myForm = m.formation ?? 'line'; myForms = m.formations ?? ['line'];
    myName = m.name ?? '';
    if (m.token) { try { localStorage.setItem(TOKEN_KEY, m.token); } catch {} }
    return;
  }
  if (m.t === 'bumped') { status = 'signed in from another tab'; return; }
  if (m.t === 'chat') {
    chatLog.push({ from: m.from ?? '', co: m.co, text: String(m.text ?? '').slice(0, MAX_LEN), at: performance.now() });
    while (chatLog.length > LOG_KEEP) chatLog.shift();
    return;
  }
  if (m.t === 'fit') {                            // the station confirming a change
    myHull = m.hull; myFit = m.fit;
    myGear = m.gear ?? myGear;
    myHulls = m.hulls ?? myHulls;
    myDrones = m.drones ?? myDrones;
    myForm = m.formation ?? myForm; myForms = m.formations ?? myForms;
    if (typeof m.credits === 'number') credits = m.credits;
    return;
  }
  if (m.t === 'award') {
    credits = m.total;
    say(m.promoted
        ? `${COMPANIES[myCo].tag} awards you ${m.amount} ${CURRENCY.short} — and promotes you to level ${m.level}`
        : `${COMPANIES[myCo].tag} awards you ${m.amount} ${CURRENCY.short}` +
          (m.xp ? ` and ${m.xp} XP` : '') + ` for a ${m.what}`,
        m.promoted ? '#7de08a' : '#ffd479');
    return;
  }
  if (m.t === 'dead')    { dead = { lost: m.lost ?? {}, at: performance.now() }; return; }
  if (m.t === 'map') {
    mapId = m.map; ships.clear(); prevShot.clear(); marker = null; prevSelf = null;
    if (m.respawned) dead = null;
    return;
  }
  if (m.t !== 's') return;
  bolts = (m.bolts ?? []).map(unpackBolt);
  blasts = (m.blasts ?? []).map(unpackBlast);
  {                                               // a blast is new the first time we see it low
    const self0 = ships.get(myId);
    for (const b of blasts) {
      const key = `${b.x},${b.y},${b.r}`;
      if (b.p > 0.4 || heardBooms.has(key)) continue;
      heardBooms.add(key);
      explosion(self0 ? Math.hypot(b.x - self0.x, b.y - self0.y) : 0, !!b.foe);
    }
    if (heardBooms.size > 80) heardBooms.clear();
  }
  pods = (m.pods ?? []).map(unpackPod);
  numbers = (m.hits ?? []).map(unpackHit);
  hold = m.hold ?? {}; cargoCap = m.cap ?? cargoCap;
  vault = m.vault ?? vault; credits = m.credits ?? credits;
  atDock = !!m.docked; scoop = m.scoop ?? null; want = m.want ?? null;
  myGear = m.gear ?? myGear;
  if (m.power) power = m.power;
  if (typeof m.shieldNow === 'number') { shieldNow = m.shieldNow; shieldTop = m.shieldMax; }
  if (m.drones) myDrones = m.drones;
  if (m.rank) { myRank = m.rank; myXp = m.xp ?? myXp; }
  const seen = new Set();
  for (const raw of m.ships) {
    const n = unpackShip(raw);
    seen.add(n.id);
    const s = ships.get(n.id) ?? { rx: n.x, ry: n.y };
    Object.assign(s, n);
    ships.set(n.id, s);
  }
  const self = ships.get(myId);
  for (const [id, sh] of ships) {
    const was = prevShot.get(id) ?? 0;
    if (sh.shot > 60 && was <= 60 && sh.vis !== STALE)
      laser(id === myId, self ? Math.hypot(sh.x - self.x, sh.y - self.y) : 1e9);
    prevShot.set(id, sh.shot);
  }
  for (const id of ships.keys()) if (!seen.has(id)) { ships.delete(id); prevShot.delete(id); }
};

// --- input -------------------------------------------------------------------
// A tap is a destination. A hold is a throttle+heading, resent every tick because
// the ship (and the camera under the cursor) keeps moving while you hold still.
const HOLD_MS = 150, DRAG_PX = 10;
let held = false, steering = false, downAt = 0, cur = { x: 0, y: 0 }, down = { x: 0, y: 0 };
let hover = null, lastClick = { t: -1e9, x: 0, y: 0 };
const PICK_SLACK = 30, DOUBLE_MS = 320, DOUBLE_PX = 26;
let marker = null;                                    // your last move order, for display

const toView = e => {
  const r = c.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (VIEW_W / r.width),
           y: (e.clientY - r.top)  * (VIEW_H / r.height) };
};
const toWorld = v => ({ x: v.x / zoom + cam.x, y: v.y / zoom + cam.y });

const docked = () => {
  const me = ships.get(myId), map = MAPS[mapId];
  return !!me && map.owner === myCo && inBase(map, { x: me.x, y: me.y });
};

// Nearest hostile to a world point, within a forgiving radius. Demanding a direct
// hit on a 15px hull that is also moving made engaging anything a chore.
function hostileAt(wx, wy) {
  let best = null, bestD = Infinity;
  for (const [id, sh] of ships) {
    if (sh.co !== 'x' || sh.vis === STALE) continue;
    const d = Math.hypot(sh.rx - wx, sh.ry - wy);
    if (d < rOf(sh) + PICK_SLACK && d < bestD) { bestD = d; best = id; }
  }
  return best;
}

// Cargo is hauled in on purpose: you click it, and the tractor takes a moment.
function podAt(wx, wy) {
  let best = null, bestD = Infinity;
  for (const p of pods) {
    const d = Math.hypot(p.x - wx, p.y - wy);
    if (d < 34 && d < bestD) { bestD = d; best = p; }
  }
  return best;
}

function nearestHostile() {
  const me = ships.get(myId);
  if (!me) return null;
  let best = null, bestD = Infinity;
  for (const [id, sh] of ships) {
    if (sh.co !== 'x' || sh.vis === STALE) continue;
    const d = Math.hypot(sh.rx - me.rx, sh.ry - me.ry);
    if (d < bestD) { bestD = d; best = id; }
  }
  return best;
}
addEventListener('keydown', e => {
  audioReady();                                   // browsers want a gesture first
  stir();

  if (chatOpen) {                                 // the line owns the keyboard
    if (e.key === 'Enter') {
      e.preventDefault();
      if (chatLine.trim()) send({ t: 'chat', text: chatLine });
      chatLine = ''; chatOpen = false;
      return;
    }
    if (e.key === 'Escape')    { e.preventDefault(); chatLine = ''; chatOpen = false; return; }
    if (e.key === 'Backspace') { e.preventDefault(); chatLine = chatLine.slice(0, -1); return; }
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      if (chatLine.length < MAX_LEN) chatLine += e.key;
    }
    return;
  }
  if (e.key === 'Enter' && !dead) { e.preventDefault(); chatOpen = true; chatLine = ''; return; }

  const k = e.key.toLowerCase();
  if (k === 'v') say(toggleAudio() ? 'Sound on' : 'Sound off', '#8ab4e6');
  if (k === 'm') { sysOpen = !sysOpen; bayOpen = false; }
  if (k === 'h') { bayOpen = !bayOpen; sysOpen = false; invOpen = false; }
  if (k === '1' || k === '2' || k === '3') send({ t: 'power', sys: SYSTEMS[+k - 1] });
  if (k === 'i') { invOpen = !invOpen; sysOpen = false; bayOpen = false; }
  if (k === 'x') send({ t: 'target', id: 0 });     // break off
  if (e.key === 'Tab') {                          // engage the closest thing on the plot
    e.preventDefault();
    const n = nearestHostile();
    if (n !== null) send({ t: 'target', id: n });
  }
  if (k === 'k') send({ t: 'dev-damage' });        // self-damage, for watching the shield timer
  if (dead && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); send({ t: 'respawn' }); return; }
  if (e.key === ' ') {                            // one action key: haul, or jump
    e.preventDefault();
    // With the hold open, the obvious thing to want is everything off the ship.
    if (invOpen) {
      if (!atDock) return say('Dock at your base to move cargo', '#e0a53f');
      const mats = Object.keys(hold).filter(mt => (hold[mt] ?? 0) > 0);
      if (!mats.length) return say('Hold is already empty', '#66748c');
      for (const mt of mats) send({ t: 'stash', mat: mt });
      return say(`Stowed ${mats.length} stack${mats.length === 1 ? '' : 's'}`, '#7de08a');
    }
    const me2 = ships.get(myId);
    if (!me2) return;
    const pod = pods.filter(pd => Math.hypot(pd.x - me2.rx, pd.y - me2.ry) <= SCOOP_R)
                    .sort((a2, b2) => Math.hypot(a2.x - me2.rx, a2.y - me2.ry) - Math.hypot(b2.x - me2.rx, b2.y - me2.ry))[0];
    if (pod) return send({ t: 'scoop', id: pod.id });
    if (nearPortal(MAPS[mapId], { x: me2.x, y: me2.y, jumpCd: 0 })) return send({ t: 'jump' });
    say('Nothing in reach', '#66748c');
    return;
  }
  if (e.key === 'Escape') { sysOpen = false; bayOpen = false; invOpen = false; }
});

c.addEventListener('pointerdown', e => {
  audioReady();
  stir();
  if (signedOff) { location.reload(); return; }
  const v = toView(e);
  if (dead) {                                     // a wreck has exactly one control
    const b = respawnBtn();
    if (v.x > b.x && v.x < b.x + b.w && v.y > b.y && v.y < b.y + b.h) send({ t: 'respawn' });
    return;
  }
  if (sysOpen) { sysOpen = false; return; }
  if (bayOpen) { bayClick(v); return; }           // click anywhere dismisses the chart
  if (invOpen) { invClick(v); return; }
  const sb = sysBtn();
  if (v.x > sb.x && v.x < sb.x + sb.w && v.y > sb.y && v.y < sb.y + sb.h) { sysOpen = true; return; }
  const b = btn();
  if (v.x > b.x && v.x < b.x + b.w && v.y > b.y && v.y < b.y + b.h) return send({ t: 'jump' });
  const w = toWorld(v);
  const pick = hostileAt(w.x, w.y);
  if (pick !== null) { lastClick = { t: performance.now(), x: v.x, y: v.y }; return send({ t: 'target', id: pick }); }
  const can = podAt(w.x, w.y);
  if (can) { lastClick = { t: performance.now(), x: v.x, y: v.y };
             marker = { x: can.x, y: can.y };        // show the course you just ordered
             return send({ t: 'scoop', id: can.id }); }

  // Double-click on empty space breaks off. Single click still just sets a course,
  // and the second click repeats that harmlessly.
  const now2 = performance.now();
  if (now2 - lastClick.t < DOUBLE_MS && Math.hypot(v.x - lastClick.x, v.y - lastClick.y) < DOUBLE_PX) {
    send({ t: 'target', id: 0 });
    lastClick.t = -1e9;
  } else lastClick = { t: now2, x: v.x, y: v.y };

  if (v.x > MM_X && v.y > MM_Y) {                     // minimap click = destination order
    marker = { x: clamp((v.x - MM_X) / MM_W * MAP_W, 0, MAP_W),
               y: clamp((v.y - MM_Y) / MM_H * MAP_H, 0, MAP_H) };   // the minimap IS charted space
    return send({ t: 'intent', mode: 'pt', x: marker.x, y: marker.y });
  }
  held = true; steering = false; downAt = performance.now(); cur = down = v;
  c.setPointerCapture(e.pointerId);
  marker = { x: v.x + cam.x, y: v.y + cam.y };
  send({ t: 'intent', mode: 'pt', x: marker.x, y: marker.y });   // instant response on tap
});
c.addEventListener('pointermove', e => {
  const v = toView(e);
  hover = v;
  if (held) stir();                                          // tracked always, so we can preview the pick
  if (!held) return;
  cur = v;
  if (Math.hypot(cur.x - down.x, cur.y - down.y) > DRAG_PX) steering = true;
});
c.addEventListener('pointerleave', () => hover = null);
addEventListener('pointerup', () => {
  if (held && steering) { send({ t: 'intent', mode: 'stop' }); marker = null; }
  held = false; steering = false;
});

setInterval(() => {                                   // flush at the server tick rate
  if (!held) return;
  if (!steering && performance.now() - downAt > HOLD_MS) steering = true;
  if (!steering) return;
  const me = ships.get(myId);
  if (!me) return;
  const dx = cur.x - (me.rx - cam.x), dy = cur.y - (me.ry - cam.y);
  const d = Math.hypot(dx, dy);
  const throttle = Math.min(1, d / SLOW_RADIUS);      // point near yourself = crawl
  marker = null;
  send(d < 1 ? { t: 'intent', mode: 'stop' }
             : { t: 'intent', mode: 'dir', dx: (dx / d) * throttle, dy: (dy / d) * throttle });
}, 1000 / 30);

// --- starfield: hashed grid, infinite, zero storage ---------------------------
const hash = (x, y, s) => {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(s, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};
const LAYERS = [
  { p: 0.30, cell:  70, size: 1.0, a: 0.45 },
  { p: 0.60, cell: 110, size: 1.7, a: 0.60 },
  { p: 1.00, cell: 190, size: 2.5, a: 0.85 },
];
function drawStars() {
  g.fillStyle = '#cfe4ff';
  LAYERS.forEach((L, li) => {
    const ox = cam.x * L.p * zoom, oy = cam.y * L.p * zoom;   // stars keep their screen size
    const cx0 = Math.floor(ox / L.cell), cx1 = Math.floor((ox + VIEW_W) / L.cell);
    const cy0 = Math.floor(oy / L.cell), cy1 = Math.floor((oy + VIEW_H) / L.cell);
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
      const b = hash(cx, cy, li * 97 + 3);
      if (b < 0.35) continue;
      g.globalAlpha = L.a * (0.35 + b * 0.65);
      g.fillRect(cx * L.cell + hash(cx, cy, li * 97 + 1) * L.cell - ox,
                 cy * L.cell + hash(cx, cy, li * 97 + 2) * L.cell - oy, L.size, L.size);
    }
  });
  g.globalAlpha = 1;
}

// --- star system chart -------------------------------------------------------
// All geometry lives in shared/chart.js so the tests verify the same router that
// draws here. This function is purely paint.
function drawSystem(me) {
  const { rects, links, stubs, NW, NH } = chartLayout(VIEW_W, VIEW_H);
  const small = NW < 104;

  g.fillStyle = 'rgba(3,5,9,0.92)'; g.fillRect(0, 0, VIEW_W, VIEW_H);

  for (const L of links) {                                  // long routing, under the nodes
    g.strokeStyle = L.own ? COMPANIES[L.own].color + '66' : 'rgba(224,90,90,0.50)';
    g.lineWidth = L.own ? 1.8 : 2.4;
    g.lineJoin = 'round';
    g.beginPath(); g.moveTo(L.pts[0][0], L.pts[0][1]);
    for (const [x, y] of L.pts.slice(1)) g.lineTo(x, y);
    g.stroke();
  }

  for (const [id, r] of rects) {
    const m = MAPS[id], here = id === mapId;
    const kx = r.w / MAP_W, ky = r.h / MAP_H;

    g.save();
    g.beginPath(); g.rect(r.x, r.y, r.w, r.h); g.clip();
    g.fillStyle = '#070b11'; g.fillRect(r.x, r.y, r.w, r.h);
    g.globalAlpha = 0.17; g.fillStyle = m.tint; g.fillRect(r.x, r.y, r.w, r.h);
    for (const [x, y, rad, col] of m.neb) {
      const cx = r.x + x * kx, cy = r.y + y * ky, rr = rad * kx;
      const grd = g.createRadialGradient(cx, cy, 0, cx, cy, rr);
      grd.addColorStop(0, col); grd.addColorStop(1, 'transparent');
      g.globalAlpha = 0.8; g.fillStyle = grd; g.fillRect(cx - rr, cy - rr, rr * 2, rr * 2);
    }
    g.globalAlpha = 0.45; g.fillStyle = '#cfe4ff';
    const sd = id.charCodeAt(0) * 31 + id.charCodeAt(1);
    for (let i = 0; i < 22; i++) g.fillRect(r.x + hash(i, 7, sd) * r.w, r.y + hash(i, 11, sd) * r.h, 1, 1);
    g.globalAlpha = 1;
    g.restore();

    for (const st of stubs) {                               // last stretch, over its own preview
      if (st.map !== id) continue;
      g.globalAlpha = 0.6; g.lineWidth = 1.2;
      g.strokeStyle = st.own ? COMPANIES[st.own].color : '#e08a8a';
      g.beginPath(); g.moveTo(st.from.x, st.from.y); g.lineTo(st.to_.x, st.to_.y); g.stroke();
      g.globalAlpha = 1;
      g.fillStyle = MAPS[st.to].tint;
      g.fillRect(st.from.x - 2.5, st.from.y - 2.5, 5, 5);
    }

    if (m.home) {
      g.fillStyle = COMPANIES[m.owner].color;
      const cx = r.x + m.base.x * kx, cy = r.y + m.base.y * ky;
      g.strokeStyle = COMPANIES[m.owner].color + '99'; g.lineWidth = 1;
      g.beginPath(); g.arc(cx, cy, m.base.r * kx, 0, 7); g.stroke();
      g.beginPath();
      g.moveTo(cx, cy - 7); g.lineTo(cx + 7, cy); g.lineTo(cx, cy + 7); g.lineTo(cx - 7, cy);
      g.closePath(); g.fill();
      g.strokeStyle = '#05070b'; g.lineWidth = 1; g.stroke();
    }
    if (here && me) {
      g.fillStyle = '#fff';
      g.beginPath(); g.arc(r.x + me.rx * kx, r.y + me.ry * ky, 3, 0, 7); g.fill();
    }

    // fill is the region's own theme; the OUTLINE is who holds it
    if (m.owner) { g.strokeStyle = COMPANIES[m.owner].color; g.lineWidth = 2; }
    else         { g.strokeStyle = '#8a94a8'; g.lineWidth = 1.4; g.setLineDash([4, 3]); }
    g.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);
    g.setLineDash([]);
    if (here) { g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.strokeRect(r.x - 3.5, r.y - 3.5, r.w + 7, r.h + 7); }

    g.textAlign = 'center';
    g.font = (small ? '10px' : '11px') + ' ui-monospace, monospace';
    g.fillStyle = here ? '#fff' : m.tint;
    g.fillText(m.name.split(' · ')[0] + (here ? '  ◂ you' : ''), r.x + r.w / 2, r.y + r.h + 14);
    g.fillStyle = '#66748c'; g.font = (small ? '9px' : '10px') + ' ui-monospace, monospace';
    g.fillText(m.theme.toUpperCase(), r.x + r.w / 2, r.y + r.h + 26);
  }

  g.textAlign = 'center'; g.fillStyle = '#8ab4e6'; g.font = '15px ui-monospace, monospace';
  g.fillText('KNOWN SPACE · STAR SYSTEM', VIEW_W / 2, 30);
  let lx = VIEW_W / 2 - 306;
  g.font = '11px ui-monospace, monospace'; g.textAlign = 'left';
  for (const [co, f] of Object.entries(COMPANIES)) {
    g.strokeStyle = f.color; g.lineWidth = 2; g.strokeRect(lx + .5, 43.5, 11, 11);
    g.fillStyle = co === myCo ? '#fff' : '#7f8ea8';
    g.fillText(`${f.tag} — ${f.name}${co === myCo ? '  ◂ you' : ''}`, lx + 18, 53);
    lx += 208;
  }
  g.strokeStyle = '#8a94a8'; g.lineWidth = 1.4; g.setLineDash([4, 3]);
  g.strokeRect(VIEW_W / 2 - 306.5, 62.5, 11, 11); g.setLineDash([]);
  g.fillStyle = '#7f8ea8';
  g.fillText('CONTESTED — no holder.   Fill colour is the region itself; the outline is who holds it.',
             VIEW_W / 2 - 288, 72);
  g.textAlign = 'center'; g.fillStyle = '#5b6b85'; g.font = '12px ui-monospace, monospace';
  g.fillText('click anywhere or press M to close', VIEW_W / 2, VIEW_H - 18);
  g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
}

// --- station: hangar and store ------------------------------------------------
// Geometry lives in one place so drawing and hit-testing can never disagree
// about where a row is. Two tabs: HANGAR arranges what you own, STORE spends
// money, paged by category so one column never holds everything at once.
let bayTab = 'hangar', bayPage = 'ships';

const bayGeom = () => bayLayout(VIEW_W, VIEW_H, {
  tab: bayTab, page: bayPage, hull: myHull, drones: myDrones.length,
  hulls: myHulls, formations: myForms, gear: myGear });

const shipCtx = () => ({ hull: myHull, fit: myFit, drones: myDrones, formation: myForm,
                         gear: myGear, hulls: myHulls, formations: myForms, credits });

// Anything in the locker that would go in this slot, and is not a technology we
// are already flying — the same rule the server applies, so a click never bounces.
const spare = slot => Object.keys(EQUIPMENT).find(k => EQUIPMENT[k].slot === slot && (myGear[k] ?? 0) > 0
  && !(slot === 'tech' && (myFit.tech ?? []).concat(myDrones).includes(k)));

function bayClick(v) {
  const G = bayGeom();
  const inside = r => v.x > r.x && v.x < r.x + r.w && v.y > r.y && v.y < r.y + r.h;
  if (!inside(G.panel)) { bayOpen = false; return; }
  if (!docked()) return say('Fly into your base ring to use the station', '#e0a53f');

  for (const t of G.tabs) if (inside(t.r)) { bayTab = t.key; return; }
  for (const p of G.pages) if (inside(p.r)) { bayPage = p.key; return; }

  if (bayTab === 'hangar') {
    for (const { k, r } of G.hulls) if (inside(r)) {
      if (k === myHull) return;
      return send({ t: 'hull', key: k });               // owned only in here; buying is the store's job
    }
    for (const row of G.racks) {
      if (row.header || !inside(row.r)) continue;
      if (row.slot === 'form') {
        if (row.key === myForm) return;
        return send({ t: 'formation', key: row.key });
      }
      if (row.slot === 'drone') {
        if (myDrones[row.index]) return send({ t: 'dronestrip', index: row.index });
        const any = Object.keys(EQUIPMENT).find(k => (myGear[k] ?? 0) > 0
          && !(EQUIPMENT[k].slot === 'tech' && (myFit.tech ?? []).concat(myDrones).includes(k)));
        return any ? send({ t: 'dronefit', index: row.index, item: any })
                   : say('Nothing in the locker to mount — buy one in the store', '#8ab4e6');
      }
      if ((myFit[row.slot] ?? [])[row.index]) return send({ t: 'uninstall', slot: row.slot, index: row.index });
      const owned = spare(row.slot);
      return owned ? send({ t: 'install', item: owned })
                   : say(`Nothing in the locker for a ${row.slot} slot — buy one in the store`, '#8ab4e6');
    }
    return;
  }

  for (const it of G.store) {
    if (!inside(it.r)) continue;
    if (it.kind === 'hull') {
      if (it.owned) return it.k === myHull ? undefined : send({ t: 'hull', key: it.k });
      return credits >= HULLS[it.k].price ? send({ t: 'buyhull', key: it.k })
        : say(`A ${HULLS[it.k].name} costs ${HULLS[it.k].price} ${CURRENCY.short}`, '#e0a53f');
    }
    if (it.kind === 'form') {
      if (it.owned) return it.k === myForm ? undefined : send({ t: 'formation', key: it.k });
      return credits >= FORMATIONS[it.k].price ? send({ t: 'buyformation', key: it.k })
        : say(`${FORMATIONS[it.k].name} costs ${FORMATIONS[it.k].price} ${CURRENCY.short}`, '#e0a53f');
    }
    if (it.kind === 'drone') {
      const cost = dronePrice(myDrones.length);
      return credits >= cost ? send({ t: 'buydrone' })
        : say(`A drone costs ${cost} ${CURRENCY.short}`, '#e0a53f');
    }
    return credits >= EQUIPMENT[it.k].price ? send({ t: 'buy', item: it.k })
      : say(`Not enough credits for a ${EQUIPMENT[it.k].name}`, '#e0a53f');
  }
}

const fmt = v => Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 10) / 10;

// A framed box of real numbers, placed beside the cursor and nudged back on
// screen at the edges. This is the only place the effect of a module is stated
// exactly — a blurb reads well and tells you nothing.
function drawTip(tip, at) {
  if (!tip) return;
  g.font = '11px ui-monospace, monospace';
  const lines = tip.lines.slice(0, 12);
  const cut = tip.lines.length - lines.length;
  const widest = Math.max(g.measureText(tip.title).width + 90,
                          g.measureText(tip.blurb ?? '').width,
                          g.measureText(tip.note ?? '').width,
                          ...lines.map(l => g.measureText(`${l.label}  ${l.from} → ${l.to}${l.unit}`).width + 54));
  const w = Math.min(340, Math.max(190, widest + 24));
  const h = 40 + (tip.blurb ? 15 : 0) + lines.length * 15 + (cut ? 14 : 0) + (tip.note ? 20 : 0);
  const x = Math.min(at.x + 18, VIEW_W - w - 8), y = Math.min(at.y + 14, VIEW_H - h - 8);

  g.fillStyle = 'rgba(6,10,16,0.97)'; g.fillRect(x, y, w, h);
  g.strokeStyle = '#3d5876'; g.lineWidth = 1; g.strokeRect(x + .5, y + .5, w - 1, h - 1);

  let ty = y + 19;
  g.textAlign = 'left'; g.fillStyle = '#cfe4ff'; g.font = '12px ui-monospace, monospace';
  g.fillText(tip.title, x + 10, ty);
  if (tip.price) { g.textAlign = 'right'; g.fillStyle = credits >= tip.price ? '#ffd479' : '#7a6a45';
                   g.fillText(`${tip.price} ${CURRENCY.short}`, x + w - 10, ty); g.textAlign = 'left'; }
  ty += 14;
  g.font = '10px ui-monospace, monospace'; g.fillStyle = '#66748c';
  g.fillText(tip.sub ?? '', x + 10, ty); ty += tip.blurb ? 15 : 6;
  if (tip.blurb) { g.fillStyle = '#8ea3bd'; g.fillText(tip.blurb, x + 10, ty); ty += 8; }

  g.font = '11px ui-monospace, monospace';
  for (const l of lines) {
    ty += 15;
    g.fillStyle = '#7b8ba3'; g.fillText(l.label, x + 10, ty);
    g.textAlign = 'right';
    g.fillStyle = '#66748c'; g.fillText(String(l.from), x + w - 96, ty);
    g.fillStyle = '#3d4757'; g.fillText('→', x + w - 84, ty);
    g.fillStyle = l.good ? '#7de08a' : '#e07a7a';
    g.fillText(`${l.to}${l.unit}`, x + w - 44, ty);
    if (l.pct !== null) { g.font = '10px ui-monospace, monospace';
                          g.fillText(`${l.pct > 0 ? '+' : ''}${l.pct}%`, x + w - 10, ty);
                          g.font = '11px ui-monospace, monospace'; }
    g.textAlign = 'left';
  }
  if (cut) { ty += 14; g.fillStyle = '#4a5568'; g.font = '10px ui-monospace, monospace';
             g.fillText(`+${cut} more`, x + 10, ty); }
  if (tip.note) { ty += 18; g.fillStyle = '#5b6b85'; g.font = '10px ui-monospace, monospace';
                  g.fillText(tip.note, x + 10, ty); }
  g.font = '11px ui-monospace, monospace';
}

function drawBay() {
  const G = bayGeom(), P = G.panel;
  const stats = resolve(myHull, myFit, myDrones, myForm), bare = resolve(myHull, emptyFit());
  const home = docked();
  const at = hover && hover.x > P.x && hover.x < P.x + P.w && hover.y > P.y && hover.y < P.y + P.h ? hover : null;
  const over = r => at && at.x > r.x && at.x < r.x + r.w && at.y > r.y && at.y < r.y + r.h;
  let tip = null;

  g.fillStyle = 'rgba(3,5,9,0.92)'; g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.fillStyle = 'rgba(8,12,19,0.98)'; g.fillRect(P.x, P.y, P.w, P.h);
  g.strokeStyle = '#2c3d55'; g.lineWidth = 1; g.strokeRect(P.x + .5, P.y + .5, P.w - 1, P.h - 1);

  g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
  for (const t of G.tabs) {
    const on = t.key === G.tab;
    g.fillStyle = on ? 'rgba(90,150,220,0.18)' : 'rgba(255,255,255,0.02)';
    g.fillRect(t.r.x, t.r.y, t.r.w, t.r.h);
    g.strokeStyle = on ? '#7fd4ff' : '#2c3d55'; g.lineWidth = on ? 1.6 : 1;
    g.strokeRect(t.r.x + .5, t.r.y + .5, t.r.w - 1, t.r.h - 1);
    g.fillStyle = on ? '#cfe4ff' : '#66748c'; g.textAlign = 'center';
    g.fillText(t.name, t.r.x + t.r.w / 2, t.r.y + t.r.h / 2 + 4);
  }
  g.textAlign = 'right'; g.font = '13px ui-monospace, monospace'; g.fillStyle = '#ffd479';
  g.fillText(`${credits} ${CURRENCY.short}`, P.x + P.w - 20, P.y + 32);
  g.textAlign = 'left'; g.font = '11px ui-monospace, monospace';
  g.fillStyle = home ? '#66748c' : '#e0a53f';
  g.fillText(home ? 'docked — every change takes effect at once'
                  : `fly into the ${COMPANIES[myCo].tag}-1 base ring to outfit`, P.x + 236, P.y + 32);

  // a live stat line, so the effect of a click is visible immediately
  let sx = P.x + 20;
  for (const k of ['hull', 'shield', 'damage', 'speed', 'capacitor']) {
    const d = stats[k] - bare[k];
    g.fillStyle = '#66748c'; g.fillText(ATTRS[k].label.toUpperCase(), sx, P.y + 62);
    g.fillStyle = '#cfe4ff'; g.font = '13px ui-monospace, monospace';
    g.fillText(String(Math.round(stats[k])), sx, P.y + 78);
    if (Math.abs(d) > 0.01) {
      g.fillStyle = (ATTRS[k].better === 'high') === (d > 0) ? '#7de08a' : '#e07a7a';
      g.font = '10px ui-monospace, monospace';
      g.fillText(`${d > 0 ? '+' : ''}${Math.round(d)}`, sx + 44, P.y + 78);
    }
    g.font = '11px ui-monospace, monospace';
    sx += G.colW * 0.62;
  }

  const pct = v => `${v > 0 ? '+' : ''}${Math.round(v * 100)}%`;
  const SHORT = { damage: 'dmg', hull: 'hull', shield: 'shld', speed: 'spd', accel: 'acc' };

  if (G.tab === 'hangar') {
    g.fillStyle = '#5b6b85';
    g.fillText('YOUR SHIPS', P.x + 20, G.top - 10);
    g.fillText(`RACKS  ${fitCount(myFit)}/${SLOTS.reduce((n, s2) => n + slotsOf(myHull)[s2], 0)}`,
               P.x + 30 + G.colW, G.top - 10);
    g.fillText('ESCORT', P.x + 40 + G.colW * 2, G.top - 10);

    for (const { k, r } of G.hulls) {
      const H = HULLS[k], on = k === myHull, sl = slotsOf(k);
      if (over(r) && !on) tip = tipFor('hull', k, shipCtx());
      g.fillStyle = on ? 'rgba(90,150,220,0.16)' : over(r) ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.03)';
      g.fillRect(r.x, r.y, r.w, r.h);
      g.strokeStyle = on ? '#7fd4ff' : '#2c3d55'; g.lineWidth = on ? 1.6 : 1;
      g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);
      g.fillStyle = COMPANIES[myCo].color;
      g.fillRect(r.x + 16 - H.r / 2, r.y + r.h / 2 - H.r / 2, H.r, H.r);
      g.fillStyle = on ? '#fff' : '#93a3b5'; g.font = '12px ui-monospace, monospace';
      g.fillText(H.name, r.x + 36, r.y + 20);
      g.fillStyle = '#66748c'; g.font = '10px ui-monospace, monospace';
      g.fillText(`${H.cls}   W${sl.weapon} G${sl.generator} T${sl.tech}   ${H.attrs.hull} hull  ` +
                 `${H.attrs.cargo} hold`, r.x + 36, r.y + 35);
      if (on) { g.fillStyle = '#7fd4ff'; g.textAlign = 'right';
                g.fillText('FLYING', r.x + r.w - 10, r.y + 20); g.textAlign = 'left'; }
      g.font = '11px ui-monospace, monospace';
    }

    for (const row of G.racks) {
      const r = row.r;
      if (row.header) {
        g.fillStyle = '#3d4757'; g.font = '10px ui-monospace, monospace';
        g.fillText(row.slot === 'drone' ? `DRONE BAYS  ${myDrones.length}/${MAX_DRONES}`
                 : row.slot === 'form'  ? `FORMATION${myDrones.length ? '' : '  (needs drones)'}`
                                        : row.slot.toUpperCase(),
                   r.x + 2, r.y + r.h - 4);
        g.font = '11px ui-monospace, monospace';
        continue;
      }
      if (row.slot === 'form') {
        const F = FORMATIONS[row.key], flying = row.key === myForm;
        if (over(r)) tip = tipFor('form', row.key, shipCtx());
        g.fillStyle = flying ? 'rgba(125,224,138,0.12)' : over(r) ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.02)';
        g.fillRect(r.x, r.y, r.w, r.h);
        g.strokeStyle = flying ? '#7de08a' : '#2c3d55'; g.lineWidth = 1;
        g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);
        const mid = r.y + r.h / 2 + 4;
        g.fillStyle = flying ? '#cfe4ff' : '#8ea3bd';
        g.fillText(F.name, r.x + 10, mid);
        g.textAlign = 'right';
        g.fillStyle = flying ? '#7de08a' : '#66748c';
        g.fillText(flying ? 'FLYING' : 'fly it', r.x + r.w - 10, mid);
        g.textAlign = 'left';
        // What this escort would really deliver, not the brochure number.
        const k = bonusScale(myDrones.length);
        const nameW = g.measureText(F.name).width;
        g.font = '10px ui-monospace, monospace';
        const mx = r.x + 20 + nameW, room = r.x + r.w - 60 - mx;
        const forms = F.mods.length
          ? [F.mods.map(([a, , v]) => `${SHORT[a] ?? a} ${pct(v * k)}`).join('  '),
             F.mods.map(([a, , v]) => `${SHORT[a] ?? a}${pct(v * k)}`).join(' '), '']
          : ['no effect', ''];
        g.fillStyle = '#66748c';
        g.fillText(forms.find(t => g.measureText(t).width <= room) ?? '', mx, mid);
        g.font = '11px ui-monospace, monospace';
        continue;
      }
      const held = row.slot === 'drone' ? myDrones[row.index] : (myFit[row.slot] ?? [])[row.index];
      const item = EQUIPMENT[held];
      // An empty slot previews whatever clicking it would actually fit, so you
      // can see the numbers before you commit rather than after.
      const would = item ? null
                  : row.slot === 'drone'
                    ? Object.keys(EQUIPMENT).find(k => (myGear[k] ?? 0) > 0
                        && !(EQUIPMENT[k].slot === 'tech' && (myFit.tech ?? []).concat(myDrones).includes(k)))
                    : spare(row.slot);
      if (over(r) && (held || would)) tip = tipFor('item', held ?? would, shipCtx());
      if (tip && would) tip = { ...tip, note: 'in your locker — click to fit it' };
      g.fillStyle = item ? 'rgba(125,224,138,0.12)' : over(r) ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.02)';
      g.fillRect(r.x, r.y, r.w, r.h);
      g.strokeStyle = item ? '#7de08a' : '#2c3d55'; g.lineWidth = 1;
      if (!item) g.setLineDash([3, 3]);
      g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1); g.setLineDash([]);
      let tx = r.x + 10;
      if (row.slot === 'drone') { g.fillStyle = COMPANIES[myCo].color;
                                  g.fillRect(r.x + 8, r.y + r.h / 2 - 3, 6, 6); tx = r.x + 22; }
      g.fillStyle = item ? '#cfe4ff' : '#3d4757';
      g.fillText(item ? item.name : row.slot === 'drone' ? 'empty bay' : 'empty', tx, r.y + r.h / 2 + 4);
      if (!item && would) { g.fillStyle = '#4d6a45'; g.textAlign = 'right';
                            g.fillText('fit ' + EQUIPMENT[would].name, r.x + r.w - 10, r.y + r.h / 2 + 4);
                            g.textAlign = 'left'; }
      if (item) { g.fillStyle = '#66748c'; g.textAlign = 'right';
                  g.fillText('remove', r.x + r.w - 10, r.y + r.h / 2 + 4); g.textAlign = 'left'; }
    }

    g.fillStyle = '#5b6b85';
    g.fillText('click a slot to fit what is in your locker · a filled slot to strip it · H or Esc to close',
               P.x + 20, P.y + P.h - 18);
    g.font = '12px ui-monospace, monospace';
    drawTip(tip, at ?? { x: 0, y: 0 });
    return;
  }

  // --- store ---------------------------------------------------------------
  g.fillStyle = '#5b6b85';
  g.fillText('DEPARTMENT', P.x + 20, G.top - 10);
  g.fillText(STORE_PAGES.find(p => p.key === G.page)?.hint ?? '', P.x + 30 + G.pages[0].r.w, G.top - 10);

  for (const p of G.pages) {
    const on = p.key === G.page, r = p.r;
    g.fillStyle = on ? 'rgba(90,150,220,0.16)' : over(r) ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.02)';
    g.fillRect(r.x, r.y, r.w, r.h);
    g.strokeStyle = on ? '#7fd4ff' : '#2c3d55'; g.lineWidth = on ? 1.6 : 1;
    g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);
    g.fillStyle = on ? '#cfe4ff' : '#8ea3bd'; g.font = '12px ui-monospace, monospace';
    g.fillText(p.name, r.x + 12, r.y + r.h / 2 + 4);
    g.font = '11px ui-monospace, monospace';
  }

  for (const it of G.store) {
    const r = it.r;
    const price = it.kind === 'hull' ? HULLS[it.k].price
                : it.kind === 'form' ? FORMATIONS[it.k].price
                : it.kind === 'drone' ? dronePrice(myDrones.length)
                                      : EQUIPMENT[it.k].price;
    const name = it.kind === 'hull' ? HULLS[it.k].name
               : it.kind === 'form' ? FORMATIONS[it.k].name
               : it.kind === 'drone' ? `Drone ${myDrones.length + 1}`
                                     : EQUIPMENT[it.k].name;
    const blurb = it.kind === 'hull' ? `${HULLS[it.k].cls}   W${slotsOf(it.k).weapon} G${slotsOf(it.k).generator} T${slotsOf(it.k).tech}`
                : it.kind === 'form' ? FORMATIONS[it.k].blurb
                : it.kind === 'drone' ? 'Flies escort. One slot, anything you like in it.'
                                      : EQUIPMENT[it.k].blurb;
    const afford = credits >= price;
    if (over(r)) tip = tipFor(it.kind, it.k, shipCtx());

    g.globalAlpha = it.owned || afford ? 1 : 0.5;
    g.fillStyle = it.owned ? 'rgba(125,224,138,0.10)' : over(r) ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.03)';
    g.fillRect(r.x, r.y, r.w, r.h);
    g.strokeStyle = it.owned ? '#2c3d55' : afford ? '#3d5876' : '#2c3d55'; g.lineWidth = 1;
    g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);
    g.fillStyle = '#cfe4ff'; g.font = '12px ui-monospace, monospace';
    g.fillText(name, r.x + 12, r.y + 20);
    g.fillStyle = '#66748c'; g.font = '10px ui-monospace, monospace';
    g.fillText(blurb, r.x + 12, r.y + 35);
    g.textAlign = 'right';
    if (it.owned) { g.fillStyle = '#7de08a'; g.font = '11px ui-monospace, monospace';
                    g.fillText((it.kind === 'hull' ? it.k === myHull : it.k === myForm) ? 'FLYING' : 'owned — fly it',
                               r.x + r.w - 12, r.y + 20); }
    else { g.fillStyle = afford ? '#ffd479' : '#7a6a45'; g.font = '11px ui-monospace, monospace';
           g.fillText(`${price} ${CURRENCY.short}`, r.x + r.w - 12, r.y + 20); }
    const stock = it.kind === 'item' ? (myGear[it.k] ?? 0) : 0;
    if (stock) { g.fillStyle = '#7de08a'; g.font = '10px ui-monospace, monospace';
                 g.fillText(`${stock} in locker`, r.x + r.w - 12, r.y + 35); }
    g.textAlign = 'left'; g.globalAlpha = 1; g.font = '11px ui-monospace, monospace';
  }

  g.fillStyle = '#5b6b85';
  g.fillText('hover for exact numbers · click to buy · fit it in the HANGAR tab · H or Esc to close',
             P.x + 20, P.y + P.h - 18);
  g.font = '12px ui-monospace, monospace';
  drawTip(tip, at ?? { x: 0, y: 0 });
}

// --- inventory / company hangar -----------------------------------------------
// Left is what the ship is carrying, right is what the company holds for you.
// Transfer only works at the dock, because the hangar is theirs, not yours.
function invGeom() {
  const w = Math.min(820, VIEW_W - 60), h = Math.min(440, VIEW_H - 60);
  const x = (VIEW_W - w) / 2, y = (VIEW_H - h) / 2;
  const colW = (w - 60) / 2, top = y + 92;
  const rows = (obj, cx) => Object.keys(obj).map((mat, i) =>
    ({ mat, r: { x: cx, y: top + i * 40, w: colW, h: 34 } }));
  return { panel: { x, y, w, h }, colW, top,
           ship: rows(hold, x + 20), bank: rows(vault, x + 40 + colW),
           all: { x: x + 20, y: y + h - 56, w: 190, h: 40 } };
}

function invClick(v) {
  const G = invGeom();
  const inside = r => v.x > r.x && v.x < r.x + r.w && v.y > r.y && v.y < r.y + r.h;
  if (!inside(G.panel)) { invOpen = false; return; }
  if (!atDock) return;                              // browsing is free, moving cargo is not
  for (const { mat, r } of G.ship) if (inside(r)) return send({ t: 'stash', mat });
  for (const { mat, r } of G.bank) if (inside(r)) {
    // right half of the row sells, left half loads it back onto the ship
    if (v.x > r.x + r.w * 0.62) return send({ t: 'sell', mat, n: vault[mat] });
    return send({ t: 'load', mat });
  }
  if (inside(G.all)) for (const mat of Object.keys(hold)) send({ t: 'stash', mat });
}

function stack(r, mat, n, live) {
  const M = MATERIALS[mat];
  g.fillStyle = live ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.02)';
  g.fillRect(r.x, r.y, r.w, r.h);
  g.strokeStyle = (M?.colour ?? '#9aa3ad') + (live ? 'aa' : '44'); g.lineWidth = 1;
  g.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);
  g.fillStyle = M?.colour ?? '#9aa3ad';
  g.fillRect(r.x + 10, r.y + 6, 22, 22);
  g.fillStyle = '#0a0e14'; g.font = 'bold 12px ui-monospace, monospace'; g.textAlign = 'center';
  g.fillText(M?.sym ?? '?', r.x + 21, r.y + 21);
  g.textAlign = 'left';
  g.fillStyle = '#cfe4ff'; g.font = '12px ui-monospace, monospace';
  g.fillText(M?.name ?? mat, r.x + 42, r.y + 15);
  g.fillStyle = '#66748c'; g.font = '10px ui-monospace, monospace';
  g.fillText(`T${M?.tier ?? '?'} · ${M?.value ?? 0} ${CURRENCY.short} · ${M?.vol ?? 1} vol · ${M?.density ?? '?'} g/cm³`,
             r.x + 42, r.y + 27);
  g.fillStyle = '#fff'; g.font = '14px ui-monospace, monospace'; g.textAlign = 'right';
  g.fillText('×' + n, r.x + r.w - 12, r.y + 22);
  g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
}

function drawInventory() {
  const G = invGeom(), P = G.panel, vol = holdVol(hold);
  g.fillStyle = 'rgba(3,5,9,0.92)'; g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.fillStyle = 'rgba(8,12,19,0.98)'; g.fillRect(P.x, P.y, P.w, P.h);
  g.strokeStyle = '#2c3d55'; g.lineWidth = 1; g.strokeRect(P.x + .5, P.y + .5, P.w - 1, P.h - 1);

  g.font = '15px ui-monospace, monospace'; g.fillStyle = '#8ab4e6';
  g.fillText('INVENTORY', P.x + 20, P.y + 32);
  g.font = '13px ui-monospace, monospace'; g.fillStyle = '#ffd479'; g.textAlign = 'right';
  g.fillText(`${credits} ${CURRENCY.short}`, P.x + P.w - 20, P.y + 32);
  g.textAlign = 'left'; g.font = '11px ui-monospace, monospace';
  g.fillStyle = atDock ? '#66748c' : '#e0a53f';
  g.fillText(atDock ? 'docked — click a stack to move it the other way'
                    : 'you can look, but transfers happen at your home base', P.x + 20, P.y + 52);

  g.fillStyle = '#5b6b85'; g.font = '11px ui-monospace, monospace';
  g.fillText(`SHIP HOLD   ${vol}/${cargoCap}` + (vol ? `   ${holdValue(hold)} ${CURRENCY.short}` : '') +
             (atDock ? '   → click to stow' : ''), P.x + 20, G.top - 12);
  g.fillText('COMPANY HANGAR   unlimited' + (atDock ? '   → left half loads, right half sells' : ''),
             P.x + 40 + G.colW, G.top - 12);

  if (!G.ship.length) { g.fillStyle = '#3d4757'; g.fillText('empty', P.x + 20, G.top + 18); }
  for (const { mat, r } of G.ship) stack(r, mat, hold[mat], atDock);
  if (!G.bank.length) { g.fillStyle = '#3d4757'; g.fillText('nothing stored yet', P.x + 40 + G.colW, G.top + 18); }
  for (const { mat, r } of G.bank) {
    stack(r, mat, vault[mat], atDock);
    if (!atDock) continue;
    const M = MATERIALS[mat];
    g.fillStyle = 'rgba(255,212,121,0.10)';
    g.fillRect(r.x + r.w * 0.62, r.y + 1, r.w * 0.38 - 1, r.h - 2);
    g.fillStyle = '#ffd479'; g.textAlign = 'center'; g.font = '10px ui-monospace, monospace';
    g.fillText(`SELL ${vault[mat] * M.value} ${CURRENCY.short}`, r.x + r.w * 0.81, r.y + r.h / 2 + 4);
    g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
  }

  if (G.ship.length) {
    const A = G.all;
    g.globalAlpha = atDock ? 1 : 0.35;
    g.fillStyle = 'rgba(125,224,138,0.14)'; g.fillRect(A.x, A.y, A.w, A.h);
    g.strokeStyle = '#7de08a'; g.lineWidth = 1.3; g.strokeRect(A.x + .5, A.y + .5, A.w - 1, A.h - 1);
    g.fillStyle = '#7de08a'; g.textAlign = 'center';
    g.fillText('STOW EVERYTHING', A.x + A.w / 2, A.y + 18);
    g.fillStyle = '#4d7a55'; g.font = '10px ui-monospace, monospace';
    g.fillText('or press SPACE', A.x + A.w / 2, A.y + 29);
    g.font = '12px ui-monospace, monospace';
    g.textAlign = 'left'; g.globalAlpha = 1;
  }
  g.fillStyle = '#5b6b85'; g.font = '11px ui-monospace, monospace';
  g.fillText('I or Esc to close', P.x + P.w - 130, P.y + P.h - 30);
  g.font = '12px ui-monospace, monospace';
}

// --- render -------------------------------------------------------------------
let renderFailed = false;
requestAnimationFrame(function frame(now) {
  try { drawFrame(now); } catch (err) {
    if (!renderFailed) { renderFailed = true; console.error('render error (loop kept alive):', err); }
  }
  requestAnimationFrame(frame);
});

function drawFrame(now) {
  const map = MAPS[mapId], me = ships.get(myId);
  const st = resolve(myHull, myFit);          // your resolved stats, wanted by minimap and hud alike

  // Thruster tracks how fast you are actually going, measured off the smoothed
  // render position — the server never sends velocity and does not need to.
  const frameDt = Math.min(0.1, (now - lastFrameAt) / 1000) || 0.016;
  lastFrameAt = now;
  if (me) {
    if (prevSelf) {
      const v = Math.hypot(me.rx - prevSelf.x, me.ry - prevSelf.y) / frameDt;
      thrust += (Math.min(1, v / Math.max(1, st.speed)) - thrust) * 0.16;
    }
    prevSelf = { x: me.rx, y: me.ry };
  } else thrust *= 0.9;
  setThrust(thrust);

  for (const s of ships.values()) { s.rx += (s.x - s.rx) * 0.35; s.ry += (s.y - s.ry) * 0.35; }
  if (me) {
    cam.x = clamp(me.rx - WVW / 2, WORLD.x0, Math.max(WORLD.x0, WORLD.x1 - WVW));
    cam.y = clamp(me.ry - WVH / 2, WORLD.y0, Math.max(WORLD.y0, WORLD.y1 - WVH));
  }
  const depth = me ? driftDepth(me.x, me.y) : 0;
  if (marker && me && Math.hypot(marker.x - me.x, marker.y - me.y) < 12) marker = null;
  const atPortal = me ? nearPortal(map, { x: me.x, y: me.y, jumpCd: 0 }) : null;
  const charge = me?.charge ?? 0;

  g.fillStyle = '#05070b'; g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.globalAlpha = 0.055; g.fillStyle = map.tint; g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.globalAlpha = 1;
  drawStars();

  g.save();
  g.scale(zoom, zoom);
  g.translate(-cam.x, -cam.y);

  for (const [x, y, r, col] of map.neb) {
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, col); grad.addColorStop(1, 'transparent');
    g.globalAlpha = 0.30; g.fillStyle = grad; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  g.globalAlpha = 1;

  g.strokeStyle = 'rgba(120,160,220,0.05)'; g.lineWidth = 1; g.beginPath();
  for (let x = Math.floor(cam.x / 500) * 500; x < cam.x + WVW; x += 500) { g.moveTo(x, cam.y); g.lineTo(x, cam.y + WVH); }
  for (let y = Math.floor(cam.y / 500) * 500; y < cam.y + WVH; y += 500) { g.moveTo(cam.x, y); g.lineTo(cam.x + WVW, y); }
  g.stroke();

  // No boundary drawn in the world. Sliding off the minimap is the tell, and the
  // shear vignette takes over from there.

  if (map.base) {
    const b = map.base, col = COMPANIES[map.owner].color, mine = map.owner === myCo;
    const grd = g.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    grd.addColorStop(0, col + '2e'); grd.addColorStop(0.65, col + '12'); grd.addColorStop(1, 'transparent');
    g.fillStyle = grd; g.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);

    g.strokeStyle = col + (mine ? 'aa' : '55'); g.lineWidth = 2;
    g.setLineDash([26, 18]); g.lineDashOffset = -now / 60;          // slow drift
    g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.stroke();
    g.setLineDash([]); g.lineDashOffset = 0;
    g.strokeStyle = col + '44'; g.lineWidth = 1;
    g.beginPath(); g.arc(b.x, b.y, b.r * 0.62, 0, 7); g.stroke();

    for (let i = 0; i < 4; i++) {                                    // approach ticks
      const a = i * Math.PI / 2 + Math.PI / 4;
      g.beginPath();
      g.moveTo(b.x + Math.cos(a) * (b.r - 26), b.y + Math.sin(a) * (b.r - 26));
      g.lineTo(b.x + Math.cos(a) * (b.r + 26), b.y + Math.sin(a) * (b.r + 26));
      g.stroke();
    }

    g.save();                                                        // station
    g.translate(b.x, b.y); g.rotate(now / 9000);
    g.strokeStyle = col; g.lineWidth = 3; g.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3, px = Math.cos(a) * 62, py = Math.sin(a) * 62;
      i ? g.lineTo(px, py) : g.moveTo(px, py);
    }
    g.closePath(); g.stroke();
    g.fillStyle = col + '55'; g.fill();
    g.fillStyle = col; g.fillRect(-13, -13, 26, 26);
    g.restore();

    g.fillStyle = col; g.textAlign = 'center'; g.font = '14px ui-monospace, monospace';
    g.fillText(`${COMPANIES[map.owner].tag} BASE`, b.x, b.y - b.r - 18);
    g.font = '12px ui-monospace, monospace'; g.textAlign = 'left';
  }

  const idle = 0.6 + 0.4 * Math.sin(now / 420);
  for (const p of map.portals) {
    const tint = MAPS[p.to].tint;
    const spooling = charge > 0 && atPortal === p;
    let r = PORTAL_R;
    if (spooling) {
      const el = JUMP_TIME - charge, prog = el / JUMP_TIME;
      r = PORTAL_R * (1 + (0.16 + 0.34 * prog) * Math.sin(el * el * 1.6 * Math.PI * 2));  // winds up
    }
    g.globalAlpha = (spooling ? 0.34 : 0.20) * (spooling ? 1 : idle);
    g.fillStyle = tint; g.beginPath(); g.arc(p.x, p.y, r, 0, 7); g.fill();
    g.globalAlpha = 1; g.strokeStyle = tint; g.lineWidth = spooling ? 5 : 3;
    g.beginPath(); g.arc(p.x, p.y, r, 0, 7); g.stroke();
    if (spooling) {
      g.lineWidth = 3; g.strokeStyle = '#fff';
      g.beginPath(); g.arc(p.x, p.y, PORTAL_R * 1.45, -Math.PI / 2, -Math.PI / 2 + (1 - charge / JUMP_TIME) * Math.PI * 2);
      g.stroke();
    }
    g.fillStyle = tint; g.textAlign = 'center';
    g.fillText(MAPS[p.to].name.toUpperCase(), p.x, p.y - PORTAL_R * 1.45 - 14);
  }
  g.textAlign = 'left';

  if (marker) {
    g.strokeStyle = '#4a90d9'; g.lineWidth = 1.5; g.globalAlpha = 0.8;
    g.beginPath(); g.arc(marker.x, marker.y, 8, 0, 7); g.stroke();
    g.globalAlpha = 1;
  }

  for (const pod of pods) {
    const col = MATERIALS[pod.mat]?.colour ?? '#9aa3ad';
    const pu = 0.72 + 0.28 * Math.sin(now / 260 + pod.id);
    g.globalAlpha = 0.22 * pu; g.fillStyle = col;
    g.beginPath(); g.arc(pod.x, pod.y, 26, 0, 7); g.fill();
    g.globalAlpha = 1; g.fillStyle = col;
    g.save(); g.translate(pod.x, pod.y); g.rotate(now / 1400 + pod.id);
    g.beginPath(); g.moveTo(0, -9); g.lineTo(8, 0); g.lineTo(0, 9); g.lineTo(-8, 0);
    g.closePath(); g.fill();
    g.strokeStyle = '#05070b'; g.lineWidth = 1.5; g.stroke();
    g.restore();
    if (hover && podAt(toWorld(hover).x, toWorld(hover).y)?.id === pod.id) {
      const reachable = me && Math.hypot(pod.x - me.rx, pod.y - me.ry) <= SCOOP_R;
      g.strokeStyle = col; g.lineWidth = 1.4; g.setLineDash([3, 4]);
      g.beginPath(); g.arc(pod.x, pod.y, 21, 0, 7); g.stroke(); g.setLineDash([]);
      g.fillStyle = col; g.textAlign = 'center'; g.font = '10px ui-monospace, monospace';
      g.fillText(`${MATERIALS[pod.mat]?.name ?? pod.mat} — click to ${reachable ? 'haul in' : 'fly over and collect'}`,
                 pod.x, pod.y + 32);
      g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
    }
    {
      g.fillStyle = col; g.textAlign = 'center'; g.font = '10px ui-monospace, monospace';
      g.fillText((MATERIALS[pod.mat]?.sym ?? '?') + (pod.n > 1 ? ' ×' + pod.n : ''), pod.x, pod.y - 18);
      g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
    }
  }

  if (want && me) {                                // on the way to fetch something
    const pod = pods.find(p => p.id === want);
    if (pod) {
      const col = MATERIALS[pod.mat]?.colour ?? '#9aa3ad';
      g.strokeStyle = col; g.globalAlpha = 0.45; g.lineWidth = 1.5; g.setLineDash([9, 8]);
      g.beginPath(); g.moveTo(me.rx, me.ry); g.lineTo(pod.x, pod.y); g.stroke();
      g.setLineDash([]); g.globalAlpha = 1;
      g.strokeStyle = col; g.lineWidth = 1.6;
      g.beginPath(); g.arc(pod.x, pod.y, 24, 0, 7); g.stroke();
    }
  }

  if (scoop && me) {                               // tractor beam
    const pod = pods.find(p => p.id === scoop.id);
    if (pod) {
      const col = MATERIALS[pod.mat]?.colour ?? '#9aa3ad';
      const px = pod.x + (me.rx - pod.x) * scoop.p, py = pod.y + (me.ry - pod.y) * scoop.p;
      g.strokeStyle = col; g.globalAlpha = 0.35; g.lineWidth = 10;
      g.beginPath(); g.moveTo(me.rx, me.ry); g.lineTo(pod.x, pod.y); g.stroke();
      g.globalAlpha = 0.9; g.lineWidth = 2;
      g.beginPath(); g.moveTo(me.rx, me.ry); g.lineTo(pod.x, pod.y); g.stroke();
      g.fillStyle = col; g.globalAlpha = 1;       // the cargo itself, sliding in
      g.beginPath(); g.arc(px, py, 7 * (1 - scoop.p * 0.6), 0, 7); g.fill();
    }
  }

  for (const b of bolts) {                         // bolts first, so hulls sit on top
    const p1 = Math.min(1, b.p), p0 = Math.max(0, b.p - 0.22);
    const x0 = b.sx + (b.ax - b.sx) * p0, y0 = b.sy + (b.ay - b.sy) * p0;
    const x1 = b.sx + (b.ax - b.sx) * p1, y1 = b.sy + (b.ay - b.sy) * p1;
    const thick = boltWidth(b.w);                 // a better emitter throws a heavier bolt
    g.strokeStyle = b.foe ? '#ff7a5c' : '#8fe7ff';
    g.globalAlpha = 0.22; g.lineWidth = thick + 3.5;
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    g.globalAlpha = 1; g.lineWidth = thick;
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    if (thick > 3.2) {                            // heavy rounds run white hot down the middle
      g.strokeStyle = b.foe ? '#ffd6c8' : '#e8fbff'; g.lineWidth = thick * 0.34;
      g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    }
  }

  for (const [id, s] of ships) {
    const R = rOf(s), lost = s.vis === STALE, foe = s.co === 'x';
    const lvl = (s.plvl ?? 0) / 100, sys = s.psys ?? 0;
    g.save();
    g.translate(s.rx, s.ry); g.rotate(s.heading);
    g.globalAlpha = lost ? 0.35 : 1;               // last known track, no live sensor

    if (sys === 1 && lvl > 0.02) {                 // thrusters: a plume out the back
      const len = R * (1.6 + lvl * 5.5);
      const grd = g.createLinearGradient(-R, 0, -R - len, 0);
      grd.addColorStop(0, `rgba(255,255,255,${0.45 + lvl * 0.45})`);
      grd.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grd;
      g.beginPath();
      g.moveTo(-R, -R * 0.55); g.lineTo(-R - len, -R * 0.16 * (1 + lvl));
      g.lineTo(-R - len, R * 0.16 * (1 + lvl)); g.lineTo(-R, R * 0.55);
      g.closePath(); g.fill();
    }

    g.fillStyle = colOf(s);
    if (foe) {                                     // hostiles read as a different kind of thing
      g.beginPath();
      g.moveTo(R * 1.35, 0); g.lineTo(0, R); g.lineTo(-R * 0.8, 0); g.lineTo(0, -R);
      g.closePath(); g.fill();
      g.strokeStyle = '#1b0d28'; g.lineWidth = 1.5; g.stroke();
    } else {
      g.fillStyle = colOf(s);
      g.fillRect(-R, -R, R * 2, R * 2);
      if (id === myId) { g.strokeStyle = '#fff'; g.lineWidth = 2; g.strokeRect(-R, -R, R * 2, R * 2); }
      g.fillStyle = '#05070b'; g.fillRect(R - 6, -2, 6, 4);

      // Cannons go ON TOP of the hull and out past its nose, on the same
      // hardpoints the bolts actually leave from. Drawn under the body they were
      // almost entirely hidden — on a Hauler about three pixels showed.
      // Fixed. The cannons used to fatten with every emitter and just looked
      // blunt — how good your guns are shows in the bolt, not the barrel.
      const bore = Math.max(3, R * 0.26);
      for (const side of [-1, 1]) {
        const off = side * R * 0.95;
        g.fillStyle = '#0a0f16';                   // a dark seat, so it reads off the hull
        g.fillRect(-R * 0.25 - 1, off - bore / 2 - 1.4, R * 1.9 + 2, bore + 2.8);
        g.fillStyle = '#c2cede';
        g.fillRect(-R * 0.25, off - bore / 2, R * 1.9, bore);
        g.fillStyle = '#eef5ff';                   // muzzle
        g.fillRect(R * 1.25, off - bore / 2 - 0.6, R * 0.4, bore + 1.2);
        if (sys === 2 && lvl > 0.02) {             // weapons: the mounts crackle
          g.globalAlpha = (lost ? 0.35 : 1) * (0.4 + lvl * 0.6) *
                          (0.55 + 0.45 * Math.sin(now / 55 + (side > 0 ? 2 : 0)));
          g.fillStyle = SYS_COLOUR[1];
          g.fillRect(-R * 0.25, off - bore / 2 - lvl * 2, R * 1.9 + lvl * 7, bore + lvl * 4);
          g.globalAlpha = lost ? 0.35 : 1;
        }
      }
    }
    if (lost) { g.strokeStyle = '#e05a5a'; g.lineWidth = 1; g.setLineDash([3, 3]);
                g.strokeRect(-R - 4, -R - 4, R * 2 + 8, R * 2 + 8); g.setLineDash([]); }
    g.globalAlpha = 1;
    g.restore();

    if (sys === 3 && lvl > 0.02) {                 // shields: a bubble that thickens
      const rr = R * (2.2 + lvl * 0.8);
      g.globalAlpha = 0.06 + lvl * 0.16;
      g.fillStyle = SYS_COLOUR[2];
      g.beginPath(); g.arc(s.rx, s.ry, rr, 0, 7); g.fill();
      g.globalAlpha = 0.2 + lvl * 0.6; g.strokeStyle = SYS_COLOUR[2]; g.lineWidth = 1 + lvl * 2;
      g.beginPath(); g.arc(s.rx, s.ry, rr, 0, 7); g.stroke();
      g.globalAlpha = 1;
    }

    if (hover && s.co === 'x' && !lost && id === hostileAt(toWorld(hover).x, toWorld(hover).y) && id !== me?.tgt) {
      g.strokeStyle = 'rgba(255,140,120,0.55)'; g.lineWidth = 1.2; g.setLineDash([3, 4]);
      g.beginPath(); g.arc(s.rx, s.ry, R + 13, 0, 7); g.stroke(); g.setLineDash([]);
    }
    if (me && id === me.tgt) {                     // engagement reticle
      const rr = R + 9 + Math.sin(now / 200) * 2;
      g.strokeStyle = '#ff5c6b'; g.lineWidth = 1.6;
      for (let q = 0; q < 4; q++) {
        const a0 = q * Math.PI / 2 + Math.PI / 4;
        g.beginPath(); g.arc(s.rx, s.ry, rr, a0 - 0.42, a0 + 0.42); g.stroke();
      }
      const inRange = Math.hypot(s.rx - me.rx, s.ry - me.ry) <= st.weaponRange;
      g.fillStyle = inRange ? '#ff5c6b' : '#7a5a60';
      g.textAlign = 'center'; g.font = '11px ui-monospace, monospace';
      const running = s.hp <= 10;
      g.fillStyle = running ? '#ffc14d' : (inRange ? '#ff5c6b' : '#7a5a60');
      g.fillText(`${ALIENS[s.hull]?.name ?? '?'}  ${s.hp}%` +
                 (running ? '  FLEEING' : inRange ? '' : '  OUT OF RANGE'), s.rx, s.ry - rr - 8);
      g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
    }

    // Escort, in whatever formation it is flying. Armed drones are drawn with a
    // barrel, because they are genuinely where some of your bolts come from.
    const nD = s.drones ?? 0;
    if (nD) {
      const layout = formSlots(FORMATION_KEYS[s.form ?? 0] ?? 'line', nD);
      const c0 = Math.cos(s.heading), s0 = Math.sin(s.heading), dr = Math.max(5, R * 0.52);
      layout.forEach((pt, d) => {
        const dx = s.rx + (c0 * pt.fwd - s0 * pt.lat) * R;
        const dy = s.ry + (s0 * pt.fwd + c0 * pt.lat) * R;
        const armed = ((s.dmask ?? 0) >> d) & 1;
        g.save(); g.translate(dx, dy); g.rotate(s.heading);
        g.globalAlpha = lost ? 0.3 : 0.95;
        g.fillStyle = '#0a0f16'; g.fillRect(-dr - 1, -dr - 1, dr * 2 + 2, dr * 2 + 2);
        g.fillStyle = colOf(s); g.fillRect(-dr, -dr, dr * 2, dr * 2);
        if (armed) { g.fillStyle = '#c2cede'; g.fillRect(dr * 0.4, -1.3, dr * 1.5, 2.6); }
        g.fillStyle = '#0a0f16'; g.fillRect(-dr * 0.35, -dr * 0.35, dr * 0.7, dr * 0.7);
        g.globalAlpha = 1; g.restore();
      });
    }

    if (lost) continue;                            // no vitals read on a fading track

    // PLACEHOLDER shield impact. Lit only while the shields are catching the hit;
    // once they're down the server stops sending it and bare hull takes the damage.
    const f = (s.flash ?? 0) / 100;
    if (f > 0) {
      const rr = R * (2.7 + (1 - f) * 0.9);        // the envelope stands well off the hull
      g.globalAlpha = f * 0.20; g.fillStyle = '#7fd4ff';
      g.beginPath(); g.arc(s.rx, s.ry, rr, 0, 7); g.fill();
      g.globalAlpha = Math.min(1, f * 1.1); g.strokeStyle = '#bfe9ff'; g.lineWidth = 1.5 + f * 2.5;
      g.beginPath(); g.arc(s.rx, s.ry, rr, 0, 7); g.stroke();
      g.globalAlpha = 1;
    }

    const bw = Math.max(30, R * 2.8);              // bars stay upright, never rotate
    g.fillStyle = 'rgba(4,7,12,0.75)';
    g.fillRect(s.rx - bw / 2, s.ry - R - 17, bw, 8);
    g.fillStyle = '#5fd0ff'; g.fillRect(s.rx - bw / 2 + 1, s.ry - R - 16, (bw - 2) * (s.sh ?? 0) / 100, 2.5);
    g.fillStyle = (s.hp ?? 100) > 33 ? '#7de08a' : '#e05a5a';
    g.fillRect(s.rx - bw / 2 + 1, s.ry - R - 12.5, (bw - 2) * (s.hp ?? 0) / 100, 2.5);
    if (s.lvl > 0) {                               // rank, so everyone can read it
      g.fillStyle = 'rgba(4,7,12,0.8)';
      g.fillRect(s.rx + bw / 2 + 3, s.ry - R - 18, 20, 11);
      g.fillStyle = '#cfe4ff'; g.font = 'bold 9px ui-monospace, monospace'; g.textAlign = 'center';
      g.fillText(String(s.lvl), s.rx + bw / 2 + 13, s.ry - R - 9.5);
      g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
    }
  }
  // Damage you deal is red and loud. Damage you take is amber — unless your own
  // shields caught it, in which case it is drawn in the same blue as your shield
  // bar and shield bubble, so "the shield held" reads the same way everywhere.
  for (const h of numbers) {
    const fade = h.p < 0.55 ? 1 : Math.max(0, (1 - h.p) / 0.45);
    const colour = h.mine ? (h.sh ? '#ff8fa0' : '#ff3b47')     // paler red = blunted by their shields
                          : (h.sh ? '#7fd4ff' : '#ffc14d');    // blue = yours held, amber = it got through
    g.globalAlpha = fade;
    g.font = (h.mine ? 'bold 17px' : '14px') + ' ui-monospace, SFMono-Regular, monospace';
    g.textAlign = 'center';
    const txt = (h.mine ? '' : '-') + h.n;
    g.lineWidth = 3.5; g.strokeStyle = 'rgba(4,7,12,0.9)';
    g.strokeText(txt, h.x, h.y - h.p * 36);
    g.fillStyle = colour;
    g.fillText(txt, h.x, h.y - h.p * 36);
    g.globalAlpha = 1; g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
  }

  for (const b of blasts) {                        // kill flash, over everything in world space
    const rr = b.r * (1.3 + b.p * 6.5);
    g.strokeStyle = b.foe ? '#ff9a6a' : '#9ad7ff';
    g.globalAlpha = (1 - b.p) * 0.85;
    g.lineWidth = 2 + (1 - b.p) * 6;
    g.beginPath(); g.arc(b.x, b.y, rr, 0, 7); g.stroke();
    g.globalAlpha = (1 - b.p) * (1 - b.p) * 0.55;
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(b.x, b.y, rr * 0.5, 0, 7); g.fill();
    g.globalAlpha = 1;
  }

  g.restore();

  // --- jump button (screen space) ---
  if (atPortal || charge > 0) {
    const p = atPortal ?? map.portals[0], tint = MAPS[p.to].tint, b = btn();
    const prog = charge > 0 ? 1 - charge / JUMP_TIME : 0;
    g.fillStyle = 'rgba(6,10,16,0.9)';
    g.beginPath(); g.roundRect(b.x, b.y, b.w, b.h, 6); g.fill();
    if (charge > 0) {
      g.save(); g.beginPath(); g.roundRect(b.x, b.y, b.w, b.h, 6); g.clip();
      g.globalAlpha = 0.35; g.fillStyle = tint; g.fillRect(b.x, b.y, b.w * prog, b.h);
      g.restore(); g.globalAlpha = 1;
    }
    g.strokeStyle = tint; g.lineWidth = 1.5;
    g.beginPath(); g.roundRect(b.x + .5, b.y + .5, b.w - 1, b.h - 1, 6); g.stroke();
    g.fillStyle = tint; g.textAlign = 'center'; g.font = '13px ui-monospace, monospace';
    g.fillText(charge > 0 ? `SPOOLING  ${charge.toFixed(1)}s  ·  CLICK TO ABORT`
                          : `JUMP  →  ${MAPS[p.to].name.toUpperCase()}`, b.x + b.w / 2, b.y + 29);
    g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
  }

  // --- minimap ---
  const sx = MM_W / MAP_W, sy = MM_H / MAP_H;
  g.fillStyle = 'rgba(6,10,16,0.86)'; g.fillRect(MM_X, MM_Y, MM_W, MM_H);
  g.strokeStyle = map.tint + '99'; g.lineWidth = 1; g.strokeRect(MM_X + .5, MM_Y + .5, MM_W - 1, MM_H - 1);
  if (map.base) {
    const b = map.base, col = COMPANIES[map.owner].color;
    g.strokeStyle = col + 'cc'; g.lineWidth = 1;
    g.beginPath(); g.arc(MM_X + b.x * sx, MM_Y + b.y * sy, b.r * sx, 0, 7); g.stroke();
    g.fillStyle = col; g.fillRect(MM_X + b.x * sx - 2, MM_Y + b.y * sy - 2, 4, 4);
  }
  for (const p of map.portals) {
    g.fillStyle = MAPS[p.to].tint;
    g.fillRect(MM_X + p.x * sx - 2.5, MM_Y + p.y * sy - 2.5, 5, 5);
  }
  if (marker && me) {                                 // course line, drawn under the dots
    const mx = MM_X + clamp(marker.x, 0, MAP_W) * sx, my = MM_Y + clamp(marker.y, 0, MAP_H) * sy;
    g.strokeStyle = 'rgba(74,144,217,0.75)'; g.lineWidth = 1; g.setLineDash([3, 3]);
    g.beginPath(); g.moveTo(MM_X + me.rx * sx, MM_Y + me.ry * sy); g.lineTo(mx, my); g.stroke();
    g.setLineDash([]);
    g.strokeStyle = '#4a90d9';
    g.beginPath(); g.arc(mx, my, 3.5, 0, 7); g.stroke();
    g.beginPath(); g.moveTo(mx - 6, my); g.lineTo(mx + 6, my);
    g.moveTo(mx, my - 6); g.lineTo(mx, my + 6); g.stroke();
  }
  g.save();                                        // nothing on the plot may spill past the frame
  g.beginPath(); g.rect(MM_X, MM_Y, MM_W, MM_H); g.clip();

  if (me) {                                        // the sweep itself, expanding out to radar range
    const cx = MM_X + clamp(me.rx, 0, MAP_W) * sx, cy = MM_Y + clamp(me.ry, 0, MAP_H) * sy;
    const reach = st.radar * sx;                 // the sweep itself, no ring left behind
    for (const off of [0, 0.5]) {
      const ph = ((now / 2400) + off) % 1;
      g.globalAlpha = (1 - ph) * (1 - ph) * 0.5;
      g.strokeStyle = '#7fd4ff'; g.lineWidth = 1.4;
      g.beginPath(); g.arc(cx, cy, ph * reach, 0, 7); g.stroke();
    }
    g.globalAlpha = 1;
  }

  for (const pod of pods) {
    g.fillStyle = MATERIALS[pod.mat]?.colour ?? '#9aa3ad';
    g.fillRect(MM_X + clamp(pod.x, 0, MAP_W) * sx - 1, MM_Y + clamp(pod.y, 0, MAP_H) * sy - 1, 2, 2);
  }
  for (const [id, s] of ships) {
    const off = driftDepth(s.x, s.y) > 0;          // clamp strays to the frame so they stay findable
    const mx = MM_X + clamp(s.rx, 0, MAP_W) * sx, my = MM_Y + clamp(s.ry, 0, MAP_H) * sy;
    if (s.co === 'x') {                            // hostiles: a pulsing diamond, never a ping ring
      const ph = ((now / 900) + id * 0.31) % 1;
      g.globalAlpha = s.vis === FRESH ? 0.5 + 0.5 * (1 - ph) : 0.35;
      g.fillStyle = ALIENS[s.hull]?.colour ?? '#b06adf';
      g.beginPath(); g.moveTo(mx, my - 3); g.lineTo(mx + 3, my); g.lineTo(mx, my + 3); g.lineTo(mx - 3, my);
      g.closePath(); g.fill();
      g.globalAlpha = 1;
      continue;
    }
    if (s.vis === ALLY) {
      g.fillStyle = off ? '#ff5c6b' : (COMPANIES[s.co]?.color ?? '#8899aa');
      const w = id === myId ? 5 : 3;
      g.fillRect(mx - w / 2, my - w / 2, w, w);
      continue;
    }
    const hot = s.vis === FRESH;
    if (hot) {                                     // contact ping, phase-offset per contact
      const ph = ((now / 1150) + id * 0.37) % 1;
      g.globalAlpha = (1 - ph) * 0.75;
      g.strokeStyle = '#ff5c6b'; g.lineWidth = 1;
      g.beginPath(); g.arc(mx, my, 2 + ph * 8, 0, 7); g.stroke();
      g.globalAlpha = 1;
    }
    g.globalAlpha = hot ? 1 : 0.4;
    g.fillStyle = '#ff5c6b'; g.fillRect(mx - 1.5, my - 1.5, 3, 3);
    g.globalAlpha = 1;
  }
  g.restore();
  // The viewport can hang off charted space now, so draw only the part of it that
  // the plot actually covers — clipped to the frame, half a pixel in for the stroke.
  const vx0 = Math.max(0, cam.x), vy0 = Math.max(0, cam.y);
  const vx1 = Math.min(MAP_W, cam.x + WVW), vy1 = Math.min(MAP_H, cam.y + WVH);
  if (vx1 > vx0 && vy1 > vy0) {
    const L = Math.max(MM_X + .5, MM_X + vx0 * sx), T = Math.max(MM_Y + .5, MM_Y + vy0 * sy);
    const R = Math.min(MM_X + MM_W - .5, MM_X + vx1 * sx), B = Math.min(MM_Y + MM_H - .5, MM_Y + vy1 * sy);
    if (R > L && B > T) { g.strokeStyle = '#ff3b47'; g.lineWidth = 1; g.strokeRect(L, T, R - L, B - T); }
  }

  // --- reactor, bottom left ---
  {
    const cx = 62, cy = VIEW_H - 74, R0 = 34;
    const cap = (power.cap ?? 0) / 100;
    const sysI = power.to ? SYSTEMS.indexOf(power.to) : -1;
    const lvl = power.to ? (power.lv?.[power.to] ?? 0) / 100 : 0;
    const col = sysI < 0 ? '#5b6b85' : SYS_COLOUR[sysI];

    g.fillStyle = 'rgba(4,7,12,0.72)';
    g.beginPath(); g.arc(cx, cy, R0 + 13, 0, 7); g.fill();

    g.strokeStyle = '#1d2634'; g.lineWidth = 6;    // capacitor ring
    g.beginPath(); g.arc(cx, cy, R0, 0, 7); g.stroke();
    g.strokeStyle = cap > 0.15 ? '#ffd479' : '#ff5c6b'; g.lineWidth = 6;
    g.beginPath(); g.arc(cx, cy, R0, -Math.PI / 2, -Math.PI / 2 + cap * Math.PI * 2); g.stroke();

    if (lvl > 0) {                                 // what is being fed, and how hard
      g.globalAlpha = 0.16 + lvl * 0.34; g.fillStyle = col;
      g.beginPath(); g.arc(cx, cy, (R0 - 7) * (0.35 + lvl * 0.65), 0, 7); g.fill();
      g.globalAlpha = 1;
      g.strokeStyle = col; g.lineWidth = 2.5;
      g.beginPath(); g.arc(cx, cy, R0 - 10, -Math.PI / 2, -Math.PI / 2 + lvl * Math.PI * 2); g.stroke();
    }

    g.textAlign = 'center';
    g.fillStyle = lvl > 0 ? col : '#5b6b85'; g.font = 'bold 14px ui-monospace, monospace';
    g.fillText(`+${Math.round(BOOST * lvl * 100)}%`, cx, cy + 2);
    g.fillStyle = '#66748c'; g.font = '9px ui-monospace, monospace';
    g.fillText(power.to ? power.to.toUpperCase() : 'REACTOR', cx, cy + 14);
    g.fillText(`${Math.round(cap * 100)}%`, cx, cy - 10);

    SYSTEMS.forEach((sys, i) => {                  // 1 2 3, arranged around the dial
      const a0 = -Math.PI / 2 + (i - 1) * 0.85;
      const px = cx + Math.cos(a0) * (R0 + 22), py = cy + Math.sin(a0) * (R0 + 22);
      const on = power.to === sys;
      g.fillStyle = on ? SYS_COLOUR[i] : '#3d4757';
      g.font = (on ? 'bold 12px' : '11px') + ' ui-monospace, monospace';
      g.fillText(String(i + 1), px, py + 4);
    });
    g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
  }

  // --- star system button ---
  const sb = sysBtn();
  g.fillStyle = 'rgba(6,10,16,0.86)'; g.beginPath(); g.roundRect(sb.x, sb.y, sb.w, sb.h, 5); g.fill();
  g.strokeStyle = '#3d5a7f'; g.lineWidth = 1;
  g.beginPath(); g.roundRect(sb.x + .5, sb.y + .5, sb.w - 1, sb.h - 1, 5); g.stroke();
  g.strokeStyle = '#8ab4e6'; g.beginPath();                       // little link glyph
  g.moveTo(sb.x + 12, sb.y + 15); g.lineTo(sb.x + 24, sb.y + 15);
  g.moveTo(sb.x + 24, sb.y + 10); g.lineTo(sb.x + 24, sb.y + 20); g.stroke();
  g.fillStyle = '#8ab4e6';
  for (const [dx, dy] of [[9, 15], [27, 10], [27, 20]]) { g.beginPath(); g.arc(sb.x + dx, sb.y + dy, 2.5, 0, 7); g.fill(); }
  g.fillStyle = '#8ab4e6'; g.fillText('STAR SYSTEM', sb.x + 38, sb.y + 19);

  // --- hud ---
  g.fillStyle = map.tint; g.fillText(map.name, 16, 24);
  const terr = map.owner ? `${COMPANIES[map.owner].tag} TERRITORY` : 'CONTESTED';
  g.fillStyle = map.owner ? COMPANIES[map.owner].color : '#e05a5a';
  g.fillText(terr, 20 + g.measureText(map.name).width, 24);
  g.fillStyle = '#5b6b85';
  g.fillText(`${myName || '…'} · ${COMPANIES[myCo].tag} · ${HULLS[myHull].name} ${HULLS[myHull].cls}` +
             `${myDrones.filter(Boolean).length ? ` +${myDrones.filter(Boolean).length} drones` : ''} · ` +
             `${status} · ${ships.size} in sector`, 16, 42);
  if (me) {
    const hp = Math.round(st.hull * (me.hp ?? 100) / 100);
    const sh = shieldNow, shMax = Math.max(1, shieldTop || st.shield);
    const boosted = shMax > st.shield * 1.001;
    const w = 190;
    g.fillStyle = 'rgba(4,7,12,0.7)'; g.fillRect(16, 52, w, 22);
    g.fillStyle = '#1d3b52'; g.fillRect(18, 54, w - 4, 8);
    g.fillStyle = boosted ? '#8fe7ff' : '#5fd0ff';   // brighter blue, never a different colour
    g.fillRect(18, 54, (w - 4) * sh / shMax, 8);
    if (boosted) {                                 // where the unboosted pool used to end
      const mark = 18 + (w - 4) * (st.shield / shMax);
      g.fillStyle = 'rgba(255,255,255,0.55)'; g.fillRect(mark, 52, 1, 12);
    }
    g.fillStyle = '#26402c'; g.fillRect(18, 64, w - 4, 8);
    g.fillStyle = hp > st.hull / 3 ? '#7de08a' : '#e05a5a';
    g.fillRect(18, 64, (w - 4) * hp / st.hull, 8);
    g.fillStyle = '#5b6b85';
    g.fillText(`SH ${sh}/${shMax | 0}${boosted ? ' ↑' : ''}   HU ${hp}/${st.hull | 0}` +
               (myFit.length ? `   fit ${myFit.length}/${st.slots}` : ''), 16 + w + 10, 68);
    let hostiles = 0, tracks = 0;
    for (const c of ships.values()) if (c.vis === FRESH) hostiles++; else if (c.vis === STALE) tracks++;
    if (docked()) {
      g.fillStyle = COMPANIES[myCo].color;
      g.fillText('◆ DOCKED — repairing', 16 + w + 10, 52);
    } else if (hostiles || tracks) {
      g.fillStyle = '#ff5c6b';
      g.fillText(`▲ ${hostiles} contact${hostiles === 1 ? '' : 's'}` + (tracks ? ` · ${tracks} fading` : ''), 16 + w + 10, 52);
    }
    const vol = holdVol(hold), gw = 190;
    g.fillStyle = 'rgba(4,7,12,0.7)'; g.fillRect(16, 92, gw, 14);
    g.fillStyle = '#1b222d'; g.fillRect(18, 94, gw - 4, 10);
    let gx = 18;                                   // one segment per material, in its own colour
    for (const [m, n] of Object.entries(hold)) {
      const w2 = (gw - 4) * (n * (MATERIALS[m]?.vol ?? 1)) / Math.max(1, cargoCap);
      g.fillStyle = MATERIALS[m]?.colour ?? '#9aa3ad';
      g.fillRect(gx, 94, w2, 10); gx += w2;
    }
    g.fillStyle = vol >= cargoCap ? '#ff5c6b' : '#5b6b85';
    g.fillText(`CARGO ${vol}/${cargoCap}` + (vol >= cargoCap ? '  HOLD FULL' : '') +
               (vol ? `  ${holdValue(hold)} cr` : ''), 16 + gw + 10, 103);
    g.fillStyle = '#ffd479';
    g.fillText(`${credits} ${CURRENCY.short}`, 16, 124);
    const rank = myRank ?? levelFor(myXp);
    g.fillStyle = '#cfe4ff';
    g.fillText(`LVL ${rank.level}`, 16 + 96, 124);
    const bx = 16 + 152, bw2 = 60;
    g.fillStyle = '#1b222d'; g.fillRect(bx, 117, bw2, 6);
    g.fillStyle = '#8ab4e6'; g.fillRect(bx, 117, bw2 * progress(myXp), 6);
    if (atDock && vol > 0) {
      g.fillStyle = COMPANIES[myCo].color;
      g.fillText('docked — press I to stow cargo', 16 + 96, 124);
    }
    g.fillStyle = depth > 0 ? '#ff5c6b' : '#5b6b85';
    g.fillText(depth > 0 ? `SHEAR ${driftDps(depth) | 0}/s` :
               `RDR ${st.radar | 0}   SIG ${Math.round(st.signature * 10) / 10}s   ` +
               `GUN ${st.damage | 0}×${Math.round(st.fireRate * 10) / 10}/s @${st.weaponRange | 0}`, 16 + w + 10, 84);
  }
  g.fillText(`click a hostile or TAB to engage · click cargo to haul it in · I inventory · H hangar · M star system · V sound ${audioOn() ? 'on' : 'off'}` +
             (docked() ? '' : ' (dock first)') + ' · K take test damage', 16, VIEW_H - 16);

  if (depth > 0 && !sysOpen && !bayOpen) {
    const t = Math.min(1, depth / DRIFT_MARGIN);
    const vig = g.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.28,
                                       VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.78);
    vig.addColorStop(0, 'transparent');
    vig.addColorStop(1, `rgba(150,12,24,${0.20 + t * 0.5})`);
    g.fillStyle = vig; g.fillRect(0, 0, VIEW_W, VIEW_H);

    const pulse = 0.5 + 0.5 * Math.abs(Math.sin(now / (150 - t * 80)));
    g.textAlign = 'center'; g.globalAlpha = pulse;
    g.fillStyle = '#ff2f42'; g.font = 'bold 30px ui-monospace, SFMono-Regular, monospace';
    g.fillText('⚠  BEACON LATTICE LOST  ⚠', VIEW_W / 2, VIEW_H * 0.22);
    g.globalAlpha = 0.6 + pulse * 0.4;
    g.font = '15px ui-monospace, monospace'; g.fillStyle = '#ff8a95';
    g.fillText(`UNCOMPENSATED HULL SHEAR — ${driftDps(depth) | 0}/s`, VIEW_W / 2, VIEW_H * 0.22 + 28);
    g.font = '13px ui-monospace, monospace'; g.fillStyle = '#ffc4ca';
    g.fillText(`${depth | 0}m OUTSIDE CHARTED SPACE — COME ABOUT`, VIEW_W / 2, VIEW_H * 0.22 + 52);
    g.globalAlpha = 1; g.textAlign = 'left'; g.font = '12px ui-monospace, monospace';
  }

  if (notice) {
    const age = (now - notice.at) / 1000;
    if (age > 4.5) notice = null;
    else {
      g.globalAlpha = age < 0.25 ? age / 0.25 : Math.min(1, (4.5 - age) / 1.2);
      g.font = '15px ui-monospace, monospace'; g.textAlign = 'center';
      const w2 = g.measureText(notice.text).width + 40;
      g.fillStyle = 'rgba(6,10,16,0.88)'; g.fillRect(VIEW_W / 2 - w2 / 2, 22, w2, 38);
      g.strokeStyle = notice.colour; g.lineWidth = 1;
      g.strokeRect(VIEW_W / 2 - w2 / 2 + .5, 22.5, w2 - 1, 37);
      g.fillStyle = notice.colour; g.fillText(notice.text, VIEW_W / 2, 47);
      g.textAlign = 'left'; g.globalAlpha = 1; g.font = '12px ui-monospace, monospace';
    }
  }

  if (sysOpen) drawSystem(me);
  if (bayOpen) drawBay();
  if (invOpen) drawInventory();
  if (dead) drawWreck(now);
  if (chatOpen || chatLog.some(m => now - m.at < CHAT_LINGER)) drawChat(now);

  if (!signedOff && performance.now() - lastInput > IDLE_LIMIT) {
    signedOff = true;
    try { ws.close(4002, 'idle'); } catch {}
    status = 'signed out';
  }
  if (signedOff) drawSignedOff();
}

function drawChat(now) {
  const w = Math.min(620, VIEW_W - 80), x = (VIEW_W - w) / 2;
  // Open, it is a window onto the whole conversation. Closed, only the last few
  // lines linger, and only briefly — the history is there when you ask for it.
  const recent = chatOpen ? chatLog.slice(-8)
                          : chatLog.filter(m => now - m.at < CHAT_LINGER).slice(-4);
  if (!recent.length && !chatOpen) return;
  const lineH = 18, boxH = recent.length * lineH + (chatOpen ? 34 : 8);
  const y = VIEW_H * 0.42 - boxH / 2;
  const fadeOf = m => {
    if (chatOpen) return 1;
